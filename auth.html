<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeaea — Sign In</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>
:root {
  --bg:#000;
  --ink:#fff;
  --muted:#999;
  --input-bg:#1a1a1a;
  --input-border:#333;
}
* {
  box-sizing:border-box;
}
html,body {
  height:100%;
  margin:0;
  padding:0;
}
body {
  background:var(--bg);
  color:var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
}
.auth-container {
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 0px;
}
.auth-content {
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  max-width:280px;
  gap:0px;
}
/* Logo Image! */
.logo-image {
  width: 300px;
  height: auto;
  margin-bottom: 0px;
}
.tagline {
  font-size: 22px;
  color: var(--ink);
  margin: 0 0 30px;
  text-align: center;
  font-weight: 400;
}
/* Form Sections */
.auth-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.section-divider {
  text-align: center;
  color: var(--ink);
  font-size: 16px;
  margin: 10px 0 20px 0;
  cursor: pointer;
  transition: opacity 0.2s ease;
}
.section-divider:hover {
  opacity: 0.8;
}
/* Collapsible signup section */
.signup-section {
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.3s ease;
}
.signup-section.collapsed {
  max-height: 0;
  opacity: 0;
}
.signup-section.expanded {
  max-height: 300px;
  opacity: 1;
}
/* Input Styling */
.auth-input {
  width: 100%;
  height: 48px;
  background: var(--bg);
  border: 1px solid var(--ink);
  border-radius: 24px;
  padding: 0 20px;
  color: var(--ink);
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s ease;
}
.auth-input::placeholder {
  color: var(--ink);
  opacity: 0.7;
}
.auth-input:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 1px var(--ink);
}
/* Button Styling */
.auth-btn {
  width: 100%;
  height: 48px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  border: none;
  outline: none;
}
.auth-btn.primary {
  background: var(--ink);
  color: var(--bg);
}
.auth-btn.primary:hover {
  background: #e0e0e0;
}
.auth-btn.secondary {
  background: var(--ink);
  color: var(--bg);
}
.auth-btn.secondary:hover {
  background: #e0e0e0;
}
.auth-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
@media (max-width: 480px) {
  .auth-content {
    max-width: 80%;
  }
  /* .logo-image {
    width: 80%;
    height: auto;
  } */
  .logo-bubble {
    font-size: 28px;
    padding: 14px 28px;
  }
  /* .tagline {
    font-size: 30px;
  } */
}
</style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-content">
      <!-- Logo -->
      <img src="images/logo.png" alt="Aeaea Logo" class="logo-image" /> <!-- Codex test comment -->

      <div class="tagline">Personal AI Agents</div>

      <!-- Sign In Section -->
      <div class="auth-section" id="signin-section">
        <input id="signin-email" type="email" class="auth-input" placeholder="Enter your email" />
        <input id="signin-password" type="password" class="auth-input" placeholder="Enter your password" />
        <button id="signin-btn" class="auth-btn primary">Sign In</button>
      </div>
      
      <!-- Divider -->
      <div class="section-divider" id="toggle-signup">Don't have an account?</div>
      
      <!-- Create Account Section -->
      <div class="auth-section signup-section collapsed" id="signup-section">
        <input id="signup-username" type="text" class="auth-input" placeholder="Create your username" />
        <input id="signup-email" type="email" class="auth-input" placeholder="Enter your email" />
        <input id="signup-password" type="password" class="auth-input" placeholder="Create a password" />
        <button id="signup-btn" class="auth-btn secondary">Create new account</button>
      </div>
    </div>
  </div>
  
  <script type="module">
    // === Supabase Auth ===
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // Replace with your keys
    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c";
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    // Flag to prevent automatic redirect during signup
    let isSigningUp = false;

    // Check if already authenticated
    async function checkExistingAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        console.log("Already authenticated as:", session.user.email, "redirecting to main app");
        window.location.href = 'index.html';
      } else {
        console.log("No existing session found");
      }
    }
    checkExistingAuth();

    // Get form elements
    const signinEmailInput = document.getElementById("signin-email");
    const signinPasswordInput = document.getElementById("signin-password");
    const signupUsernameInput = document.getElementById("signup-username");
    const signupEmailInput = document.getElementById("signup-email");
    const signupPasswordInput = document.getElementById("signup-password");
    const signinBtn = document.getElementById("signin-btn");
    const signupBtn = document.getElementById("signup-btn");
    const toggleSignup = document.getElementById("toggle-signup");
    const signupSection = document.getElementById("signup-section");

    // Toggle signup section
    const signinSection = document.getElementById("signin-section");
    
    toggleSignup.addEventListener("click", () => {
      if (signupSection.classList.contains("collapsed")) {
        // Show signup, hide signin
        signupSection.classList.remove("collapsed");
        signupSection.classList.add("expanded");
        signinSection.style.display = "none";
        toggleSignup.textContent = "Already have an account?";
      } else {
        // Show signin, hide signup
        signupSection.classList.remove("expanded");
        signupSection.classList.add("collapsed");
        signinSection.style.display = "flex";
        toggleSignup.textContent = "Don't have an account?";
      }
    });

    // Sign in handler
    signinBtn.addEventListener("click", async () => {
      const email = signinEmailInput.value.trim();
      const password = signinPasswordInput.value;
      
      if (!email || !password) {
        alert('Please enter both email and password');
        return;
      }

      try {
        signinBtn.textContent = 'Signing in...';
        signinBtn.disabled = true;

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        console.log('Successfully signed in as:', data.user.email);
        // Redirect to main app
        window.location.href = 'index.html';
        
      } catch (error) {
        console.error('Error signing in:', error.message);
        if (error.message.includes('Invalid login credentials')) {
          alert('Incorrect email or password. Please try again.');
        } else {
          alert(error.message);
        }
      } finally {
        signinBtn.textContent = 'Sign In';
        signinBtn.disabled = false;
      }
    });

    // Sign up handler
    signupBtn.addEventListener("click", async () => {
      console.log('Signup button clicked!');
      const username = signupUsernameInput.value.trim();
      const email = signupEmailInput.value.trim();
      const password = signupPasswordInput.value;
      
      console.log('Signup form values - Username:', username, 'Email:', email, 'Password length:', password.length);
      
      if (!username || !email || !password) {
        alert('Please fill in all fields');
        return;
      }

      if (password.length < 6) {
        alert('Password must be at least 6 characters long');
        return;
      }

      try {
        isSigningUp = true;
        signupBtn.textContent = 'Creating account...';
        signupBtn.disabled = true;

        console.log('Starting sign up process for:', email);
        console.log('Username for signup:', username);
        
        // Sign out if there's an existing session
        await supabase.auth.signOut();

        // Create auth user with auto-confirm
        console.log('About to call supabase.auth.signUp with username:', username);
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { 
              confirmed: true,
              display_name: username
            },
            emailRedirectTo: window.location.origin
          }
        });

        if (error) {
          console.error('Sign up error:', error);
          throw error;
        }
        
        console.log('Sign up response data:', data);

        console.log('Sign up successful, attempting immediate sign in');

        // Immediately sign in
        const { error: signInError } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (signInError) {
          console.error('Auto sign in error:', signInError);
          throw signInError;
        }

        console.log('Sign in successful after signup');

        // Create profile for new user
        if (data.user) {
          console.log('Creating profile for user:', data.user.id, 'with username:', username);
          console.log('Username type:', typeof username, 'Username length:', username?.length);
          
          const profileData = { 
            id: data.user.id,
            display_name: username,
            created_at: new Date().toISOString()
          };
          
          console.log('Profile data to insert:', profileData);
          
          const { error: profileError } = await supabase
            .from('profiles')
            .upsert(profileData, { 
              onConflict: 'id'
            });
            
          if (profileError) {
            console.error('Error creating profile:', profileError);
            // Don't throw here, profile creation failure shouldn't block auth
          } else {
            console.log('Profile created successfully');
          }
        }

        // Reset flag and redirect to main app
        isSigningUp = false;
        console.log('Signup process complete, redirecting to index.html');
        window.location.href = 'index.html';
        
      } catch (error) {
        console.error('Signup process error:', error);
        console.error('Error details:', {
          message: error.message,
          stack: error.stack,
          name: error.name
        });
        alert(error.message);
      } finally {
        isSigningUp = false;
        signupBtn.textContent = 'Create new account';
        signupBtn.disabled = false;
      }
    });

    // Enter key support
    signinEmailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signinPasswordInput.focus();
    });

    signinPasswordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signinBtn.click();
    });

    signupUsernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signupEmailInput.focus();
    });

    signupEmailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signupPasswordInput.focus();
    });

    signupPasswordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signupBtn.click();
    });

    // Watch auth state changes
    supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user && !isSigningUp) {
        console.log("Signed in as", session.user.email);
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
