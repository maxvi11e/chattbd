<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Aeaea — Sign In</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>
:root {
  --bg:#000;
  --ink:#fff;
  --muted:#999;
  --input-bg:#1a1a1a;
  --input-border:#333;
}
* {
  box-sizing:border-box;
}
html,body {
  height:100dvh;
  margin:0;
  padding:0;
}
body {
  background:var(--bg);
  color:var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
}
.auth-container {
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 0px;
}
.auth-content {
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  max-width:280px;
  gap:0px;
  margin-top:-60px;
}
/* Logo Image!! */
.logo-image {
  width: 300px;
  height: auto;
  margin-bottom: 0px;
}
.tagline {
  font-size: 22px;
  color: var(--ink);
  margin: 4px 0 30px;
  text-align: left;
  font-weight: 400;
}
/* Form Sections */
.auth-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
/* Input Styling */
.auth-input {
  width: 100%;
  height: 48px;
  background: var(--bg);
  border: 1px solid var(--ink);
  border-radius: 24px;
  padding: 0 20px;
  color: var(--ink);
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s ease;
}
.auth-input::placeholder {
  color: var(--ink);
  opacity: 0.7;
}
.auth-input:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 1px var(--ink);
}
/* Button Styling */
.auth-btn {
  width: 100%;
  height: 48px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  border: none;
  outline: none;
}
.auth-btn.primary {
  background: #212121;
  color: #ffffff;
  border: 1px solid #d3d3d3;
}
.auth-btn.primary:hover {
  background: #404040;
}
.auth-btn.secondary {
  background: #000000;
  color: #ffffff;
  border: 1px solid #d3d3d3;
}
.auth-btn.secondary:hover {
  background: #333333;
}
.auth-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
/* OAuth Button Styling */
.oauth-divider {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin: 12px 0 16px 0;
}
.google-btn {
  width: 100%;
  height: 48px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid var(--ink);
  outline: none;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.google-btn:hover {
  background: #1a1a1a;
}
.google-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.google-icon {
  width: 20px;
  height: 20px;
}
@media (max-width: 480px) {
  .auth-content {
    max-width: 70%;
  }
  /* .logo-image {
    width: 80%;
    height: auto;
  } */
  .logo-bubble {
    font-size: 28px;
    padding: 14px 28px;
  }
  /* .tagline! {
    font-size: 30px;
  } */
}
</style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-content">
      <!-- Logo -->
      <img src="images/logo.png" alt="Aeaea Logo" class="logo-image" /> <!-- Codex test comment -->

      <div class="tagline">Personal AI Assistants</div>

      <!-- Google Sign-In -->
      <div class="auth-section">
        <button id="google-signin-btn" class="google-btn">
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <div class="oauth-divider">or</div>

      <!-- Email/Password Section -->
      <div class="auth-section" id="auth-section">
        <input id="auth-email" type="email" class="auth-input" placeholder="Enter your email" />
        <input id="auth-password" type="password" class="auth-input" placeholder="Enter your password" />
        <button id="auth-btn" class="auth-btn primary">Sign in</button>
      </div>
    </div>
  </div>
  
  <script type="module">
    // === Supabase Auth ===
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // Replace with your keys
    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c";
    const supabase = createClient(supabaseUrl, supabaseAnonKey, {
      auth: {
        storage: window.localStorage,
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true,
        flowType: 'pkce',
        storageKey: 'sb-auth-token' // Explicit storage key
      }
    });

    // Check if already authenticated
    async function checkExistingAuth() {
      // Check if we're in the middle of an OAuth callback
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const isOAuthCallback = hashParams.has('access_token') || hashParams.has('error');
      
      if (isOAuthCallback) {
        console.log("OAuth callback detected, waiting for Supabase to process...");
        return; // Let Supabase handle the OAuth callback
      }
      
      // Try to get session with retry logic (helps with Chrome mobile)
      let session = null;
      let attempts = 0;
      const maxAttempts = 2;
      
      while (!session && attempts < maxAttempts) {
        const { data } = await supabase.auth.getSession();
        session = data.session;
        
        if (!session && attempts < maxAttempts - 1) {
          console.log(`Session not ready, retry ${attempts + 1}`);
          await new Promise(resolve => setTimeout(resolve, 300));
        }
        attempts++;
      }
      
      if (session) {
        console.log("Already authenticated as:", session.user.email, "redirecting to main app");
        // Use replace to avoid back button issues
        window.location.replace('index.html');
      } else {
        console.log("No existing session found");
      }
    }
    checkExistingAuth();

    // Get form elements
    const authEmailInput = document.getElementById("auth-email");
    const authPasswordInput = document.getElementById("auth-password");
    const authBtn = document.getElementById("auth-btn");
    const googleSigninBtn = document.getElementById("google-signin-btn");

    // Google Sign-In handler
    googleSigninBtn.addEventListener("click", async () => {
      try {
        googleSigninBtn.textContent = 'Redirecting to Google...';
        googleSigninBtn.disabled = true;

        const { data, error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: `${window.location.origin}/index.html`
          }
        });

        if (error) throw error;

        // The redirect will happen automatically
        console.log('Google sign-in initiated');
        
      } catch (error) {
        console.error('Error with Google sign-in:', error.message);
        alert('Unable to sign in with Google: ' + error.message);
        googleSigninBtn.innerHTML = `
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        `;
        googleSigninBtn.disabled = false;
      }
    });

    // Unified auth handler (sign in or sign up)
    authBtn.addEventListener("click", async () => {
      const email = authEmailInput.value.trim();
      const password = authPasswordInput.value;
      
      if (!email || !password) {
        alert('Please enter both email and password');
        return;
      }

      if (password.length < 6) {
        alert('Password must be at least 6 characters long');
        return;
      }

      try {
        authBtn.textContent = 'Signing in...';
        authBtn.disabled = true;

        // First, try to sign in
        const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (signInError) {
          // If sign in fails with invalid credentials, try to create account
          if (signInError.message.includes('Invalid login credentials')) {
            console.log('No account found, creating new account...');
            authBtn.textContent = 'Creating account...';
            
            // Sign out any existing session
            await supabase.auth.signOut();
            
            // Generate username from email
            const username = email.split('@')[0];
            
            // Create new account
            const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
              email,
              password,
              options: {
                data: { 
                  confirmed: true,
                  display_name: username
                },
                emailRedirectTo: window.location.origin
              }
            });

            if (signUpError) throw signUpError;

            // Sign in immediately after signup
            const { error: autoSignInError } = await supabase.auth.signInWithPassword({
              email,
              password
            });

            if (autoSignInError) throw autoSignInError;

            // Create profile for new user
            if (signUpData.user) {
              const { error: profileError } = await supabase
                .from('profiles')
                .upsert({
                  id: signUpData.user.id,
                  display_name: username,
                  created_at: new Date().toISOString()
                }, { 
                  onConflict: 'id'
                });
                
              if (profileError) {
                console.error('Error creating profile:', profileError);
              }
            }

            console.log('Account created and signed in successfully');
            // Use replace to avoid back button issues
            window.location.replace('index.html');
          } else {
            // Some other error
            throw signInError;
          }
        } else {
          // Sign in successful
          console.log('Successfully signed in as:', signInData.user.email);
          // Use replace to avoid back button issues
          window.location.replace('index.html');
        }
        
      } catch (error) {
        console.error('Error with authentication:', error.message);
        alert(error.message);
      } finally {
        authBtn.textContent = 'Continue';
        authBtn.disabled = false;
      }
    });

    // Enter key support
    authEmailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') authPasswordInput.focus();
    });

    authPasswordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') authBtn.click();
    });

    // Watch auth state changes
    supabase.auth.onAuthStateChange(async (event, session) => {
      console.log("Auth state change event:", event, session?.user?.email);
      
      if (session?.user && event === 'SIGNED_IN') {
        console.log("Signed in as", session.user.email);
        
        // For OAuth sign-ins, ensure profile exists
        try {
          // Check if profile exists
          const { data: existingProfile, error: checkError } = await supabase
            .from('profiles')
            .select('id')
            .eq('id', session.user.id)
            .single();
          
          // If no profile exists, create one
          if (checkError || !existingProfile) {
            console.log('Creating profile for OAuth user:', session.user.id);
            
            // Use Google display name or email as fallback
            const displayName = session.user.user_metadata?.full_name || 
                                session.user.user_metadata?.name || 
                                session.user.email?.split('@')[0] || 
                                'User';
            
            const { error: profileError } = await supabase
              .from('profiles')
              .upsert({
                id: session.user.id,
                display_name: displayName,
                created_at: new Date().toISOString()
              }, { 
                onConflict: 'id'
              });
            
            if (profileError) {
              console.error('Error creating OAuth profile:', profileError);
            } else {
              console.log('OAuth profile created successfully');
            }
          }
        } catch (error) {
          console.error('Error checking/creating profile:', error);
        }
        
        // Use replace to avoid back button issues and clear OAuth state
        window.location.replace('index.html');
      }
    });
  </script>
</body>
</html>
