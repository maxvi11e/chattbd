<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeaea — Sign In</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>
:root {
  --bg:#000;
  --ink:#fff;
  --muted:#999;
  --input-bg:#1a1a1a;
  --input-border:#333;
}
* {
  box-sizing:border-box;
}
html,body {
  height:100%;
  margin:0;
  padding:0;
}
body {
  background:var(--bg);
  color:var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
}
.auth-container {
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 0px;
}
.auth-content {
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  max-width:280px;
  gap:0px;
}
/* Logo Image! */
.logo-image {
  width: 300px;
  height: auto;
  margin-bottom: 0px;
}
.tagline {
  font-size: 22px;
  color: var(--ink);
  margin: 0 0 30px;
  text-align: center;
  font-weight: 400;
}
/* Form Sections */
.auth-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.section-divider {
  text-align: center;
  color: var(--ink);
  font-size: 16px;
  margin: 10px 0 20px 0;
  cursor: pointer;
  transition: opacity 0.2s ease;
}
.section-divider:hover {
  opacity: 0.8;
}
/* Collapsible signup section */
.signup-section {
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.3s ease;
}
.signup-section.collapsed {
  max-height: 0;
  opacity: 0;
}
.signup-section.expanded {
  max-height: 300px;
  opacity: 1;
}
/* Input Styling */
.auth-input {
  width: 100%;
  height: 48px;
  background: var(--bg);
  border: 1px solid var(--ink);
  border-radius: 24px;
  padding: 0 20px;
  color: var(--ink);
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s ease;
}
.auth-input::placeholder {
  color: var(--ink);
  opacity: 0.7;
}
.auth-input:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 1px var(--ink);
}
/* Button Styling */
.auth-btn {
  width: 100%;
  height: 48px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  border: none;
  outline: none;
}
.auth-btn.primary {
  background: var(--ink);
  color: var(--bg);
}
.auth-btn.primary:hover {
  background: #e0e0e0;
}
.auth-btn.secondary {
  background: var(--ink);
  color: var(--bg);
}
.auth-btn.secondary:hover {
  background: #e0e0e0;
}
.auth-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
/* OAuth Button Styling */
.oauth-divider {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin: 20px 0 16px 0;
  position: relative;
}
.oauth-divider::before,
.oauth-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 40%;
  height: 1px;
  background: var(--input-border);
}
.oauth-divider::before {
  left: 0;
}
.oauth-divider::after {
  right: 0;
}
.google-btn {
  width: 100%;
  height: 48px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid var(--ink);
  outline: none;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.google-btn:hover {
  background: #1a1a1a;
}
.google-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.google-icon {
  width: 20px;
  height: 20px;
}
@media (max-width: 480px) {
  .auth-content {
    max-width: 80%;
  }
  /* .logo-image {
    width: 80%;
    height: auto;
  } */
  .logo-bubble {
    font-size: 28px;
    padding: 14px 28px;
  }
  /* .tagline! {
    font-size: 30px;
  } */
}
</style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-content">
      <!-- Logo -->
      <img src="images/logo.png" alt="Aeaea Logo" class="logo-image" /> <!-- Codex test comment -->

      <div class="tagline">Personal AI Agents</div>

      <!-- Google Sign-In -->
      <div class="auth-section">
        <button id="google-signin-btn" class="google-btn">
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <div class="oauth-divider">or</div>

      <!-- Sign In Section -->
      <div class="auth-section" id="signin-section">
        <input id="signin-email" type="email" class="auth-input" placeholder="Enter your email" />
        <input id="signin-password" type="password" class="auth-input" placeholder="Enter your password" />
        <button id="signin-btn" class="auth-btn primary">Sign In</button>
      </div>
      
      <!-- Divider -->
      <div class="section-divider" id="toggle-signup">Don't have an account?</div>
      
      <!-- Create Account Section -->
      <div class="auth-section signup-section collapsed" id="signup-section">
        <input id="signup-username" type="text" class="auth-input" placeholder="Create your username" />
        <input id="signup-email" type="email" class="auth-input" placeholder="Enter your email" />
        <input id="signup-password" type="password" class="auth-input" placeholder="Create a password" />
        <button id="signup-btn" class="auth-btn secondary">Create new account</button>
      </div>
    </div>
  </div>
  
  <script type="module">
    // === Supabase Auth ===
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // Replace with your keys
    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c";
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    // Flag to prevent automatic redirect during signup
    let isSigningUp = false;

    // Check if already authenticated
    async function checkExistingAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        console.log("Already authenticated as:", session.user.email, "redirecting to main app");
        window.location.href = 'index.html';
      } else {
        console.log("No existing session found");
      }
    }
    checkExistingAuth();

    // Get form elements
    const signinEmailInput = document.getElementById("signin-email");
    const signinPasswordInput = document.getElementById("signin-password");
    const signupUsernameInput = document.getElementById("signup-username");
    const signupEmailInput = document.getElementById("signup-email");
    const signupPasswordInput = document.getElementById("signup-password");
    const signinBtn = document.getElementById("signin-btn");
    const signupBtn = document.getElementById("signup-btn");
    const googleSigninBtn = document.getElementById("google-signin-btn");
    const toggleSignup = document.getElementById("toggle-signup");
    const signupSection = document.getElementById("signup-section");

    // Google Sign-In handler
    googleSigninBtn.addEventListener("click", async () => {
      try {
        googleSigninBtn.textContent = 'Redirecting to Google...';
        googleSigninBtn.disabled = true;

        const { data, error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: `${window.location.origin}/index.html`
          }
        });

        if (error) throw error;

        // The redirect will happen automatically
        console.log('Google sign-in initiated');
        
      } catch (error) {
        console.error('Error with Google sign-in:', error.message);
        alert('Unable to sign in with Google: ' + error.message);
        googleSigninBtn.innerHTML = `
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        `;
        googleSigninBtn.disabled = false;
      }
    });

    // Toggle signup section
    const signinSection = document.getElementById("signin-section");
    
    toggleSignup.addEventListener("click", () => {
      if (signupSection.classList.contains("collapsed")) {
        // Show signup, hide signin
        signupSection.classList.remove("collapsed");
        signupSection.classList.add("expanded");
        signinSection.style.display = "none";
        toggleSignup.textContent = "Already have an account?";
      } else {
        // Show signin, hide signup
        signupSection.classList.remove("expanded");
        signupSection.classList.add("collapsed");
        signinSection.style.display = "flex";
        toggleSignup.textContent = "Don't have an account?";
      }
    });

    // Sign in handler
    signinBtn.addEventListener("click", async () => {
      const email = signinEmailInput.value.trim();
      const password = signinPasswordInput.value;
      
      if (!email || !password) {
        alert('Please enter both email and password');
        return;
      }

      try {
        signinBtn.textContent = 'Signing in...';
        signinBtn.disabled = true;

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        console.log('Successfully signed in as:', data.user.email);
        // Redirect to main app
        window.location.href = 'index.html';
        
      } catch (error) {
        console.error('Error signing in:', error.message);
        if (error.message.includes('Invalid login credentials')) {
          alert('Incorrect email or password. Please try again.');
        } else {
          alert(error.message);
        }
      } finally {
        signinBtn.textContent = 'Sign In';
        signinBtn.disabled = false;
      }
    });

    // Sign up handler
    signupBtn.addEventListener("click", async () => {
      console.log('Signup button clicked!');
      const username = signupUsernameInput.value.trim();
      const email = signupEmailInput.value.trim();
      const password = signupPasswordInput.value;
      
      console.log('Signup form values - Username:', username, 'Email:', email, 'Password length:', password.length);
      
      if (!username || !email || !password) {
        alert('Please fill in all fields');
        return;
      }

      if (password.length < 6) {
        alert('Password must be at least 6 characters long');
        return;
      }

      try {
        isSigningUp = true;
        signupBtn.textContent = 'Creating account...';
        signupBtn.disabled = true;

        console.log('Starting sign up process for:', email);
        console.log('Username for signup:', username);
        
        // Sign out if there's an existing session
        await supabase.auth.signOut();

        // Create auth user with auto-confirm
        console.log('About to call supabase.auth.signUp with username:', username);
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { 
              confirmed: true,
              display_name: username
            },
            emailRedirectTo: window.location.origin
          }
        });

        if (error) {
          console.error('Sign up error:', error);
          throw error;
        }
        
        console.log('Sign up response data:', data);

        console.log('Sign up successful, attempting immediate sign in');

        // Immediately sign in
        const { error: signInError } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (signInError) {
          console.error('Auto sign in error:', signInError);
          throw signInError;
        }

        console.log('Sign in successful after signup');

        // Create profile for new user
        if (data.user) {
          console.log('Creating profile for user:', data.user.id, 'with username:', username);
          console.log('Username type:', typeof username, 'Username length:', username?.length);
          
          const profileData = { 
            id: data.user.id,
            display_name: username,
            created_at: new Date().toISOString()
          };
          
          console.log('Profile data to insert:', profileData);
          
          const { error: profileError } = await supabase
            .from('profiles')
            .upsert(profileData, { 
              onConflict: 'id'
            });
            
          if (profileError) {
            console.error('Error creating profile:', profileError);
            // Don't throw here, profile creation failure shouldn't block auth
          } else {
            console.log('Profile created successfully');
          }
        }

        // Reset flag and redirect to main app
        isSigningUp = false;
        console.log('Signup process complete, redirecting to index.html');
        window.location.href = 'index.html';
        
      } catch (error) {
        console.error('Signup process error:', error);
        console.error('Error details:', {
          message: error.message,
          stack: error.stack,
          name: error.name
        });
        alert(error.message);
      } finally {
        isSigningUp = false;
        signupBtn.textContent = 'Create new account';
        signupBtn.disabled = false;
      }
    });

    // Enter key support
    signinEmailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signinPasswordInput.focus();
    });

    signinPasswordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signinBtn.click();
    });

    signupUsernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signupEmailInput.focus();
    });

    signupEmailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signupPasswordInput.focus();
    });

    signupPasswordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signupBtn.click();
    });

    // Watch auth state changes
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (session?.user && !isSigningUp) {
        console.log("Signed in as", session.user.email, "Event:", event);
        
        // For OAuth sign-ins, ensure profile exists
        if (event === 'SIGNED_IN') {
          try {
            // Check if profile exists
            const { data: existingProfile, error: checkError } = await supabase
              .from('profiles')
              .select('id')
              .eq('id', session.user.id)
              .single();
            
            // If no profile exists, create one
            if (checkError || !existingProfile) {
              console.log('Creating profile for OAuth user:', session.user.id);
              
              // Use Google display name or email as fallback
              const displayName = session.user.user_metadata?.full_name || 
                                  session.user.user_metadata?.name || 
                                  session.user.email?.split('@')[0] || 
                                  'User';
              
              const { error: profileError } = await supabase
                .from('profiles')
                .upsert({
                  id: session.user.id,
                  display_name: displayName,
                  created_at: new Date().toISOString()
                }, { 
                  onConflict: 'id'
                });
              
              if (profileError) {
                console.error('Error creating OAuth profile:', profileError);
              } else {
                console.log('OAuth profile created successfully');
              }
            }
          } catch (error) {
            console.error('Error checking/creating profile:', error);
          }
        }
        
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
