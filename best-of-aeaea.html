<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Aeaea — Import to Library</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>
:root {
  --bg:#000;
  --ink:#fff;
  --muted:#d9d9d9;
  --stroke:#fff;
}
* {
  box-sizing:border-box;
}
html,body {
  height:100%;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
}
.screen {
  min-height:100dvh;
  width:100%;
}
/* ===== Dashboard Layout with Sidebar ===== */
.dashboard {
  padding:0;
  min-height:100dvh;
}
.chat-container {
  display:flex;
  height:100dvh;
  overflow:hidden;
}
/* Sidebar */
.sidebar {
  width:300px;
  background:var(--bg);
  border-right:1px solid #333;
  display:flex;
  flex-direction:column;
  transition:width 0.3s ease;
  position:relative;
  min-width:200px;
  max-width:600px;
  height:100dvh;
  flex-shrink:0;
}
.sidebar.collapsed {
  width:44px !important;
  min-width:44px !important;
  overflow:hidden;
}
.sidebar.resizing {
  transition:none;
}
.sidebar *::-webkit-scrollbar {
  width:12px;
}
.sidebar *::-webkit-scrollbar-track {
  background:#000 !important;
}
.sidebar *::-webkit-scrollbar-thumb {
  background:var(--stroke);
  border-radius:999px;
}
.sidebar *::-webkit-scrollbar-corner {
  background:#000;
}
/* Resize Handle */
.resize-handle {
  position:absolute;
  top:0;
  right:-3px;
  width:6px;
  height:100%;
  cursor:col-resize;
  background:transparent;
  z-index:100;
}
.resize-handle:hover {
  background:rgba(255,255,255,0.1);
}
.resize-handle.resizing {
  background:rgba(255,255,255,0.2);
}
/* Sidebar Toggle Button */
.sidebar-toggle {
  position:fixed;
  top:18px;
  left:260px;
  width:22px;
  height:22px;
  background:transparent;
  border:none;
  border-radius:8px;
  color:var(--ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  z-index:1000;
  transition:left 0.1s ease, top 0.1s ease;
}
.sidebar-toggle:hover {
  background:transparent;
}
.sidebar-toggle:active {
  background:transparent;
}
.sidebar-toggle:focus {
  background:transparent;
  outline:none;
}
.sidebar.collapsed .sidebar-toggle {
  position:absolute !important;
  top:14px !important;
  left:6px !important;
  border-radius:8px;
}
/* Prevent laggy animation of toggle during live resize */
.sidebar.resizing .sidebar-toggle {
  transition:none;
}
/* Top Navigation in Sidebar */
.sidebar-nav {
  display:flex;
  justify-content:center;
  align-items:center;
  padding:14px 24px 0px 24px;
  position:relative;
}
.sidebar-nav .sidebar-toggle {
  position:absolute;
  right:24px;
}
.nav-left {
  display:flex;
  align-items:center;
  gap:16px;
}
.nav-logo {
  height:34px;
  width:auto;
}
.nav-right {
  display:flex;
  gap:12px;
  align-items:center;
}
.user-email {
  color:var(--ink);
  font-size:14px;
}
.logout-btn {
  padding:8px;
  border:none;
  background:transparent;
  color:var(--ink);
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logout-btn:hover {
  background:rgba(255,255,255,0.1);
}
.logout-btn img {
  width:24px;
  height:24px;
}
/* Sidebar Actions */
.sidebar-actions {
  padding:16px;
  flex:1;
  overflow-y:auto;
}
.action-btn {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:12px 16px;
  background:transparent;
  border:none;
  border-radius:8px;
  color:var(--ink);
  cursor:pointer;
  font-size:14px;
  margin-bottom:8px;
  text-decoration:none;
}
.action-btn:hover {
  background:rgba(255,255,255,0.1);
}
.action-btn img, .action-btn svg {
  width:16px;
  height:16px;
}
.action-btn .action-label {
  display:inline-flex;
  align-items:center;
}
/* Sidebar Bottom */
.sidebar-bottom {
  padding:16px;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.sidebar-bottom .user-email {
  color:var(--muted);
  font-size:12px;
}
.sidebar.collapsed .sidebar-nav {
  justify-content:center;
  padding:14px 0 0 0;
}
.sidebar.collapsed .nav-logo {
  display:none;
}
.sidebar.collapsed .nav-left {
  justify-content:center;
  gap:0;
}
.sidebar.collapsed .sidebar-actions {
  padding:12px 8px;
  align-items:center;
  margin-top:28px;
}
.sidebar.collapsed .action-btn {
  justify-content:center;
  padding:10px 0;
  gap:0;
}
.sidebar.collapsed .action-btn .action-label {
  display:none;
}
.sidebar.collapsed .action-btn img,
.sidebar.collapsed .action-btn svg {
  width:20px;
  height:20px;
}
.sidebar.collapsed .sidebar-bottom {
  padding:12px 4px;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.sidebar.collapsed .sidebar-bottom .user-email {
  display:none;
}
.sidebar.collapsed .logout-btn {
  padding:8px 0;
}
.sidebar.collapsed .resize-handle {
  right:-3px;
}
/* Main Chat Area wrapper */
.main-chat {
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
  min-height:0;
  overflow:auto;
}
/* Main Content */
.main-content {
  padding:0px;
  max-width:1200px;
  margin:0 auto;
}
/* Page Title */
.page-header {
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:4px;
  margin-top:0px;
  justify-content:flex-start;
  padding:20px 20px 0;
}
.page-title {
  font-size:18pt;
  font-weight:700;
  text-align:left;
  margin:0;
}
/* Avatar Grid */
.avatars-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
  gap:60px 40px;
  max-width:1000px;
  margin-top:20px;
}
/* Avatar Items */
.avatar-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  transition:transform 0.2s ease;
  position:relative;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
.avatar-item:hover {
  transform:scale(1.05);
}
.avatar-circle {
  width:190px;
  height:190px;
  border-radius:50%;
  overflow:hidden;
  margin-bottom:10px;
  background:#1a1a1a;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border:1px solid #333;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
.avatar-circle img {
  width:100%;
  height:100%;
  object-fit:cover;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  pointer-events: none;
}
.avatar-name {
  color:var(--ink);
  font-size:12px;
  text-align:center;
  margin:0;
  padding:0 8px;
  overflow:hidden;
  text-overflow:ellipsis;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  max-width:190px;
  line-height:1.3;
  word-wrap:break-word;
  min-height:1.3em;
}

/* Featured Avatar Dialog Modal */
#featuredAvatarModal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10000;
}

.modal-overlay {
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-content {
  background: var(--bg);
  border: 1px solid #505050;
  border-radius: 24px;
  max-width: 500px;
  width: 100%;
  max-height: 90dvh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  border-bottom: 0 solid #333;
}

.modal-header h2 {
  margin: 0;
  color: var(--ink);
  font-size: 20px;
}

.modal-close {
  background: transparent;
  border: none;
  color: var(--ink);
  font-size: 32px;
  cursor: pointer;
  padding: 0;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.modal-close:hover {
  opacity: 0.7;
}

.modal-body {
  padding: 16px;
  margin-top: -18px;
}

.featured-avatar-preview {
  text-align: center;
  margin-bottom: 24px;
}

.featured-avatar-preview img {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 1px solid #333;
  object-fit: cover;
  margin-bottom: 16px;
}

.featured-avatar-preview h3 {
  color: var(--ink);
  font-size: 16px;
  margin: 0 0 12px 0;
  line-height: 1.4;
}

.featured-avatar-description {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 24px;
  text-align: left;
}

.modal-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.modal-btn {
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}

.modal-btn-primary {
  background: var(--ink);
  color: var(--bg);
}

.modal-btn-primary:hover {
  opacity: 0.9;
  transform: scale(1.02);
}

.modal-btn-secondary {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--stroke);
}

.modal-btn-secondary:hover {
  background: rgba(255,255,255,0.1);
}

/* Mobile Top Navigation */
.mobile-top-nav {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: var(--bg);
  border-bottom: 0px solid #333;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 1001;
}
.mobile-nav-btn {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s ease;
}
.mobile-nav-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}
.mobile-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.mobile-nav-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 18px;
  font-weight: 600;
  margin: 0;
  color: var(--ink);
  pointer-events: none;
}

/* Mobile Styles */
@media (max-width: 768px) {
  .mobile-top-nav {
    display: flex;
  }
  /* Sidebar as overlay on mobile */
  .sidebar {
    position: fixed !important;
    left: -300px;
    top: 0;
    height: 100dvh;
    width: 300px !important;
    min-width: 300px !important;
    z-index: 1002;
    transition: left 0.3s ease;
  }
  /* Mobile sidebar backdrop */
  .mobile-sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 998;
  }
  .mobile-sidebar-backdrop.show {
    display: block;
  }
  /* Override collapsed state on mobile */
  .sidebar.collapsed {
    width: 300px !important;
    min-width: 300px !important;
    overflow: visible !important;
  }
  .sidebar.collapsed .nav-logo {
    display: block;
  }
  .sidebar.collapsed .sidebar-actions {
    padding: 16px;
    margin-top: 0;
  }
  .sidebar.collapsed .action-btn {
    justify-content: flex-start;
    padding: 12px 16px;
    gap: 12px;
  }
  .sidebar.collapsed .action-btn .action-label {
    display: inline-flex;
  }
  .sidebar.collapsed .action-btn img,
  .sidebar.collapsed .action-btn svg {
    width: 16px;
    height: 16px;
  }
  .sidebar.collapsed .sidebar-bottom {
    padding: 16px;
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }
  .sidebar.collapsed .sidebar-bottom .user-email {
    display: block;
  }
  .sidebar.collapsed .logout-btn {
    padding: 8px;
  }
  .sidebar.mobile-open {
    left: 0;
  }
  .sidebar-toggle {
    display: none !important;
  }
  .chat-container {
    padding-top: 60px;
  }
  .page-header {
    display:none;
  }
  .main-content {
    padding:0px;
  }
  .avatars-grid {
    grid-template-columns: 1fr 1fr;
    gap: 50px 13px !important;
    padding: 14px 16px 0;
    margin-top:-15px;
    max-width: none;
  }
  .avatar-circle {
    width: 130px;
    height: 130px;
    margin-bottom: 8px;
  }
  .avatar-name {
    font-size: 11px;
    max-width: 130px;
  }
  .resize-handle {
    display: none;
  }
  .featured-avatar-preview img {
    width: 150px;
    height: 150px;
  }
}

    // === Check Authentication ===
    async function checkAuth() {
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error || !session) {
        window.location.href = 'auth.html';
        return null;
      }
      return session.user;
    }

    // === Initialize Page ===
    async function init() {
      const user = await checkAuth();
      if (!user) return;

      // Display user email
      document.getElementById('userEmail').textContent = user.email || '';

      // Load featured avatars
      loadFeaturedAvatars();

      // Setup sidebar and navigation
      setupSidebar();
      setupNavigation();
    }

    // === Load Featured Avatars ===
    function loadFeaturedAvatars() {
      const grid = document.getElementById('avatarsGrid');
      grid.innerHTML = '';

      featuredAvatars.forEach(avatar => {
        const item = document.createElement('div');
        item.className = 'avatar-item';
        item.innerHTML = `
          <div class="avatar-circle">
            <img src="${avatar.image_url}" alt="${avatar.name}">
          </div>
          <p class="avatar-name">${avatar.name}</p>
        `;
        
        item.addEventListener('click', () => showAvatarModal(avatar));
        grid.appendChild(item);
      });
    }

    // === Show Avatar Modal ===
    function showAvatarModal(avatar) {
      const modal = document.getElementById('featuredAvatarModal');
      const modalImage = document.getElementById('modalAvatarImage');
      const modalName = document.getElementById('modalAvatarName');
      const modalDescription = document.getElementById('modalAvatarDescription');
      
      modalImage.src = avatar.image_url;
      modalName.textContent = avatar.name;
      modalDescription.textContent = avatar.description;
      
      modal.style.display = 'flex';
      
      // Store current avatar for adding
      modal.dataset.avatarId = avatar.id;
      modal.dataset.avatarData = JSON.stringify(avatar);
    }

    // === Hide Avatar Modal ===
    function hideAvatarModal() {
      const modal = document.getElementById('featuredAvatarModal');
      modal.style.display = 'none';
    }

    // === Add Avatar to User's Library ===
    async function addAvatarToLibrary() {
      const modal = document.getElementById('featuredAvatarModal');
      const avatarData = JSON.parse(modal.dataset.avatarData);
      const addBtn = document.getElementById('addToLibraryBtn');
      
      // Disable button and show loading
      addBtn.disabled = true;
      addBtn.textContent = 'Adding...';
      
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) throw new Error('User not authenticated');

        // Create a copy of the avatar for this user
        const { data, error } = await supabase
          .from('avatars')
          .insert({
            user_id: user.id,
            name: avatarData.name,
            image_url: avatarData.image_url,
            traits: avatarData.traits,
            personality_prompt: avatarData.personality_prompt,
            is_active: true
          })
          .select();

        if (error) throw error;

        // Success! Show feedback and redirect
        addBtn.textContent = 'Added!';
        setTimeout(() => {
          hideAvatarModal();
          window.location.href = 'index.html';
        }, 500);

      } catch (error) {
        console.error('Error adding avatar:', error);
        alert('Failed to add avatar to your library. Please try again.');
        addBtn.disabled = false;
        addBtn.textContent = 'Add to Library';
      }
    }

    // === Setup Modal Event Listeners ===
    document.getElementById('modalClose').addEventListener('click', hideAvatarModal);
    document.getElementById('cancelBtn').addEventListener('click', hideAvatarModal);
    document.getElementById('addToLibraryBtn').addEventListener('click', addAvatarToLibrary);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'modalOverlay') {
        hideAvatarModal();
      }
    });

    // === Sidebar Functionality ===
    function setupSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const toggle = document.getElementById('sidebarToggle');
      const resizeHandle = document.getElementById('resizeHandle');
      
      if (!sidebar) return;

      // Load saved sidebar state
      const savedState = localStorage.getItem('sidebarState');
      const savedWidth = localStorage.getItem('sidebarWidth');
      
      if (savedState === 'expanded') {
        sidebar.classList.remove('collapsed');
      }
      
      if (savedWidth && savedState === 'expanded') {
        sidebar.style.width = savedWidth;
      }

      // Toggle sidebar
      if (toggle) {
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('collapsed');
          const isCollapsed = sidebar.classList.contains('collapsed');
          localStorage.setItem('sidebarState', isCollapsed ? 'collapsed' : 'expanded');
        });
      }

      // Resize functionality
      if (resizeHandle) {
        let isResizing = false;
        let startX;
        let startWidth;

        resizeHandle.addEventListener('mousedown', (e) => {
          if (sidebar.classList.contains('collapsed')) return;
          isResizing = true;
          startX = e.clientX;
          startWidth = sidebar.offsetWidth;
          sidebar.classList.add('resizing');
          resizeHandle.classList.add('resizing');
        });

        document.addEventListener('mousemove', (e) => {
          if (!isResizing) return;
          const width = startWidth + (e.clientX - startX);
          const minWidth = 200;
          const maxWidth = 600;
          if (width >= minWidth && width <= maxWidth) {
            sidebar.style.width = width + 'px';
          }
        });

        document.addEventListener('mouseup', () => {
          if (isResizing) {
            isResizing = false;
            sidebar.classList.remove('resizing');
            resizeHandle.classList.remove('resizing');
            localStorage.setItem('sidebarWidth', sidebar.style.width);
          }
        });
      }

      // Mobile sidebar
      const mobileLogoBtn = document.getElementById('mobileLogoBtn');
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const mobileSidebarBackdrop = document.getElementById('mobileSidebarBackdrop');
      
      console.log('Mobile elements found:', { 
        mobileLogoBtn: !!mobileLogoBtn, 
        mobileMenuBtn: !!mobileMenuBtn, 
        mobileSidebarBackdrop: !!mobileSidebarBackdrop,
        sidebar: !!sidebar
      });
      
      if (mobileLogoBtn) {
        mobileLogoBtn.addEventListener('click', (e) => {
          console.log('Mobile logo clicked');
          e.stopPropagation();
          sidebar.classList.toggle('mobile-open');
          mobileSidebarBackdrop.classList.toggle('show');
          console.log('Sidebar classes:', sidebar.classList.toString());
        });
      }
      
      if (mobileMenuBtn) {
        mobileMenuBtn.addEventListener('click', (e) => {
          console.log('Mobile menu clicked');
          e.stopPropagation();
          sidebar.classList.toggle('mobile-open');
          mobileSidebarBackdrop.classList.toggle('show');
        });
      }

      // Close sidebar when clicking backdrop
      if (mobileSidebarBackdrop) {
        mobileSidebarBackdrop.addEventListener('click', () => {
          console.log('Backdrop clicked');
          sidebar.classList.remove('mobile-open');
          mobileSidebarBackdrop.classList.remove('show');
        });
      }

      // Close sidebar when clicking outside on mobile
      document.addEventListener('click', (e) => {
        if (window.innerWidth <= 768 && 
            sidebar.classList.contains('mobile-open') &&
            !sidebar.contains(e.target) &&
            !mobileLogoBtn.contains(e.target) &&
            !mobileMenuBtn.contains(e.target)) {
          console.log('Outside click, closing sidebar');
          sidebar.classList.remove('mobile-open');
          mobileSidebarBackdrop.classList.remove('show');
        }
      });
    }

    // === Setup Navigation ===
    function setupNavigation() {
      // Logout
      document.getElementById('logoutBtn')?.addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = 'auth.html';
      });

      // Chat navigation - go to most recent active avatar
      document.getElementById('chatNavAction')?.addEventListener('click', async (e) => {
        e.preventDefault();
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return;

        const { data: avatars } = await supabase
          .from('avatars')
          .select('id')
          .eq('user_id', user.id)
          .eq('is_active', true)
          .order('updated_at', { ascending: false })
          .limit(1);

        if (avatars && avatars.length > 0) {
          window.location.href = `chat.html?avatar=${avatars[0].id}`;
        } else {
          window.location.href = 'create.html';
        }
      });
    }

    // === Initialize on Load ===
    init();
  </script>
</body>
</html>
