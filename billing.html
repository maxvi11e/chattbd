<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeaea — Billing</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>
    :root{
      --bg:#000;
      --ink:#fff;
      --muted:#999;
      --bubble:#333;
      --stroke:#fff;
      --radius-lg:24px;
      --radius-md:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial}

    .screen{min-height:100dvh; width:100%;}
    .dashboard{padding:0; min-height:100dvh;}
    
    /* Top Navigation */
    .top-nav{display:flex; justify-content:space-between; align-items:center; padding:14px 48px 0px 48px;}
    .nav-left{display:flex; align-items:center; gap:24px;}
    .nav-logo{height:32px; width:auto;}
    .nav-icon{height:24px; width:auto; transition:transform 0.2s ease; cursor:pointer; opacity:1;}
    .nav-icon:hover{transform:scale(1.1);}
    .nav-right{display:flex; gap:16px; align-items:center;}
    .user-email{color:var(--ink); font-size:16px;}
    .logout-btn{padding:8px; border:none; background:transparent; color:var(--ink); border-radius:8px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;}
    .logout-btn:hover{background:rgba(255,255,255,0.1);}
    .logout-btn img{width:24px; height:24px;}

    /* Main Content */
    .main-content{padding:10px; max-width:1000px; margin-top:-28px; margin:0 auto;}
    .page-header{text-align:center; margin-bottom:48px;}
    .page-title{font-size:30px; font-weight:600; margin:0 0 16px 0;}
    .page-subtitle{color:var(--muted); font-size:18px; margin:0;}

    /* Current Plan Card */
    .current-plan{background:rgba(255,255,255,0.05); border:1px solid rgba(128,128,128,0.3); border-radius:var(--radius-lg); padding:22px; margin-top:-22px;margin-bottom:40px; text-align:center; width:300px; max-width:300px; margin-left:auto; margin-right:auto;}
    .plan-name{font-size:28px; font-weight:bold; margin:0 0 8px 0; color:var(--ink);}
    .plan-price{font-size:24px; color:var(--muted); margin:0 0 16px 0;}
    .plan-usage{font-size:16px; color:var(--muted); margin:0 0 24px 0;}
    .usage-bar{width:100%; height:8px; background:rgba(128,128,128,0.2); border-radius:4px; overflow:hidden; margin:16px 0;}
    .usage-fill{height:100%; background:var(--ink); transition:width 0.3s ease;}

    /* Available Plans */
    .plans-section{margin-bottom:48px; margin-top:-20px;}
    .section-title{font-size:24px; font-weight:600; margin:0 0 24px 0; text-align:center;}
    .plans-grid{display:flex; flex-wrap:nowrap; gap:24px; justify-content:center; overflow-x:auto;}
    
    .plan-card{border:1px solid rgba(128,128,128,0.3); border-radius:var(--radius-lg); padding:32px; text-align:center; position:relative; background:var(--bg); width:275px !important; max-width:275px !important; flex-shrink:0; flex-grow:0;}
    .plan-card.recommended{border-color:#2196F3; background:rgba(33, 150, 243, 0.1);}
    .plan-card.current{border-color:#4CAF50; background:rgba(76, 175, 80, 0.1); opacity:0.7;}
    
    
    .plan-card h3{font-size:24px; font-weight:bold; margin:0 0 8px 0;}
    .plan-card .price{font-size:32px; font-weight:bold; margin:0 0 16px 0;}
    .plan-card .description{color:var(--muted); font-size:14px; margin:0 0 24px 0;}
    .plan-card .features{list-style:none; padding:0; margin:0 0 32px 0;}
    .plan-card .features li{font-size:14px; margin:12px 0; padding-left:20px; position:relative;}
    .plan-card .features li::before{content:"✓"; color:#4CAF50; font-weight:bold; position:absolute; left:0;}
    
    .plan-button{background:var(--ink); color:var(--bg); border:none; padding:16px 32px; border-radius:var(--radius-md); font-size:16px; font-weight:bold; cursor:pointer; width:100%; transition:opacity 0.2s ease;}
    .plan-button:hover:not(:disabled){opacity:0.8;}
    .plan-button:disabled{background:var(--muted); cursor:not-allowed;}
    .plan-button.current{background:#4CAF50; color:white;}

    /* Billing History */
    .billing-history{margin-top:48px;}
    .history-table{width:100%; border-collapse:collapse; margin-top:24px;}
    .history-table th, .history-table td{padding:16px; text-align:left; border-bottom:1px solid rgba(128,128,128,0.3);}
    .history-table th{color:var(--ink); font-weight:600;}
    .history-table td{color:var(--muted);}
    .status-badge{padding:4px 12px; border-radius:16px; font-size:12px; font-weight:bold;}
    .status-paid{background:#4CAF50; color:white;}
    .status-pending{background:#ff9800; color:white;}

    /* Delete Account Section */
    .delete-account-section{margin-top:64px; padding-top:48px; border-top:1px solid rgba(128,128,128,0.3);}
    .delete-account-card{background:rgba(255,59,48,0.1); border:1px solid rgba(255,59,48,0.3); border-radius:var(--radius-lg); padding:24px; display:flex; flex-direction:column; align-items:center; gap:16px; max-width:500px; margin:0 auto;}
    .delete-account-info{text-align:center;}
    .delete-account-info h3{margin:0 0 8px 0; color:#ff453a; font-size:18px;}
    .delete-account-info p{margin:0; color:var(--muted); font-size:14px;}
    .delete-btn{background:#ff453a; color:white; border:none; padding:12px 24px; border-radius:var(--radius-md); font-size:14px; font-weight:600; cursor:pointer; transition:background 0.2s; white-space:nowrap;}
    .delete-btn:hover{background:#ff3b30;}

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .top-nav{padding:12px 16px 0px 16px;}
      .main-content{padding:20px 16px; margin-top:-12px;}
      .plans-grid{flex-direction:column; align-items:center;}
      .current-plan{padding:16px 16px;}
      .plan-card{padding:16px 16px; width:275px !important; max-width:275px !important;}
      
      .history-table{font-size:14px;}
      .history-table th, .history-table td{padding:12px 8px;}
      
      .delete-account-card{flex-direction:column; align-items:stretch; text-align:center;}
      .delete-btn{width:100%;}
    }
  </style>
</head>

<body>
  <div class="screen dashboard">
    <!-- Top Navigation -->
    <div class="top-nav">
      <div class="nav-left">
        <img src="images/favicon.png" alt="Aeaea Logo" class="nav-logo">
        <a href="index.html">
          <img src="images/library_icon.png" alt="AI Library" class="nav-icon" title="AI library">
        </a>
        <a href="#" id="chatNavIcon">
          <img src="images/chat_icon.png" alt="Chat" class="nav-icon" title="Chat with latest AI">
        </a>
      </div>
      <div class="nav-right">
        <span id="userEmail" class="user-email"></span>
        <button id="logoutBtn" class="logout-btn" title="Sign out">
          <img src="images/logout_icon.png" alt="Sign out" />
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Page Header -->
      <div class="page-header">
        <h1 class="page-title">Billing & Subscription</h1>
        <!-- <p class="page-subtitle">Manage your subscription and billing preferences</p> -->
      </div>

      <!-- Current Plan -->
      <div class="current-plan" id="currentPlan">
        <h2 class="plan-name" id="currentPlanName">Free Plan</h2>
        <div class="plan-price" id="currentPlanPrice">Free</div>
        <div class="plan-usage" id="currentPlanUsage">
          <span id="botCount">0</span> of <span id="botLimit">1</span> AIs created
        </div>
        <div class="usage-bar">
          <div class="usage-fill" id="usageFill" style="width:0%"></div>
        </div>
        <div class="plan-usage" id="editCreditsUsage" style="margin-top:16px;">
          <span id="editCreditsUsed">0</span> of <span id="editCreditsLimit">0</span> edit credits used
        </div>
        <div class="usage-bar">
          <div class="usage-fill" id="editCreditsFill" style="width:0%"></div>
        </div>
      </div>

      <!-- Available Plans -->
      <div class="plans-section">
        <h2 class="section-title">Choose Your Plan</h2>
        <div class="plans-grid" id="plansGrid">
          <!-- Plans will be populated here -->
        </div>
      </div>

      <!-- Billing History -->
      <div class="billing-history">
        <h2 class="section-title">Billing History</h2>
        <table class="history-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="billingHistory">
            <tr>
              <td colspan="4" style="text-align:center; color:var(--muted); padding:40px;">
                No billing history available
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Delete Account Section -->
      <div class="delete-account-section">
        <div class="delete-account-card">
          <div class="delete-account-info">
            <h3>Delete Account</h3>
            <p>Permanently delete your account and all associated data. This action cannot be undone.</p>
          </div>
          <button id="deleteAccountBtn" class="delete-btn">Delete Account</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Freemium utilities -->
  <script type="module" src="freemium-utils.js"></script>
  
  <script type="module">
    // === DESIGN MODE ===
    // Set to true to see mock data without authentication
    const DESIGN_MODE = false;
    
    // === Supabase Auth ===
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c";
    const supabase = createClient(supabaseUrl, supabaseAnonKey, {
      auth: {
        storage: window.localStorage,
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true,
        flowType: 'pkce',
        storageKey: 'sb-auth-token'
      }
    });
    
    // Make supabase available globally for freemium-utils.js
    window.supabase = supabase;

    // Check authentication and redirect if needed
    async function checkAuthAndRedirect() {
      if (DESIGN_MODE) {
        console.log('Design mode active - skipping auth check');
        return true;
      }
      
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'auth.html';
        return false;
      }
      console.log("User authenticated:", session.user.email);
      
      // Load and display username from profiles table
      await loadUserProfile(session.user);
      return true;
    }

    // Load user profile and display username
    async function loadUserProfile(user) {
      if (DESIGN_MODE) {
        document.getElementById('userEmail').textContent = 'design@example.com';
        return;
      }
      
      try {
        const { data: profile, error } = await supabase
          .from('profiles')
          .select('display_name')
          .eq('id', user.id)
          .single();

        if (error) {
          console.error('Error loading profile:', error);
          document.getElementById('userEmail').textContent = user.email;
        } else {
          document.getElementById('userEmail').textContent = profile?.display_name || user.email;
        }
      } catch (error) {
        console.error('Error in loadUserProfile:', error);
        document.getElementById('userEmail').textContent = user.email;
      }
    }

    // Load and display subscription information
    async function loadSubscriptionInfo() {
      try {
        if (DESIGN_MODE) {
          // Mock data for design mode
          document.getElementById('currentPlanName').textContent = 'Pro Plan';
          document.getElementById('currentPlanPrice').textContent = '$9.99/month';
          document.getElementById('botCount').textContent = '3';
          document.getElementById('botLimit').textContent = '10';
          
          const percentage = (3 / 10) * 100;
          document.getElementById('usageFill').style.width = percentage + '%';
          
          // Display mock plans
          displayMockPlans();
          return;
        }
        
        const subscriptionInfo = await window.FreemiumUtils.getUserSubscriptionInfo(supabase);
        const plans = await window.FreemiumUtils.getSubscriptionPlans(supabase);
        
        // Update current plan info
        document.getElementById('currentPlanName').textContent = subscriptionInfo.plan_name;
        document.getElementById('currentPlanPrice').textContent = 
          window.FreemiumUtils.formatPrice(
            plans.find(p => p.id === subscriptionInfo.plan_id)?.price_cents || 0,
            plans.find(p => p.id === subscriptionInfo.plan_id)?.billing_interval || 'one_time'
          );
        
        // Update usage info
        document.getElementById('botCount').textContent = subscriptionInfo.current_bot_count;
        document.getElementById('botLimit').textContent = subscriptionInfo.bot_limit || 'unlimited';
        
        // Update usage bar
        if (subscriptionInfo.bot_limit) {
          const percentage = (subscriptionInfo.current_bot_count / subscriptionInfo.bot_limit) * 100;
          document.getElementById('usageFill').style.width = Math.min(percentage, 100) + '%';
        } else {
          document.getElementById('usageFill').style.width = '100%';
          document.getElementById('usageFill').style.background = '#4CAF50';
        }
        
        // Update edit credits info
        const editCreditsUsed = subscriptionInfo.edit_credits_used || 0;
        const editCreditsLimit = subscriptionInfo.edit_credits_limit || 0;
        
        document.getElementById('editCreditsUsed').textContent = editCreditsUsed;
        document.getElementById('editCreditsLimit').textContent = editCreditsLimit || 'unlimited';
        
        // Update edit credits usage bar
        if (editCreditsLimit > 0) {
          const creditsPercentage = (editCreditsUsed / editCreditsLimit) * 100;
          document.getElementById('editCreditsFill').style.width = Math.min(creditsPercentage, 100) + '%';
        } else if (editCreditsLimit === null || editCreditsLimit === 0) {
          // No edit credits for free plan
          document.getElementById('editCreditsUsage').style.display = editCreditsLimit === 0 ? 'none' : 'block';
          document.getElementById('editCreditsFill').parentElement.style.display = editCreditsLimit === 0 ? 'none' : 'block';
        }
        
        // Populate plans grid
        const plansGrid = document.getElementById('plansGrid');
        plansGrid.innerHTML = plans.map(plan => {
          const isCurrent = plan.id === subscriptionInfo.plan_id;
          const isRecommended = plan.id === 'starter';
          
          return `
            <div class="plan-card ${isCurrent ? 'current' : ''} ${isRecommended ? 'recommended' : ''}">
              <h3>${plan.name}</h3>
              <div class="price">${window.FreemiumUtils.formatPrice(plan.price_cents, plan.billing_interval)}</div>
              <p class="description">${plan.description}</p>
              <ul class="features">
                ${(plan.features || []).map(feature => `<li>${feature}</li>`).join('')}
              </ul>
              <button class="plan-button ${isCurrent ? 'current' : ''}" 
                      data-plan-id="${plan.id}" 
                      ${isCurrent ? 'disabled' : ''}>
                ${isCurrent ? 'Current Plan' : plan.price_cents === 0 ? 'Downgrade' : 'Upgrade'}
              </button>
            </div>
          `;
        }).join('');
        
        // Add event listeners to plan buttons
        plansGrid.querySelectorAll('.plan-button:not(:disabled)').forEach(button => {
          button.addEventListener('click', async () => {
            const planId = button.dataset.planId;
            const plan = plans.find(p => p.id === planId);
            
            if (plan && plan.price_cents > 0) {
              await handlePaidPlanUpgrade(plan);
            } else if (plan && plan.price_cents === 0) {
              await handleFreePlanDowngrade(plan);
            }
          });
        });
        
        return subscriptionInfo;
      } catch (error) {
        console.error('Error loading subscription info:', error);
      }
    }

    // Display mock plans for design mode
    function displayMockPlans() {
      const mockPlans = [
        {
          id: 'free',
          name: 'Free',
          price_cents: 0,
          billing_interval: 'one_time',
          description: 'Perfect for getting started',
          features: ['3 bots', 'Basic features', 'Community support'],
          isCurrent: false
        },
        {
          id: 'pro',
          name: 'Pro',
          price_cents: 999,
          billing_interval: 'month',
          description: 'For power users',
          features: ['10 bots', 'Advanced features', 'Priority support', 'Custom avatars'],
          isCurrent: true,
          isRecommended: true
        },
        {
          id: 'unlimited',
          name: 'Unlimited',
          price_cents: 2999,
          billing_interval: 'month',
          description: 'No limits',
          features: ['Unlimited bots', 'All features', 'VIP support', 'Early access'],
          isCurrent: false
        }
      ];
      
      const plansGrid = document.getElementById('plansGrid');
      plansGrid.innerHTML = mockPlans.map(plan => {
        const formatPrice = (cents, interval) => {
          if (cents === 0) return 'Free';
          const dollars = (cents / 100).toFixed(2);
          return interval === 'month' ? `$${dollars}/mo` : `$${dollars}`;
        };
        
        return `
          <div class="plan-card ${plan.isCurrent ? 'current' : ''} ${plan.isRecommended ? 'recommended' : ''}">
            <h3>${plan.name}</h3>
            <div class="price">${formatPrice(plan.price_cents, plan.billing_interval)}</div>
            <p class="description">${plan.description}</p>
            <ul class="features">
              ${plan.features.map(feature => `<li>${feature}</li>`).join('')}
            </ul>
            <button class="plan-button ${plan.isCurrent ? 'current' : ''}" 
                    ${plan.isCurrent ? 'disabled' : ''}
                    onclick="alert('Design mode - button disabled')">
              ${plan.isCurrent ? 'Current Plan' : plan.price_cents === 0 ? 'Downgrade' : 'Upgrade'}
            </button>
          </div>
        `;
      }).join('');
    }

    // Handle upgrade to paid plan
    async function handlePaidPlanUpgrade(plan) {
      // Use the FreemiumUtils function that handles Stripe checkout
      await window.FreemiumUtils.handlePaidPlanUpgrade(plan);
    }

    // Handle downgrade to free plan
    async function handleFreePlanDowngrade(plan) {
      const confirm = window.confirm(
        `Are you sure you want to downgrade to the ${plan.name}? You'll be limited to ${plan.bot_limit} agent(s).`
      );
      
      if (confirm) {
        // TODO: Implement downgrade logic
        alert('Downgrade functionality coming soon!');
      }
    }

    // Initialize the page
    async function init() {
      const isAuthenticated = await checkAuthAndRedirect();
      if (!isAuthenticated) return;

      // Load subscription info
      await loadSubscriptionInfo();

      // Setup event handlers
      const logoutBtn = document.getElementById("logoutBtn");
      const chatNavIcon = document.getElementById("chatNavIcon");
      const deleteAccountBtn = document.getElementById("deleteAccountBtn");

      if (!deleteAccountBtn) {
        console.error('Delete account button not found!');
      }

      // Sign out handler
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          await supabase.auth.signOut();
          window.location.href = 'auth.html';
        });
      }

      // Chat navigation handler
      if (chatNavIcon) {
        chatNavIcon.addEventListener("click", (e) => {
          e.preventDefault();
          const lastAvatarId = localStorage.getItem('lastSelectedAvatar');
          if (lastAvatarId) {
            window.location.href = `chat.html?avatar=${lastAvatarId}`;
          } else {
            alert('Please select an avatar to chat with first!');
          }
        });
      }

      // Delete account handler
      if (deleteAccountBtn) {
        deleteAccountBtn.addEventListener("click", async () => {
        const confirmed = confirm(
          "Are you absolutely sure you want to delete your account?\n\n" +
          "This will permanently delete:\n" +
          "• All your avatars\n" +
          "• All chat history\n" +
          "• Your subscription data\n" +
          "• All associated data\n\n" +
          "This action CANNOT be undone."
        );
        
        if (!confirmed) return;
        
        // Double confirmation
        const doubleConfirm = confirm(
          "FINAL WARNING: This will permanently delete everything. Are you 100% sure?"
        );
        
        if (!doubleConfirm) return;
        
        try {
          deleteAccountBtn.disabled = true;
          deleteAccountBtn.textContent = "Deleting...";
          
          const { data: { session } } = await supabase.auth.getSession();
          if (!session) {
            alert("Session expired. Please log in again.");
            window.location.href = 'auth.html';
            return;
          }
          
          const userId = session.user.id;
          
          // Delete user data in order (respecting foreign key constraints)
          // Note: Conversations and Messages will cascade delete when avatars are deleted
          console.log('Deleting user data...');
          
          // 1. Delete user subscriptions (has CASCADE on user_id)
          const { error: subsError } = await supabase
            .from('user_subscriptions')
            .delete()
            .eq('user_id', userId);
          
          if (subsError) {
            console.warn('Error deleting subscriptions:', subsError);
            // Continue anyway - this is not critical
          }
          
          // 2. Delete avatars (will CASCADE delete conversations and messages)
          const { error: avatarsError } = await supabase
            .from('avatars')
            .delete()
            .eq('user_id', userId);
          
          if (avatarsError) {
            console.error('Error deleting avatars:', avatarsError);
            throw new Error('Failed to delete avatars');
          }
          
          // 3. Delete profile
          const { error: profileError } = await supabase
            .from('profiles')
            .delete()
            .eq('id', userId);
          
          if (profileError) {
            console.error('Error deleting profile:', profileError);
            throw new Error('Failed to delete profile');
          }
          
          // 4. Sign out (this will end the session)
          await supabase.auth.signOut();
          
          alert('Your account and all associated data have been permanently deleted.');
          window.location.href = 'auth.html';
          
        } catch (error) {
          console.error('Error deleting account:', error);
          alert('An error occurred while deleting your account. Please try again or contact support.');
          deleteAccountBtn.disabled = false;
          deleteAccountBtn.textContent = "Delete Account";
        }
        });
      }

      // Watch auth state changes
      if (!DESIGN_MODE) {
        supabase.auth.onAuthStateChange((_event, session) => {
          if (!session) {
            window.location.href = 'auth.html';
          }
        });
      }
    }

    // Start the app
    init();
  </script>
</body>
</html>
