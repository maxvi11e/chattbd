<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeaea — Chat</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>
@keyframes progress {
  0% {
    width: 0%;
  }
  100% {
    width: 100%;
  }
}
:root {
  --bg:#000;
  --ink:#fff;
  --muted:#d9d9d9;
  --bubble:#333;
  --stroke:#fff;
  --radius-lg:24px;
  --radius-md:14px;
}
* {
  box-sizing:border-box;
}
html,body {
  height:100%;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
}
.screen {
  min-height:100dvh;
  width:100%;
}
/* ===== Chat Layout ===== */
.chat-container {
  display:flex;
  height:100dvh;
}
/* Sidebar */
.sidebar {
  width:300px;
  background:var(--bg);
  border-right:1px solid #333;
  display:flex;
  flex-direction:column;
  transition:width 0.3s ease;
  position:relative;
  min-width:200px;
  max-width:600px;
}
.sidebar.collapsed {
  width:44px !important;
  min-width:44px !important;
  overflow:hidden;
}
.sidebar.resizing {
  transition:none;
}
/* Disable transition while resizing! */
.sidebar *::-webkit-scrollbar {
  width:8px;
}
.sidebar *::-webkit-scrollbar-track {
  background:#000 !important;
}
.sidebar *::-webkit-scrollbar-thumb {
  background:rgba(255, 255, 255, .1);
  border-radius:999px;
}
.sidebar *::-webkit-scrollbar-corner {
  background:#000;
}
/* Resize Handle */
.resize-handle {
  position:absolute;
  top:0;
  right:-3px;
  width:6px;
  height:100%;
  cursor:col-resize;
  background:transparent;
  z-index:100;
}
.resize-handle:hover {
  background:rgba(255,255,255,0.1);
}
.resize-handle.resizing {
  background:rgba(255,255,255,0.2);
}
/* Sidebar Toggle Button */
.sidebar-toggle {
  position:fixed;
  top:12px;
  left:260px;
  width:32px;
  height:32px;
  background:transparent;
  border:none;
  border-radius:8px;
  color:var(--ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  z-index:1000;
  transition:left 0.3s ease;
}
.sidebar-toggle:hover {
  background:transparent;
}
.sidebar-toggle:active {
  background:transparent;
}
.sidebar-toggle:focus {
  background:transparent;
  outline:none;
}
.sidebar.collapsed + .main-chat .sidebar-toggle {
  display:none;
}
.sidebar.resizing + .main-chat .sidebar-toggle {
  transition:none;
}
/* Top Navigation in Sidebar */
.sidebar-nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 24px 0px 24px;
}
.nav-left {
  display:flex;
  align-items:center;
  gap:16px;
}
.sidebar-mini-toggle {
  display:none;
  background:transparent;
  border:none;
  color:var(--ink);
  width:32px;
  height:32px;
  border-radius:8px;
  cursor:pointer;
  align-items:center;
  justify-content:center;
}
.sidebar-mini-toggle svg {
  width:18px;
  height:18px;
  fill:var(--ink);
}
.sidebar-mini-toggle:hover {
  background:rgba(255,255,255,0.1);
}
.nav-logo {
  height:44px;
  width:auto;
}
.nav-icon {
  height:24px;
  width:auto;
  transition:transform 0.2s ease;
  cursor:pointer;
  opacity:1;
}
.nav-icon:hover {
  transform:scale(1.1);
}
.nav-right {
  display:flex;
  gap:12px;
  align-items:center;
}
.user-email {
  color:var(--ink);
  font-size:14px;
}
.logout-btn {
  padding:6px 12px;
  border:1px solid var(--stroke);
  background:transparent;
  color:var(--ink);
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}
.logout-btn:hover {
  background:rgba(255,255,255,0.1);
}
.sidebar.collapsed .sidebar-nav {
  justify-content:center;
  padding:8px 0;
  flex-direction:column;
  gap:8px;
}
.sidebar.collapsed .nav-left,
.sidebar.collapsed .nav-right {
  display:none;
}
.sidebar.collapsed .sidebar-mini-toggle {
  display:flex;
}
.sidebar.collapsed .sidebar-actions {
  padding:12px 8px;
  align-items:center;
}
.sidebar.collapsed .action-btn {
  justify-content:center;
  gap:0;
  padding:10px 0;
}
.sidebar.collapsed .action-btn .action-label {
  display:none;
}
.sidebar.collapsed .action-btn img,
.sidebar.collapsed .action-btn svg {
  width:20px;
  height:20px;
}
.sidebar.collapsed .sidebar-bottom {
  padding:12px 8px;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.sidebar.collapsed .sidebar-bottom .user-email {
  display:none;
}
.sidebar.collapsed .logout-btn {
  padding:8px 0;
}
.ask-question-bar {
  display:flex;
  justify-content:center;
  gap:8px;
  margin:8px 0 4px;
  flex-wrap:nowrap;
}
.ask-bar-btn {
  background:rgba(255, 255, 255, 0.1);
  color:#fff;
  border:0px solid rgba(255, 255, 255, 0.1);
  border-radius:20px;
  padding:6px 14px;
  font-size:13px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:transform 0.15s ease-in-out, background 0.2s ease;
}
.ask-bar-btn:hover {
  background:#2a2a2a;
  transform:translateY(-2px);
}
.ask-bar-btn:active {
  transform:translateY(0);
}
/* Sidebar Actions */
.sidebar-actions {
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.action-btn {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:12px 16px;
  background:transparent;
  border:none;
  border-radius:8px;
  color:var(--ink);
  cursor:pointer;
  font-size:14px;
  margin-bottom:8px;
  text-decoration:none;
}
.action-btn:hover {
  background:rgba(255,255,255,0.1);
}
.action-btn img, .action-btn svg {
  width:16px;
  height:16px;
  fill:var(--ink);
}
.action-btn .action-label {
  display:inline-flex;
  align-items:center;
}
/* Conversations List */
.conversations {
  flex:1;
  overflow-y:auto;
  padding:16px;
}
.conversations-header {
  font-size:14px;
  font-weight:300;
  font-style:italic;
  color:#dddddd;
  margin-bottom:12px;
  padding-left:32px;
}
.conversation-item {
  padding:12px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:4px;
  color:var(--ink);
  font-size:14px;
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.conversation-item:hover {
  background:rgba(255,255,255,0.1);
}
.conversation-item.active {
  background:rgba(255,255,255,0.15);
}
.sidebar.collapsed .conversation-item.active {
  background:transparent;
}
/* Conversation Menu */
.conversation-title {
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.conversation-actions {
  opacity:0;
  transition:opacity 0.2s ease;
  position:relative;
}
.conversation-item:hover .conversation-actions {
  opacity:1;
}
.conversation-menu-btn {
  background:none;
  border:none;
  color:var(--ink);
  cursor:pointer;
  padding:4px;
  border-radius:4px;
  font-size:14px;
  font-weight:600;
  width:20px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.conversation-menu-btn:hover {
  background:rgba(255,255,255,0.2);
}
.conversation-dropdown {
  position:absolute;
  top:100%;
  right:0;
  background:var(--bg);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:8px;
  min-width:120px;
  z-index:25;
  display:none;
  box-shadow:0 4px 6px rgba(0,0,0,0.3);
}
.conversation-dropdown.show {
  display:block;
}
.conversation-dropdown-item {
  display:block;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--ink);
  padding:8px 12px;
  cursor:pointer;
  font-size:14px;
  border-radius:4px;
}
.conversation-dropdown-item:hover {
  background:rgba(255,255,255,0.1);
}
.conversation-dropdown-item.danger {
  color:#ff5252;
}
.conversation-dropdown-item.danger:hover {
  background:rgba(255,82,82,0.1);
}
/* Sidebar Bottom */
.sidebar-bottom {
  padding:16px;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.sidebar-bottom .user-email {
  color:var(--muted);
  font-size:12px;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sidebar-bottom .logout-btn {
  padding:8px;
  border:none;
  background:transparent;
  color:var(--ink);
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sidebar-bottom .logout-btn:hover {
  background:rgba(255,255,255,0.1);
}
.sidebar-bottom .logout-btn img {
  width:24px;
  height:24px;
}
/* Main Chat Area */
.main-chat {
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}
.chat {
  position:relative;
  padding:10px 22px 32px;
  max-width:1200px;
  margin:0 auto;
  flex:1;
  width:100%;
}
.column {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}
.column:has(.avatar-section.minimized) {
  flex-direction:row;
  align-items:flex-start;
  justify-content:flex-start;
  gap:24px;
}
.avatar-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
.column:has(.avatar-section.minimized) .avatar-section {
  align-items:flex-start;
}
.column:has(.avatar-section.minimized) .pane {
  flex:1;
  width:auto;
}
/* TEMP: slow transitions to inspect animation */
.avatarFrame {
  width:300px;
  height:300px;
  border-radius:22px;
  overflow:hidden;
  background:#1c1c1c;
  border:1px solid #333;
  display:grid;
  place-items:center;
  position:relative;
  transform-origin: center center;
}
/* Idle wiggle removed */
/* Minimized avatar state */
.avatar-section.minimized {
  align-items: flex-start;
}
.avatar-section.minimized .avatarFrame {
  width:150px;
  height:150px;
  cursor:pointer;
  transform-origin: left bottom;
  transform:none;
  border-radius:50%;
}
/* Minimize button */
.minimize-btn {
  position:absolute;
  top:8px;
  left:8px;
  background:rgba(0,0,0,0.8);
  border:none;
  color:var(--ink);
  cursor:pointer;
  padding:6px;
  border-radius:6px;
  font-size:12px;
  opacity:1;
  transition:all 0.3s ease;
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.minimize-btn:hover {
  background:rgba(0,0,0,0.9);
  transform:scale(1.1);
}
/* Edit button */
.edit-btn {
  position:absolute;
  top:8px;
  right:8px;
  background:rgba(0,0,0,0.8);
  border:none;
  color:var(--ink);
  cursor:pointer;
  padding:6px;
  border-radius:6px;
  font-size:12px;
  opacity:1;
  transition:all 0.3s ease;
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.edit-btn:hover {
  background:rgba(0,0,0,0.9);
  transform:scale(1.1);
}
/* Maximize/expand button position (when avatar is minimized) */
.avatar-section.minimized .minimize-btn {
  left:auto;
  right:8px;
}
/* Hide edit button when avatar is minimized */
.avatar-section.minimized .edit-btn {
  display:none;
}
.pane {
  position:relative;
  width:100%;
  max-width:760px;
}
/* TEMP: slow transitions to inspect animation */
.scroller {
  max-height:240px;
  overflow:auto;
  padding:0 0 0 0;
  transition: max-height 0.3s ease;
  position:relative;
}
.scroller.expanded {
  max-height:550px;
}
.scroller::-webkit-scrollbar {
  width:12px;
}
.scroller::-webkit-scrollbar-track {
  background:transparent;
}
.scroller::-webkit-scrollbar-thumb {
  background:rgba(255, 255, 255, 0.1);
  border-radius:999px;
}
.row {
  display:flex;
  margin:12px 0;
}
.bubble {
  max-width:520px;
  background:var(--bubble);
  color:var(--muted);
  border-radius:18px;
  padding:14px 18px;
  font-size:14px;
  line-height:1.3;
  border:2px solid #2a2a2a;
}
.bubble.from-bot {
  border:none;
  background:none;
}
.bubble.from-me {
  border:0px solid #fff;
  background:rgba(255, 255, 255, .1);
  margin-right:10px;
}
.from-me {
  margin-left:auto;
  border-top-right-radius:4px;
}
.from-bot {
  margin-right:auto;
  border-top-left-radius:8px;
}
.composerWrap {
  position:relative;
  margin-top:20px;
  margin-bottom:10px;
  width:100%;
  max-width:735.36px;
  margin-left:auto;
  margin-right:auto;
  display:flex;
  align-items:center;
  gap:11.2px;
  z-index:3;
}
.composer {
  flex:1;
  border:1px solid var(--stroke);
  border-radius:24.5px;
  padding:11.2px 14.4px;
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255, 255, 255, .1);
  min-height:46.4px;
  max-height:200px;
  overflow-y:auto;
}
.composer textarea {
  flex:1;
  background:transparent;
  border:0;
  outline:none;
  color:var(--ink);
  font-size:17.6px;
  resize:none;
  font-family:inherit;
  line-height:1.4;
  min-height:22px;
  padding:0;
}
.composer textarea::placeholder {
  color:#a8a8a8;
  opacity:1;
}
.circleBtn.sendBtn {
  background:rgba(255, 255, 255, .1);
}
.circleBtn {
  width:46.4px;
  height:46.4px;
  border-radius:999px;
  border:1px solid var(--stroke);
  background:transparent;
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:transform 0.15s ease-in-out, background 0.2s ease;
}
.circleBtn:hover {
  background:rgba(255,255,255,0.2);
  transform:translateY(-2px) scale(1.02);
}
.circleBtn:active {
  transform:translateY(0) scale(1);
}
.circleBtn svg {
  width:33.6px;
  height:33.6px;
  fill:var(--ink);
}
.circleBtn img {
  width:24px;
  height:24px;
}
.avatar-set-bubble {
  border: none !important;
  background: transparent !important;
  color: #fff !important;
  text-align: center !important;
  font-size: 18px !important;
  font-weight: 600 !important;
  width: fit-content !important;
  margin: 0 auto !important;
  left: 0 !important;
  right: 0 !important;
  padding: 0 20px !important;
}
.loading-message {
  color: var(--muted);
  font-style: italic;
  text-align: center;
  margin: 16px 0;
}
.hide {
  display:none;
}
/* Mobile Responsive Styles */
@media (max-width: 768px) {
  .chat-container {
    height:100dvh;
  }
  .sidebar {
    height:100dvh;
    max-height:100dvh;
  }
  .scroller.expanded {
    max-height:600px;
  }
  /* Sidebar toggle positioning for mobile */
  .sidebar-toggle {
    left:200px;
  }
  /* Just inside the right edge of 300px sidebar */
  .sidebar.collapsed + .main-chat .sidebar-toggle {
    left:0;
  }
  .sidebar .avatar-section.in-sidebar {
    padding:8px 2px 0;
    align-items:center;
    gap:8px;
  }
  .sidebar .avatar-section.in-sidebar .avatarFrame {
    width:40px;
    height:40px;
    margin:4px auto 0;
    border-radius:50%;
  }
  .sidebar:not(.collapsed) .avatar-section.in-sidebar .avatarFrame {
    width:70px;
    height:70px;
    border-radius:50%;
  }
  .sidebar .avatar-section.in-sidebar .minimize-btn {
    left:auto;
    right:2px;
    top:2px;
  }
  .sidebar .avatar-section.in-sidebar + .sidebar-nav {
    margin-top:12px;
  }
  .ask-question-bar {
    display:none;
  }
}
</style>
</head>

<body>
  <div class="chat-container">
    <!-- Sidebar -->
    <div class="sidebar collapsed">
      <!-- Top Navigation -->
      <div class="sidebar-nav">
        <button class="sidebar-mini-toggle" id="sidebarMiniToggle" title="Expand sidebar" aria-label="Expand sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="3" y="6" width="18" height="2" fill="#ffffff"/>
            <rect x="3" y="11" width="18" height="2" fill="#ffffff"/>
            <rect x="3" y="16" width="18" height="2" fill="#ffffff"/>
          </svg>
        </button>
        <div class="nav-left">
          <img src="images/favicon.png" alt="Aeaea Logo" class="nav-logo">
        </div>
      </div>
      
      <!-- Sidebar Actions -->
      <div class="sidebar-actions">
        <a href="index.html" class="action-btn" title="AI library">
          <img src="images/library_icon.png" alt="AI Library">
          <span class="action-label">AI Library</span>
        </a>
        <a href="create.html" class="action-btn" title="Create new AI">
          <img src="images/creator_icon.png" alt="Create AI">
          <span class="action-label">Create New AI</span>
        </a>
        <button id="newChatBtn" class="action-btn">
          <img src="images/new_chat_icon.png" alt="New Chat">
          <span class="action-label">New Chat</span>
        </button>
        <button id="searchBtn" class="action-btn">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <span class="action-label">Search</span>
        </button>
      </div>
      
      <!-- Conversations List -->
      <div class="conversations">
        <div id="conversationsHeader" class="conversations-header">Chats</div>
        <div id="conversationsList"></div>
      </div>
      
      <!-- Bottom User Section -->
      <div class="sidebar-bottom">
        <span id="userEmail" class="user-email"></span>
        <button id="logoutBtn" class="logout-btn" title="Sign out">
          <img src="images/logout_icon.png" alt="Sign out" />
        </button>
      </div>
      
      <!-- Resize Handle -->
      <div class="resize-handle" id="resizeHandle" title="Drag to resize sidebar"></div>
    </div>
    
    <!-- Main Chat Area -->
    <div class="main-chat">
      <!-- Sidebar Toggle Button -->
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="3" y="6" width="18" height="2" fill="#ffffff"/>
          <rect x="3" y="11" width="18" height="2" fill="#ffffff"/>
          <rect x="3" y="16" width="18" height="2" fill="#ffffff"/>
        </svg>
      </button>
      
      <section class="screen chat">
        <div class="column">
          <!-- Avatar section -->
          <div class="avatar-section">
            <div id="avatar" class="avatarFrame"></div>
          </div>
          <!-- Conversation pane -->
          <div class="pane" style="position:relative;">
            <div id="log" class="scroller" role="log" aria-live="polite"></div>
            
            <!-- Personality prompt action -->
            <div id="askQuestionBar" class="ask-question-bar">
              <button id="askQuestionBtn" class="ask-bar-btn">
                <span>Ask me a question</span>
              </button>
              <button id="discussTopicBtn" class="ask-bar-btn">
                <span>Discuss topic</span>
              </button>
              <button id="learnSubjectBtn" class="ask-bar-btn">
                <span>Learn about a subject</span>
              </button>
            </div>
            <!-- Bottom composer -->
            <div class="composerWrap">
              <label class="composer">
                <textarea id="ask" placeholder="Ask anything..." rows="1"></textarea>
              </label>
              <button id="send" class="circleBtn sendBtn" title="Send">
                <img src="images/send_icon.png" alt="Send" style="width:24px; height:24px;">
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Freemium utilities -->
  <script type="module" src="freemium-utils.js"></script>
  
  <script type="module">
    // === Supabase Auth ===
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      // Generate smart conversation title using AI
      async function generateConversationTitle(firstMessage, avatarName) {
        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              persona: 'assistant',
              message: `Create a short, descriptive title (max 4-6 words) for a conversation that starts with: "${firstMessage}". The conversation is with ${avatarName}. Return only the title, no quotes or extra text.`,
              history: []
            })
          });
          
          const { text, error } = await res.json();
          if (error || !text) throw new Error('Failed to generate title');
          
          // Clean up the response and ensure it's not too long
          let title = text.trim().replace(/^["']|["']$/g, ''); // Remove quotes
          if (title.length > 40) {
            title = title.substring(0, 37) + '...';
          }
          
          return title;
        } catch (error) {
          console.error('Error generating title:', error);
          // Fallback to first few words of the message
          const words = firstMessage.split(' ').slice(0, 4).join(' ');
          return words + (firstMessage.split(' ').length > 4 ? '...' : '');
        }
      }

        conversationItem.addEventListener('touchstart', (e) => {
          // Don't handle touch if clicking on menu button
          if (e.target.closest('.conversation-actions')) return;
          
          touchStartTime = Date.now();
          longPressTriggered = false;
          
          longPressTimer = setTimeout(() => {
            // Long press detected - show menu
            longPressTriggered = true;
            navigator.vibrate && navigator.vibrate(50); // Haptic feedback if available
            toggleConversationMenu(e, conversationId);
          }, 500); // 500ms for long press
        });
        
        // Touch end - determine if it's a tap or long press
        conversationItem.addEventListener('touchend', (e) => {
          // Don't handle touch if clicking on menu button
          if (e.target.closest('.conversation-actions')) return;
          
          clearTimeout(longPressTimer);
          
          if (!longPressTriggered) {
            // Short tap - load conversation
            e.preventDefault();
            loadConversation(conversationId);
          }
        });
        
        // Touch cancel - clean up
        conversationItem.addEventListener('touchcancel', () => {
          clearTimeout(longPressTimer);
          longPressTriggered = false;
        });
        
        // Mouse click for desktop - keep original behavior
        conversationItem.addEventListener('click', (e) => {
          // Only handle if not a touch device or if no touch events fired
          if (!('ontouchstart' in window)) {

          const avoidSubjects = learnedSubjects.length ? ` Avoid these subjects already covered: ${learnedSubjects.join(', ')}.` : '';

      async function doSend(){
        const t = ask.value.trim(); 
        if(!t) return;
        
        ask.value=''; 
        ask.style.height = 'auto'; // Reset height after sending
        add('from-me',t);
        convo.push({ role:'user', content:t });

        // Show loading indicator
        const loadingId = 'loading-' + Date.now();
        addLoading(loadingId);

        try {
          // Get current user
          const { data: { user } } = await supabase.auth.getUser();
          if (!user || !currentAvatar) {
            throw new Error('Please sign in to chat');
          }

          // Get or create conversation
          if (!currentConversationId) {
            const { data: convoData, error: convoError } = await supabase
              .from('conversations')
              .insert({
                avatar_id: currentAvatar.id,
                title: `Conversation with ${currentAvatar.name}`
              })
              .select()
              .single();
            
            if (convoError) throw convoError;
            currentConversationId = convoData.id;
            
            // Refresh conversation history in sidebar
            loadConversationHistory();
          }

          // Save user message
          const { error: msgError } = await supabase
            .from('messages')
            .insert({
              conversation_id: currentConversationId,
              role: 'user',
              text: t
            });
          if (msgError) console.error('Error saving message:', msgError);

          // Extract lightweight personality traits
          const traits = currentAvatar?.traits || {};
          const sliders = traits.persona_traits || traits.sliders_raw || traits.sliders || {};
          const s = {
            seriousPlayful: sliders.seriousPlayful ?? sliders.serious_playful ?? null,
            succinctChatty: sliders.succinctChatty ?? sliders.succinct_chatty ?? null,
            rationalIntuitive: sliders.rationalIntuitive ?? sliders.rational_intuitive ?? null,
            practicalImaginative: sliders.practicalImaginative ?? sliders.practical_imaginative ?? null
          };
          const flavor = [];
          const bucket = (v, low, high)=>{ if(v==null) return; if(v<=35) flavor.push(low); else if(v>=65) flavor.push(high); };
          bucket(s.seriousPlayful,'serious','playful');
          bucket(s.succinctChatty,'succinct','chatty');
          bucket(s.rationalIntuitive,'rational','intuitive');
          bucket(s.practicalImaginative,'practical','imaginative');
          const personalityTraits = flavor.join(', ') || null;

          // Non-stream fetch + typewriter simulation (fallback while real streaming debug)
          const res = await fetch('/api/chat', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ 
              persona: currentAvatar.name,
              personalityTraits: personalityTraits,
              message: t, 
              history: convo.slice(-10),
              temperature: 0.85,
              presencePenalty: 0.45,
              frequencyPenalty: 0.35
            })
          });
          const { text:fullResp, error:respErr } = await res.json();
          const finalText = (respErr || !fullResp ? 'No response.' : fullResp).trim();
          // Reuse loading row instead of creating a second placeholder
          let loadingRow = document.getElementById(loadingId);
          let bubble;
          if(loadingRow){
            bubble = loadingRow.querySelector('.bubble');
            // Clean the loading bubble
            if(bubble){
              bubble.classList.remove('loading-message');
              bubble.textContent = '';
            }
            loadingRow.removeAttribute('id'); // prevent accidental future removal
          } else {
            // Fallback if loading row missing
            const row = document.createElement('div');
            row.className = 'row';
            bubble = document.createElement('div');
            bubble.className = 'bubble from-bot';
            row.appendChild(bubble);
            log.appendChild(row);
          }
          setTimeout(()=>{ log.scrollTop = log.scrollHeight; },0);
          // Animate text typing
          let i=0;
          const speed = 7; // Characters per frame (higher = faster)
          const animate = ()=>{
            if(!bubble) return;
            bubble.textContent = finalText.slice(0,i);
            log.scrollTop = log.scrollHeight;
            if(i < finalText.length){ i+=speed; requestAnimationFrame(animate); }
          };
          animate();
          convo.push({ role:'assistant', content: finalText });
          const { error: aiMsgError } = await supabase
            .from('messages')
            .insert({ conversation_id: currentConversationId, role: 'assistant', text: finalText });
          if (aiMsgError) console.error('Error saving AI message:', aiMsgError);
          
          // Generate smart title after first exchange
          await generateAndUpdateTitle();
          
        } catch (err) {
          console.error('Chat error:', err);
          removeLoading(loadingId);
          add('from-bot', err.message || 'Chat failed. Try again.');
        }
      }

      function add(who, text){
        const row = document.createElement('div'); 
        row.className = 'row';
        const b = document.createElement('div');
        b.className = 'bubble ' + who;
        b.textContent = text;
        row.appendChild(b); 
        log.appendChild(row);
        setTimeout(()=>{ log.scrollTop = log.scrollHeight; }, 0);
      }

      function typewriterBot(text){
        const row = document.createElement('div');
        row.className = 'row';
        const b = document.createElement('div');
        b.className = 'bubble from-bot';
        b.textContent = '';
        row.appendChild(b);
        log.appendChild(row);
        setTimeout(()=>{ log.scrollTop = log.scrollHeight; },0);
        let i=0; const finalText = (text||'').trim();
        const speed = 7; // Characters per frame (higher = faster)
        const animate=()=>{
          b.textContent = finalText.slice(0,i);
          log.scrollTop = log.scrollHeight;
          if(i < finalText.length){ i+=speed; requestAnimationFrame(animate); }
        };
        requestAnimationFrame(animate);
      }

      function addLoading(id) {
        const row = document.createElement('div'); 
        row.className = 'row';
        row.id = id;
        const b = document.createElement('div');
        b.className = 'bubble from-bot loading-message';
        b.innerHTML = 'Thinking...';
        row.appendChild(b); 
        log.appendChild(row);
        setTimeout(()=>{ log.scrollTop = log.scrollHeight; }, 0);
      }

      function removeLoading(id) {
        const element = document.getElementById(id);
        if (element) {
          element.remove();
        }
      }

      function fallbackAvatar(){
        return `<img src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png"

                   style="width:100%;height:100%;object-fit:cover;border-radius:24px;">`;

  // Idle wiggle removed

  // Avatar minimize functionality
  let isMinimized = false;
  const avatarSection = document.querySelector('.avatar-section');
  const scroller = document.getElementById('log');
  const sidebarNav = sidebar.querySelector('.sidebar-nav');
  const avatarPlaceholder = document.createElement('div');
  avatarPlaceholder.className = 'avatar-placeholder';
  avatarPlaceholder.style.display = 'none';
  if (avatarSection && avatarSection.parentNode) {
    avatarSection.parentNode.insertBefore(avatarPlaceholder, avatarSection.nextSibling);
  }
  let expandClickHandler = null; // stable reference for minimized->expand click

      function isMobileLayout() {
        return window.innerWidth <= 768;
      }

      function moveAvatarToSidebar() {
        if (!avatarSection || !sidebar) return;
        if (avatarSection.parentNode !== sidebar) {
          sidebar.insertBefore(avatarSection, sidebar.firstElementChild);
        } else if (sidebar.firstElementChild !== avatarSection) {
          sidebar.insertBefore(avatarSection, sidebar.firstElementChild);
        }
        avatarSection.classList.add('in-sidebar');
      }

      function moveAvatarToColumn() {
        if (!avatarSection || !avatarPlaceholder.parentNode) return;
        if (avatarSection.parentNode !== avatarPlaceholder.parentNode) {
          avatarPlaceholder.parentNode.insertBefore(avatarSection, avatarPlaceholder);
        }
        avatarSection.classList.remove('in-sidebar');
      }

      function updateAvatarPlacement() {
        if (isMinimized && isMobileLayout()) {
          moveAvatarToSidebar();
          scroller.style.maxHeight = '566px';
        } else {
          moveAvatarToColumn();
          if (!isMinimized) {
            scroller.style.maxHeight = '';
          }
        }
      }

      function addMinimizeButton() {
        // Remove existing minimize button if any
        const existingBtn = avatar.querySelector('.minimize-btn');
        if (existingBtn) existingBtn.remove();
        
        const minimizeBtn = document.createElement('button');
        minimizeBtn.className = 'minimize-btn';
        minimizeBtn.innerHTML = '−';
        minimizeBtn.title = 'Minimize avatar';
        minimizeBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          console.log('Minimize button clicked!'); // Debug log
          toggleMinimize();
        });
        avatar.appendChild(minimizeBtn);
      }

      function addEditButton() {
        // Remove existing edit button if any
        const existingBtn = avatar.querySelector('.edit-btn');
        if (existingBtn) existingBtn.remove();
        
        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.innerHTML = '✎';
        editBtn.title = 'Edit avatar';
        editBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          // Get current avatar ID from URL or localStorage
          const urlParams = new URLSearchParams(window.location.search);
          const avatarId = urlParams.get('avatar') || localStorage.getItem('lastSelectedAvatar');
          if (avatarId) {
            window.location.href = `edit.html?avatar=${avatarId}`;
          }
        });
        avatar.appendChild(editBtn);
      }

      function toggleMinimize() {
        console.log('toggleMinimize called, current state:', isMinimized); // Debug log
        isMinimized = !isMinimized;
        const minimizeBtn = avatar.querySelector('.minimize-btn');
        
        if (isMinimized) {
          console.log('Minimizing avatar...'); // Debug log
          avatarSection.classList.add('minimized');
          scroller.classList.add('expanded');
          if (isMobileLayout()) {
            scroller.style.maxHeight = '580px';
          }
          if (minimizeBtn) {
            minimizeBtn.innerHTML = '+';
            minimizeBtn.title = 'Expand avatar';
            minimizeBtn.style.display = 'none';
          }
          if (!expandClickHandler) {
            expandClickHandler = function(e){
              if (e.target.closest && e.target.closest('.minimize-btn')) return;
              toggleMinimize();
            };
          }
          avatar.style.cursor = 'pointer';
          avatar.addEventListener('click', expandClickHandler);
        } else {
          console.log('Expanding avatar...'); // Debug log
          avatarSection.classList.remove('minimized');
          scroller.classList.remove('expanded');
          scroller.style.maxHeight = '';
          if (minimizeBtn) {
            minimizeBtn.innerHTML = '−';
            minimizeBtn.title = 'Minimize avatar';
            minimizeBtn.style.display = '';
          }
          avatar.style.cursor = 'default';
          if (expandClickHandler) {
            avatar.removeEventListener('click', expandClickHandler);
            expandClickHandler = null;
          }
        }
        updateAvatarPlacement();
      }

      window.addEventListener('resize', updateAvatarPlacement);
      updateAvatarPlacement();

    } // End of authenticated check
