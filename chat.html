<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Build a Bot — Chat</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <style>
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    :root{
      --bg:#000;
      --ink:#fff;
      --muted:#d9d9d9;
      --bubble:#333;
      --stroke:#fff;
      --radius-lg:24px;
      --radius-md:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial}

    .screen{min-height:100vh; width:100%;}

    /* ===== Chat Layout ===== */
    .chat-container{display:flex; height:100vh;}
    
    /* Sidebar */
    .sidebar{width:300px; background:var(--bg); border-right:1px solid #333; display:flex; flex-direction:column; transition:width 0.3s ease; position:relative; min-width:200px; max-width:600px;}
    .sidebar.collapsed{width:0 !important; min-width:0 !important; overflow:hidden;}
    .sidebar.resizing{transition:none;} /* Disable transition while resizing! */
    .sidebar *::-webkit-scrollbar{width:12px}
    .sidebar *::-webkit-scrollbar-track{background:#000 !important}
    .sidebar *::-webkit-scrollbar-thumb{background:var(--stroke); border-radius:999px}
    .sidebar *::-webkit-scrollbar-corner{background:#000}
    
    /* Resize Handle */
    .resize-handle{position:absolute; top:0; right:-3px; width:6px; height:100%; cursor:col-resize; background:transparent; z-index:100;}
    .resize-handle:hover{background:rgba(255,255,255,0.1);}
    .resize-handle.resizing{background:rgba(255,255,255,0.2);}
    
    /* Sidebar Toggle Button */
  .sidebar-toggle{position:fixed; top:50px; left:260px; width:32px; height:32px; background:transparent; border:none; border-radius:8px; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:bold; z-index:1000; transition:left 0.3s ease;}
  .sidebar-toggle:hover{background:transparent;}
  .sidebar-toggle:active{background:transparent;}
  .sidebar-toggle:focus{background:transparent; outline:none;}
    .sidebar.collapsed + .main-chat .sidebar-toggle{left:0; border-radius:8px;}
    .sidebar.resizing + .main-chat .sidebar-toggle{transition:none;}
    
    /* Top Navigation in Sidebar */
    .sidebar-nav{display:flex; justify-content:space-between; align-items:center; padding:14px 24px 0px 24px;}
    .nav-left{display:flex; align-items:center; gap:16px;}
    .nav-logo{height:44px; width:auto;}
    .nav-icon{height:24px; width:auto; transition:transform 0.2s ease; cursor:pointer; opacity:1;}
    .nav-icon:hover{transform:scale(1.1);}
    .nav-right{display:flex; gap:12px; align-items:center;}
    .user-email{color:var(--ink); font-size:14px;}
    .logout-btn{padding:6px 12px; border:1px solid var(--stroke); background:transparent; color:var(--ink); border-radius:6px; cursor:pointer; font-size:12px;}
    .logout-btn:hover{background:rgba(255,255,255,0.1);}
    
    /* Sidebar Actions */
    .sidebar-actions{padding:16px;}
    .action-btn{display:flex; align-items:center; gap:12px; width:100%; padding:12px 16px; background:transparent; border:none; border-radius:8px; color:var(--ink); cursor:pointer; font-size:14px; margin-bottom:8px; text-decoration:none;}
    .action-btn:hover{background:rgba(255,255,255,0.1);}
    .action-btn svg{width:16px; height:16px; fill:var(--ink);}
    
    /* Conversations List */
    .conversations{flex:1; overflow-y:auto; padding:16px;}
    .conversations-header{font-size:14px; font-weight:300; font-style:italic; color:#dddddd; margin-bottom:12px; padding-left:32px;}
    .conversation-item{padding:12px; border-radius:8px; cursor:pointer; margin-bottom:4px; color:var(--ink); font-size:14px; position:relative; display:flex; justify-content:space-between; align-items:center;}
    .conversation-item:hover{background:rgba(255,255,255,0.1);}
    .conversation-item.active{background:rgba(255,255,255,0.15);}
    
    /* Conversation Menu */
    .conversation-title{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .conversation-actions{opacity:0; transition:opacity 0.2s ease; position:relative;}
    .conversation-item:hover .conversation-actions{opacity:1;}
    .conversation-menu-btn{background:none; border:none; color:var(--ink); cursor:pointer; padding:4px; border-radius:4px; font-size:14px; font-weight:600; width:20px; height:20px; display:flex; align-items:center; justify-content:center;}
    .conversation-menu-btn:hover{background:rgba(255,255,255,0.2);}
    .conversation-dropdown{position:absolute; top:100%; right:0; background:var(--bg); border:1px solid var(--stroke); border-radius:8px; padding:8px; min-width:120px; z-index:25; display:none; box-shadow:0 4px 6px rgba(0,0,0,0.3);}
    .conversation-dropdown.show{display:block;}
    .conversation-dropdown-item{display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink); padding:8px 12px; cursor:pointer; font-size:14px; border-radius:4px;}
    .conversation-dropdown-item:hover{background:rgba(255,255,255,0.1);}
    .conversation-dropdown-item.danger{color:#ff5252;}
    .conversation-dropdown-item.danger:hover{background:rgba(255,82,82,0.1);}
    
    /* Sidebar Bottom */
  .sidebar-bottom{padding:16px; display:flex; flex-direction:row; align-items:center; justify-content:space-between; gap:12px;}
  .sidebar-bottom .user-email{color:var(--muted); font-size:12px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sidebar-bottom .logout-btn{padding:8px; border:none; background:transparent; color:var(--ink); border-radius:6px; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center;}
    .sidebar-bottom .logout-btn:hover{background:rgba(255,255,255,0.1);}
    .sidebar-bottom .logout-btn img{width:24px; height:24px;}
    
    /* Main Chat Area */
    .main-chat{flex:1; display:flex; flex-direction:column; position:relative;}
    .chat{position:relative; padding:10px 22px 32px; max-width:1200px; margin:0 auto; flex:1; width:100%;}

  .column{display:flex; flex-direction:column; align-items:center; gap:18px;}
  .column:has(.avatar-section.minimized){align-items:flex-start;}
  /* Keep left alignment while expanding to avoid early jump */
  .column:has(.avatar-section.expanding){align-items:flex-start;}

    .avatar-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      transition: all 0.3s ease;
    }

  /* TEMP: slow transitions to inspect animation */
    .avatarFrame{width:333px; height:333px; border-radius:24px; overflow:hidden; background:#1c1c1c; display:grid; place-items:center; position:relative; transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease; transform-origin: center center; will-change: transform, width, height;}
  /* Idle wiggle removed */
    
  /* Minimized avatar state */
  .avatar-section.minimized{align-items: flex-start;}
  .avatar-section.minimized .avatarFrame{width:100px; height:100px; cursor:pointer; transform-origin: left bottom; transform: translate(-12px, 10px);}    
  /* Collapsing (animating to minimized) - keep column centered until complete */
  .avatar-section.collapsing .avatarFrame{width:100px; height:100px; cursor:pointer; transform-origin: left bottom; transform: translate(-12px, 10px);}    
    
    /* Expanding from minimized - scale from left center initially, then return to center */
  .avatar-section.expanding{align-items: center;}
  .avatar-section.expanding .avatarFrame{transform-origin: right top; transform: translate(8px, -6px);}
  .avatar-section.minimized .avatarFrame:hover{transform: translate(-12px, 10px) scale(1.06);}    
    
    /* Minimize button */
    .minimize-btn{position:absolute; top:8px; left:8px; background:rgba(0,0,0,0.8); border:none; color:var(--ink); cursor:pointer; padding:6px; border-radius:6px; font-size:12px; opacity:1; transition:all 0.3s ease; width:24px; height:24px; display:flex; align-items:center; justify-content:center; z-index:10;}
    .minimize-btn:hover{background:rgba(0,0,0,0.9); transform:scale(1.1);}
    
    /* Maximize/expand button position (when avatar is minimized) */
    .avatar-section.minimized .minimize-btn{left:auto; right:8px;}
    
    .pane{position:relative; width:100%; max-width:760px;}
  /* TEMP: slow transitions to inspect animation */
    .scroller{max-height:270px; overflow:auto; padding:0 0 0 0; transition: max-height 0.3s ease;}
    .scroller.expanded{max-height:500px;}
    .scroller::-webkit-scrollbar{width:12px}
    .scroller::-webkit-scrollbar-track{background:transparent}
    .scroller::-webkit-scrollbar-thumb{background:var(--stroke); border-radius:999px}

    .row{display:flex; margin:12px 0}
    .bubble{max-width:520px; background:var(--bubble); color:var(--muted); border-radius:18px; padding:14px 18px; font-size:14px; line-height:1.3; border:2px solid #2a2a2a}
    .bubble.from-bot{border:none; background:none;}
    .bubble.from-me{border:1px solid #fff; background:rgba(0,0,0,0.4); margin-right:10px;}
    .from-me{margin-left:auto; border-top-right-radius:8px}
    .from-bot{margin-right:auto; border-top-left-radius:8px}

    .composerWrap{position:relative; margin-top:20px; margin-bottom:10px; width:100%; max-width:735.36px; margin-left:auto; margin-right:auto; display:flex; align-items:center; gap:11.2px; z-index:3}
  .composer{flex:1; border:1px solid var(--stroke); border-radius:24.5px; padding:11.2px 14.4px; display:flex; align-items:center; gap:8px; background:#000; min-height:46.4px; max-height:200px; overflow-y:auto;}
    .composer textarea{flex:1; background:transparent; border:0; outline:none; color:var(--ink); font-size:17.6px; resize:none; font-family:inherit; line-height:1.4; min-height:22px; padding:0;}
    .composer textarea::placeholder { color:#a8a8a8; opacity:1; }
    .sendBtn .circleBtn{width:40px; height:40px}
    .circleBtn{width:46.4px; height:46.4px; border-radius:999px; border:1px solid var(--stroke); background:transparent; display:grid; place-items:center; cursor:pointer}
    .circleBtn svg{width:33.6px; height:33.6px; fill:var(--ink)}

    .avatar-set-bubble {
      border: none !important;
      background: transparent !important;
      color: #fff !important;
      text-align: center !important;
      font-size: 18px !important;
      font-weight: 600 !important;
      width: fit-content !important;
      margin: 0 auto !important;
      left: 0 !important;
      right: 0 !important;
      padding: 0 20px !important;
    }

    .loading-message {
      color: var(--muted);
      font-style: italic;
      text-align: center;
      margin: 16px 0;
    }

    .hide{display:none}

    /* Mobile Responsive Styles */
    @media (max-width: 768px) {
      .scroller.expanded{max-height:400px;}
      
      /* Sidebar toggle positioning for mobile */
      .sidebar-toggle{left:200px;} /* Just inside the right edge of 300px sidebar */
      .sidebar.collapsed + .main-chat .sidebar-toggle{left:0;}
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Top Navigation -->
      <div class="sidebar-nav">
        <div class="nav-left">
          <img src="images/favicon.png" alt="Build a Bot Logo" class="nav-logo">
        </div>
      </div>
      
      <!-- Sidebar Actions -->
      <div class="sidebar-actions">
        <a href="index.html" class="action-btn" title="Bot library">
          <img src="images/library_icon.png" alt="Bot Library" style="width:16px; height:16px;">
          Bot Library
        </a>
        <a href="create.html" class="action-btn" title="Create new bot">
          <img src="images/creator_icon.png" alt="Create Bot" style="width:16px; height:16px;">
          Create New Bot
        </a>
        <button id="newChatBtn" class="action-btn">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          New Chat
        </button>
        <button id="searchBtn" class="action-btn">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          Search
        </button>
      </div>
      
      <!-- Conversations List -->
      <div class="conversations">
        <div id="conversationsHeader" class="conversations-header">Chats</div>
        <div id="conversationsList"></div>
      </div>
      
      <!-- Bottom User Section -->
      <div class="sidebar-bottom">
        <span id="userEmail" class="user-email"></span>
        <button id="logoutBtn" class="logout-btn" title="Sign out">
          <img src="images/logout_icon.png" alt="Sign out" />
        </button>
      </div>
      
      <!-- Resize Handle -->
      <div class="resize-handle" id="resizeHandle" title="Drag to resize sidebar"></div>
    </div>
    
    <!-- Main Chat Area -->
    <div class="main-chat">
      <!-- Sidebar Toggle Button -->
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="3" y="6" width="18" height="2" fill="#ffffff"/>
          <rect x="3" y="11" width="18" height="2" fill="#ffffff"/>
          <rect x="3" y="16" width="18" height="2" fill="#ffffff"/>
        </svg>
      </button>
      
      <section class="screen chat">
        <div class="column">
          <!-- Avatar section -->
          <div class="avatar-section">
            <div id="avatar" class="avatarFrame"></div>
          </div>
          <!-- Conversation pane -->
          <div class="pane" style="position:relative;">
            <div id="log" class="scroller" role="log" aria-live="polite"></div>
            
            <!-- Personality prompt action -->
            <div id="askQuestionBar" style="display:flex; justify-content:flex-end; gap:8px; margin:8px 0 4px; flex-wrap:wrap;">
              <button id="askQuestionBtn" style="background:#222; color:#fff; border:1px solid var(--stroke); border-radius:20px; padding:6px 14px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;">
                <span>Ask question</span>
              </button>
              <button id="discussTopicBtn" style="background:#222; color:#fff; border:1px solid var(--stroke); border-radius:20px; padding:6px 14px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;">
                <span>Discuss topic</span>
              </button>
              <button id="learnSubjectBtn" style="background:#222; color:#fff; border:1px solid var(--stroke); border-radius:20px; padding:6px 14px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;">
                <span>Learn about a subject</span>
              </button>
            </div>
            <!-- Bottom composer -->
            <div class="composerWrap">
              <label class="composer">
                <textarea id="ask" placeholder="Ask anything..." rows="1"></textarea>
              </label>
              <button id="send" class="circleBtn sendBtn" title="Send">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Freemium utilities -->
  <script type="module" src="freemium-utils.js"></script>
  
  <script type="module">
    // === Supabase Auth ===
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c";
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    // Check auth and redirect if not authenticated
    async function checkAuthAndRedirect() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'auth.html';
        return false;
      }
      console.log("User authenticated:", session.user.email);
      
      // Load and display username from profiles table
      await loadUserProfile(session.user);
      return true;
    }

    // Load user profile and display username
    async function loadUserProfile(user) {
      try {
        const { data: profile, error } = await supabase
          .from('profiles')
          .select('display_name')
          .eq('id', user.id)
          .single();

        if (error) {
          console.error('Error loading profile:', error);
          document.getElementById('userEmail').textContent = user.email; // Fallback to email
        } else {
          document.getElementById('userEmail').textContent = profile?.display_name || user.email;
        }
      } catch (error) {
        console.error('Error in loadUserProfile:', error);
        document.getElementById('userEmail').textContent = user.email; // Fallback to email
      }
    }

    // Initialize auth check
    const isAuthenticated = await checkAuthAndRedirect();
    if (!isAuthenticated) {
      // Don't initialize the rest of the app if not authenticated
    } else {
      // Continue with app initialization only if authenticated

      const avatar = document.getElementById('avatar');
      const log = document.getElementById('log');
      const conversationsHeader = document.getElementById('conversationsHeader');
      const ask = document.getElementById('ask');
      const send = document.getElementById('send');
      const logoutBtn = document.getElementById('logoutBtn');
      const newChatBtn = document.getElementById('newChatBtn');
      const searchBtn = document.getElementById('searchBtn');
      const conversationsList = document.getElementById('conversationsList');
      const sidebar = document.querySelector('.sidebar');
      const sidebarToggle = document.getElementById('sidebarToggle');

      // Global state
      let currentAvatar = null;
      let currentConversationId = null;
      const convo = [];
      let allConversations = [];

      // Sign out handler
      logoutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.href = 'auth.html';
      });

      // New chat handler
      newChatBtn.addEventListener('click', async () => {
        await saveCurrentConversation();
        startNewChat();
      });

      // Search handler - simple search through conversations
      searchBtn.addEventListener('click', () => {
        const searchTerm = prompt('Search conversations:');
        if (!searchTerm || !searchTerm.trim()) return;
        
        performSearch(searchTerm.trim().toLowerCase());
      });

      // Helper function to set toggle position based on screen size
      function setTogglePosition(width) {
        const isMobile = window.innerWidth <= 768;
        if (isMobile) {
          sidebarToggle.style.left = '200px'; // Fixed position on mobile
        } else {
          sidebarToggle.style.left = `${width - 40}px`; // Dynamic position on desktop
        }
      }

      // Sidebar toggle handler
      sidebarToggle.addEventListener('click', () => {
        if (sidebar.classList.contains('collapsed')) {
          // Expand sidebar
          sidebar.classList.remove('collapsed');
          // Restore the saved width or default
          const savedWidth = localStorage.getItem('sidebarWidth') || '300';
          sidebar.style.width = `${savedWidth}px`;
          setTogglePosition(parseInt(savedWidth));
          // Keep hamburger icon; update title only
          sidebarToggle.title = 'Collapse sidebar';
        } else {
          // Collapse sidebar
          sidebar.classList.add('collapsed');
          // Override inline width with 0 for collapse
          sidebar.style.width = '0px';
          sidebarToggle.style.left = '0px';
          // Keep hamburger icon; update title only
          sidebarToggle.title = 'Expand sidebar';
        }
      });

      // Sidebar resize functionality
      const resizeHandle = document.getElementById('resizeHandle');
      let isResizing = false;
      let startX = 0;
      let startWidth = 0;

      resizeHandle.addEventListener('mousedown', (e) => {
        isResizing = true;
        startX = e.clientX;
        startWidth = parseInt(window.getComputedStyle(sidebar).width, 10);
        
        sidebar.classList.add('resizing');
        resizeHandle.classList.add('resizing');
        
        // Add global listeners for mouse events
        document.addEventListener('mousemove', handleResize);
        document.addEventListener('mouseup', stopResize);
        
        // Prevent text selection during drag
        e.preventDefault();
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
      });

      function handleResize(e) {
        if (!isResizing) return;
        
        const width = startWidth + (e.clientX - startX);
        const minWidth = 200;
        const maxWidth = 600;
        
        if (width >= minWidth && width <= maxWidth) {
          sidebar.style.width = `${width}px`;
          
          // Update the sidebar toggle position
          setTogglePosition(width);
          
          // Store the width preference
          localStorage.setItem('sidebarWidth', width);
        }
      }

      function stopResize() {
        if (!isResizing) return;
        
        isResizing = false;
        sidebar.classList.remove('resizing');
        resizeHandle.classList.remove('resizing');
        
        // Remove global listeners
        document.removeEventListener('mousemove', handleResize);
        document.removeEventListener('mouseup', stopResize);
        
        // Restore normal cursor and text selection
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
      }

      // Load saved sidebar width on page load
      const savedWidth = localStorage.getItem('sidebarWidth');
      if (savedWidth) {
        const width = parseInt(savedWidth, 10);
        if (width >= 200 && width <= 600) {
          sidebar.style.width = `${width}px`;
          setTogglePosition(width);
        }
      }

      // Auto-collapse sidebar on mobile devices
      function initializeMobileSidebar() {
        const isMobile = window.innerWidth <= 768;
        if (isMobile && !sidebar.classList.contains('collapsed')) {
          // Collapse sidebar on mobile
          sidebar.classList.add('collapsed');
          sidebar.style.width = '0px';
          sidebarToggle.style.left = '0px';
          // Keep hamburger icon; update title only
          sidebarToggle.title = 'Expand sidebar';
        }
      }

      // Initialize mobile sidebar state
      initializeMobileSidebar();

      // Re-check on window resize
      window.addEventListener('resize', initializeMobileSidebar);

      // Simple search function
      function performSearch(searchTerm) {
        const filteredConversations = allConversations.filter(conv => {
          // Search in conversation titles
          const titleMatch = conv.title.toLowerCase().includes(searchTerm);
          return titleMatch;
        });
        
        if (filteredConversations.length === 0) {
          alert(`No conversations found containing "${searchTerm}"`);
          return;
        }
        
        // Display filtered results
        displayConversations(filteredConversations);
        
        // Add a way to clear search and show all conversations
        if (!document.getElementById('clearSearchBtn')) {
          const clearBtn = document.createElement('button');
          clearBtn.id = 'clearSearchBtn';
          clearBtn.className = 'action-btn';
          clearBtn.innerHTML = `
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            Clear Search
          `;
          clearBtn.addEventListener('click', () => {
            displayConversations(allConversations);
            clearBtn.remove();
            conversationsHeader.textContent = currentAvatar ? `Chats with ${currentAvatar.nickname || currentAvatar.name}` : 'Chats';
          });

      // Generate smart conversation title using AI
      async function generateConversationTitle(firstMessage, avatarName) {
        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              persona: 'assistant',
              message: `Create a short, descriptive title (max 4-6 words) for a conversation that starts with: "${firstMessage}". The conversation is with ${avatarName}. Return only the title, no quotes or extra text.`,
              history: []
            })
          });
          
          const { text, error } = await res.json();
          if (error || !text) throw new Error('Failed to generate title');
          
          // Clean up the response and ensure it's not too long
          let title = text.trim().replace(/^["']|["']$/g, ''); // Remove quotes
          if (title.length > 40) {
            title = title.substring(0, 37) + '...';
          }
          
          return title;
        } catch (error) {
          console.error('Error generating title:', error);
          // Fallback to first few words of the message
          const words = firstMessage.split(' ').slice(0, 4).join(' ');
          return words + (firstMessage.split(' ').length > 4 ? '...' : '');
        }
      }

      // Conversation management functions
      // Setup conversation interaction for mobile and desktop
      function setupConversationInteraction(conversationItem, conversationId) {
        let touchStartTime = 0;
        let longPressTimer = null;
        let longPressTriggered = false;
        
        // Touch start - start timing for long press
        conversationItem.addEventListener('touchstart', (e) => {
          // Don't handle touch if clicking on menu button
          if (e.target.closest('.conversation-actions')) return;
          
          touchStartTime = Date.now();
          longPressTriggered = false;
          
          longPressTimer = setTimeout(() => {
            // Long press detected - show menu
            longPressTriggered = true;
            navigator.vibrate && navigator.vibrate(50); // Haptic feedback if available
            toggleConversationMenu(e, conversationId);
          }, 500); // 500ms for long press
        });
        
        // Touch end - determine if it's a tap or long press
        conversationItem.addEventListener('touchend', (e) => {
          // Don't handle touch if clicking on menu button
          if (e.target.closest('.conversation-actions')) return;
          
          clearTimeout(longPressTimer);
          
          if (!longPressTriggered) {
            // Short tap - load conversation
            e.preventDefault();
            loadConversation(conversationId);
          }
        });
        
        // Touch cancel - clean up
        conversationItem.addEventListener('touchcancel', () => {
          clearTimeout(longPressTimer);
          longPressTriggered = false;
        });
        
        // Mouse click for desktop - keep original behavior
        conversationItem.addEventListener('click', (e) => {
          // Only handle if not a touch device or if no touch events fired
          if (!('ontouchstart' in window)) {
            // Don't trigger if clicking on the menu button or dropdown
            if (!e.target.closest('.conversation-actions')) {
              loadConversation(conversationId);
            }
          }
        });
      }

            .from('messages')
            .delete()

            .from('conversations')

          }
          const avoidSubjects = learnedSubjects.length ? ` Avoid these subjects already covered: ${learnedSubjects.join(', ')}.` : '';
          const instruction = `Persona traits: ${flavor.join(', ') || 'balanced'}. Choose ONE specific subject (not overly broad like 'science' or 'history', not obscure jargon).${avoidSubjects} Provide plain text: 'Subject: <name>. Fact. Fact. Fact.' using 3-5 crisp factual sentences. Must not repeat or closely paraphrase: ${sanitizedLearnRecent.join(' | ') || '(none)'}. Each fact should be accurate, concrete, interesting; playful/imaginative may have one analogy; serious/practical include one applied/impact fact. No questions, filler, dashes, bullets, numbering, or self reference.`;
          const res = await fetch('/api/chat', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ persona: currentAvatar.name, message: instruction, history: [], temperature: 0.92, presencePenalty: 0.55, frequencyPenalty: 0.4 })
          });
          const { text } = await res.json();
          let facts = cleanTrailing((text || '').trim());
          // Defensive cleanup if model still outputs bullets or newlines
          facts = facts
            .replace(/^\s*[-*+]\s*/gm,'') // remove bullet markers
            .replace(/\n+/g,' ')          // collapse newlines
            .replace(/\s{2,}/g,' ')       // collapse extra spaces
            .trim();
          // Extract subject name
          const subjectMatch = facts.match(/^[Ss]ubject:\s*([^\.]+)\./);
          let subjectName = subjectMatch ? subjectMatch[1].trim() : null;
          if(subjectName && learnedSubjects.map(s=>s.toLowerCase()).includes(subjectName.toLowerCase())) {
            // Retry once forcing a new subject
            try {
              const retryInstruction = instruction + ` The previously generated subject '${subjectName}' was already used. Pick a DIFFERENT subject not in: ${learnedSubjects.join(', ')}.`;
              const retryRes = await fetch('/api/chat', {
                method:'POST',
                headers:{ 'Content-Type':'application/json' },
                body: JSON.stringify({ persona: currentAvatar.name, message: retryInstruction, history: [], temperature: 0.95, presencePenalty: 0.65, frequencyPenalty: 0.55 })
              });
              const retryJson = await retryRes.json();
              let retryFacts = cleanTrailing((retryJson.text || '').trim());
              retryFacts = retryFacts.replace(/^\s*[-*+]\s*/gm,'').replace(/\n+/g,' ').replace(/\s{2,}/g,' ').trim();
              const retrySubjectMatch = retryFacts.match(/^[Ss]ubject:\s*([^\.]+)\./);
              const retrySubjectName = retrySubjectMatch ? retrySubjectMatch[1].trim() : null;
              if(retrySubjectName && !learnedSubjects.map(s=>s.toLowerCase()).includes(retrySubjectName.toLowerCase())) {
                facts = retryFacts;
                subjectName = retrySubjectName;
              }
            } catch(_e) { /* ignore retry errors */ }
          }
          if(facts){
            typewriterBot(facts);
            convo.push({ role:'assistant', content: facts });
            const updatedLearn = [...learnRecent, facts].slice(-10);
            localStorage.setItem(learnKey, JSON.stringify(updatedLearn));
            if(subjectName){
              const updatedSubjects = [...learnedSubjects.filter(s=>s.toLowerCase()!==subjectName.toLowerCase()), subjectName].slice(-30);
              localStorage.setItem(learnSubjectsKey, JSON.stringify(updatedSubjects));
            }
            if(!currentConversationId){
              const { data: convoData } = await supabase
                .from('conversations')
                .insert({ avatar_id: currentAvatar.id, title: `Conversation with ${currentAvatar.name}` })
                .select()
                .single();
              currentConversationId = convoData?.id || currentConversationId;
              loadConversationHistory();
            }
            if(currentConversationId){
              await supabase.from('messages').insert({ conversation_id: currentConversationId, role:'assistant', text: facts });
            }
          }
        } catch(e){
          console.error('LearnSubject failed', e);
        }
      });

      async function doSend(){
        const t = ask.value.trim(); 
        if(!t) return;
        
        ask.value=''; 
        ask.style.height = 'auto'; // Reset height after sending
        add('from-me',t);
        convo.push({ role:'user', content:t });

        // Show loading indicator
        const loadingId = 'loading-' + Date.now();
        addLoading(loadingId);

        try {
          // Get current user
          const { data: { user } } = await supabase.auth.getUser();
          if (!user || !currentAvatar) {
            throw new Error('Please sign in to chat');
          }

          // Get or create conversation
          if (!currentConversationId) {
            const { data: convoData, error: convoError } = await supabase
              .from('conversations')
              .insert({
                avatar_id: currentAvatar.id,
                title: `Conversation with ${currentAvatar.name}`
              })
              .select()
              .single();
            
            if (convoError) throw convoError;
            currentConversationId = convoData.id;
            
            // Refresh conversation history in sidebar
            loadConversationHistory();
          }

          // Save user message
          const { error: msgError } = await supabase
            .from('messages')
            .insert({
              conversation_id: currentConversationId,
              role: 'user',
              text: t
            });
          if (msgError) console.error('Error saving message:', msgError);

          // Non-stream fetch + typewriter simulation (fallback while real streaming debug)
          const res = await fetch('/api/chat', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ 
              persona: currentAvatar.name, 
              message: t, 
              history: convo.slice(-10),
              temperature: 0.85,
              presencePenalty: 0.45,
              frequencyPenalty: 0.35
            })
          });
          const { text:fullResp, error:respErr } = await res.json();
          const finalText = (respErr || !fullResp ? 'No response.' : fullResp).trim();
          // Reuse loading row instead of creating a second placeholder
          let loadingRow = document.getElementById(loadingId);
          let bubble;
          if(loadingRow){
            bubble = loadingRow.querySelector('.bubble');
            // Clean the loading bubble
            if(bubble){
              bubble.classList.remove('loading-message');
              bubble.textContent = '';
            }
            loadingRow.removeAttribute('id'); // prevent accidental future removal
          } else {
            // Fallback if loading row missing
            const row = document.createElement('div');
            row.className = 'row';
            bubble = document.createElement('div');
            bubble.className = 'bubble from-bot';
            row.appendChild(bubble);
            log.appendChild(row);
          }
          setTimeout(()=>{ log.scrollTop = log.scrollHeight; },0);
          // Animate text typing
          let i=0;
          const speed = 18;
          const animate = ()=>{
            if(!bubble) return;
            bubble.textContent = finalText.slice(0,i);
            log.scrollTop = log.scrollHeight;
            if(i < finalText.length){ i++; requestAnimationFrame(animate); }
          };
          animate();
          convo.push({ role:'assistant', content: finalText });
          const { error: aiMsgError } = await supabase
            .from('messages')
            .insert({ conversation_id: currentConversationId, role: 'assistant', text: finalText });
          if (aiMsgError) console.error('Error saving AI message:', aiMsgError);
          
          // Generate smart title after first exchange
          await generateAndUpdateTitle();
          
        } catch (err) {
          console.error('Chat error:', err);
          removeLoading(loadingId);
          add('from-bot', err.message || 'Chat failed. Try again.');
        }
      }

      function add(who, text){
        const row = document.createElement('div'); 
        row.className = 'row';
        const b = document.createElement('div');
        b.className = 'bubble ' + who;
        b.textContent = text;
        row.appendChild(b); 
        log.appendChild(row);
        setTimeout(()=>{ log.scrollTop = log.scrollHeight; }, 0);
      }

      function typewriterBot(text){
        const row = document.createElement('div');
        row.className = 'row';
        const b = document.createElement('div');
        b.className = 'bubble from-bot';
        b.textContent = '';
        row.appendChild(b);
        log.appendChild(row);
        setTimeout(()=>{ log.scrollTop = log.scrollHeight; },0);
        let i=0; const finalText = (text||'').trim();
        const speed = 18;
        const animate=()=>{
          b.textContent = finalText.slice(0,i);
          log.scrollTop = log.scrollHeight;
          if(i < finalText.length){ i++; requestAnimationFrame(animate); }
        };
        requestAnimationFrame(animate);
      }

      function addLoading(id) {
        const row = document.createElement('div'); 
        row.className = 'row';
        row.id = id;
        const b = document.createElement('div');
        b.className = 'bubble from-bot loading-message';
        b.innerHTML = 'Thinking...';
        row.appendChild(b); 
        log.appendChild(row);
        setTimeout(()=>{ log.scrollTop = log.scrollHeight; }, 0);
      }

      function removeLoading(id) {
        const element = document.getElementById(id);
        if (element) {
          element.remove();
        }
      }

      function fallbackAvatar(){
        return `<img src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png"
                   alt="Avatar Placeholder"
                   style="width:100%;height:100%;object-fit:cover;border-radius:24px;">`;
      }

      // Utility: get transform transition duration (ms) for avatar frame
      function getTransformTransitionMs(){
        try{
          const el = document.getElementById('avatar');
          const cs = getComputedStyle(el);
          const props = cs.transitionProperty.split(',').map(s=>s.trim());
          const durs  = cs.transitionDuration.split(',').map(s=>s.trim());
          const delays = cs.transitionDelay.split(',').map(s=>s.trim());
          const parseTime = (t)=> t.endsWith('ms') ? parseFloat(t) : parseFloat(t)*1000;
          const idx = props.findIndex(p => p === 'transform');
          if (idx !== -1) {
            const dur = parseTime(durs[Math.min(idx, durs.length-1)] || '0s');
            const del = parseTime(delays[Math.min(idx, delays.length-1)] || '0s');
            return Math.max(0, dur + del);
          }
          // Fallback to the first duration if transform not explicitly listed
          const dur = parseTime(durs[0] || '0.3s');
          const del = parseTime(delays[0] || '0s');
          return Math.max(0, dur + del);
        }catch(e){
          return 300; // safe default
        }
      }

  // Idle wiggle removed

  // Avatar minimize functionality
  let isMinimized = false;
  const avatarSection = document.querySelector('.avatar-section');
  const scroller = document.getElementById('log');
  let expandClickHandler = null; // stable reference for minimized->expand click

      function addMinimizeButton() {
        // Remove existing minimize button if any
        const existingBtn = avatar.querySelector('.minimize-btn');
        if (existingBtn) existingBtn.remove();
        
        const minimizeBtn = document.createElement('button');
        minimizeBtn.className = 'minimize-btn';
        minimizeBtn.innerHTML = '−';
        minimizeBtn.title = 'Minimize avatar';
        minimizeBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          console.log('Minimize button clicked!'); // Debug log
          toggleMinimize();
        });
        avatar.appendChild(minimizeBtn);
      }

      function toggleMinimize() {
        console.log('toggleMinimize called, current state:', isMinimized); // Debug log
        isMinimized = !isMinimized;
        const minimizeBtn = avatar.querySelector('.minimize-btn');
        
        if (isMinimized) {
          // Minimize avatar: animate first without left-align, then commit
          console.log('Minimizing avatar...'); // Debug log
          // Start collapsing animation (keeps column centered)
          avatarSection.classList.add('collapsing');
          
          // After animation completes (transform), set minimized state and align left
          const delayMs = getTransformTransitionMs();
          setTimeout(() => {
            avatarSection.classList.remove('collapsing');
            avatarSection.classList.add('minimized');
            scroller.classList.add('expanded');
            if (minimizeBtn) {
              minimizeBtn.innerHTML = '+';
              minimizeBtn.title = 'Expand avatar';
            }
            // Make minimized avatar clickable to expand (use stable handler)
            if (!expandClickHandler) {
              expandClickHandler = function(e){
                if (e.target.closest && e.target.closest('.minimize-btn')) return;
                toggleMinimize();
              };
            }
            avatar.style.cursor = 'pointer';
            avatar.addEventListener('click', expandClickHandler);
          }, delayMs);
        } else {
          // Expand avatar and reduce chat space
          console.log('Expanding avatar...'); // Debug log
          
          // Add expanding class for smooth animation from left to center
          avatarSection.classList.add('expanding');
          avatarSection.classList.remove('minimized');
          scroller.classList.remove('expanded');
          
          // Remove expanding class after animation completes
          setTimeout(() => {
            avatarSection.classList.remove('expanding');
          }, getTransformTransitionMs());
          
          if (minimizeBtn) {
            minimizeBtn.innerHTML = '−';
            minimizeBtn.title = 'Minimize avatar';
          }
          
          // Remove minimized click handler from avatar
          avatar.style.cursor = 'default';
          if (expandClickHandler) {
            avatar.removeEventListener('click', expandClickHandler);
            expandClickHandler = null;
          }
        }
      }

    } // End of authenticated check
  </script>
