<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeaea — Chat</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>
@keyframes progress {
  0% {
    width: 0%;
  }
  100% {
    width: 100%;
  }
}
:root {
  --bg:#000;
  --ink:#fff;
  --muted:#d9d9d9;
  --bubble:#333;
  --stroke:#fff;
  --radius-lg:24px;
  --radius-md:14px;
}
* {
  box-sizing:border-box;
}
html,body {
  height:100dvh;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
}
.screen {
  min-height:100dvh;
  width:100%;
}
/* ===== Chat Layout ===== */
.chat-container {
  display:flex;
  height:100dvh;
}
/* Sidebar */
.sidebar {
  width:300px;
  background:var(--bg);
  border-right:1px solid #333;
  display:flex;
  flex-direction:column;
  transition:width 0.3s ease;
  position:relative;
  min-width:200px;
  max-width:600px;
  contain: layout style;
  will-change: width;
}
.sidebar.collapsed {
  width:44px !important;
  min-width:44px !important;
  overflow:hidden;
}
.sidebar.resizing {
  transition:none;
}
/* Disable transition while resizing! */
.sidebar *::-webkit-scrollbar {
  width:8px;
}
.sidebar *::-webkit-scrollbar-track {
  background:#000 !important;
}
.sidebar *::-webkit-scrollbar-thumb {
  background:rgba(255, 255, 255, .1);
  border-radius:999px;
}
.sidebar *::-webkit-scrollbar-corner {
  background:#000;
}
/* Resize Handle */
.resize-handle {
  position:absolute;
  top:0;
  right:-3px;
  width:6px;
  height:100%;
  cursor:col-resize;
  background:transparent;
  z-index:100;
}
.resize-handle:hover {
  background:rgba(255,255,255,0.1);
}
.resize-handle.resizing {
  background:rgba(255,255,255,0.2);
}
/* Sidebar Toggle Button */
.sidebar-toggle {
  position:fixed;
  top:12px;
  left:260px;
  width:36px;
  height:36px;
  background:transparent;
  border:none;
  border-radius:8px;
  color:var(--ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  z-index:1000;
  transition:left 0.3s ease;
}
.sidebar-toggle:hover {
  background:transparent;
}
.sidebar-toggle:active {
  background:transparent;
}
.sidebar-toggle:focus {
  background:transparent;
  outline:none;
}
.sidebar.collapsed + .main-chat .sidebar-toggle {
  display:none;
}
.sidebar.resizing + .main-chat .sidebar-toggle {
  transition:none;
}
/* Top Navigation in Sidebar */
.sidebar-nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 24px 0px 24px;
}
.nav-left {
  display:flex;
  align-items:center;
  gap:16px;
}
.sidebar-mini-toggle {
  display:none;
  background:transparent;
  border:none;
  color:var(--ink);
  width:32px;
  height:32px;
  border-radius:8px;
  cursor:pointer;
  align-items:center;
  justify-content:center;
}
.sidebar-mini-toggle svg {
  width:18px;
  height:18px;
  fill:var(--ink);
}
.sidebar-mini-toggle:hover {
  background:rgba(255,255,255,0.1);
}
.nav-logo {
  height:44px;
  width:auto;
}
/* Hide favicon when avatar is minimized and sidebar is expanded */
.sidebar:not(.collapsed):has(.avatar-section.minimized) .nav-logo {
  display:none;
}
.nav-icon {
  height:24px;
  width:auto;
  transition:transform 0.2s ease;
  cursor:pointer;
  opacity:1;
}
.nav-icon:hover {
  transform:scale(1.1);
}
.nav-right {
  display:flex;
  gap:12px;
  align-items:center;
}
.user-email {
  color:var(--ink);
  font-size:14px;
}
.logout-btn {
  padding:6px 12px;
  border:1px solid var(--stroke);
  background:transparent;
  color:var(--ink);
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}
.logout-btn:hover {
  background:rgba(255,255,255,0.1);
}
.sidebar.collapsed .sidebar-nav {
  justify-content:center;
  padding:8px 0;
  flex-direction:column;
  gap:8px;
}
.sidebar.collapsed .nav-left,
.sidebar.collapsed .nav-right {
  display:none;
}
.sidebar.collapsed .sidebar-mini-toggle {
  display:flex;
}
.sidebar.collapsed .sidebar-actions {
  padding:12px 8px;
  align-items:center;
  margin-top: -10px;
}
.sidebar.collapsed .action-btn {
  justify-content:center;
  gap:0;
  padding:8px;
}
.sidebar.collapsed .action-btn .action-label {
  display:none;
}
.sidebar.collapsed .action-btn img,
.sidebar.collapsed .action-btn svg {
  width: 20px;
  height: 20px;
}
.sidebar.collapsed .sidebar-bottom {
  padding:12px 8px;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.sidebar.collapsed .sidebar-bottom .user-email {
  display:none;
}
.sidebar.collapsed .logout-btn {
  padding:8px 0;
}
.ask-question-bar {
  display:flex;
  justify-content:center;
  gap:8px;
  margin:8px 0 4px;
  flex-wrap:nowrap;
}
.ask-bar-btn {
  background:rgba(255, 255, 255, 0.1);
  color:#e1e1e1;
  border:0px solid rgba(255, 255, 255, 0.1);
  border-radius:20px;
  padding:6px 14px;
  font-size:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:transform 0.15s ease-in-out, background 0.2s ease;
}
.ask-bar-btn:hover {
  background:#2a2a2a;
  transform:translateY(-2px);
}
.ask-bar-btn:active {
  transform:translateY(0);
}
/* Sidebar Actions */
.sidebar-actions {
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:0px;
}
/* Move sidebar-actions up when avatar is minimized and sidebar is expanded */
.sidebar:not(.collapsed):has(.avatar-section.minimized) .sidebar-actions {
  margin-top:-20px;
}
.action-btn {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:12px 16px;
  background:transparent;
  border:none;
  border-radius:8px;
  color:var(--ink);
  cursor:pointer;
  font-size:14px;
  margin-bottom:8px;
  text-decoration:none;
}
.action-btn:hover {
  background:rgba(255,255,255,0.1);
}
.action-btn img, .action-btn svg {
  width:20px;
  height:20px;
  fill:var(--ink);
}
.action-btn .action-label {
  display:inline-flex;
  align-items:center;
}
/* Conversations List */
.conversations {
  flex:1;
  overflow-y:auto;
  padding:16px;
}
.conversations-header {
  font-size:14px;
  font-weight:300;
  font-style:italic;
  color:#dddddd;
  margin-bottom:12px;
  padding-left:30px;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  line-clamp:2;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.4;
  max-height:calc(1.4em * 2);
}
.conversation-item {
  padding:12px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:4px;
  color:var(--ink);
  font-size:14px;
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}
.conversation-item:hover {
  background:rgba(255,255,255,0.1);
}
.conversation-item.active {
  background:rgba(255,255,255,0.15);
}
.sidebar.collapsed .conversation-item.active {
  background:transparent;
}
/* Conversation Menu */
.conversation-title {
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  line-clamp:2;
  line-height:1.3;
  max-height:2.6em;
  /* Exact calculation: 1.3em * 2 lines = 2.6em */
}
.conversation-actions {
  opacity:0;
  transition:opacity 0.2s ease;
  position:relative;
}
.conversation-item:hover .conversation-actions {
  opacity:1;
}
.conversation-menu-btn {
  background:none;
  border:none;
  color:var(--ink);
  cursor:pointer;
  padding:4px;
  border-radius:4px;
  font-size:14px;
  font-weight:600;
  width:20px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.conversation-menu-btn:hover {
  background:rgba(255,255,255,0.2);
}
.conversation-dropdown {
  position:absolute;
  top:100%;
  right:0;
  background:var(--bg);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:8px;
  min-width:120px;
  z-index:25;
  display:none;
  box-shadow:0 4px 6px rgba(0,0,0,0.3);
}
.conversation-dropdown.show {
  display:block;
}
.conversation-dropdown-item {
  display:block;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--ink);
  padding:8px 12px;
  cursor:pointer;
  font-size:14px;
  border-radius:4px;
}
.conversation-dropdown-item:hover {
  background:rgba(255,255,255,0.1);
}
.conversation-dropdown-item.danger {
  color:#ff5252;
}
.conversation-dropdown-item.danger:hover {
  background:rgba(255,82,82,0.1);
}
/* Sidebar Bottom */
.sidebar-bottom {
  padding:16px;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.sidebar-bottom .user-email {
  color:var(--muted);
  font-size:12px;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sidebar-bottom .logout-btn {
  padding:8px;
  border:none;
  background:transparent;
  color:var(--ink);
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  outline:none;
}
.sidebar-bottom .logout-btn:hover {
  background:rgba(255,255,255,0.1);
}
.sidebar-bottom .logout-btn:focus {
  outline:none;
  background:transparent;
}
.sidebar.collapsed .logout-btn:focus {
  background:transparent;
}
.sidebar-bottom .logout-btn img {
  width:24px;
  height:24px;
}
/* Main Chat Area */
.main-chat {
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}
.chat {
  position:relative;
  padding:10px 22px 32px;
  max-width:1020px;
  margin:0 auto;
  flex:1;
  width:100%;
}
.column {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}
.column:has(.avatar-section.minimized) {
  flex-direction:row;
  align-items:flex-start;
  justify-content:flex-start;
  gap:24px;
}
.avatar-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
.column:has(.avatar-section.minimized) .avatar-section {
  align-items:flex-start;
}
.column:has(.avatar-section.minimized) .pane {
  flex:1;
  width:auto;
}
/* TEMP: slow transitions to inspect animation */
.avatarFrame {
  width:300px;
  height:300px;
  border-radius:0px;
  overflow:hidden;
  background:#1c1c1c;
  border:1px solid #333;
  display:grid;
  place-items:center;
  position:relative;
  transform-origin: center center;
}
.avatarFrame img {
  border-radius:0px;
}
/* Idle wiggle removed */
/* Minimized avatar state */
.avatar-section.minimized {
  align-items: flex-start;
}
.avatar-section.minimized .avatarFrame {
  width:180px;
  height:180px;
  cursor:pointer;
  transform-origin: left bottom;
  transform:none;
  border-radius:50%;
}
/* Increase avatar size by 20% when minimized and sidebar is expanded */
.sidebar:not(.collapsed) .avatar-section.minimized .avatarFrame {
  width:180px;
  height:180px;
}
/* Minimize button */
.minimize-btn {
  position:absolute;
  top:8px;
  right:8px;
  background:rgba(0,0,0,0.8);
  border:1px solid rgba(255,255,255,0.3);
  color:var(--ink);
  cursor:pointer;
  padding:6px;
  border-radius:50%;
  font-size:12px;
  opacity:1;
  transition:all 0.3s ease;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.minimize-btn:hover {
  background:rgba(0,0,0,0.9);
  transform:scale(1.1);
}
/* Edit button */
.edit-btn {
  position:absolute;
  top:8px;
  right:48px;
  background:rgba(0,0,0,0.8);
  border:1px solid rgba(255,255,255,0.3);
  color:var(--ink);
  cursor:pointer;
  padding:6px;
  border-radius:50%;
  font-size:12px;
  opacity:1;
  transition:all 0.3s ease;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.edit-btn:hover {
  background:rgba(0,0,0,0.9);
  transform:scale(1.1);
}
/* Maximize/expand button position (when avatar is minimized) */
.avatar-section.minimized .minimize-btn {
  right:8px;
}
/* Hide edit button when avatar is minimized */
.avatar-section.minimized .edit-btn {
  display:none;
}
.pane {
  position:relative;
  width:100%;
  max-width:720px;
}
/* TEMP: slow transitions to inspect animation */
.scroller {
  max-height:300px;
  overflow:auto;
  padding:0 0 0 0;
  transition: max-height 0.3s ease;
  position:relative;
}
.scroller.expanded {
  max-height:550px;
}
.scroller::-webkit-scrollbar {
  width:12px;
}
.scroller::-webkit-scrollbar-track {
  background:transparent;
}
.scroller::-webkit-scrollbar-thumb {
  background:rgba(255, 255, 255, 0.1);
  border-radius:999px;
}
.row {
  display:flex;
  margin:12px 0;
}
.bubble {
  max-width:520px;
  background:var(--bubble);
  color:var(--muted);
  border-radius:18px;
  padding:14px 18px;
  font-size:14px;
  line-height:1.3;
  border:2px solid #2a2a2a;
}
.bubble.from-bot {
  border:none;
  background:none;
}
.bubble.from-me {
  border:0px solid #fff;
  background:rgba(255, 255, 255, .1);
  margin-right:10px;
}
.from-me {
  margin-left:auto;
  border-top-right-radius:4px;
}
.from-bot {
  margin-right:auto;
  border-top-left-radius:8px;
}
.composerWrap {
  position:relative;
  margin-top:20px;
  margin-bottom:10px;
  width:100%;
  margin-left:auto;
  margin-right:auto;
  display:flex;
  align-items:center;
  z-index:3;
}
.composer {
  flex:1;
  border:1px solid #aaaaaa;
  border-radius:27px;
  padding:8px 16px;
  display:flex;
  align-items:center;
  gap:8px;
  background:#0a0a0a;
  min-height:44px;
  max-height:200px;
  overflow-y:auto;
}
.composer textarea {
  flex:1;
  background:transparent;
  border:0;
  outline:none;
  color:var(--ink);
  font-size:17.6px;
  resize:none;
  font-family:inherit;
  line-height:1.4;
  min-height:22px;
  padding:0;
}
.composer textarea::placeholder {
  color:#a8a8a8;
  opacity:1;
}
.circleBtn.sendBtn {
  background:rgba(255, 255, 255, .1);
  flex-shrink:0;
  width:36px;
  height:36px;
  margin-right:-7px;
}
.circleBtn {
  width:46.4px;
  height:46.4px;
  border-radius:999px;
  border:0px solid var(--stroke);
  background:transparent;
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:transform 0.15s ease-in-out, background 0.2s ease;
}
.circleBtn:hover {
  background:rgba(255,255,255,0.2);
  transform:translateY(-2px) scale(1.02);
}
.circleBtn:active {
  transform:translateY(0) scale(1);
}
.circleBtn svg {
  width:33.6px;
  height:33.6px;
  fill:var(--ink);
}
.circleBtn img {
  width:24px;
  height:24px;
}
.avatar-set-bubble {
  border: none !important;
  background: transparent !important;
  color: #fff !important;
  text-align: center !important;
  font-size: 18px !important;
  font-weight: 600 !important;
  width: fit-content !important;
  margin: 0 auto !important;
  left: 0 !important;
  right: 0 !important;
  padding: 0 20px !important;
}
.loading-message {
  color: var(--muted);
  font-style: italic;
  text-align: center;
  margin: 16px 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.loading-spinner {
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-top-color: rgba(255, 255, 255, 0.6);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.hide {
  display:none;
}
/* Mobile Top Navigation */
.mobile-top-nav {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: var(--bg);
  border-bottom: 1px solid #333;
  align-items: center;
  justify-content: flex-start;
  padding: 0 12px;
  z-index: 1001;
  gap: 12px;
}
.mobile-nav-left {
  display: flex;
  align-items: center;
  gap: 4px;
}
.mobile-nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.mobile-nav-btn {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s ease;
}
.mobile-nav-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}
.mobile-avatar-preview {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid #333;
  transition: border-color 0.2s ease;
  display: none;
}
.mobile-avatar-preview.visible {
  display: block;
}
.mobile-avatar-preview:hover {
  border-color: #666;
}
.mobile-avatar-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/* Mobile Responsive Styles */
@media (max-width: 768px) {
  .mobile-top-nav {
    display: flex;
  }
  .chat-container {
    height:100dvh;
    padding-top: 60px;
  }
  /* Hide sidebar by default on mobile, show as overlay when toggled */
  .sidebar {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 280px !important;
    min-width: 280px !important;
    max-width: 280px !important;
    z-index: 1002;
    box-shadow: 2px 0 8px rgba(0, 0, 0, 0.3);
    transform: translateX(-100%);
    transition: transform 0.3s ease-out;
    will-change: transform;
  }
  .sidebar.mobile-visible {
    display: flex !important;
    transform: translateX(0);
  }
  /* Mobile sidebar backdrop */
  .mobile-sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1001;
    opacity: 0;
    transition: opacity 0.3s ease-out;
  }
  .mobile-sidebar-backdrop.visible {
    display: block;
    opacity: 1;
  }
  /* Hide sidebar toggle on mobile */
  .sidebar-toggle {
    display: none !important;
  }
  /* Reduce scroller height by 50px when avatar is expanded (not minimized) */
  .scroller {
    max-height:160px;
  }
  .scroller.expanded {
    max-height:600px;
  }
  /* Sidebar toggle positioning for mobile */
  .sidebar-toggle {
    left:222px;
  }
  /* Just inside the right edge of 300px sidebar */
  .sidebar.collapsed + .main-chat .sidebar-toggle {
    left:0;
  }
  .sidebar .avatar-section.in-sidebar {
    padding:8px 2px 0;
    align-items:center;
    gap:8px;
    margin-top:-26px;
  }
  .sidebar .avatar-section.in-sidebar .avatarFrame {
    width:40px;
    height:40px;
    margin:4px auto 0;
    border-radius:50%;
  }
  .sidebar:not(.collapsed) .avatar-section.in-sidebar .avatarFrame {
    width:160px;
    height:160px;
    border-radius:50%;
  }
  /* Increase avatar size by 20% when minimized and sidebar is expanded - REMOVED, now always minimized */
  /* .sidebar:not(.collapsed) .avatar-section.in-sidebar.minimized .avatarFrame {
    width:130px;
    height:130px;
  } */
  .sidebar .avatar-section.in-sidebar .minimize-btn {
    left:auto;
    right:2px;
    top:2px;
    display: none; /* Hide minimize button since avatar is always minimized in sidebar */
  }

  <script type="module">

    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c";
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    // Initialize auth check

      const avatar = document.getElementById('avatar');

      const sidebar = document.querySelector('.sidebar');

      const sidebarMiniToggle = document.getElementById('sidebarMiniToggle');
      const navLogo = document.getElementById('navLogo');

      // Global state
      let currentAvatar = null;
      let currentConversationId = null;
      const convo = [];
      let allConversations = [];

      // Sign out handler
      logoutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.href = 'auth.html';
      });

      // New chat handler
      newChatBtn.addEventListener('click', async () => {
        await saveCurrentConversation();
        startNewChat();
      });

      // Mobile nav button handlers
      const mobileNewChatBtn = document.getElementById('mobileNewChatBtn');
      const mobileLibraryBtn = document.getElementById('mobileLibraryBtn');
      const mobileToggleBtn = document.getElementById('mobileToggleBtn');
      const mobileAvatarPreview = document.getElementById('mobileAvatarPreview');
      const mobileAvatarImg = document.getElementById('mobileAvatarImg');
      const mobileSidebarBackdrop = document.getElementById('mobileSidebarBackdrop');

      // Update mobile avatar image when avatar loads
      function updateMobileAvatar() {
        if (currentAvatar && currentAvatar.image_url) {
          mobileAvatarImg.src = currentAvatar.image_url;
        }
      }

      mobileNewChatBtn?.addEventListener('click', async () => {
        await saveCurrentConversation();
        startNewChat();
      });

      mobileLibraryBtn?.addEventListener('click', () => {
        window.location.href = 'index.html';
      });

      mobileToggleBtn?.addEventListener('click', () => {
        // Toggle sidebar visibility on mobile
        const isMobile = window.innerWidth <= 768;
        if (isMobile) {
          const isVisible = sidebar.classList.contains('mobile-visible');
          if (isVisible) {
            // Start closing animation
            sidebar.classList.remove('mobile-visible');
            mobileSidebarBackdrop?.classList.remove('visible');
            // Hide display after animation completes
            setTimeout(() => {
              if (!sidebar.classList.contains('mobile-visible')) {
                sidebar.style.display = 'none';
              }
            }, 300); // Match transition duration
          } else {
            // Show immediately then animate in
            sidebar.style.display = 'flex';
            mobileSidebarBackdrop.style.display = 'block';
            // Force reflow to ensure display:flex is applied before transform
            void sidebar.offsetHeight;
            sidebar.classList.add('mobile-visible');
            sidebar.classList.remove('collapsed');
            mobileSidebarBackdrop?.classList.add('visible');
          }
        }
      });

      // Close sidebar when backdrop is clicked
      mobileSidebarBackdrop?.addEventListener('click', () => {
        sidebar.classList.remove('mobile-visible');
        mobileSidebarBackdrop.classList.remove('visible');
        setTimeout(() => {
          if (!sidebar.classList.contains('mobile-visible')) {
            sidebar.style.display = 'none';
            mobileSidebarBackdrop.style.display = 'none';
          }
        }, 300);
      });

      mobileAvatarPreview?.addEventListener('click', () => {
        // Maximize the avatar when clicked
        if (isMinimized) {
          toggleMinimize(); // This will maximize the avatar and hide the mobile preview
        }
      });

      // Helper function to set toggle position based on screen size
      function setTogglePosition(width) {
        const collapsedWidth = COLLAPSED_SIDEBAR_WIDTH;
        const isCollapsed = sidebar.classList.contains('collapsed');
        let effectiveWidth = width;
        if (!effectiveWidth || Number.isNaN(effectiveWidth)) {
          effectiveWidth = isCollapsed ? collapsedWidth : (sidebar.offsetWidth || 300);
        }
        const offset = isCollapsed ? collapsedWidth : Math.max(effectiveWidth - 40, collapsedWidth);
        sidebarToggle.style.left = `${offset}px`;
      }

      const SIDEBAR_WIDTH_KEY = 'sidebarWidth';
      const SIDEBAR_STATE_KEY = 'sidebarCollapsed';

      function getSavedSidebarWidth() {
        const stored = parseInt(localStorage.getItem(SIDEBAR_WIDTH_KEY) || '', 10);
        const isMobile = window.innerWidth <= 768;
        
        if (Number.isNaN(stored)) return isMobile ? 280 : 300;
        
        // On mobile, clamp between 280-400px; on desktop, 200-600px
        if (isMobile) {
          return Math.min(Math.max(stored, 280), 400);
        }
        return Math.min(Math.max(stored, 200), 600);
      }

      function expandSidebar() {
        const width = getSavedSidebarWidth();
        sidebar.classList.remove('collapsed');
        sidebar.style.width = `${width}px`;
        setTogglePosition(width);
        sidebarToggle.title = 'Collapse sidebar';
        sidebarMiniToggle?.setAttribute('title', 'Collapse sidebar');
        sidebarMiniToggle?.setAttribute('aria-label', 'Collapse sidebar');
        localStorage.setItem(SIDEBAR_STATE_KEY, 'false');
      }

      function collapseSidebar(options = {}) {
        const { saveWidth = true, persistState = true } = options;

        if (saveWidth) {
          const currentWidth = parseInt(window.getComputedStyle(sidebar).width, 10);
          if (!Number.isNaN(currentWidth) && currentWidth > 0) {
            localStorage.setItem(SIDEBAR_WIDTH_KEY, String(currentWidth));
          }
        }
        sidebar.classList.add('collapsed');
        sidebar.style.width = `${COLLAPSED_SIDEBAR_WIDTH}px`;
        setTogglePosition(COLLAPSED_SIDEBAR_WIDTH);
        sidebarToggle.title = 'Expand sidebar';
        sidebarMiniToggle?.setAttribute('title', 'Expand sidebar');
        sidebarMiniToggle?.setAttribute('aria-label', 'Expand sidebar');
        if (persistState) {
          localStorage.setItem(SIDEBAR_STATE_KEY, 'true');
        }
      }

      // Sidebar toggle handler
      sidebarToggle.addEventListener('click', () => {
        if (sidebar.classList.contains('collapsed')) {
          expandSidebar();
        } else {
          collapseSidebar();
        }
      });

      sidebarMiniToggle?.addEventListener('click', () => {
        if (sidebar.classList.contains('collapsed')) {
          expandSidebar();
        } else {
          collapseSidebar();
        }
      });

      // Collapse sidebar when clicking the nav logo
      navLogo?.addEventListener('click', () => {
        if (!sidebar.classList.contains('collapsed')) {
          collapseSidebar();
        }
      });

      // Sidebar resize functionality
      const resizeHandle = document.getElementById('resizeHandle');
      let isResizing = false;
      let startX = 0;
      let startWidth = 0;

      resizeHandle.addEventListener('mousedown', (e) => {
        isResizing = true;
        startX = e.clientX;
        startWidth = parseInt(window.getComputedStyle(sidebar).width, 10);
        
        sidebar.classList.add('resizing');
        resizeHandle.classList.add('resizing');
        
        // Add global listeners for mouse events
        document.addEventListener('mousemove', handleResize);
        document.addEventListener('mouseup', stopResize);
        
        // Prevent text selection during drag
        e.preventDefault();
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
      });

      function handleResize(e) {
        if (!isResizing) return;
        
        const width = startWidth + (e.clientX - startX);
        const minWidth = 200;
        const maxWidth = 600;
        
        if (width >= minWidth && width <= maxWidth) {
          sidebar.style.width = `${width}px`;

          // Update the sidebar toggle position
          setTogglePosition(width);

          // Store the width preference
          localStorage.setItem(SIDEBAR_WIDTH_KEY, String(width));
        }
      }

      function stopResize() {
        if (!isResizing) return;
        
        isResizing = false;
        sidebar.classList.remove('resizing');
        resizeHandle.classList.remove('resizing');
        
        // Remove global listeners
        document.removeEventListener('mousemove', handleResize);
        document.removeEventListener('mouseup', stopResize);
        
        // Restore normal cursor and text selection
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
      }

      // Initialize sidebar state (default collapsed if no preference saved)
      collapseSidebar({ saveWidth: false });

      // Debounce function for resize events
      let resizeTimeout;
      function debounceResize(callback, delay = 150) {
        return function(...args) {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(() => callback.apply(this, args), delay);
        };
      }

      // Reposition toggle on resize and collapse automatically on mobile
      window.addEventListener('resize', debounceResize(() => {
        const nowMobile = window.innerWidth <= 768;
        const storedState = localStorage.getItem(SIDEBAR_STATE_KEY);

        if (nowMobile) {
        collapseSidebar({ saveWidth: false, persistState: false });
        return;
      }

        if (storedState === 'false') {
          expandSidebar();
          return;
        }
        const width = sidebar.classList.contains('collapsed') ? COLLAPSED_SIDEBAR_WIDTH : parseInt(window.getComputedStyle(sidebar).width, 10);
        if (!Number.isNaN(width) && width > 0) {
          setTogglePosition(width);
        }
      }));

      // Simple search function
      // Watch auth state changes
      supabase.auth.onAuthStateChange((_event, session) => {
        if (!session) {
          window.location.href = 'auth.html';
        }
      });

      // Get avatar ID from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const avatarId = urlParams.get('avatar');
      const isNewAvatar = urlParams.get('new') === 'true';

      if (!avatarId) {
        // No avatar ID provided, redirect to dashboard
        window.location.href = 'index.html';
      } else {
        loadAvatar(avatarId, isNewAvatar);
      }

      // Load conversation history for sidebar (filtered by current avatar)
      async function loadConversationHistory() {
        try {
          const { data: { user } } = await supabase.auth.getUser();
          if (!user || !currentAvatar) return;

          const { data: conversations, error } = await supabase
            .from('conversations')
            .select(`
              id,
              title,
              created_at,
              avatar_id,
              custom_title
            `)
            .eq('avatar_id', currentAvatar.id)
            .order('created_at', { ascending: false });

          if (error) {
            console.error('Error loading conversations:', error);
            return;
          }

          allConversations = conversations || [];
          displayConversations(allConversations);
          
          // Update conversations header with avatar name (use nickname if available)
          if (currentAvatar) {
            const displayName = currentAvatar.nickname || currentAvatar.name;
            conversationsHeader.textContent = `Chats with ${displayName}`;
          }
        } catch (error) {
          console.error('Error in loadConversationHistory:', error);
        }
      }

      // Display conversations in sidebar
      function displayConversations(conversations) {
        conversationsList.innerHTML = '';
        
        conversations.forEach(conv => {
          const item = document.createElement('div');
          item.className = 'conversation-item';
          if (conv.id === currentConversationId) {
            item.classList.add('active');
          }
          
          item.innerHTML = `
            <div class="conversation-title">${conv.title || `Chat ${new Date(conv.created_at).toLocaleDateString()}`}</div>
            <div class="conversation-actions">
              <button class="conversation-menu-btn" onclick="toggleConversationMenu(event, '${conv.id}')">⋯</button>
              <div id="conv-menu-${conv.id}" class="conversation-dropdown">
                <button class="conversation-dropdown-item" onclick="renameConversation('${conv.id}', '${(conv.title || `Chat ${new Date(conv.created_at).toLocaleDateString()}`).replace(/'/g, "\\'")}')">Rename</button>
                <button class="conversation-dropdown-item danger" onclick="deleteConversation('${conv.id}', '${(conv.title || `Chat ${new Date(conv.created_at).toLocaleDateString()}`).replace(/'/g, "\\'")}')">Delete</button>
              </div>
            </div>
          `;
          
          // Setup touch/click interaction for better mobile UX
          setupConversationInteraction(item, conv.id);
          
          conversationsList.appendChild(item);
        });
      }

      // Load a specific conversation
      window.loadConversation = async function(conversationId) {
        try {
          // Save current conversation first
          await saveCurrentConversation();
          
          // Load messages for the selected conversation
          const { data: messages, error } = await supabase
            .from('messages')
            .select('*')
            .eq('conversation_id', conversationId)
            .order('created_at', { ascending: true });

          if (error) {
            console.error('Error loading conversation messages:', error);
            return;
          }

          // Clear current conversation and load new one
          convo.length = 0;
          log.innerHTML = '';
          currentConversationId = conversationId;

          // Display messages in conversation
          messages.forEach(message => {
            convo.push({ role: message.role, content: message.text });
            add(message.role === 'user' ? 'from-me' : 'from-bot', message.text);
          });
          
          // Hide ask question bar if there are messages (existing conversation)
          if (messages && messages.length > 0) {
            hideAskQuestionBar();
          } else {
            // Show bar if it's an empty conversation
            showAskQuestionBar();
          }

          // Update active conversation in sidebar
          displayConversations(allConversations);
          
        } catch (error) {
          console.error('Error in loadConversation:', error);
        }
      };

      // Save current conversation (fallback title generation for edge cases)
      async function saveCurrentConversation() {
        if (!currentConversationId || convo.length === 0) return;
        
        try {
          // Only generate title if it's still default and NOT user-customized
          const currentConv = allConversations.find(c => c.id === currentConversationId);
          if (currentConv && currentConv.title.includes('Conversation with') && !currentConv.custom_title) {
            const firstUserMessage = convo.find(m => m.role === 'user');
            if (firstUserMessage && firstUserMessage.content) {
              // Get AI-generated title
              const smartTitle = await generateConversationTitle(firstUserMessage.content, currentAvatar.name);
              
              const { error } = await supabase
                .from('conversations')
                .update({ title: smartTitle })
                .eq('id', currentConversationId);
                
              if (!error) {
                currentConv.title = smartTitle;
                // Refresh the conversations list to show new title
                displayConversations(allConversations);
              }
            }
          }
        } catch (error) {
          console.error('Error saving conversation:', error);
        }
      }

      // Generate smart conversation title using AI
      async function generateConversationTitle(firstMessage, avatarName) {
        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              persona: 'assistant',
              message: `Create a short, descriptive title (max 4-6 words) for a conversation that starts with: "${firstMessage}". The conversation is with ${avatarName}. Return only the title, no quotes or extra text.`,
              history: []
            })
          });
          
          const { text, error } = await res.json();
          if (error || !text) throw new Error('Failed to generate title');
          
          // Clean up the response and ensure it's not too long
          let title = text.trim().replace(/^["']|["']$/g, ''); // Remove quotes
          if (title.length > 40) {
            title = title.substring(0, 37) + '...';
          }
          
          return title;
        } catch (error) {
          console.error('Error generating title:', error);
          // Fallback to first few words of the message
          const words = firstMessage.split(' ').slice(0, 4).join(' ');
          return words + (firstMessage.split(' ').length > 4 ? '...' : '');
        }
      }

      // Generate and update title immediately after first exchange
      async function generateAndUpdateTitle() {
        if (!currentConversationId || convo.length < 2) return; // Need at least user + assistant message
        
        try {
          const currentConv = allConversations.find(c => c.id === currentConversationId);
          if (currentConv && currentConv.title.includes('Conversation with') && !currentConv.custom_title) {
            const firstUserMessage = convo.find(m => m.role === 'user');
            if (firstUserMessage && firstUserMessage.content) {
              // Get AI-generated title
              const smartTitle = await generateConversationTitle(firstUserMessage.content, currentAvatar.name);
              
              const { error } = await supabase
                .from('conversations')
                .update({ title: smartTitle })
                .eq('id', currentConversationId);
                
              if (!error) {
                currentConv.title = smartTitle;
                // Refresh the conversations list to show new title immediately
                displayConversations(allConversations);
              }

          }
        } catch (error) {
          console.error('Error generating immediate title:', error);
        }
      }

      function startNewChat() {
        convo.length = 0;
        log.innerHTML = '';
        currentConversationId = null;
        
        // Show the ask question bar for new conversation
        showAskQuestionBar();
        
        // Remove active state from all conversations
        displayConversations(allConversations);
      }

      // Conversation management functions
      // Setup conversation interaction for mobile and desktop
      function setupConversationInteraction(conversationItem, conversationId) {
        let touchStartTime = 0;
        let longPressTimer = null;
        let longPressTriggered = false;
        
        // Touch start - start timing for long press
        conversationItem.addEventListener('touchstart', (e) => {
          // Don't handle touch if clicking on menu button
          if (e.target.closest('.conversation-actions')) return;
          
          touchStartTime = Date.now();
          longPressTriggered = false;
          
          longPressTimer = setTimeout(() => {
            // Long press detected - show menu
            longPressTriggered = true;
            navigator.vibrate && navigator.vibrate(50); // Haptic feedback if available
            toggleConversationMenu(e, conversationId);
          }, 500); // 500ms for long press
        }, { passive: true });
        
        // Touch end - determine if it's a tap or long press
        conversationItem.addEventListener('touchend', (e) => {
          // Don't handle touch if clicking on menu button
          if (e.target.closest('.conversation-actions')) return;
          
          clearTimeout(longPressTimer);
          
          if (!longPressTriggered) {
            // Short tap - load conversation
            e.preventDefault();
            loadConversation(conversationId);
          }
        }, { passive: false });
        
        // Touch cancel - clean up
        conversationItem.addEventListener('touchcancel', () => {
          clearTimeout(longPressTimer);
          longPressTriggered = false;
        }, { passive: true });
        
        // Mouse click for desktop - keep original behavior
        conversationItem.addEventListener('click', (e) => {
          // Only handle if not a touch device or if no touch events fired
          if (!('ontouchstart' in window)) {

      window.renameConversation = async function(conversationId, currentTitle) {
        const newTitle = prompt('Enter new conversation name:', currentTitle);
        if (!newTitle || newTitle === currentTitle) return;
        
        try {
          const { error } = await supabase
            .from('conversations')
            .update({ 
              title: newTitle,
              custom_title: true  // Mark as user-customized
            })
            .eq('id', conversationId);
            
          if (error) throw error;
          
          // Update local conversations array
          const convIndex = allConversations.findIndex(c => c.id === conversationId);
          if (convIndex !== -1) {
            allConversations[convIndex].title = newTitle;
            allConversations[convIndex].custom_title = true;
          }
          
          // Refresh conversations display
          displayConversations(allConversations);
          
        } catch (error) {
          console.error('Error renaming conversation:', error);
          alert('Failed to rename conversation');
        }
      };

      window.deleteConversation = async function(conversationId, title) {
        if (!confirm(`Are you sure you want to delete "${title}"? This cannot be undone.`)) return;
        
        try {
          // Delete all messages first
          const { error: msgError } = await supabase
            .from('messages')
            .delete()
            .eq('conversation_id', conversationId);
            
          if (msgError) throw msgError;
          
          // Delete conversation
          const { error } = await supabase
            .from('conversations')
            .delete()
            .eq('id', conversationId);
            
          if (error) throw error;
          
          // If this was the current conversation, start a new one
          if (conversationId === currentConversationId) {
            startNewChat();
          }
          
          // Remove from local array and refresh display
          allConversations = allConversations.filter(c => c.id !== conversationId);
          displayConversations(allConversations);
          
        } catch (error) {
          console.error('Error deleting conversation:', error);
          alert('Failed to delete conversation');
        }
      };

      // Load existing conversation

            .from('conversations')
            .select(`
              id,
              messages (
                id,
                role,
                text,
                created_at
              )
            `)
            .eq('avatar_id', avatarId)
            .order('created_at', { ascending: false })
            .limit(1);

          if (convoError) {
            console.error('Error loading conversation:', convoError);
            return;
          }

          if (conversations && conversations.length > 0) {
            currentConversationId = conversations[0].id;
            const messages = conversations[0].messages || [];
            
            // Sort messages by creation time
            messages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            
            // Display messages
            messages.forEach(msg => {
              add(msg.role === 'user' ? 'from-me' : 'from-bot', msg.text);

          bucket(s.rationalIntuitive,'rational','intuitive');
          bucket(s.practicalImaginative,'practical','imaginative');
          const personalityTraits = flavor.join(', ') || null;

          // Use archetype or archetype_specific as persona, fallback to name
          const personaType = currentAvatar.traits?.archetype_specific || currentAvatar.traits?.archetype || currentAvatar.name;

          // Non-stream fetch + typewriter simulation (fallback while real streaming debug)
          const res = await fetch('/api/chat', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ 
              persona: personaType,
              avatarName: currentAvatar.name,
              personalityTraits: personalityTraits,
              message: t, 
              history: convo.slice(-10),
              temperature: 0.85,
              presencePenalty: 0.45,
              frequencyPenalty: 0.35
            })
          });
          const { text:fullResp, error:respErr } = await res.json();
          const finalText = (respErr || !fullResp ? 'No response.' : fullResp).trim();
          // Reuse loading row instead of creating a second placeholder
          let loadingRow = document.getElementById(loadingId);
          let bubble;
          if(loadingRow){
            bubble = loadingRow.querySelector('.bubble');
            // Clean the loading bubble
            if(bubble){
              bubble.classList.remove('loading-message');
              bubble.textContent = '';
            }
            loadingRow.removeAttribute('id'); // prevent accidental future removal
          } else {
            // Fallback if loading row missing
            const row = document.createElement('div');
            row.className = 'row';
            bubble = document.createElement('div');
            bubble.className = 'bubble from-bot';
            row.appendChild(bubble);
            log.appendChild(row);
          }
          setTimeout(()=>{ log.scrollTop = log.scrollHeight; },0);
          // Animate text typing
          let i=0;
          const speed = 7; // Characters per frame (higher = faster)
          const animate = ()=>{
            if(!bubble) return;
            bubble.textContent = finalText.slice(0,i);
            log.scrollTop = log.scrollHeight;
            if(i < finalText.length){ i+=speed; requestAnimationFrame(animate); }
          };
          animate();
          convo.push({ role:'assistant', content: finalText });
          const { error: aiMsgError } = await supabase
            .from('messages')
            .insert({ conversation_id: currentConversationId, role: 'assistant', text: finalText });
          if (aiMsgError) console.error('Error saving AI message:', aiMsgError);
          
          // Generate smart title after first exchange
          await generateAndUpdateTitle();
          
        } catch (err) {
          console.error('Chat error:', err);
          removeLoading(loadingId);
          add('from-bot', err.message || 'Chat failed. Try again.');
        }
      }

      function add(who, text){
        const row = document.createElement('div'); 
        row.className = 'row';
        const b = document.createElement('div');
        b.className = 'bubble ' + who;
        b.textContent = text;
        row.appendChild(b); 
        log.appendChild(row);
        setTimeout(()=>{ log.scrollTop = log.scrollHeight; }, 0);
      }

      function typewriterBot(text){
        const row = document.createElement('div');
        row.className = 'row';
        const b = document.createElement('div');
        b.className = 'bubble from-bot';
        b.textContent = '';
        row.appendChild(b);
        log.appendChild(row);
        setTimeout(()=>{ log.scrollTop = log.scrollHeight; },0);
        let i=0; const finalText = (text||'').trim();
        const speed = 7; // Characters per frame (higher = faster)
        const animate=()=>{
          b.textContent = finalText.slice(0,i);
          log.scrollTop = log.scrollHeight;
          if(i < finalText.length){ i+=speed; requestAnimationFrame(animate); }
        };
        requestAnimationFrame(animate);
      }

      function addLoading(id) {
        const row = document.createElement('div'); 
        row.className = 'row';
        row.id = id;
        const b = document.createElement('div');
        b.className = 'bubble from-bot loading-message';
        b.innerHTML = '<div class="loading-spinner"></div>';
        row.appendChild(b); 
        log.appendChild(row);
        setTimeout(()=>{ log.scrollTop = log.scrollHeight; }, 0);
      }

      function removeLoading(id) {
        const element = document.getElementById(id);
        if (element) {
          element.remove();
        }
      }

      function fallbackAvatar(){
        return `<img src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png"
                   alt="Avatar Placeholder"
                   style="width:100%;height:100%;object-fit:cover;">`;
      }

  // Idle wiggle removed

  // Avatar minimize functionality
  let isMinimized = true; // Default to minimized state
  const avatarSection = document.querySelector('.avatar-section');
  const scroller = document.getElementById('log');
  const sidebarNav = sidebar.querySelector('.sidebar-nav');
  const avatarPlaceholder = document.createElement('div');
  avatarPlaceholder.className = 'avatar-placeholder';
  avatarPlaceholder.style.display = 'none';
  if (avatarSection && avatarSection.parentNode) {
    avatarSection.parentNode.insertBefore(avatarPlaceholder, avatarSection.nextSibling);
  }
  let expandClickHandler = null; // stable reference for minimized->expand click

      function isMobileLayout() {
        return window.innerWidth <= 768;
      }

      function moveAvatarToSidebar() {
        if (!avatarSection || !sidebar) return;
        const sidebarActions = sidebar.querySelector('.sidebar-actions');
        if (sidebarActions && avatarSection.parentNode !== sidebar) {
          // Insert after sidebar-actions (after "New Conversation")
          sidebarActions.parentNode.insertBefore(avatarSection, sidebarActions.nextSibling);
        } else if (sidebarActions && avatarSection.previousElementSibling !== sidebarActions) {
          // Move to after sidebar-actions if already in sidebar but wrong position
          sidebarActions.parentNode.insertBefore(avatarSection, sidebarActions.nextSibling);
        }
        avatarSection.classList.add('in-sidebar');
        // Always show as minimized in sidebar
        avatarSection.classList.add('minimized');
        scroller.classList.add('expanded');
      }

      function moveAvatarToColumn() {
        if (!avatarSection || !avatarPlaceholder.parentNode) return;
        if (avatarSection.parentNode !== avatarPlaceholder.parentNode) {
          avatarPlaceholder.parentNode.insertBefore(avatarSection, avatarPlaceholder);
        }
        avatarSection.classList.remove('in-sidebar');
        // Restore the actual minimized state when moving back to column
        if (!isMinimized) {
          avatarSection.classList.remove('minimized');
          scroller.classList.remove('expanded');
        }
      }

      function updateAvatarPlacement() {
        if (isMinimized && isMobileLayout()) {
          moveAvatarToSidebar();
          scroller.style.maxHeight = '566px';
        } else {
          moveAvatarToColumn();
          if (!isMinimized) {
            scroller.style.maxHeight = '';
          }
        }
      }

      function addMinimizeButton() {
        // Remove existing minimize button if any
        const existingBtn = avatar.querySelector('.minimize-btn');
        if (existingBtn) existingBtn.remove();
        
        const minimizeBtn = document.createElement('button');
        minimizeBtn.className = 'minimize-btn';
        minimizeBtn.innerHTML = '−';
        minimizeBtn.title = 'Minimize avatar';
        minimizeBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          console.log('Minimize button clicked!'); // Debug log
          toggleMinimize();
        });
        avatar.appendChild(minimizeBtn);
      }

      function addEditButton() {
        // Remove existing edit button if any
        const existingBtn = avatar.querySelector('.edit-btn');
        if (existingBtn) existingBtn.remove();
        
        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.innerHTML = '<img src="images/sliders_icon.png" alt="Edit" style="width:18px; height:18px;">';
        editBtn.title = 'Edit avatar';
        editBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          // Get current avatar ID from URL or localStorage
          const urlParams = new URLSearchParams(window.location.search);
          const avatarId = urlParams.get('avatar') || localStorage.getItem('lastSelectedAvatar');
          if (avatarId) {
            window.location.href = `edit.html?avatar=${avatarId}`;
          }
        });
        avatar.appendChild(editBtn);
      }

      function initializeMinimizedState() {
        // Set up the initial minimized state without toggling
        avatarSection.classList.add('minimized');
        scroller.classList.add('expanded');
        if (isMobileLayout()) {
          scroller.style.maxHeight = '580px';
        }
        // Show mobile avatar preview when minimized
        mobileAvatarPreview?.classList.add('visible');
        
        const minimizeBtn = avatar.querySelector('.minimize-btn');
        if (minimizeBtn) {
          minimizeBtn.innerHTML = '+';
          minimizeBtn.title = 'Expand avatar';
          minimizeBtn.style.display = 'none';
        }
        
        // Add click handler to expand
        if (!expandClickHandler) {
          expandClickHandler = function(e){
            if (e.target.closest && e.target.closest('.minimize-btn')) return;
            toggleMinimize();
          };
        }
        avatar.style.cursor = 'pointer';
        avatar.addEventListener('click', expandClickHandler);
        
        updateAvatarPlacement();
      }

      function toggleMinimize() {
        console.log('toggleMinimize called, current state:', isMinimized); // Debug log
        isMinimized = !isMinimized;
        const minimizeBtn = avatar.querySelector('.minimize-btn');
        
        if (isMinimized) {
          console.log('Minimizing avatar...'); // Debug log
          avatarSection.classList.add('minimized');
          scroller.classList.add('expanded');
          if (isMobileLayout()) {
            scroller.style.maxHeight = '580px';
          }
          // Show mobile avatar preview when minimized
          mobileAvatarPreview?.classList.add('visible');
          
          if (minimizeBtn) {
            minimizeBtn.innerHTML = '+';
            minimizeBtn.title = 'Expand avatar';
            minimizeBtn.style.display = 'none';
          }
          if (!expandClickHandler) {
            expandClickHandler = function(e){
              if (e.target.closest && e.target.closest('.minimize-btn')) return;
              toggleMinimize();
            };
          }
          avatar.style.cursor = 'pointer';
          avatar.addEventListener('click', expandClickHandler);
        } else {
          console.log('Expanding avatar...'); // Debug log
          avatarSection.classList.remove('minimized');
          scroller.classList.remove('expanded');
          scroller.style.maxHeight = '';
          // Hide mobile avatar preview when maximized
          mobileAvatarPreview?.classList.remove('visible');
          
          if (minimizeBtn) {
            minimizeBtn.innerHTML = '−';
            minimizeBtn.title = 'Minimize avatar';
            minimizeBtn.style.display = '';
          }
          avatar.style.cursor = 'default';
          if (expandClickHandler) {
            avatar.removeEventListener('click', expandClickHandler);
            expandClickHandler = null;
          }
        }
        updateAvatarPlacement();
      }

      // Use debounced resize for avatar placement
      window.addEventListener('resize', debounceResize(updateAvatarPlacement, 150));
      updateAvatarPlacement();

    } // End of authenticated check
  </script>
</body>
</html>
