  <script type="module">
    // === Supabase Auth ===
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c";
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    // Check auth and redirect if not authenticated
    async function checkAuthAndRedirect() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'auth.html';
        return false;
      }
      console.log("User authenticated:", session.user.email);
      
      // Load and display username from profiles table
      await loadUserProfile(session.user);
      return true;
    }

    // Load user profile and display username
    async function loadUserProfile(user) {
      try {
        const { data: profile, error } = await supabase
          .from('profiles')
          .select('display_name')
          .eq('id', user.id)
          .single();

        if (error) {
          console.error('Error loading profile:', error);
          document.getElementById('userEmail').textContent = user.email; // Fallback to email
        } else {
          document.getElementById('userEmail').textContent = profile?.display_name || user.email;
        }
      } catch (error) {
        console.error('Error in loadUserProfile:', error);
        document.getElementById('userEmail').textContent = user.email; // Fallback to email
      }
    }

    // Initialize auth check
    const isAuthenticated = await checkAuthAndRedirect();
    if (!isAuthenticated) {
      // Don't initialize the rest of the app if not authenticated
    } else {
      // Continue with app initialization only if authenticated

      const persona = document.getElementById('persona');
      const startBtn = document.getElementById('startBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const advancedToggle = document.getElementById('advancedToggle');
      const advancedPanel = document.getElementById('advancedPanel');

      // Sign out handler
      logoutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.href = 'auth.html';
      });

      // Chat navigation handler
      const chatNavIcon = document.getElementById("chatNavIcon");
      if (chatNavIcon) {
        chatNavIcon.addEventListener("click", (e) => {
          e.preventDefault();
          const lastAvatarId = localStorage.getItem('lastSelectedAvatar');
          if (lastAvatarId) {
            window.location.href = `chat.html?avatar=${lastAvatarId}`;
          } else {
            alert('Please select an avatar to chat with first!');
          }
        });
      }

      // Watch auth state changes
      supabase.auth.onAuthStateChange((_event, session) => {
        if (!session) {
          window.location.href = 'auth.html';
        }
      });

      // Handle responsive placeholder text
      function updatePlaceholder() {
        if (window.innerWidth <= 600) {
          persona.placeholder = persona.dataset.shortPlaceholder;
        } else {
          persona.placeholder = "Describe the personality, appearance, or character of the Bot";
        }
      }
      window.addEventListener('resize', updatePlaceholder);
      updatePlaceholder();

      persona.addEventListener('keydown', e=>{ if(e.key==='Enter') start(); });
      startBtn.addEventListener('click', start);
      
      // Advanced options toggle
      advancedToggle.addEventListener('click', () => {
        const isVisible = advancedPanel.style.display !== 'none';
        const dynamicStartContainer = document.getElementById('dynamicStartContainer');
        const inputContainer = document.querySelector('.input-container');
        
        if (isVisible) {
          // Closing advanced panel - move button back to input container
          advancedPanel.style.display = 'none';
          dynamicStartContainer.style.display = 'none';
          inputContainer.appendChild(startBtn);
          advancedToggle.style.transform = 'rotate(0deg)';
        } else {
          // Opening advanced panel - move button below panel
          advancedPanel.style.display = 'flex';
          dynamicStartContainer.style.display = 'flex';
          dynamicStartContainer.appendChild(startBtn);
          advancedToggle.style.transform = 'rotate(180deg)';
        }
      });

      async function start(){
        const p = persona.value.trim(); 
        if(!p) return;

        // Check if user can create a new bot (freemium limits)
        const canCreateResult = await window.FreemiumUtils.canUserCreateBot(supabase);
        if (!canCreateResult.canCreate) {
          // Show upgrade modal
          const plans = await window.FreemiumUtils.getSubscriptionPlans(supabase);
          await window.FreemiumUtils.showUpgradeModal(canCreateResult.subscriptionInfo, plans);
          return;
        }

        // Get values from advanced panel
        const botName = document.getElementById('botName').value.trim();
        const artStyle = document.getElementById('artStyle').value.trim();
        const personalityPrompt = document.getElementById('personalityPrompt').value.trim();

        // Disable form while processing
        persona.disabled = true;
        startBtn.disabled = true;
        startBtn.innerHTML = loader();

        try {
          // ===== Generate avatar via API =====
          const res = await fetch('/api/generate-avatar', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ 
              prompt: p,
              botName: botName,
              artStyle: artStyle,
              personalityPrompt: personalityPrompt
            })
          });

          const json = await res.json().catch(() => ({}));
          if (!res.ok || !json?.dataUrl) {
            console.error('Avatar API error:', json);
            // Show error message
            let msg = document.getElementById('safetyMsg');
            if (msg) {
              msg.textContent = 'Content blocked by safety system. Avoid copyrighted, controversial, or explicit characters!';
              msg.style.display = 'block';
              // Hide after 6 seconds
              setTimeout(() => { msg.style.display = 'none'; }, 6000);
            }
            return;
          }

          // Remove safety message if present
          let msg = document.getElementById('safetyMsg');
          if (msg) msg.style.display = 'none';

          // Upload avatar image to Supabase and save it
          const { data: { user } } = await supabase.auth.getUser();
          if (user) {
            const finalBotName = json.botName || p;
            const url = await uploadAvatarImage({ dataUrl: json.dataUrl, userId: user.id, fileName: `${finalBotName}.png` });
            
            // Save avatar to database
            const { data: avatarData, error: avatarError } = await supabase
              .from('avatars')
              .insert({
                user_id: user.id,
                name: finalBotName,
                image_url: url,
                traits: {
                  original_prompt: p,
                  art_style: json.artStyle,
                  personality_prompt: json.personalityPrompt,
                  ...(json.traits || {})
                },
              })
              .select()
              .single();
              
            if (avatarError) {
              console.error('Error saving avatar:', avatarError);
              throw avatarError;
            }
            
            console.log('Avatar created successfully:', avatarData);
            
            // Store the new avatar ID for future navigation
            localStorage.setItem('lastSelectedAvatar', avatarData.id);
            
            // Redirect to chat with the new avatar
            window.location.href = `chat.html?avatar=${avatarData.id}&new=true`;
          }

        } catch (err) {
          console.error('Avatar creation failed:', err);
          let msg = document.getElementById('safetyMsg');
          if (msg) {
            msg.textContent = 'Avatar creation failed. Please try again.';
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 4000);
          }
        } finally {
          // Re-enable form
          persona.disabled = false;
          startBtn.disabled = false;
          startBtn.innerHTML = '<img src="images/wand_icon.png" alt="Generate" style="width: 32px; height: 32px;" />';
          persona.focus();
        }
      }

      function loader(){
        return `<div style="width:24px;height:24px;border:2px solid #333;border-top:2px solid #fff;border-radius:50%;animation:spin 60s linear infinite;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>`;
      }

      // --- Supabase Upload Helper ---
      function dataUrlToBlob(dataUrl){
        const [meta, b64] = dataUrl.split(",");
        const mime = meta.match(/data:(.*?);base64/)[1] || "image/png";
        const bin = atob(b64), len = bin.length;
        const bytes = new Uint8Array(len);
        for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }

      async function uploadAvatarImage({ dataUrl, userId, fileName="avatar.png" }){
        try {
          const blob = dataUrlToBlob(dataUrl);
          const path = `${userId}/${crypto.randomUUID()}-${fileName}`;
          
          // Upload the file
          const { error: upErr } = await supabase.storage.from("avatars")
            .upload(path, blob, { 
              upsert: true, 
              contentType: blob.type,
              cacheControl: '3600'
            });
          if (upErr) throw upErr;
          
          // Get the public URL
          const { data } = supabase.storage.from("avatars")
            .getPublicUrl(path, {
              download: false,
              transform: {
                width: 333,
                height: 333,
                resize: 'cover'
              }
            });
            
          // Ensure the URL is using HTTPS
          const url = new URL(data.publicUrl);
          url.protocol = 'https:';
          return url.toString();
        } catch (err) {
          console.error('Error in uploadAvatarImage:', err);
          throw err;
        }
      }

      // Focus on input when page loads
      persona.focus();

    } // End of authenticated check
  </script>
