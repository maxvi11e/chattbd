<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Build a Bot — Create</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <style>
  /* Advanced Panel Styling - Match input-container exactly */
  #advancedPanel {
    width: 100%;
    max-width: 800px;
  }
  
  /* Ensure advanced panel heroInput elements don't get responsive sizing */
  #advancedPanel .heroInput {
    width: 100% !important;
  }
  
  @media (max-width: 900px) {
    .heroInput {
      width: min(400.69px, calc(56vw - 32px));
    }
    /* Override responsive sizing for advanced panel inputs */
    #advancedPanel .heroInput {
      width: 100% !important;
    }
  }
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @media (max-width: 600px) {
      #persona::placeholder {
        content: "Create avatar...";
      }
      .user-email {
        display: none;
      }
      .logout-btn {
        display: none !important;
      }
    }
    :root{
      --bg:#000;
      --ink:#fff;
      --muted:#d9d9d9;
      --bubble:#333;
      --stroke:#fff;
      --radius-lg:24px;
      --radius-md:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial}

    .screen{min-height:100vh; width:100%;}

    /* ===== Dashboard ===== */
    .dashboard{padding:0; min-height:100vh;}
    
    /* Top Navigation */
    .top-nav{display:flex; justify-content:space-between; align-items:center; padding:12px 48px 4px 48px;}
    .nav-left{display:flex; align-items:center; gap:24px;}
    .nav-logo{height:48px; width:auto;}
    .nav-icon{height:32px; width:auto; transition:transform 0.2s ease; cursor:pointer; opacity:1;}
    .nav-icon:hover{transform:scale(1.1);}
    .nav-right{display:flex; gap:16px; align-items:center;}
    .user-email{color:var(--ink); font-size:16px;}
    .logout-btn{padding:8px; border:none; background:transparent; color:var(--ink); border-radius:8px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;}
    .logout-btn:hover{background:rgba(255,255,255,0.1);}
    .logout-btn img{width:36px; height:36px;}

    /* Main Content */
    .main-content{padding:0px; max-width:1200px; margin:0 auto;}
    
    /* Page Title */
    .page-header{display:flex; align-items:center; gap:16px; margin-bottom:50px; justify-content:center;}
    .page-icon{height:40px; width:auto;}
    .page-title{font-size:32px; font-weight:600; margin:0;}

    /* Create Form */
    .create-form{display:flex; justify-content:center; padding:0 48px;}
    .input-container{display:flex; align-items:center; gap:11.2px; max-width:800px; width:100%;}
    .heroInput{display:flex; align-items:center; flex:1; border:1px solid var(--stroke); border-radius:800px; padding:0 14.4px; height:46.4px; background:transparent}
    .heroInput input{flex:1; background:transparent; border:0; outline:none; color:var(--ink); font-size:21.6px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:0; min-width:0;}
    .heroInput input::placeholder { color:#a8a8a8; opacity:1; }
    .circleBtn{width:46.4px; height:46.4px; border-radius:999px; border:1px solid var(--stroke); background:transparent; display:grid; place-items:center; cursor:pointer;}
    .circleBtn:hover{background:rgba(255,255,255,0.1);}
    .circleBtn svg{width:33.6px; height:33.6px; fill:var(--ink)}
    
    /* Generate Persona Button Styles */
    #startBtn{background:#fff; border:0px solid #ddd; display:flex; align-items:center; justify-content:center;}
    #startBtn:hover{background:#acacac;}
    #startBtn img{width:40px; height:40px; filter:invert(1); display:block; margin:0; padding:0; border:0;}
  </style>
</head>

<body>
  <div class="screen dashboard">
    <!-- Top Navigation -->
    <div class="top-nav">
      <div class="nav-left">
        <img src="images/favicon.png" alt="Build a Bot Logo" class="nav-logo">
        <a href="index.html">
          <img src="images/library_icon.png" alt="Bot Library" class="nav-icon" title="Bot library">
        </a>
        <!-- <a href="#" id="chatNavIcon">
          <img src="images/chat_icon.png" alt="Chat" class="nav-icon" title="Chat with latest bot">
        </a> -->

      </div>
      <div class="nav-right">
        <span id="userEmail" class="user-email"></span>
        <a href="billing.html" class="nav-icon" title="Billing & Subscription">
          <img src="images/gear_icon.png" alt="Billing" style="width:32px; height:32px;">
        </a>
        <button id="logoutBtn" class="logout-btn" title="Sign out">
          <img src="images/logout_icon.png" alt="Sign out" />
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Page Header -->
      <div class="page-header">
        <h1 class="page-title">Bot Creator</h1>
      </div>

      <!-- Create Form -->
      <div class="create-form" style="flex-direction: column; align-items: center;">
        <div class="input-container" style="display:none;">
          <div id="safetyMsg" style="display:none; color:#ff5252; position:absolute; top:-40px; left:50%; transform:translateX(-50%); text-align:center; font-weight:500; pointer-events:none; z-index:10; width:max-content; max-width:90vw;"></div>
          
          <label class="heroInput" aria-label="Persona prompt" style="flex: 1;">
            <input id="persona" type="text" placeholder="Describe the personality, appearance, or character of the Bot" data-short-placeholder="Describe the bot!" />
          </label>
          <button id="startBtn" class="circleBtn" title="Generate persona">
            <img src="images/creator_icon.png" alt="Generate" />
          </button>
        </div>

        <!-- Mode Chooser -->
        <div id="modeChooser" style="display:flex; justify-content:center; gap:16px; margin-top:16px;">
          <button id="modeOptionsBtn" 
                  style="padding:14px 18px; border:2px solid var(--stroke); background:transparent; color:var(--ink); border-radius:var(--radius-md); font-size:16px; cursor:pointer;">
            Create from options
          </button>
          <button id="modePromptBtn" 
                  style="padding:14px 18px; border:2px solid var(--stroke); background:transparent; color:var(--ink); border-radius:var(--radius-md); font-size:16px; cursor:pointer;">
            I know exactly what I want
          </button>
        </div>

        <!-- Back buttons for each mode -->
        <div id="backPrompt" style="display:none; justify-content:center; margin-top:12px;">
          <button id="backFromPrompt" style="padding:8px 14px; border:1px solid var(--stroke); background:transparent; color:var(--ink); border-radius:10px; font-size:14px; cursor:pointer;">← Back</button>
        </div>
        <div id="backOptions" style="display:none; justify-content:center; margin-top:12px;">
          <button id="backFromOptions" style="padding:8px 14px; border:1px solid var(--stroke); background:transparent; color:var(--ink); border-radius:10px; font-size:14px; cursor:pointer;">← Back</button>
        </div>
        
        <!-- Advanced Options Panel (Expanded Quiz) -->
  <div id="advancedPanel" style="display: none; margin-top: 16px; flex-direction: column; gap: 12px;">
          <!-- Archetype -->
          <div style="display:flex; gap:8px; align-items:center; flex-direction:column;">
            <div style="width:100%; border:1px solid var(--stroke); border-radius:800px; padding:0 14.4px; height:46.4px; display:flex; align-items:center;">
              <select id="archetype" aria-label="Archetype" style="flex:1; background:transparent; border:0; outline:none; color:var(--ink); font-size:16px;">
                <option value="">Archetype (optional)</option>
                <option>Animal</option>
                <option>Mythical</option>
                <option>Machine</option>
                <option>Elemental</option>
                <option>Abstract</option>
                <option value="custom">choose my own/ get specific</option>
              </select>
            </div>
            <div id="archetypeCustomRow" style="display:none; width:100%; margin-top:8px;">
              <label class="heroInput" aria-label="Custom archetype" style="flex:1;">
                <input id="archetypeCustom" type="text" placeholder="Type the archetype (e.g., phoenix, clockwork automaton, sand elemental)" />
              </label>
            </div>
          </div>

          <!-- Vibe / Mood -->
          <div style="display:flex; gap:8px; align-items:center;">
            <div style="flex:1; border:1px solid var(--stroke); border-radius:800px; padding:0 14.4px; height:46.4px; display:flex; align-items:center;">
              <select id="vibe" aria-label="Vibe / Mood" style="flex:1; background:transparent; border:0; outline:none; color:var(--ink); font-size:16px;">
                <option value="">Vibe / Mood (optional)</option>
                <option>mysterious</option>
                <option>radiant</option>
                <option>calm</option>
                <option>fierce</option>
                <option>playful</option>
                <option>dramatic</option>
                <option>cosmic</option>
                <option>serene</option>
              </select>
            </div>
          </div>

          <!-- Era / Setting -->
          <div style="display:flex; gap:8px; align-items:center;">
            <div style="flex:1; border:1px solid var(--stroke); border-radius:800px; padding:0 14.4px; height:46.4px; display:flex; align-items:center;">
              <select id="setting" aria-label="Era / Setting" style="flex:1; background:transparent; border:0; outline:none; color:var(--ink); font-size:16px;">
                <option value="">Era / Setting (optional)</option>
                <option>futuristic</option>
                <option>cyberpunk</option>
                <option>medieval</option>
                <option>post-apocalyptic</option>
                <option>forest</option>
                <option>underwater</option>
                <option>space</option>
              </select>
            </div>
          </div>

          <!-- Color Palette (multi-select up to 3) -->
          <div id="colorsGroup" style="border:1px solid var(--stroke); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px;">
            <div style="font-size:14px; color:#a8a8a8;">Color Palette (pick up to 3)</div>
            <div style="display:flex; flex-wrap:wrap; gap:10px;">
              <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" value="neutral tones"> <span>neutral tones</span></label>
              <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" value="vibrant neon"> <span>vibrant neon</span></label>
              <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" value="pastel"> <span>pastel</span></label>
              <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" value="monochrome"> <span>monochrome</span></label>
              <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" value="warm earth tones"> <span>warm earth tones</span></label>
              <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" value="cool blues"> <span>cool blues</span></label>
              <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" value="sunset gradient"> <span>sunset gradient</span></label>
              <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" value="forest greens"> <span>forest greens</span></label>
            </div>
          </div>

          <!-- Style Choice -->
          <div id="styleChoiceGroup" style="border:1px solid var(--stroke); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px;">
            <div style="font-size:14px; color:#a8a8a8;">Specify the art style</div>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="radio" name="styleChoice" value="default" checked />
              <span>default avatar art</span>
            </label>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="radio" name="styleChoice" value="realistic" />
              <span>realistic</span>
            </label>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="radio" name="styleChoice" value="vector" />
              <span>simplified vector</span>
            </label>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="radio" name="styleChoice" value="fantasy concept art" />
              <span>fantasy concept art</span>
            </label>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="radio" name="styleChoice" value="anime illustration" />
              <span>anime illustration</span>
            </label>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="radio" name="styleChoice" value="pixel art" />
              <span>pixel art</span>
            </label>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="radio" name="styleChoice" value="children's book" />
              <span>children’s book</span>
            </label>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input id="styleChoiceCustom" type="radio" name="styleChoice" value="custom" />
              <span>another style</span>
            </label>
            <div id="customStyleRow" style="display:none; margin-top:4px;">
              <label class="heroInput" aria-label="Custom art style" style="flex:1;">
                <input id="artStyleCustom" type="text" placeholder="Type the art style" />
              </label>
            </div>
            <div style="font-size:12px; color:#8a8a8a; line-height:1.4;">
              a. default avatar art (Square portrait avatar, crisp line art, subtle texture, softly lit, centered, clean edge lighting.)
            </div>
          </div>

          <!-- Band / BookFilm removed -->

          <!-- Personality Traits -->
          <div id="traitsGroup" style="border:1px solid var(--stroke); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px;">
            <div style="font-size:14px; color:#a8a8a8;">Personality Traits</div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="width:90px; text-align:right; font-size:12px; color:#a8a8a8;">Serious</span>
              <input id="traitSeriousPlayful" type="range" min="0" max="100" value="50" style="flex:1;"/>
              <span style="width:90px; font-size:12px; color:#a8a8a8;">Playful</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="width:90px; text-align:right; font-size:12px; color:#a8a8a8;">Introvert</span>
              <input id="traitIntroExtro" type="range" min="0" max="100" value="50" style="flex:1;"/>
              <span style="width:90px; font-size:12px; color:#a8a8a8;">Extrovert</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="width:90px; text-align:right; font-size:12px; color:#a8a8a8;">Gentle</span>
              <input id="traitGentleFierce" type="range" min="0" max="100" value="50" style="flex:1;"/>
              <span style="width:90px; font-size:12px; color:#a8a8a8;">Fierce</span>
            </div>
          </div>
        </div>
        
        <!-- Dynamic Start Button Container (when advanced panel is open) -->
  <div id="dynamicStartContainer" style="display: none; justify-content: center; margin-top: 16px;">
        </div>
      </div>
    </div>
  </div>

  <!-- Freemium utilities -->
  <script type="module" src="freemium-utils.js"></script>
  
  <script type="module">
    // === Supabase Auth ===
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c";
    const supabase = createClient(supabaseUrl, supabaseAnonKey);
    
    // Make supabase available globally for freemium-utils.js
    window.supabase = supabase;

    // Check auth and redirect if not authenticated
    async function checkAuthAndRedirect() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'auth.html';
        return false;
      }
      console.log("User authenticated:", session.user.email);
      
      // Load and display username from profiles table
      await loadUserProfile(session.user);
      return true;
    }

    // Load user profile and display username
    async function loadUserProfile(user) {
      try {
        const { data: profile, error } = await supabase
          .from('profiles')
          .select('display_name')
          .eq('id', user.id)
          .single();

        if (error) {
          console.error('Error loading profile:', error);
          document.getElementById('userEmail').textContent = user.email; // Fallback to email
        } else {
          document.getElementById('userEmail').textContent = profile?.display_name || user.email;
        }
      } catch (error) {
        console.error('Error in loadUserProfile:', error);
        document.getElementById('userEmail').textContent = user.email; // Fallback to email
      }
    }

    // Initialize auth check
    const isAuthenticated = await checkAuthAndRedirect();
    if (!isAuthenticated) {
      // Don't initialize the rest of the app if not authenticated
    } else {
      // Continue with app initialization only if authenticated

      const persona = document.getElementById('persona');
      const startBtn = document.getElementById('startBtn');
      const logoutBtn = document.getElementById('logoutBtn');
  const advancedPanel = document.getElementById('advancedPanel');
  const modeChooser = document.getElementById('modeChooser');
  const modeOptionsBtn = document.getElementById('modeOptionsBtn');
  const modePromptBtn = document.getElementById('modePromptBtn');
  const inputContainer = document.querySelector('.input-container');
  const backPrompt = document.getElementById('backPrompt');
  const backOptions = document.getElementById('backOptions');
  const backFromPrompt = document.getElementById('backFromPrompt');
  const backFromOptions = document.getElementById('backFromOptions');

      // Sign out handler
      logoutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.href = 'auth.html';
      });

      // Chat navigation handler
      const chatNavIcon = document.getElementById("chatNavIcon");
      if (chatNavIcon) {
        chatNavIcon.addEventListener("click", (e) => {
          e.preventDefault();
          const lastAvatarId = localStorage.getItem('lastSelectedAvatar');
          if (lastAvatarId) {
            window.location.href = `chat.html?avatar=${lastAvatarId}`;
          } else {
            alert('Please select an avatar to chat with first!');
          }
        });
      }

      // Watch auth state changes
      supabase.auth.onAuthStateChange((_event, session) => {
        if (!session) {
          window.location.href = 'auth.html';
        }
      });

      // Handle responsive placeholder text
      function updatePlaceholder() {
        if (window.innerWidth <= 600) {
          persona.placeholder = persona.dataset.shortPlaceholder;
        } else {
          persona.placeholder = "Describe the personality, appearance, or character of the Bot";
        }
      }
      window.addEventListener('resize', updatePlaceholder);
      updatePlaceholder();

      persona.addEventListener('keydown', e=>{ if(e.key==='Enter') start(); });
      startBtn.addEventListener('click', start);
      
      // Mode switching: Options vs Prompt
      function showOptionsMode(){
        modeChooser.style.display = 'none';
        advancedPanel.style.display = 'flex';
        document.getElementById('dynamicStartContainer').style.display = 'flex';
        document.getElementById('dynamicStartContainer').appendChild(startBtn);
        inputContainer.style.display = 'none';
        backOptions.style.display = 'flex';
        backPrompt.style.display = 'none';
      }
      function showPromptMode(){
        modeChooser.style.display = 'none';
        advancedPanel.style.display = 'none';
        document.getElementById('dynamicStartContainer').style.display = 'none';
        inputContainer.style.display = 'flex';
        inputContainer.appendChild(startBtn);
        persona.focus();
        backPrompt.style.display = 'flex';
        backOptions.style.display = 'none';
      }
      modeOptionsBtn.addEventListener('click', showOptionsMode);
      modePromptBtn.addEventListener('click', showPromptMode);

      function backToChooser(){
        // Hide both modes
        advancedPanel.style.display = 'none';
        document.getElementById('dynamicStartContainer').style.display = 'none';
        inputContainer.style.display = 'none';
        backPrompt.style.display = 'none';
        backOptions.style.display = 'none';
        // Show chooser
        modeChooser.style.display = 'flex';
        // Park the start button with the input container by default
        inputContainer.appendChild(startBtn);
      }
      backFromPrompt.addEventListener('click', backToChooser);
      backFromOptions.addEventListener('click', backToChooser);

      // Handle art style custom input visibility
      (function initStyleChoiceUI(){
        const radios = Array.from(document.querySelectorAll('input[name="styleChoice"]'));
        const customRow = document.getElementById('customStyleRow');
        const customInput = document.getElementById('artStyleCustom');
        radios.forEach(r=>{
          r.addEventListener('change', ()=>{
            const isCustom = document.querySelector('input[name="styleChoice"]:checked')?.value === 'custom';
            customRow.style.display = isCustom ? 'block' : 'none';
            if (isCustom) customInput?.focus();
          });
        });
      })();

      // Show custom archetype field when selected
      (function initArchetypeCustomUI(){
        const sel = document.getElementById('archetype');
        const row = document.getElementById('archetypeCustomRow');
        const input = document.getElementById('archetypeCustom');
        if (!sel || !row) return;
        const toggle = ()=>{
          const isCustom = sel.value === 'custom';
          row.style.display = isCustom ? 'block' : 'none';
          if (isCustom) input?.focus();
        };
        sel.addEventListener('change', toggle);
        toggle();
      })();

      // Limit color selections to 3
      (function initColorsLimit(){
        const group = document.getElementById('colorsGroup');
        if (!group) return;
        const checkboxes = Array.from(group.querySelectorAll('input[type="checkbox"]'));
        checkboxes.forEach(cb=>{
          cb.addEventListener('change', ()=>{
            const selected = checkboxes.filter(c=>c.checked);
            if (selected.length > 3) {
              cb.checked = false;
            }
          });
        });
      })();

      async function start(){
        const p = persona.value.trim(); 
        if(!p) return;

        // Check if user can create a new bot (freemium limits)
        if (!window.FreemiumUtils) {
          console.error('FreemiumUtils not loaded - continuing without limits');
        } else {
          const canCreateResult = await window.FreemiumUtils.canUserCreateBot(supabase);
          
          if (!canCreateResult.canCreate) {
            // Show upgrade modal
            const plans = await window.FreemiumUtils.getSubscriptionPlans(supabase);
            await window.FreemiumUtils.showUpgradeModal(canCreateResult.subscriptionInfo, plans);
            return;
          }
        }

  // Get values from advanced panel (quiz)
  const archetypeValue = (document.getElementById('archetype')?.value || '').trim();
  const archetypeCustom = (document.getElementById('archetypeCustom')?.value || '').trim();
  const archetype = (archetypeValue === 'custom') ? archetypeCustom : archetypeValue;
        const vibe = (document.getElementById('vibe')?.value || '').trim();
        const setting = (document.getElementById('setting')?.value || '').trim();
        const colors = Array.from(document.querySelectorAll('#colorsGroup input[type="checkbox"]:checked')).map(cb=>cb.value);
  // band/book removed
  const styleChoice = document.querySelector('input[name="styleChoice"]:checked')?.value || 'default';
  const artStyleCustom = (document.getElementById('artStyleCustom')?.value || '').trim();
        const traits = {
          seriousPlayful: Number(document.getElementById('traitSeriousPlayful')?.value || 50),
          introExtro: Number(document.getElementById('traitIntroExtro')?.value || 50),
          gentleFierce: Number(document.getElementById('traitGentleFierce')?.value || 50)
        };

        // Immediately route to edit page and let it handle generation + save with a loading spinner
        const payload = { 
          prompt: p, 
          archetype, vibe, setting, colors,
          styleChoice, artStyleCustom,
          traits
        };
        try {
          localStorage.setItem('pendingCreate', JSON.stringify(payload));
        } catch(_) {}
        window.location.href = 'edit.html?new=1';
        return;

  // (Unreached due to early return) Disable form while processing
  persona.disabled = true;
  startBtn.disabled = true;
  startBtn.innerHTML = loader();

        try {
          // ===== Generate avatar via API =====
          const res = await fetch('/api/generate-avatar', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ 
              prompt: p,
              archetype, vibe, setting, colors,
              styleChoice, artStyleCustom,
              traits
            })
          });

          const json = await res.json().catch(() => ({}));
          if (!res.ok || !json?.dataUrl) {
            console.error('Avatar API error:', json);
            // Show error message
            let msg = document.getElementById('safetyMsg');
            if (msg) {
              msg.textContent = 'Content blocked by safety system. Avoid copyrighted, controversial, or explicit characters!';
              msg.style.display = 'block';
              // Hide after 6 seconds
              setTimeout(() => { msg.style.display = 'none'; }, 6000);
            }
            return;
          }

          // Remove safety message if present
          let msg = document.getElementById('safetyMsg');
          if (msg) msg.style.display = 'none';

          // Upload avatar image to Supabase and save it
          const { data: { user } } = await supabase.auth.getUser();
          if (user) {
            const finalBotName = json.botName || p;
            const url = await uploadAvatarImage({ dataUrl: json.dataUrl, userId: user.id, fileName: `${finalBotName}.png` });
            
            // Save avatar to database
            const { data: avatarData, error: avatarError } = await supabase
              .from('avatars')
              .insert({
                user_id: user.id,
                name: finalBotName,
                image_url: url,
                traits: {
                  original_prompt: p,
                  art_style: json.artStyle,
                  personality_prompt: json.personalityPrompt,
                  ...(json.traits || {})
                },
              })
              .select()
              .single();
              
            if (avatarError) {
              console.error('Error saving avatar:', avatarError);
              throw avatarError;
            }
            
            console.log('✅ Avatar created successfully:', avatarData);
            
            // Store the new avatar ID for future navigation
            localStorage.setItem('lastSelectedAvatar', avatarData.id);
            localStorage.setItem('lastGeneratedAvatar', avatarData.id);
            
            console.log('🔄 Redirecting to edit page with avatar ID:', avatarData.id);
            
            // Add a small delay to ensure database consistency
            setTimeout(() => {
              console.log('🔄 Executing redirect now...');
              window.location.href = `edit.html?avatar=${avatarData.id}`;
            }, 100);
          }

        } catch (err) {
          console.error('❌ Avatar creation failed:', err);
          console.error('❌ Error details:', {
            message: err.message,
            stack: err.stack
          });
          let msg = document.getElementById('safetyMsg');
          if (msg) {
            msg.textContent = 'Avatar creation failed. Please try again.';
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 4000);
          }
        } finally {
          // Re-enable form
          persona.disabled = false;
          startBtn.disabled = false;
          startBtn.innerHTML = '<img src="images/creator_icon.png" alt="Generate" style="width: 32px; height: 32px;" />';
          persona.focus();
        }
      }

      function loader(){
        return `<div style="width:24px;height:24px;border:2px solid #333;border-top:2px solid #fff;border-radius:50%;animation:spin 60s linear infinite;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>`;
      }

      // --- Supabase Upload Helper ---
      function dataUrlToBlob(dataUrl){
        const [meta, b64] = dataUrl.split(",");
        const mime = meta.match(/data:(.*?);base64/)[1] || "image/png";
        const bin = atob(b64), len = bin.length;
        const bytes = new Uint8Array(len);
        for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }

      async function uploadAvatarImage({ dataUrl, userId, fileName="avatar.png" }){
        try {
          const blob = dataUrlToBlob(dataUrl);
          const path = `${userId}/${crypto.randomUUID()}-${fileName}`;
          
          // Upload the file
          const { error: upErr } = await supabase.storage.from("avatars")
            .upload(path, blob, { 
              upsert: true, 
              contentType: blob.type,
              cacheControl: '3600'
            });
          if (upErr) throw upErr;
          
          // Get the public URL
          const { data } = supabase.storage.from("avatars")
            .getPublicUrl(path, {
              download: false,
              transform: {
                width: 333,
                height: 333,
                resize: 'cover'
              }
            });
            
          // Ensure the URL is using HTTPS
          const url = new URL(data.publicUrl);
          url.protocol = 'https:';
          return url.toString();
        } catch (err) {
          console.error('Error in uploadAvatarImage:', err);
          throw err;
        }
      }

  // Start with chooser visible; focus will be set when a mode is selected

    } // End of authenticated check
  </script>
