<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeaea — Create</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>
  /* Advanced Panel Styling - Match input-container exactly */
  #advancedPanel {
    width: 100%;
    max-width: 395px; /* Global cap for advanced panel */
  }
  /* Ensure children don't overflow the panel width */
  #advancedPanel > * { max-width: 100%; }
  
  /* Ensure advanced panel heroInput elements don't get responsive sizing */
  #advancedPanel .heroInput {
    width: 100% !important;
  }
  
  @media (max-width: 900px) {
    .heroInput {
      width: min(400.69px, calc(56vw - 32px));
    }
    /* Override responsive sizing for advanced panel inputs */
    #advancedPanel .heroInput {
      width: 100% !important;
    }
  }
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @media (max-width: 600px) {
      #persona::placeholder {
        content: "Create avatar...";
      }
      .user-email {
        display: none;
      }
      .logout-btn {
        display: none !important;
      }
    }
    :root{
      --bg:#000;
      --ink:#fff;
      --muted:#d9d9d9;
      --bubble:#333;
      --stroke:#fff;
      --radius-lg:24px;
      --radius-md:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial}

    .screen{min-height:100dvh; width:100%;}

    /* ===== Dashboard ===== */
    .dashboard{padding:0; min-height:100dvh;}
    
    /* Top Navigation */
    .top-nav{display:flex; justify-content:space-between; align-items:center; padding:12px 48px 4px 48px;}
    .nav-left{display:flex; align-items:center; gap:24px;}
    .nav-logo{height:48px; width:auto;}
    .nav-icon{height:32px; width:auto; transition:transform 0.2s ease; cursor:pointer; opacity:1;}
    .nav-icon:hover{transform:scale(1.1);}
    .nav-right{display:flex; gap:16px; align-items:center;}
    .user-email{color:var(--ink); font-size:16px;}
  .logout-btn{padding:8px; border:none; background:transparent; color:var(--ink); border-radius:8px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition: background-color 0.2s ease;}
  .logout-btn:hover{background:rgba(255,255,255,0.1);}    
    .logout-btn img{width:36px; height:36px;}

    /* Main Content */
  .main-content{padding-top:12px; max-width:1200px; margin:0 auto;}
    
    /* Page Title */
    .page-header{display:flex; align-items:center; gap:0px; margin-top:11px; margin-bottom:0px; justify-content:center;}
    .page-icon{height:40px; width:auto;}
    .page-title{font-size:24px; font-weight:600; margin:0;}

    /* Tab Navigation */
    .tab-nav{display:flex; gap:8px; justify-content:center; margin:24px auto; padding:4px; background:#000000; border-radius:800px; width:fit-content; max-width:95%; border:1px solid rgba(255,255,255,0.4);}
    .tab-btn{padding:10px 22px; border:none; background:transparent; color:var(--muted); border-radius:800px; cursor:pointer; font-size:14px; font-weight:500; transition:all 0.3s ease; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;}
    .tab-btn:hover{background:rgba(255,255,255,0.05);}
    .tab-btn.active{background:var(--bg); color:var(--ink); font-weight:600; border:1px solid rgba(255,255,255,.6);}
    .tab-content{display:none;}
    .tab-content.active{display:flex; flex-direction:column; gap:12px;}

    /* Responsive tab navigation */
    @media (max-width: 600px) {
      .tab-nav{gap:4px; padding:3px; max-width:98%;}
      .tab-btn{padding:8px 16px; font-size:13px;}
    }
    @media (max-width: 450px) {
      .tab-nav{gap:3px; padding:2px;}
      .tab-btn{padding:8px 12px; font-size:12px;}
    }

    /* Create Form */
    .create-form{display:flex; justify-content:center; padding:0 24px;}
    .input-container{display:flex; align-items:center; gap:11.2px; max-width:800px; width:100%;}
    .heroInput{display:flex; align-items:center; flex:1; border:1px solid var(--stroke); border-radius:800px; padding:0 14.4px; height:46.4px; background:transparent}
    .heroInput input{flex:1; background:transparent; border:0; outline:none; color:var(--ink); font-size:21.6px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:0; min-width:0;}
    .heroInput input::placeholder { color:#a8a8a8; opacity:1; }
    .trait-row {
      display:grid;
      grid-template-columns:minmax(0, 90px) 1fr minmax(0, 90px);
      align-items:center;
      gap:8px;
      width:100%;
    }
    .trait-row .trait-label {
      font-size:12px;
      color:#ffffff;
      white-space:nowrap;
    }
    .trait-row .trait-label.left {
      text-align:right;
      justify-self:end;
    }
    .trait-row .trait-label.right {
      text-align:left;
      justify-self:start;
    }
    .trait-row .personality-slider {
      width:100%;
      min-width:0;
    }
    /* Personality sliders use a custom track so both sides stay white */
    input[type="range"].personality-slider {
      --slider-thumb-color:#fff;
      --slider-thumb-outline:rgba(0,0,0,0.35);
      -webkit-appearance:none;
      appearance:none;
      width:100%;
      height:2px;
      background:#ffffff;
      border-radius:0;
      outline:none;
    }
    input[type="range"].personality-slider::-webkit-slider-runnable-track {
      background:#ffffff;
      border:none;
      height:2px;
      border-radius:0;
    }
    input[type="range"].personality-slider::-webkit-slider-thumb {
      -webkit-appearance:none;
      appearance:none;
      width:24px;
      height:24px;
      border-radius:50%;
      background:#000000;
      border:2px solid var(--slider-thumb-color);
      margin-top:-11px;
      cursor:pointer;
    }
    input[type="range"].personality-slider::-moz-range-track {
      background:#ffffff;
      border:none;
      height:2px;
      border-radius:0;
    }
    input[type="range"].personality-slider::-moz-range-progress {
      background:#ffffff;
      border:none;
      height:2px;
      border-radius:0;
    }
    input[type="range"].personality-slider::-moz-range-thumb {
      appearance:none;
      width:24px;
      height:24px;
      border-radius:50%;
      background:#000000;
      border:2px solid var(--slider-thumb-color);
      cursor:pointer;
    }
    @media (max-width: 540px) {
      .trait-row {
        grid-template-columns:minmax(0, 70px) 1fr minmax(0, 70px);
        gap:6px;
      }
      .trait-row .trait-label {
        font-size:11px;
        white-space:normal;
      }
    }
    .circleBtn{width:46.4px; height:46.4px; border-radius:999px; border:1px solid var(--stroke); background:transparent; display:grid; place-items:center; cursor:pointer;}
    .circleBtn:hover{background:rgba(255,255,255,0.1);}
    .circleBtn svg{width:33.6px; height:33.6px; fill:var(--ink)}
    
    /* Generate Bot Button Styles */
    #startBtn{
      background:#fff;
      color:#000;
      border:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:14px 10px;
      height:auto;
      min-width:220px;
      border-radius:999px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 0 0 rgba(255,0,128,0);
      animation: neonGlow 3.2s ease-in-out infinite;
      will-change: transform, box-shadow;
      transition: transform 0.15s ease-in-out, box-shadow 0.3s ease;
      margin-bottom:6px;
    }
    #startBtn:hover{
      transform: translateY(-2px) scale(1.02);
      box-shadow:0 4px 16px rgba(255,255,255,0.12);
    }
    #startBtn:active{
      transform:translateY(0) scale(1);
    }
    @keyframes neonGlow{
      0% { box-shadow: 0 0 0 rgba(255,0,128,0); }
      10%{ box-shadow: 0 0 10px rgba(255,0,128,0.45), 0 0 20px rgba(255,0,128,0.25); }
      25%{ box-shadow: 0 0 12px rgba(255,153,0,0.55), 0 0 24px rgba(255,153,0,0.30); }
      40%{ box-shadow: 0 0 14px rgba(255,255,0,0.55), 0 0 26px rgba(255,255,0,0.30); }
      55%{ box-shadow: 0 0 14px rgba(0,255,170,0.55), 0 0 26px rgba(0,255,170,0.30); }
      70%{ box-shadow: 0 0 14px rgba(0,153,255,0.55), 0 0 26px rgba(0,153,255,0.30); }
      85%{ box-shadow: 0 0 14px rgba(170,0,255,0.55), 0 0 26px rgba(170,0,255,0.30); }
      100%{ box-shadow: 0 0 0 rgba(255,0,128,0); }
    }

    /* Regenerate button animation (match standard hover scale/translate) */

    /* Field heading labels */
    .field-heading{
      color:#a8a8a8;
      font-style:italic;
      text-align:left;
      align-self:flex-start;
      width:100%;
      font-size:14px;
  margin:12px 0 2px 0;
  display:flex;
  align-items:center;
  gap:6px;
    }
    /* Ensure headings within Art Settings align to the 395px column */
    #artSettingsContainer .field-heading{
      width:min(100%, 395px);
      align-self:center;
    }
  .field-heading img.icon{
    width:18px;
    height:18px;
    opacity:0.95;
    display:inline-block;
    vertical-align:middle;
  }
    #suggestionDesc{
      scrollbar-color: transparent transparent;
    }
    #suggestionDesc::-webkit-scrollbar{
      width: 8px;
      background: transparent;
    }
    #suggestionDesc::-webkit-scrollbar-track{
      background: transparent;
    }
    #suggestionDesc::-webkit-scrollbar-thumb{
      background: transparent;
    }

    /* Checkbox Styling - Better visibility on all devices */
    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #ffffff;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }
    input[type="checkbox"]:checked {
      background: #ffffff;
      border-color: #ffffff;
    }
    input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1px;
      width: 5px;
      height: 10px;
      border: solid #000000;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    input[type="checkbox"]:hover {
      border-color: #cccccc;
    }

    /* Random Suggestion Buttons */
    #randomSuggestionBtns {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: -15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    #randomSuggestionBtns button:not(#undoTypeBtn) {
      width: 140px;
      padding: 8px 12px;
      border: 1px solid #d3d3d3;
      background: #000000;
      color: #ffffff;
      border-radius: 800px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #randomSuggestionBtns button:not(#undoTypeBtn):hover {
      background: #1a1a1a;
      transform: scale(1.05);
    }
    #randomSuggestionBtns button:not(#undoTypeBtn):active {
      transform: scale(1);
    }
    #randomSuggestionBtns button:not(#undoTypeBtn):disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

  </style>
</head>

<body>
  <div class="screen dashboard">

    <!-- Main Content -->
    <div class="main-content">

      <div class="page-header" style="justify-content:space-between; padding:0 48px; max-width:400px; margin:0 auto;">
        <button id="backToLibrary" title="Back to library" aria-label="Back to library" style="background:transparent; border:none; padding:0; display:flex; align-items:center; justify-content:center; margin-left:-40px;" onclick="window.location.href='index.html'">
          <img src="images/back_icon.png" alt="Back" class="nav-icon" />
        </button>
        <h1 class="page-title">AI Creator</h1>
        <button id="randomizeBtn" title="Randomize all fields" style="background:transparent; border:none; padding:0; display:flex; align-items:center; justify-content:center; margin-right:-40px;">
          <img src="images/dice_icon.png" alt="Randomize" class="nav-icon" />
        </button>
      </div>

      <!-- Create Form -->
      <div class="create-form" style="flex-direction: column; align-items: center;">
        <div class="input-container" style="display:none;">
          <div id="safetyMsg" style="display:none; color:#ff5252; position:absolute; top:-40px; left:50%; transform:translateX(-50%); text-align:center; font-weight:500; pointer-events:none; z-index:10; width:max-content; max-width:90vw;"></div>
          
          <label class="heroInput" aria-label="Persona prompt" style="flex: 1; display: none;">
            <input id="persona" type="text" placeholder="Describe the personality, appearance, or character of the Agent" data-short-placeholder="Describe the agent!" style="display: none;" />
          </label>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
          <button class="tab-btn active" data-tab="personality">Personality</button>
          <button class="tab-btn" data-tab="appearance">Appearance</button>
          <button class="tab-btn" data-tab="art">Art Options</button>
        </div>
        
    <!-- Advanced Options Panel (Final Simplified Quiz) -->
  <div id="advancedPanel" style="display: none; margin-top: 0px; flex-direction: column; gap: 12px;">
          
          <!-- Personality Tab Content -->
          <div id="personalityTab" class="tab-content active">
            <div id="personalityHeading" class="field-heading">Define Personality with sliders</div>
            <div id="traitsGroup" style="border:0px solid var(--stroke); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:16px;">
              <div class="trait-row">
                <span class="trait-label left">Serious</span>
                <input id="traitSeriousPlayful" class="personality-slider" type="range" min="1" max="10" step="1" value="5" />
                <span class="trait-label right">Playful</span>
              </div>
              <div class="trait-row">
                <span class="trait-label left">Succinct</span>
                <input id="traitSuccinctChatty" class="personality-slider" type="range" min="1" max="10" step="1" value="5" />
                <span class="trait-label right">Talkative</span>
              </div>
              <div class="trait-row">
                <span class="trait-label left">Rational</span>
                <input id="traitRationalIntuitive" class="personality-slider" type="range" min="1" max="10" step="1" value="5" />
                <span class="trait-label right">Intuitive</span>
              </div>
              <div class="trait-row">
                <span class="trait-label left">Practical</span>
                <input id="traitPracticalImaginative" class="personality-slider" type="range" min="1" max="10" step="1" value="5" />
                <span class="trait-label right">Imaginative</span>
              </div>
            </div>
            
            <!-- Navigation Button for Personality Tab -->
            <div style="width:100%; display:flex; justify-content:center; margin-top:20px; padding-bottom:6px;">
              <button id="goToAppearanceBtn" style="display:flex; width:46px; height:46px; padding:10px; border:1px solid #d3d3d3; background:#000000; border-radius:50%; cursor:pointer; justify-content:center; align-items:center; transition:all 0.2s ease;" onmouseover="this.style.background='#1a1a1a'; this.style.transform='scale(1.05)'" onmouseout="this.style.background='#000000'; this.style.transform='scale(1)'">
                <img src="images/next_icon.png" alt="→" style="width:100%; height:100%; object-fit:contain;" />
              </button>
            </div>
          </div>

          <!-- Appearance Tab Content -->
          <div id="appearanceTab" class="tab-content">
            <!-- Type field - visible on load -->
            <div style="width:min(100%, 395px);">
              <div class="field-heading" style="margin-bottom:8px;">Define Appearance <img class="icon" src="images/pencil_icon.png" alt="edit" /></div>
              <div style="width:100%; margin:0; display:flex; gap:8px; align-items:center;">
                <button id="undoTypeBtn" title="Undo last type" style="width:46px !important; height:46px; padding:8px !important; border:1px solid #d3d3d3; background:rgba(255,255,255,0.1); border-radius:50%; cursor:pointer; display:none; flex-shrink:0; transition:all 0.2s ease;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">
                  <img src="images/undo_icon.png" alt="Undo" style="width:100%; height:100%; display:block;">
                </button>
                <textarea id="suggestionType" placeholder="Enter your own or use suggestions below" rows="1" style="flex:1; background:transparent; border:1px solid #d3d3d3; color:#cfcfcf; border-radius:24.5px; padding:11px 14px; font-size:16px; line-height:1.35; height:auto; min-height:46px; box-sizing:border-box; resize:none; overflow:hidden; font-family: Arial, Helvetica, sans-serif;"></textarea>
                <button id="randomizeTypeBtn" title="Randomize appearance" style="width:46px !important; height:46px; padding:10px !important; border:1px solid #d3d3d3; background:#000000; border-radius:50%; cursor:pointer; flex-shrink:0; transition:all 0.2s ease;" onmouseover="this.style.background='#1a1a1a'; this.style.transform='scale(1.05)'" onmouseout="this.style.background='#000000'; this.style.transform='scale(1)'">
                  <img src="images/dice_icon.png" alt="Randomize" style="width:100%; height:100%; display:block;">
                </button>
              </div>
            </div>

            <!-- Suggest from personality checkbox -->
            <div style="display:flex; justify-content:center; margin-top:0px; margin-bottom:12px; padding-left:4px;">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:#ffffff; font-size:12px;">
                <input type="checkbox" id="suggestFromPersonalityCheckbox" checked />
                <span>Base Suggestions on Personality</span>
              </label>
            </div>

            <!-- Random suggestion buttons -->
            <div id="randomSuggestionBtns">
              <button id="addRandomSciFiBtn">+ Sci-Fi</button>
              <button id="addRandomAnimalBtn">+ Animal</button>
              <button id="addRandomRoleBtn">+ Role</button>
            </div>
            
            <!-- Navigation Button for Appearance Tab -->
            <div style="width:100%; display:flex; justify-content:center; margin-top:20px; padding-bottom:6px;">
              <button id="goToArtOptionsBtn" style="display:flex; width:46px; height:46px; padding:10px; border:1px solid #d3d3d3; background:#000000; border-radius:50%; cursor:pointer; justify-content:center; align-items:center; transition:all 0.2s ease;" onmouseover="this.style.background='#1a1a1a'; this.style.transform='scale(1.05)'" onmouseout="this.style.background='#000000'; this.style.transform='scale(1)'">
                <img src="images/next_icon.png" alt="→" style="width:100%; height:100%; object-fit:contain;" />
              </button>
            </div>
          </div>

          <!-- Art Options Tab Content -->
          <div id="artTab" class="tab-content">
            <!-- Style Choice -->
            <div style="width:min(100%, 395px);">
              <div class="field-heading">Choose art style</div>
              <div id="styleChoiceGroup" style="border:0; border-radius:14px; padding:0; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%;">
                <div style="width:100%; border:1px solid var(--stroke); border-radius:800px; padding:0 14.4px; height:46.4px; display:flex; align-items:center;">
                  <select id="styleChoice" aria-label="Art style" style="flex:1; background:transparent; border:0; outline:none; color:var(--ink); font-size:16px;">

                    <option value="default"> Modern Illustration</option>
                    <option value="realistic">Photo Realistic</option>
                    <option value="vector">Simplified Vector</option>
                    <option value="anime">Anime</option>
                    <option value="impressionistic">Impressionism</option>
                    <option value="custom">Another Style (Enter Your Own)</option>
                  </select>
                </div>
                <div id="customStyleRow" style="display:none; width:100%;">
                  <label class="heroInput" aria-label="Custom art style" style="flex:1; width:100%;">
                    <input id="artStyleCustom" type="text" placeholder="Type the art style" style="width:100%;" />
                  </label>
                </div>
              </div>
            </div>

            <!-- Vibe / Mood -->
            <div style="width:min(100%, 395px);">
              <div class="field-heading">Select art vibe / mood</div>
              <div id="vibeGroup" style="border:0; border-radius:14px; padding:0; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%;">
                <div style="width:100%; border:1px solid var(--stroke); border-radius:800px; padding:0 14.4px; height:46.4px; display:flex; align-items:center;">
                  <select id="vibeChoice" aria-label="Vibe / mood" style="flex:1; background:transparent; border:0; outline:none; color:var(--ink); font-size:16px;">
                    <option value="default">Neutral</option>
                    <option value="radiant">Radiant</option>
                    <option value="calming">Calming</option>
                    <option value="dramatic">Dramatic</option>
                    <option value="serene">Serene</option>
                    <option value="mysterious">Mysterious</option>
                    <option value="energetic">Energetic</option>
                    <option value="dreamlike">Dreamlike</option>
                    <option value="custom">Another (Enter your own)</option>
                  </select>
                </div>
                <div id="customVibeRow" style="display:none; width:100%;">
                  <label class="heroInput" aria-label="Custom vibe" style="flex:1; width:100%;">
                    <input id="vibeCustom" type="text" placeholder="Type the vibe / mood" style="width:100%;" />
                  </label>
                </div>
              </div>
            </div>
            
            <!-- Generate Agent Button - Only on Art Options Tab -->
            <div style="width:100%; display:flex; justify-content:center; margin-top:20px; padding-bottom:6px;">
              <button id="startBtn" style="display:flex; width:250px; padding:14px; border:1px solid var(--stroke); background:#ffffff; color:#000000; border-radius:800px; font-size:16px; font-weight:600; cursor:pointer; justify-content:center; align-items:center;">
                Generate Agent!
              </button>
            </div>
          </div>

          <!-- Hidden fields for compatibility -->
          <input type="hidden" id="archetypeSpecific" />
          <input type="hidden" id="archetypeSpecificDesc" />
          <textarea id="suggestionName" style="display:none;"></textarea>
          <textarea id="suggestionDesc" style="display:none;"></textarea>

          <!-- Primary Use removed -->

          <!-- Band / BookFilm removed -->


          <!-- Additional Details removed -->
        </div>
      </div>
    </div>
  </div>

  <!-- Freemium utilities -->
  <script type="module" src="freemium-utils.js"></script>
  
  <script type="module">
    // === Supabase Auth ===

        // Three add random buttons
        if (addRandomSciFiBtn) {
          addRandomSciFiBtn.addEventListener('click', () => {
            addRandomFromCategory('sci-fi / fantasy', addRandomSciFiBtn, '+ Sci-Fi');
          });
        }
        if (addRandomAnimalBtn) {
          addRandomAnimalBtn.addEventListener('click', () => {
            addRandomFromCategory('animal', addRandomAnimalBtn, '+ Animal');
          });
        }
        if (addRandomRoleBtn) {
          addRandomRoleBtn.addEventListener('click', () => {
            addRandomFromCategory('human', addRandomRoleBtn, '+ Role');
          });
        }
        
        // Randomize type button - randomly clicks two of the above buttons
        const randomizeTypeBtn = document.getElementById('randomizeTypeBtn');
        if (randomizeTypeBtn) {
          randomizeTypeBtn.addEventListener('click', async () => {
            // Clear the suggestion type field first
            if (suggestionTypeEl) {
              suggestionTypeEl.value = '';
            }
            hasRandomSelections = false; // Reset the flag
            
            // Randomly pick 2 buttons
            const randomButtons = [
              addRandomSciFiBtn,
              addRandomAnimalBtn,
              addRandomRoleBtn
            ].filter(btn => btn && !btn.disabled);
            
            if (randomButtons.length >= 2) {
              // Shuffle and pick 2
              const shuffled = randomButtons.sort(() => Math.random() - 0.5);
              const [btn1, btn2] = shuffled.slice(0, 2);
              
              // Click first button
              if (btn1) {
                btn1.click();
                // Wait a bit for first to complete, then click second
                await new Promise(resolve => setTimeout(resolve, 500));
                if (btn2) {
                  btn2.click();
                }
              }
            }
          });
        }
        
        // Undo button - removes last type append
        if (undoTypeBtn) {
          undoTypeBtn.addEventListener('click', ()=>{
            if (!suggestionTypeEl) return;
            const currentValue = suggestionTypeEl.value.trim();
            
            if (!currentValue.includes(' + ')) {
              // If there's no "+", this is the first/only selection - clear it
              suggestionTypeEl.value = '';
              autosizeSuggestionType();
              if (archetypeSpecificInput) {
                archetypeSpecificInput.value = '';
              }
              hasRandomSelections = false; // Reset the flag
              hideUndoBtn();
              return;
            }
            
            // Remove the last " + [type]" segment
            const parts = currentValue.split(' + ');
            if (parts.length > 1) {
              parts.pop(); // Remove last item
              const newValue = parts.join(' + ');
              suggestionTypeEl.value = newValue;
              autosizeSuggestionType();
              
              // Sync archetypeSpecific
              if (archetypeSpecificInput) {
                archetypeSpecificInput.value = newValue;
              }
              
              // Update undo button state
              updateUndoBtnState();
            }
          });
        }
        
        // Regeneration handled via generate button

        const toggle = ()=>{
          const val = sel.value;
          const isCustom = val === 'custom';
          const autoShowArt = shouldAutoShowArtSettings(val);
          row.style.display = 'none';
          updateGenerateState();
          if (genBtn) {
            genBtn.textContent = 'Get suggestion from Base and Personality';
          }
          // Show sliders only when a base archetype is set (any non-empty selection)
          if (traitsGroup) traitsGroup.style.display = val ? 'flex' : 'none';
          const personalityHeading = document.getElementById('personalityHeading');
          if (personalityHeading) personalityHeading.style.display = val ? 'block' : 'none';
          
          if (!isCustom){
            // reset suggestion UI when category changes
            if (suggestionBox) {
              suggestionBox.style.display = autoShowArt ? 'block' : 'none';
            }
            if (suggestionNameEl) {
              suggestionNameEl.value = '';
              autosizeSuggestionName();
            }
            if (suggestionTypeEl) {
              suggestionTypeEl.value = '';
              autosizeSuggestionType();
            }
            if (suggestionDescEl) {
              suggestionDescEl.value = '';
              autosizeSuggestionDesc();
            }
            document.getElementById('archetypeSpecific').value = '';
            document.getElementById('archetypeSpecificDesc').value = '';
            hideUndoBtn();
            
            let startShouldShow = false;
            if (autoShowArt) {
              openArtSettingsPanel({ ensureStart: true });
              startShouldShow = true;
            } else {
              collapseArtSettingsPanel();
              if (artSettingsBtn) artSettingsBtn.style.display = val ? 'inline-block' : 'none';
            }

            if (startBtn) {
              startBtn.style.display = startShouldShow ? 'flex' : 'none';
              startBtn.disabled = false;
            }

            if (genBtn) {
              if (val) {
                genBtn.style.display = 'inline-block';
              } else {
                genBtn.style.display = 'none';
              }
            }
            hideAddRandomBtns();
          } else {
            if (suggestionBox) {
              suggestionBox.style.display = 'block';
            }
            if (suggestionNameEl) {
              suggestionNameEl.value = '';
              autosizeSuggestionName();
            }
            if (suggestionDescEl) {
              suggestionDescEl.value = '';
              autosizeSuggestionDesc();
            }
            if (archetypeSpecificInput) archetypeSpecificInput.value = '';
            if (archetypeSpecificDesc) archetypeSpecificDesc.value = '';
            if (genBtn) {
              genBtn.style.display = 'none';
            }
            openArtSettingsPanel({ ensureStart: true });
            if (startBtn) {
              startBtn.style.display = 'flex';
              startBtn.disabled = false;
            }
          }
        };
        // Archetype dropdown removed - no longer need this toggle
        // if (!sel || !row) return;
        // sel.addEventListener('change', toggle);
        // toggle();
      })();

  // Primary Use removed

      async function start(){
        const isOptionsMode = advancedPanel.style.display === 'flex';
        let p = persona.value.trim();
        if (!p && !isOptionsMode) return;

        // Check if user can create a new agent (freemium limits)
        if (!window.FreemiumUtils) {
          console.error('FreemiumUtils not loaded - continuing without limits');
        } else {
          const canCreateResult = await window.FreemiumUtils.canUserCreateBot(supabase);
          
          if (!canCreateResult.canCreate) {
            const plans = await window.FreemiumUtils.getSubscriptionPlans(supabase);
            await window.FreemiumUtils.showUpgradeModal(canCreateResult.subscriptionInfo, plans);
            return;
          }
        }

        // Get values from advanced panel
        const archetypeSpecificInputEl = document.getElementById('archetypeSpecific');
        const archetypeSpecificDescEl = document.getElementById('archetypeSpecificDesc');
        const suggestionNameInput = document.getElementById('suggestionName');
        const suggestionDescInput = document.getElementById('suggestionDesc');
        if (suggestionNameInput && archetypeSpecificInputEl) {
          const nameVal = suggestionNameInput.value.trim();
          if (nameVal) {
            archetypeSpecificInputEl.value = nameVal;
          }
        }
        if (suggestionDescInput && archetypeSpecificDescEl) {
          const descVal = suggestionDescInput.value.trim();
          if (descVal) {
            archetypeSpecificDescEl.value = descVal;
          }
        }
        let archetypeSpecific = (archetypeSpecificInputEl?.value || '').trim();
        let archetypeSpecificDesc = (archetypeSpecificDescEl?.value || '').trim();
        if (!archetypeSpecific && suggestionNameInput) {
          archetypeSpecific = suggestionNameInput.value.trim();
        }
        if (!archetypeSpecificDesc && suggestionDescInput) {
          archetypeSpecificDesc = suggestionDescInput.value.trim();
        }

        // Get vibe and traits early (needed for hologram generation)
        const vibeSelectEl = document.getElementById('vibeChoice');
        const vibeChoice = vibeSelectEl ? vibeSelectEl.value : '';
        const vibeCustom = (document.getElementById('vibeCustom')?.value || '').trim();
        let vibe = (vibeChoice === 'custom') ? vibeCustom : vibeChoice;
        // Send null if default is selected for vibe
        if (vibe === 'default') vibe = null;
        const styleChoiceRaw = document.getElementById('styleChoice')?.value || 'default';
        // Send null if default is selected, otherwise send the actual value
        const styleChoice = (styleChoiceRaw === 'default') ? null : styleChoiceRaw;
        const artStyleCustom = (document.getElementById('artStyleCustom')?.value || '').trim();
        
        function scale10To100(v){
          const n = Number(v || 5);
          // Map 1..10 -> 0..100 in 10 steps (1->0, 10->100)
          return Math.round(((n - 1) / 9) * 100);
        }
        const traits = {
          seriousPlayful: scale10To100(document.getElementById('traitSeriousPlayful')?.value),
          succinctChatty: scale10To100(document.getElementById('traitSuccinctChatty')?.value),
          rationalIntuitive: scale10To100(document.getElementById('traitRationalIntuitive')?.value),
          practicalImaginative: scale10To100(document.getElementById('traitPracticalImaginative')?.value)
        };

        // Check if hologram (AI Hologram) style is selected
        const useHologram = (styleChoiceRaw === 'hologram');
        
        // Set archetype based on hologram mode
        const archetype = useHologram ? 'abstract' : null;
        
        // If hologram mode, generate abstract description
        let hologramDescription = '';
        if (useHologram) {
          // Call the suggest-abstract API to generate hologram description
          try {
            const response = await fetch('/api/suggest-abstract', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                sliders: traits,
                vibe: vibe || undefined
              })
            });
            
            if (response.ok) {
              const data = await response.json();
              hologramDescription = data.description || '';
              
              // Optionally use the typeValue to customize the description
              const typeValue = archetypeSpecific || 'abstract form';
              if (typeValue && typeValue !== 'abstract form') {
                // Replace "abstract figure" with "abstract [typeValue] figure"
                hologramDescription = hologramDescription.replace(
                  'Centered abstract figure',
                  `Centered abstract ${typeValue} figure`
                );
              }
            } else {
              console.error('Failed to fetch abstract description:', response.status);
              // Fallback to a basic description if API fails
              hologramDescription = 'Centered abstract figure drawn as luminous lines on a pure black background.';
            }
          } catch (error) {
            console.error('Error calling suggest-abstract API:', error);
            // Fallback to a basic description if API call fails
            hologramDescription = 'Centered abstract figure drawn as luminous lines on a pure black background.';
          }
        }

        if (!p && !isOptionsMode) return;

        // If archetypeSpecific is blank and we're in hologram mode, use a default
        if (!archetypeSpecific && useHologram) {
          archetypeSpecific = 'humanoid form';
        }

        // Immediately route to edit page and let it handle generation + save with a loading spinner
        const resolvedName = archetypeSpecific || archetype || 'New Avatar';

        // Build the prompt based on style
        let finalPrompt = '';
        if (useHologram && hologramDescription) {
          // Hologram mode: use abstract description
          finalPrompt = `Abstract avatar art: ${hologramDescription}\n\nRepresenting: ${archetypeSpecific || archetype || 'abstract form'}`;
        } else {
          // Non-hologram mode: build prompt from archetypeSpecific
          const basePrompt = 'Square portrait avatar, crisp line art, subtle texture, softly lit, centered, clean edge lighting.';
          const personaText = archetypeSpecific || archetypeSpecificDesc || 'humanoid character';
          finalPrompt = `${basePrompt} Persona: ${personaText}`;
          
          // Add style if not default
          if (styleChoice && styleChoice !== 'default') {
            const styleMap = {
              realistic: 'Photo realistic portrait style',
              vector: 'Simplified vector art style',
              anime: 'Anime illustration style',
              impressionistic: 'Impressionistic painting style'
            };
            const styleText = styleMap[styleChoice] || styleChoice;
            finalPrompt += `. Art style: ${styleText}`;
          }
          
          // Add custom art style
          if (artStyleCustom) {
            finalPrompt += `. Art style: ${artStyleCustom}`;
          }
          
          // Add vibe
          if (vibe) {
            finalPrompt += `. Atmosphere: ${vibe}`;
          }
        }

        const payload = { 
          prompt: finalPrompt, 
          botName: resolvedName,
          archetype,
          archetypeSpecific, archetypeSpecificDesc,
          vibe,
          styleChoice: useHologram ? null : styleChoice,
          artStyleCustom,
          traits,
          personalityPrompt: (document.getElementById('suggestionDesc')?.value || '').trim()
        };
        try {
          localStorage.setItem('pendingCreate', JSON.stringify(payload));
        } catch(_) {}
        window.location.href = 'edit.html?new=1';
        return;

  // (Unreached due to early return) Disable form while processing
  persona.disabled = true;
  startBtn.disabled = true;
  startBtn.innerHTML = loader();

        try {
          // ===== Generate avatar via API =====
          const res = await fetch('/api/generate-avatar', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ 
              prompt: p,
              vibe, setting, colors,
              styleChoice, artStyleCustom,
              traits,
              personalityPrompt: (document.getElementById('additionalDetails')?.value || '').trim()
            })
          });

          const json = await res.json().catch(() => ({}));
          if (!res.ok || !json?.dataUrl) {
            console.error('Avatar API error:', json);
            // Show error message
            let msg = document.getElementById('safetyMsg');
            if (msg) {
              msg.textContent = 'Content blocked by safety system. Avoid copyrighted, controversial, or explicit characters!';
              msg.style.display = 'block';
              // Hide after 6 seconds
              setTimeout(() => { msg.style.display = 'none'; }, 6000);
            }
            return;
          }

          // Remove safety message if present
          let msg = document.getElementById('safetyMsg');
          if (msg) msg.style.display = 'none';

          // Upload avatar image to Supabase and save it
          const { data: { user } } = await supabase.auth.getUser();
          if (user) {
            const finalBotName = json.botName || p;
            const url = await uploadAvatarImage({ dataUrl: json.dataUrl, userId: user.id, fileName: `${finalBotName}.png` });
            
            // Save avatar to database
            const { data: avatarData, error: avatarError } = await supabase
              .from('avatars')
              .insert({
                user_id: user.id,
                name: finalBotName,
                image_url: url,
                traits: {
                  original_prompt: p,
                  art_style: json.artStyle,
                  personality_prompt: json.personalityPrompt,
                  ...(json.traits || {})
                },
              })
              .select()
              .single();
              
            if (avatarError) {
              console.error('Error saving avatar:', avatarError);
              throw avatarError;
            }
            
            console.log('✅ Avatar created successfully:', avatarData);
            
            // Store the new avatar ID for future navigation
            localStorage.setItem('lastSelectedAvatar', avatarData.id);
            localStorage.setItem('lastGeneratedAvatar', avatarData.id);
            
            console.log('🔄 Redirecting to edit page with avatar ID:', avatarData.id);
            
            // Add a small delay to ensure database consistency
            setTimeout(() => {
              console.log('🔄 Executing redirect now...');
              window.location.href = `edit.html?avatar=${avatarData.id}`;
            }, 100);
          }

        } catch (err) {
          console.error('❌ Avatar creation failed:', err);
          console.error('❌ Error details:', {
            message: err.message,
            stack: err.stack
          });
          let msg = document.getElementById('safetyMsg');
          if (msg) {
            msg.textContent = 'Avatar creation failed. Please try again.';
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 4000);
          }
        } finally {
          // Re-enable form
          persona.disabled = false;
          startBtn.disabled = false;
          startBtn.innerHTML = 'Generate Agent!';
          persona.focus();
        }
      }

      function loader(){
        return `<div style="width:24px;height:24px;border:2px solid #333;border-top:2px solid #fff;border-radius:50%;animation:spin 60s linear infinite;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>`;
      }

      // --- Supabase Upload Helper ---
      function dataUrlToBlob(dataUrl){
        const [meta, b64] = dataUrl.split(",");
        const mime = meta.match(/data:(.*?);base64/)[1] || "image/png";
        const bin = atob(b64), len = bin.length;
        const bytes = new Uint8Array(len);
        for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }

      async function uploadAvatarImage({ dataUrl, userId, fileName="avatar.png" }){
        try {
          const blob = dataUrlToBlob(dataUrl);
          const path = `${userId}/${crypto.randomUUID()}-${fileName}`;
          
          // Upload the file
          const { error: upErr } = await supabase.storage.from("avatars")
            .upload(path, blob, { 
              upsert: true, 
              contentType: blob.type,
              cacheControl: '3600'
            });
          if (upErr) throw upErr;
          
          // Get the public URL
          const { data } = supabase.storage.from("avatars")
            .getPublicUrl(path, {
              download: false,
              transform: {
                width: 333,
                height: 333,
                resize: 'cover'
              }
            });
            
          // Ensure the URL is using HTTPS
          const url = new URL(data.publicUrl);
          url.protocol = 'https:';
          return url.toString();
        } catch (err) {
          console.error('Error in uploadAvatarImage:', err);
          throw err;
        }
      }

  // Start with chooser visible; focus will be set when a mode is selected

    } // End of authenticated check
  </script>
