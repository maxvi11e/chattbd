<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Build a Bot — Create</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <style>
  /* Advanced Panel Styling - Match input-container exactly */
  #advancedPanel {
    width: 100%;
    max-width: 395px; /* Global cap for advanced panel */
  }
  /* Ensure children don't overflow the panel width */
  #advancedPanel > * { max-width: 100%; }
  
  /* Ensure advanced panel heroInput elements don't get responsive sizing */
  #advancedPanel .heroInput {
    width: 100% !important;
  }
  
  @media (max-width: 900px) {
    .heroInput {
      width: min(400.69px, calc(56vw - 32px));
    }
    /* Override responsive sizing for advanced panel inputs */
    #advancedPanel .heroInput {
      width: 100% !important;
    }
  }
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @media (max-width: 600px) {
      #persona::placeholder {
        content: "Create avatar...";
      }
      .user-email {
        display: none;
      }
      .logout-btn {
        display: none !important;
      }
    }
    :root{
      --bg:#000;
      --ink:#fff;
      --muted:#d9d9d9;
      --bubble:#333;
      --stroke:#fff;
      --radius-lg:24px;
      --radius-md:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial}

    .screen{min-height:100vh; width:100%;}

    /* ===== Dashboard ===== */
    .dashboard{padding:0; min-height:100vh;}
    
    /* Top Navigation */
    .top-nav{display:flex; justify-content:space-between; align-items:center; padding:12px 48px 4px 48px;}
    .nav-left{display:flex; align-items:center; gap:24px;}
    .nav-logo{height:48px; width:auto;}
    .nav-icon{height:32px; width:auto; transition:transform 0.2s ease; cursor:pointer; opacity:1;}
    .nav-icon:hover{transform:scale(1.1);}
    .nav-right{display:flex; gap:16px; align-items:center;}
    .user-email{color:var(--ink); font-size:16px;}
  .logout-btn{padding:8px; border:none; background:transparent; color:var(--ink); border-radius:8px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition: background-color 0.2s ease;}
  .logout-btn:hover{background:rgba(255,255,255,0.1);}    
    .logout-btn img{width:36px; height:36px;}

    /* Main Content */
  .main-content{padding-top:12px; max-width:1200px; margin:0 auto;}
    
    /* Page Title */
    .page-header{display:flex; align-items:center; gap:0px; margin-top:11px; margin-bottom:0px; justify-content:center;}
    .page-icon{height:40px; width:auto;}
    .page-title{font-size:32px; font-weight:600; margin:0;}

    /* Create Form */
    .create-form{display:flex; justify-content:center; padding:0 48px;}
    .input-container{display:flex; align-items:center; gap:11.2px; max-width:800px; width:100%;}
    .heroInput{display:flex; align-items:center; flex:1; border:1px solid var(--stroke); border-radius:800px; padding:0 14.4px; height:46.4px; background:transparent}
    .heroInput input{flex:1; background:transparent; border:0; outline:none; color:var(--ink); font-size:21.6px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:0; min-width:0;}
    .heroInput input::placeholder { color:#a8a8a8; opacity:1; }
    .circleBtn{width:46.4px; height:46.4px; border-radius:999px; border:1px solid var(--stroke); background:transparent; display:grid; place-items:center; cursor:pointer;}
    .circleBtn:hover{background:rgba(255,255,255,0.1);}
    .circleBtn svg{width:33.6px; height:33.6px; fill:var(--ink)}
    
    /* Generate Bot Button Styles */
    #startBtn{
      background:#fff;
      color:#000;
      border:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:14px 28px;
      height:auto;
      min-width:220px;
      border-radius:999px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 0 0 rgba(255,0,128,0);
      animation: neonGlow 3.2s ease-in-out infinite;
      will-change: box-shadow;
      transition: transform 0.15s ease-in-out;
  margin-bottom:20px;
    }
    #startBtn:hover{ transform: translateY(-1px); }
    @keyframes neonGlow{
      0% { box-shadow: 0 0 0 rgba(255,0,128,0); }
      10%{ box-shadow: 0 0 10px rgba(255,0,128,0.45), 0 0 20px rgba(255,0,128,0.25); }
      25%{ box-shadow: 0 0 12px rgba(255,153,0,0.55), 0 0 24px rgba(255,153,0,0.30); }
      40%{ box-shadow: 0 0 14px rgba(255,255,0,0.55), 0 0 26px rgba(255,255,0,0.30); }
      55%{ box-shadow: 0 0 14px rgba(0,255,170,0.55), 0 0 26px rgba(0,255,170,0.30); }
      70%{ box-shadow: 0 0 14px rgba(0,153,255,0.55), 0 0 26px rgba(0,153,255,0.30); }
      85%{ box-shadow: 0 0 14px rgba(170,0,255,0.55), 0 0 26px rgba(170,0,255,0.30); }
      100%{ box-shadow: 0 0 0 rgba(255,0,128,0); }
    }

    /* Regenerate button animation (match standard hover scale/translate) */
    #tryAnotherSuggestion{
      transition: transform 0.15s ease-in-out, box-shadow 0.25s ease;
      will-change: transform;
    }
    #tryAnotherSuggestion:hover{
      background:rgba(255, 255, 255, 0.182);
      transform:translateY(-2px);
      box-shadow:0 2px 6px rgba(255,255,255,0.15);
    }
    #tryAnotherSuggestion:active{
      transform:translateY(0);
      box-shadow:none;
    }

    /* Field heading labels */
    .field-heading{
      color:#a8a8a8;
      font-style:italic;
      text-align:left;
      align-self:flex-start;
      width:100%;
      font-size:14px;
  margin:12px 0 2px 0;
  display:flex;
  align-items:center;
  gap:6px;
    }
    /* Ensure headings within Art Settings align to the 395px column */
    #artSettingsContainer .field-heading{
      width:395px;
      align-self:center;
    }
    .field-heading img.icon{
      width:18px;
      height:18px;
      opacity:0.95;
      display:inline-block;
      vertical-align:middle;
    }
  </style>
</head>

  <script type="module">
    // === Supabase Auth ===

    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";

    // Make supabase available globally for freemium-utils.js

    // Check auth and redirect if not authenticated
    async function checkAuthAndRedirect() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'auth.html';
        return false;
      }
      console.log("User authenticated:", session.user.email);
      
      // Load and display username from profiles table
      await loadUserProfile(session.user);
      return true;
    }

    // Load user profile and display username
    async function loadUserProfile(user) {
      try {
        const { data: profile, error } = await supabase
          .from('profiles')
          .select('display_name')
          .eq('id', user.id)
          .single();

        if (error) {
          console.error('Error loading profile:', error);
          const emailEl = document.getElementById('userEmail');
          if (emailEl) emailEl.textContent = user.email; // Fallback to email
        } else {
          const emailEl2 = document.getElementById('userEmail');
          if (emailEl2) emailEl2.textContent = profile?.display_name || user.email;
        }
      } catch (error) {
        console.error('Error in loadUserProfile:', error);
  const emailEl3 = document.getElementById('userEmail');
  if (emailEl3) emailEl3.textContent = user.email; // Fallback to email
      }
    }

    // Initialize auth check
    const isAuthenticated = await checkAuthAndRedirect();
    if (!isAuthenticated) {
      // Don't initialize the rest of the app if not authenticated
    } else {
      // Continue with app initialization only if authenticated

      const persona = document.getElementById('persona');
      const startBtn = document.getElementById('startBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const randomizeBtn = document.getElementById('randomizeBtn');
  const advancedPanel = document.getElementById('advancedPanel');
  // Mode chooser removed; always show options flow
  const inputContainer = document.querySelector('.input-container');
  // Back buttons removed
  const artSettings = document.getElementById('artSettingsContainer');
  const toggleArtSettingsBtn = document.getElementById('toggleArtSettingsBtn');
  // Track if user has triggered (clicked) Art Settings at least once in this flow
  let artSettingsTriggered = false;
  // Track when randomize flow should auto-open art settings after suggestion
  let randomizeFlow = false;

      // Sign out handler (optional if logout button exists)
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          await supabase.auth.signOut();
          window.location.href = 'auth.html';
        });
      }

      // Chat navigation handler
      const chatNavIcon = document.getElementById("chatNavIcon");
      if (chatNavIcon) {
        chatNavIcon.addEventListener("click", (e) => {
          e.preventDefault();
          const lastAvatarId = localStorage.getItem('lastSelectedAvatar');
          if (lastAvatarId) {
            window.location.href = `chat.html?avatar=${lastAvatarId}`;
          } else {
            alert('Please select an avatar to chat with first!');
          }
        });
      }

      // Watch auth state changes
      supabase.auth.onAuthStateChange((_event, session) => {
        if (!session) {
          window.location.href = 'auth.html';
        }
      });

      // Handle responsive placeholder text
      function updatePlaceholder() {
        if (window.innerWidth <= 600) {
          persona.placeholder = persona.dataset.shortPlaceholder;
        } else {
          persona.placeholder = "Describe the personality, appearance, or character of the Bot";
        }
      }
      window.addEventListener('resize', updatePlaceholder);
      updatePlaceholder();

      persona.addEventListener('keydown', e=>{ if(e.key==='Enter') start(); });
      startBtn.addEventListener('click', start);

      function showOptionsMode(){
        advancedPanel.style.display = 'flex';

        document.getElementById('dynamicStartContainer').appendChild(startBtn);

        const artSettingsBtn = document.getElementById('toggleArtSettingsBtn');
        if (artSettingsBtn) artSettingsBtn.style.display = 'none';
        // Hide start button until a suggestion is generated
        if (startBtn) startBtn.style.display = 'none';
      }
      // Immediately enter options mode
      showOptionsMode();

    // Art settings: one-way expand. Hide the button after first click; no collapse behavior.
      if (toggleArtSettingsBtn && artSettings){
        // Start hidden
        artSettings.style.display = 'none';
        toggleArtSettingsBtn.style.display = 'none';
        toggleArtSettingsBtn.addEventListener('click', ()=>{
          // Open settings and remove the button to avoid blank space
          artSettings.style.display = 'flex';
          artSettingsTriggered = true;
          toggleArtSettingsBtn.style.display = 'none';
          // If a suggestion exists, allow Start button to appear now
      const suggestionVisible = document.getElementById('suggestionResult')?.style.display === 'block';
      const suggestedName = (document.getElementById('archetypeSpecific')?.value || '').trim();
      const archetypeSel = document.getElementById('archetype');
      const isCustomSelected = archetypeSel && archetypeSel.value === 'custom';
      // Allow proceeding in custom path after opening Art Settings
      if ((suggestionVisible || suggestedName || isCustomSelected) && startBtn) startBtn.style.display = 'flex';
        });
      }

      // --- Randomize All ---
      function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
      function randPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
      function dispatch(el, type){ if(!el) return; const ev = new Event(type, {bubbles:true}); el.dispatchEvent(ev); }
      async function randomizeAll(){

      function loader(){
        return `<div style="width:24px;height:24px;border:2px solid #333;border-top:2px solid #fff;border-radius:50%;animation:spin 60s linear infinite;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>`;
      }

      // --- Supabase Upload Helper ---
      function dataUrlToBlob(dataUrl){
        const [meta, b64] = dataUrl.split(",");
        const mime = meta.match(/data:(.*?);base64/)[1] || "image/png";
        const bin = atob(b64), len = bin.length;
        const bytes = new Uint8Array(len);
        for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }

      async function uploadAvatarImage({ dataUrl, userId, fileName="avatar.png" }){
        try {
          const blob = dataUrlToBlob(dataUrl);
          const path = `${userId}/${crypto.randomUUID()}-${fileName}`;
          
          // Upload the file
          const { error: upErr } = await supabase.storage.from("avatars")
            .upload(path, blob, { 
              upsert: true, 
              contentType: blob.type,
              cacheControl: '3600'
            });
          if (upErr) throw upErr;
          
          // Get the public URL
          const { data } = supabase.storage.from("avatars")
            .getPublicUrl(path, {
              download: false,
              transform: {
                width: 333,
                height: 333,
                resize: 'cover'
              }
            });
            
          // Ensure the URL is using HTTPS
          const url = new URL(data.publicUrl);
          url.protocol = 'https:';
          return url.toString();
        } catch (err) {
          console.error('Error in uploadAvatarImage:', err);
          throw err;
        }
