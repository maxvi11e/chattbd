<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeaea — Create</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>
  /* Advanced Panel Styling - Match input-container exactly */
  #advancedPanel {
    width: 100%;
    max-width: 395px; /* Global cap for advanced panel */
  }
  /* Ensure children don't overflow the panel width */
  #advancedPanel > * { max-width: 100%; }
  
  /* Ensure advanced panel heroInput elements don't get responsive sizing */
  #advancedPanel .heroInput {
    width: 100% !important;
  }
  
  @media (max-width: 900px) {
    .heroInput {
      width: min(400.69px, calc(56vw - 32px));
    }
    /* Override responsive sizing for advanced panel inputs */
    #advancedPanel .heroInput {
      width: 100% !important;
    }
  }
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @media (max-width: 600px) {
      #persona::placeholder {
        content: "Create avatar...";
      }
      .user-email {
        display: none;
      }
      .logout-btn {
        display: none !important;
      }
    }
    :root{
      --bg:#000;
      --ink:#fff;
      --muted:#d9d9d9;
      --bubble:#333;
      --stroke:#fff;
      --radius-lg:24px;
      --radius-md:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial}

    .screen{min-height:100dvh; width:100%;}

    /* ===== Dashboard ===== */
    .dashboard{padding:0; min-height:100dvh;}
    
    /* Top Navigation */
    .top-nav{display:flex; justify-content:space-between; align-items:center; padding:12px 48px 4px 48px;}
    .nav-left{display:flex; align-items:center; gap:24px;}
    .nav-logo{height:48px; width:auto;}
    .nav-icon{height:32px; width:auto; transition:transform 0.2s ease; cursor:pointer; opacity:1;}
    .nav-icon:hover{transform:scale(1.1);}
    .nav-right{display:flex; gap:16px; align-items:center;}
    .user-email{color:var(--ink); font-size:16px;}
  .logout-btn{padding:8px; border:none; background:transparent; color:var(--ink); border-radius:8px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition: background-color 0.2s ease;}
  .logout-btn:hover{background:rgba(255,255,255,0.1);}    
    .logout-btn img{width:36px; height:36px;}

    /* Main Content */
  .main-content{padding-top:12px; max-width:1200px; margin:0 auto;}
    
    /* Page Title */
    .page-header{display:flex; align-items:center; gap:0px; margin-top:11px; margin-bottom:0px; justify-content:center;}
    .page-icon{height:40px; width:auto;}
    .page-title{font-size:32px; font-weight:600; margin:0;}

    /* Create Form */
    .create-form{display:flex; justify-content:center; padding:0 48px;}
    .input-container{display:flex; align-items:center; gap:11.2px; max-width:800px; width:100%;}
    .heroInput{display:flex; align-items:center; flex:1; border:1px solid var(--stroke); border-radius:800px; padding:0 14.4px; height:46.4px; background:transparent}
    .heroInput input{flex:1; background:transparent; border:0; outline:none; color:var(--ink); font-size:21.6px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:0; min-width:0;}
    .heroInput input::placeholder { color:#a8a8a8; opacity:1; }
    .trait-row {
      display:grid;
      grid-template-columns:minmax(0, 90px) 1fr minmax(0, 90px);
      align-items:center;
      gap:8px;
      width:100%;
    }
    .trait-row .trait-label {
      font-size:12px;
      color:#ffffff;
      white-space:nowrap;
    }
    .trait-row .trait-label.left {
      text-align:right;
      justify-self:end;
    }
    .trait-row .trait-label.right {
      text-align:left;
      justify-self:start;
    }
    .trait-row .personality-slider {
      width:100%;
      min-width:0;
    }
    /* Personality sliders use a custom track so both sides stay white */
    input[type="range"].personality-slider {
      --slider-thumb-color:#fff;
      --slider-thumb-outline:rgba(0,0,0,0.35);
      -webkit-appearance:none;
      appearance:none;
      width:100%;
      height:8px;
      background:#fff;
      border-radius:999px;
      outline:none;
    }
    input[type="range"].personality-slider::-webkit-slider-runnable-track {
      background:#fff;
      height:8px;
      border-radius:999px;
    }
    input[type="range"].personality-slider::-webkit-slider-thumb {
      -webkit-appearance:none;
      appearance:none;
      width:24px;
      height:24px;
      border-radius:50%;
      background:var(--slider-thumb-color);
      border:none;
      margin-top:-8px;
      cursor:pointer;
    }
    input[type="range"].personality-slider::-moz-range-track {
      background:#fff;
      height:8px;
      border-radius:999px;
    }
    input[type="range"].personality-slider::-moz-range-progress {
      background:#fff;
      height:8px;
      border-radius:999px;
    }
    input[type="range"].personality-slider::-moz-range-thumb {
      appearance:none;
      width:24px;
      height:24px;
      border-radius:50%;
      background:var(--slider-thumb-color);
      border:none;
      cursor:pointer;
    }
    @media (max-width: 540px) {
      .trait-row {
        grid-template-columns:minmax(0, 70px) 1fr minmax(0, 70px);
        gap:6px;
      }
      .trait-row .trait-label {
        font-size:11px;
        white-space:normal;
      }
    }
    .circleBtn{width:46.4px; height:46.4px; border-radius:999px; border:1px solid var(--stroke); background:transparent; display:grid; place-items:center; cursor:pointer;}
    .circleBtn:hover{background:rgba(255,255,255,0.1);}
    .circleBtn svg{width:33.6px; height:33.6px; fill:var(--ink)}
    
    /* Generate Bot Button Styles */
    #startBtn{
      background:#fff;
      color:#000;
      border:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:14px 28px;
      height:auto;
      min-width:220px;
      border-radius:999px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 0 0 rgba(255,0,128,0);
      animation: neonGlow 3.2s ease-in-out infinite;
      will-change: transform, box-shadow;
      transition: transform 0.15s ease-in-out, box-shadow 0.3s ease;
  margin-bottom:20px;
    }
    #startBtn:hover{
      transform: translateY(-2px) scale(1.02);
      box-shadow:0 4px 16px rgba(255,255,255,0.12);
    }
    #startBtn:active{
      transform:translateY(0) scale(1);
    }
    @keyframes neonGlow{
      0% { box-shadow: 0 0 0 rgba(255,0,128,0); }
      10%{ box-shadow: 0 0 10px rgba(255,0,128,0.45), 0 0 20px rgba(255,0,128,0.25); }
      25%{ box-shadow: 0 0 12px rgba(255,153,0,0.55), 0 0 24px rgba(255,153,0,0.30); }
      40%{ box-shadow: 0 0 14px rgba(255,255,0,0.55), 0 0 26px rgba(255,255,0,0.30); }
      55%{ box-shadow: 0 0 14px rgba(0,255,170,0.55), 0 0 26px rgba(0,255,170,0.30); }
      70%{ box-shadow: 0 0 14px rgba(0,153,255,0.55), 0 0 26px rgba(0,153,255,0.30); }
      85%{ box-shadow: 0 0 14px rgba(170,0,255,0.55), 0 0 26px rgba(170,0,255,0.30); }
      100%{ box-shadow: 0 0 0 rgba(255,0,128,0); }
    }

    /* Regenerate button animation (match standard hover scale/translate) */

    /* Field heading labels */
    .field-heading{
      color:#a8a8a8;
      font-style:italic;
      text-align:left;
      align-self:flex-start;
      width:100%;
      font-size:14px;
  margin:12px 0 2px 0;
  display:flex;
  align-items:center;
  gap:6px;
    }
    /* Ensure headings within Art Settings align to the 395px column */
    #artSettingsContainer .field-heading{
      width:min(100%, 395px);
      align-self:center;
    }
  .field-heading img.icon{
    width:18px;
    height:18px;
    opacity:0.95;
    display:inline-block;
    vertical-align:middle;
  }
    #suggestionDesc{
      scrollbar-color: transparent transparent;
    }
    #suggestionDesc::-webkit-scrollbar{
      width: 8px;
      background: transparent;
    }
    #suggestionDesc::-webkit-scrollbar-track{
      background: transparent;
    }
    #suggestionDesc::-webkit-scrollbar-thumb{
      background: transparent;
    }
  </style>
</head>

      function randPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
      function randPickWeighted(entries){
        const total = entries.reduce((sum, entry)=> sum + entry.weight, 0);
        if (total <= 0) return entries[entries.length - 1]?.value;
        let r = Math.random() * total;
        for (const entry of entries) {
          r -= entry.weight;
          if (r <= 0) return entry.value;
        }
        return entries[entries.length - 1]?.value;
      }

      function sliderValueToColor(value) {
        const numeric = Number(value);
        const clamped = Number.isFinite(numeric) ? Math.min(Math.max(numeric, 1), 10) : 5;
        const ratio = (clamped - 1) / 9; // 0 at cool extreme, 1 at warm extreme
        const hue = 210 - (210 * ratio); // 210 (cool blue) → 0 (red)
        const saturation = 90;
        const lightness = 60;
        return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
      }

      function applySliderColor(slider) {
        if (!slider) return;
        const color = sliderValueToColor(slider.value);
        slider.style.setProperty('--slider-thumb-color', color);

            `Structure: ${logic}.`,
            `Fill: ${fill}.`,
            `Symmetry: ${symmetry}.`,
            'Eyes: friendly rounded almond openings with soft glow; no pupils.',
            'Contrast: very bright lines with crisp edges; protect blacks; no interface/HUD, no text, no logos.',
            'Extreme brightness and luminosity to all elements',
            '10x thickness and brightness for 10% of all elements',
            vibeLine
          ].filter(Boolean);
          hologramDescription = descriptionLines.join('\n');
        }

        if (!p && !isOptionsMode) return;

        // Immediately route to edit page and let it handle generation + save with a loading spinner
        const resolvedName = archetypeSpecific || archetype || 'New Avatar';

        // If hologram mode, append abstract description to prompt
        const finalPrompt = useHologram && hologramDescription 
          ? `${hologramDescription}\n\nBased on the concept: ${archetypeSpecific || archetype}`
          : p;

        const payload = { 
          prompt: finalPrompt, 
          botName: resolvedName,
          archetypeSpecific, archetypeSpecificDesc,
          vibe,
          styleChoice, artStyleCustom,
          traits,
          personalityPrompt: (document.getElementById('suggestionDesc')?.value || '').trim(),
          useHologram
        };
        try {
          localStorage.setItem('pendingCreate', JSON.stringify(payload));
        } catch(_) {}
        window.location.href = 'edit.html?new=1';
        return;

  // (Unreached due to early return) Disable form while processing
  persona.disabled = true;
  startBtn.disabled = true;
  startBtn.innerHTML = loader();

        try {
          // ===== Generate avatar via API =====
          const res = await fetch('/api/generate-avatar', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ 
              prompt: p,
              vibe, setting, colors,
              styleChoice, artStyleCustom,
              traits,
              personalityPrompt: (document.getElementById('additionalDetails')?.value || '').trim()
            })
          });

          const json = await res.json().catch(() => ({}));
          if (!res.ok || !json?.dataUrl) {
            console.error('Avatar API error:', json);
            // Show error message
            let msg = document.getElementById('safetyMsg');
            if (msg) {
              msg.textContent = 'Content blocked by safety system. Avoid copyrighted, controversial, or explicit characters!';
              msg.style.display = 'block';
              // Hide after 6 seconds
              setTimeout(() => { msg.style.display = 'none'; }, 6000);
            }
            return;
          }

          // Remove safety message if present
          let msg = document.getElementById('safetyMsg');
          if (msg) msg.style.display = 'none';

          // Upload avatar image to Supabase and save it
          const { data: { user } } = await supabase.auth.getUser();
          if (user) {
            const finalBotName = json.botName || p;
            const url = await uploadAvatarImage({ dataUrl: json.dataUrl, userId: user.id, fileName: `${finalBotName}.png` });
            
            // Save avatar to database
            const { data: avatarData, error: avatarError } = await supabase
              .from('avatars')
              .insert({
                user_id: user.id,
                name: finalBotName,
                image_url: url,
                traits: {
                  original_prompt: p,
                  art_style: json.artStyle,
                  personality_prompt: json.personalityPrompt,
                  ...(json.traits || {})
                },
              })
              .select()
              .single();
              
            if (avatarError) {
              console.error('Error saving avatar:', avatarError);
              throw avatarError;
            }
            
            console.log('✅ Avatar created successfully:', avatarData);
            
            // Store the new avatar ID for future navigation
            localStorage.setItem('lastSelectedAvatar', avatarData.id);
            localStorage.setItem('lastGeneratedAvatar', avatarData.id);
            
            console.log('🔄 Redirecting to edit page with avatar ID:', avatarData.id);
            
            // Add a small delay to ensure database consistency
            setTimeout(() => {
              console.log('🔄 Executing redirect now...');
              window.location.href = `edit.html?avatar=${avatarData.id}`;
            }, 100);
          }

        } catch (err) {
          console.error('❌ Avatar creation failed:', err);
          console.error('❌ Error details:', {
            message: err.message,
            stack: err.stack
          });
          let msg = document.getElementById('safetyMsg');
          if (msg) {
            msg.textContent = 'Avatar creation failed. Please try again.';
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 4000);
          }
        } finally {
          // Re-enable form
          persona.disabled = false;
          startBtn.disabled = false;
          startBtn.innerHTML = 'Generate Agent!';
          persona.focus();
        }
      }

      function loader(){
        return `<div style="width:24px;height:24px;border:2px solid #333;border-top:2px solid #fff;border-radius:50%;animation:spin 60s linear infinite;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>`;
      }

      // --- Supabase Upload Helper ---
      function dataUrlToBlob(dataUrl){
        const [meta, b64] = dataUrl.split(",");
        const mime = meta.match(/data:(.*?);base64/)[1] || "image/png";
        const bin = atob(b64), len = bin.length;
        const bytes = new Uint8Array(len);
        for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }

      async function uploadAvatarImage({ dataUrl, userId, fileName="avatar.png" }){
        try {
          const blob = dataUrlToBlob(dataUrl);
          const path = `${userId}/${crypto.randomUUID()}-${fileName}`;
          
          // Upload the file
          const { error: upErr } = await supabase.storage.from("avatars")
            .upload(path, blob, { 
              upsert: true, 
              contentType: blob.type,
              cacheControl: '3600'
            });
          if (upErr) throw upErr;
          
          // Get the public URL
          const { data } = supabase.storage.from("avatars")
            .getPublicUrl(path, {
              download: false,
              transform: {
                width: 333,
                height: 333,
                resize: 'cover'
              }
            });
            
          // Ensure the URL is using HTTPS
          const url = new URL(data.publicUrl);
          url.protocol = 'https:';
          return url.toString();
        } catch (err) {
          console.error('Error in uploadAvatarImage:', err);
          throw err;
        }
      }

  // Start with chooser visible; focus will be set when a mode is selected

    } // End of authenticated check
  </script>
</body>
