<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeaea — Edit</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>

  :root {
    --bg:#000;
    --ink:#fff;
    --muted:#d9d9d9;
    --bubble:#333;
    --stroke:#fff;
    --radius-lg:24px;
    --radius-md:14px;
  }
  * {
    box-sizing:border-box;
  }
  html,body {
    height:100%;
  }
  body {
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  }
  .screen {
    min-height:100dvh;
    width:100%;
  }
  /* ===== Dashboard ===== */
  .dashboard {
    padding:0;
    min-height:100dvh;
  }
  /* Layout */
  .chat-container {
    display:flex;
    min-height:100dvh;
  }
  .sidebar {
    width:300px;
    background:var(--bg);
    border-right:1px solid #333;
    display:flex;
    flex-direction:column;
    transition:width 0.3s ease;
    position:relative;
    min-width:200px;
    max-width:600px;
    height:100dvh;
    flex-shrink:0;
  }
  .sidebar.collapsed {
    width:44px !important;
    min-width:44px !important;
    overflow:hidden;
  }
  .sidebar.resizing {
    transition:none;
  }
  .sidebar-bottom {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px;
    border-top:0px solid #333;
  }
  .sidebar *::-webkit-scrollbar {
    width:12px;
  }
  .sidebar *::-webkit-scrollbar-track {
    background:#000 !important;
  }
  .sidebar *::-webkit-scrollbar-thumb {
    background:var(--stroke);
    border-radius:999px;
  }
  .sidebar-nav {
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .nav-logo {
    height:44px;
    width:auto;
  }
  .sidebar-actions {
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .action-btn {
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:12px 16px;
    background:transparent;
    border:none;
    border-radius:8px;
    color:var(--ink);
    cursor:pointer;
    font-size:14px;
    text-decoration:none;
  }
  .action-btn:hover {
    background:rgba(255,255,255,0.1);
  }
  .action-btn img {
    width:16px;
    height:16px;
  }
  .action-btn .action-label {
    display:inline-flex;
    align-items:center;
  }
  .conversations {
    flex:1;
    overflow-y:auto;
    padding:0 16px 16px;
  }
  .sidebar.collapsed .conversations {
    display:none;
  }
  .conversations-header {
    font-size:14px;
    font-weight:300;
    font-style:italic;
    color:#dddddd;
    margin-bottom:12px;
    padding-left:16px;
  }
  .sidebar-placeholder {
    color:var(--muted);
    font-size:13px;
    padding:0 16px;
    margin:0;
    line-height:1.5;
  }
  .user-email {
    color:var(--ink);
    font-size:14px;
  }
  .logout-btn {
    padding:6px 12px;
    border:0px solid var(--stroke);
    background:transparent;
    color:var(--ink);
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .logout-btn:hover {
    background:rgba(255,255,255,0.1);
  }
  .logout-btn img {
    width:24px;
    height:24px;
  }
  .sidebar.collapsed .logout-btn img {
    width:20px;
    height:20px;
  }
  .sidebar.collapsed .sidebar-nav {
    justify-content:center;
    padding:14px 0 0 0;
  }
  .sidebar.collapsed .nav-logo {
    display:none;
  }
  .sidebar.collapsed .sidebar-actions {
    padding:12px 8px;
    align-items:center;
    margin-top:40px;
  }
  .sidebar.collapsed .action-btn {
    justify-content:center;
    padding:10px 0;
    gap:0;
  }
  .sidebar.collapsed .action-btn .action-label {
    display:none;
  }
  .sidebar.collapsed .action-btn img {
    width:20px;
    height:20px;
  }
  .sidebar.collapsed .sidebar-bottom {
    padding:12px 8px;
    flex-direction:column;
    align-items:center;
    gap:8px;
    position:absolute;
    bottom:12px;
    left:0;
    right:0;
  }
  .sidebar.collapsed .sidebar-bottom .user-email {
    display:none;
  }
  .sidebar.collapsed .logout-btn {
    padding:8px 0;
  }
  .resize-handle {
    position:absolute;
    top:0;
    right:-3px;
    width:6px;
    height:100%;
    cursor:col-resize;
    background:transparent;
    z-index:100;
  }
  .resize-handle:hover {
    background:rgba(255,255,255,0.1);
  }
  .resize-handle.resizing {
    background:rgba(255,255,255,0.2);
  }
  .main-edit {
    flex:1;
    position:relative;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .sidebar-toggle {
    position:absolute;
    top:50px;
    right:10px;
    width:32px;
    height:32px;
    background:transparent;
    border:none;
    border-radius:8px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    z-index:10;
    transition:all 0.3s ease;
  }
  .sidebar-toggle:hover {
    background:rgba(255,255,255,0.1);
  }
  .sidebar-toggle:active {
    background:rgba(255,255,255,0.15);
  }
  .sidebar-toggle:focus {
    background:rgba(255,255,255,0.1);
    outline:none;
  }
  .sidebar.collapsed .sidebar-toggle {
    top:16px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
  }
  /* Prevent laggy animation of toggle during live resize */
  .sidebar.resizing .sidebar-toggle {
    transition:none;
  }
  /* Main Content */
  .main-content {
    padding:24px;
    max-width:1200px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  /* Page Title */
  .page-header {
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:40px;
    justify-content:center;
  }
  .page-icon {
    height:40px;
    width:auto;
  }
  .page-title {
    font-size:32px;
    font-weight:600;
    margin:0;
  }
  /* Bot Preview */
  .bot-preview {
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:28px;
    margin-bottom:0px;
    transition:gap 0.35s ease;
    flex-wrap:nowrap;
  }
  .bot-preview-main {
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform 0.35s ease;
  }
  .bot-preview.personality-visible .bot-preview-main {
    transform:translateX(-24px);
  }
  .bot-frame {
    width:400px;
    height:400px;
    border-radius:var(--radius-lg);
    border:1px solid #333;
    background:transparent;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .bot-image {
    width:100%;
    height:100%;
    border-radius:var(--radius-lg);
    object-fit:cover;
    display:none;
  }
  .bot-image.visible {
    display:block;
  }
  .frame-spinner {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame-spinner.hidden {
    display:none;
  }
  .agent-name-field {
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-bottom:16px;
  }
  .field-heading {
    color:#a8a8a8;
    font-style:italic;
    text-align:left;
    align-self:flex-start;
    width:100%;
    max-width:400px;
    font-size:14px;
    margin:0 0 2px 0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .agent-name-field .field-heading {
    align-self:center;
  }
  .field-heading img.icon {
    width:18px;
    height:18px;
    opacity:0.95;
  }
  #agentNameInput {
    width:100%;
    max-width:400px;
    background:transparent;
    border:1px solid rgba(255,255,255,0.3);
    color:var(--ink);
    border-radius:24.5px;
    padding:11px 18px;
    font-size:18px;
    font-weight:400;
    line-height:1.3;
    min-height:46px;
    resize:none;
    overflow:hidden;
    text-align:center;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
    font-family:inherit;
  }
  #agentNameInput:focus {
    outline:none;
    border-color:var(--ink);
    box-shadow:0 0 0 1px var(--ink);
  }
  #agentNameInput[disabled] {
    opacity:0.6;
    cursor:not-allowed;
  }
  /* Action Buttons */
  .action-buttons {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin:24px 0 0;
    width:100%;
    max-width:500px;
    align-self:center;
  }
  .edit-buttons-row {
    display:flex;
    gap:12px;
    width:400px;
    max-width:100%;
    justify-content:center;
  }
  .action-buttons .action-btn {
    padding:16px 32px;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:999px;
    background:transparent;
    color:var(--ink);
    font-size:14px;
    font-weight:400;
    cursor:pointer;
    transition:all 0.2s ease;
    min-width:140px;
    text-align:center;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .action-buttons .action-btn:hover {
    background:rgba(255,255,255,0.1);
    transform:translateY(-2px);
  }
  .action-buttons .confirm-btn {
    background:transparent;
    color:var(--ink);
    width:100%;
    max-width:400px;
  }
  .action-buttons .confirm-btn:hover {
    background:rgba(255,255,255,0.1);
    color:var(--ink);
  }
  .personality-panel {
    display:none;
    flex-direction:column;
    gap:12px;
    width:320px;
    max-width:360px;
    margin:0;
    padding:20px 18px;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:var(--radius-md);
    background:rgba(255,255,255,0.04);
    flex-shrink:0;
  }
  .personality-panel.visible {
    display:flex;
  }
  .personality-panel .field-heading {
    max-width:100%;
    justify-content:center;
  }
  .personality-slider-row {
    display:flex;
    align-items:center;
    gap:8px;
  }
  .personality-slider-row span {
    width:110px;
    font-size:12px;
    color:#ffffff;
  }
  .personality-slider-row span:first-child {
    text-align:right;
  }
  .personality-slider-row input[type="range"] {
    flex:1;
  }
  .personality-actions {
    display:flex;
    justify-content:flex-end;
    margin-top:8px;
  }
  .personality-subtext {
    font-size:13px;
    color:#a8a8a8;
    text-align:center;
  }
  /* Edit Form */
  .edit-form {
    display:none;
    flex-direction:column;
    gap:24px;
    width:100%;
    max-width:462px;
    padding:32px;
    border:0px solid var(--stroke);
    border-radius:var(--radius-lg);
    background:rgba(255, 255, 255, 0);
  }
  .edit-form.visible {
    display:flex;
  }
  .form-group {
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:-16px;
  }
  .form-label {
    font-size:16px;
    font-weight:600;
    color:var(--ink);
  }
  .form-input {
    padding:12px 16px;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:20px;
    background:transparent;
    color:var(--ink);
    font-size:16px;
    resize:vertical;
    min-height:44px;
  }
  .form-input:focus {
    outline:none;
    border-color:var(--muted);
    box-shadow:0 0 0 2px rgba(217,217,217,0.2);
  }
  .form-input::placeholder {
    color:#a8a8a8;
  }
  .form-textarea {
    min-height:calc(2 * 1.5em + 24px);
    font-family:inherit;
    width:398px !important;
    max-width:100%;
    box-sizing:border-box;
    overflow:hidden;
    resize:none;
  }
  .form-buttons {
    display:flex;
    gap:16px;
    justify-content:center;
    margin-top:-10px;
  }
  .form-btn {
    padding:12px 24px;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:800px;
    background:transparent;
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .form-btn:hover {
    background:rgba(255,255,255,0.1);
  }
  .form-btn:disabled {
    opacity:0.5;
    cursor:not-allowed;
  }
  /* Loading State */
  .loading {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:40px;
    text-align:center;
  }
  .loading.hidden {
    display:none;
  }
  .spinner {
    width:40px;
    height:40px;
    border:3px solid rgba(255,255,255,0.3);
    border-top:3px solid var(--ink);
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
  /* Error Message */
  .error-message {
    display:none;
    padding:16px;
    border:1px solid #ff6b6b;
    border-radius:var(--radius-md);
    background:rgba(255,107,107,0.1);
    color:#ff6b6b;
    text-align:center;
    margin-bottom:24px;
  }
  .error-message.visible {
    display:block;
  }
  
  /* History Panel */
  .history-panel {
    position:fixed;
    right:0;
    top:0;
    width:360px;
    height:100dvh;
    background:var(--bg);
    border-left:1px solid #333;
    transform:translateX(100%);
    transition:transform 0.3s ease;
    z-index:1000;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .history-panel.visible {
    transform:translateX(0);
  }
  .history-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px;
    border-bottom:1px solid #333;
  }
  .history-header h3 {
    margin:0;
    font-size:18px;
    font-weight:600;
  }
  .history-close-btn {
    background:transparent;
    border:none;
    color:var(--ink);
    font-size:24px;
    cursor:pointer;
    padding:4px 8px;
    line-height:1;
  }
  .history-close-btn:hover {
    opacity:0.7;
  }
  .history-content {
    flex:1;
    overflow-y:auto;
    padding:20px;
  }
  .history-grid {
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
  }
  .history-item {
    position:relative;
    cursor:pointer;
    border-radius:12px;
    overflow:hidden;
    border:2px solid transparent;
    transition:all 0.2s;
    background:#111;
  }
  .history-item:hover {
    border-color:rgba(255,255,255,0.3);
    transform:scale(1.02);
  }
  .history-item.current {
    border-color:var(--ink);
  }
  .history-item.current::after {
    content:'CURRENT';
    position:absolute;
    top:8px;
    left:8px;
    background:var(--ink);
    color:var(--bg);
    padding:4px 8px;
    border-radius:6px;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  .history-item img {
    width:100%;
    height:140px;
    object-fit:cover;
    display:block;
  }
  .history-item-info {
    padding:12px;
    font-size:12px;
  }
  .history-item-version {
    font-weight:600;
    margin-bottom:4px;
  }
  .history-item-type {
    color:var(--muted);
    font-size:11px;
    margin-bottom:2px;
  }
  .history-item-date {
    color:#666;
    font-size:10px;
  }
  .history-empty {
    text-align:center;
    color:#666;
    padding:40px 20px;
  }
  .history-toggle-btn {
    position:absolute;
    top:8px;
    right:8px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(0,0,0,0.5);
    border:1px solid rgba(255,255,255,0.3);
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    transition:all 0.2s;
    z-index:10;
    padding:0;
  }
  .history-toggle-btn img {
    width:24px;
    height:24px;
    object-fit:contain;
    filter:brightness(0) invert(1);
  }
  .history-toggle-btn:hover {
    background:rgba(0,0,0,0.7);
    transform:scale(1.05);
  }
  
  .personality-toggle-btn-top {
    top:60px;
  }
  
  .edit-appearance-btn-top {
    top:112px;
  }
  
  @media (max-width: 1024px) {
    .bot-preview {
      flex-direction:column;
      align-items:center;
      gap:24px;
    }
    .bot-preview.personality-visible .bot-preview-main {
      transform:none;
    }
    .personality-panel {
      width:100%;
      max-width:420px;
      margin-top:8px;
    }
  }
  /* Responsive Design */
  @media (max-width: 768px) {
    .main-content {
      padding:16px;
    }
    .bot-frame {
      width:250px;
      height:250px;
    }
    .personality-panel {
      width:100%;
      max-width:100%;
      padding:16px;
    }
    .personality-slider-row {
      gap:6px;
    }
    .personality-slider-row span {
      width:70px;
      font-size:11px;
    }
    .action-buttons {
      flex-direction:column;
      align-items:center;
      width:100%;
    }
    .edit-buttons-row {
      flex-direction:column;
      width:100%;
      align-items:center;
    }
    .action-buttons .action-btn {
      width:100%;
      max-width:300px;
    }
    .action-buttons .confirm-btn {
      max-width:300px;
    }
    .form-buttons {
      flex-direction:column;
    }
    .form-btn {
      width:100%;
    }
  }
  @media (max-width: 600px) {
    .user-email {
      display:none;
    }
    .logout-btn span {
      display:none;
    }
  }
</style>
</head>

<body>
  <div class="chat-container">
    <div class="sidebar">
      <div class="sidebar-nav">
        <img src="images/favicon.png" alt="Aeaea Logo" class="nav-logo" />
      </div>
      <div class="sidebar-actions">
        <a href="index.html" class="action-btn" title="Agent library">
          <img src="images/library_icon.png" alt="Agent Library" />
          <span class="action-label">Agent Library</span>
        </a>
        <a href="create.html" class="action-btn" title="Create new agent">
          <img src="images/creator_icon.png" alt="Create Agent" />
          <span class="action-label">Create New</span>
        </a>
        <a href="chat.html" class="action-btn" title="Go to chat">
          <img src="images/chat_icon.png" alt="Chat" />
          <span class="action-label">Chat</span>
        </a>
      </div>
      <div class="conversations">
        <!-- <div class="conversations-header">Edit Flow</div>
        <p class="sidebar-placeholder">Use the controls on the right to refine your bot.</p> -->
      </div>
      <div class="sidebar-bottom">
        <span id="userEmail" class="user-email">Loading...</span>
        <button id="logoutBtn" class="logout-btn" title="Sign out">
          <img src="images/logout_icon.png" alt="Logout" />
        </button>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="3" y="6" width="18" height="2" fill="#ffffff"/>
          <rect x="3" y="11" width="18" height="2" fill="#ffffff"/>
          <rect x="3" y="16" width="18" height="2" fill="#ffffff"/>
        </svg>
      </button>
      <div class="resize-handle" id="resizeHandle" title="Drag to resize sidebar"></div>
    </div>

    <div class="main-edit">
      <div class="screen dashboard">
        <!-- Main Content -->
        <div class="main-content">
      <!-- Error Message -->
      <div id="errorMessage" class="error-message"></div>

      <!-- Bot Preview -->
      <div id="botPreview" class="bot-preview">
        <div class="bot-preview-main">
          <div class="agent-name-field">
            <div class="field-heading">Agent Name <img class="icon" src="images/pencil_icon.png" alt="Edit" /></div>
            <textarea id="agentNameInput" rows="1" placeholder="Name your agent" aria-label="Agent name" disabled spellcheck="false">Loading...</textarea>
          </div>
          <div class="bot-frame">
            <div id="frameSpinner" class="frame-spinner"><div class="spinner"></div></div>
            <img id="botImage" src="" alt="Generated Agent" class="bot-image" />
            <video id="botVideo" src="" class="bot-image" loop muted playsinline style="display: none;"></video>

    function setPersonalityPanelVisibility(show) {

    function populatePersonalitySliders(traits) {
      if (!personalityPanel) return;
      const source = extractPersonalityTraits(traits);
      const sliderState = {};
      personalitySliderKeys.forEach(key => {
        const input = personalitySliderElements[key];
        if (!input) return;
        const storedValue = source ? source[key] : undefined;
        const sliderValue = percentToSlider(storedValue);
        input.value = sliderValue;
        sliderState[key] = sliderValue;
      });
      memorizePersonality(sliderState);
      updatePersonalitySaveState();
    }

    function extractPersonalityTraits(traits) {
      if (!traits || typeof traits !== 'object') return null;
      if (traits.persona_traits && typeof traits.persona_traits === 'object') return traits.persona_traits;
      if (traits.sliders_raw && typeof traits.sliders_raw === 'object') return traits.sliders_raw;
      if (traits.sliders && typeof traits.sliders === 'object') return traits.sliders;
      return null;
    }

    function getSliderState() {
      const state = {};
      personalitySliderKeys.forEach(key => {
        const input = personalitySliderElements[key];
        if (!input) {
          state[key] = 5;
          return;
        }
        const num = Number(input.value || 5);
        state[key] = clampSliderValue(num);
      });
      return state;
    }

    function memorizePersonality(values) {
      lastSavedPersonality = {};
      personalitySliderKeys.forEach(key => {
        lastSavedPersonality[key] = clampSliderValue(values?.[key]);
      });
    }

    function hasPersonalityChanges() {
      if (!lastSavedPersonality) return true;
      const current = getSliderState();
      return personalitySliderKeys.some(key => current[key] !== lastSavedPersonality[key]);
    }

    function updatePersonalitySaveState() {
      if (!savePersonalityBtn) return;
      if (!lastSavedPersonality) {
        savePersonalityBtn.disabled = true;
        return;
      }
      const dirty = hasPersonalityChanges();
      if (dirty && savePersonalityBtn.dataset.defaultText && savePersonalityBtn.textContent === 'Saved!') {
        savePersonalityBtn.textContent = savePersonalityBtn.dataset.defaultText;
      }
      savePersonalityBtn.disabled = isSavingPersonality || !dirty;
    }

    function clampSliderValue(value) {
      const num = Number(value);
      if (Number.isNaN(num)) return 5;
      return Math.max(1, Math.min(10, Math.round(num)));
    }

    function sliderToPercent(value) {
      const slider = clampSliderValue(value);
      return Math.round(((slider - 1) / 9) * 100);
    }

    function percentToSlider(value) {
      if (value === undefined || value === null || value === '') return 5;
      const num = Number(value);
      if (Number.isNaN(num)) return 5;
      if (num >= 1 && num <= 10) {
        return clampSliderValue(num);
      }
      const clamped = Math.max(0, Math.min(100, num));
      return clampSliderValue((clamped / 100) * 9 + 1);
    }

    async function savePersonalityChanges() {
      if (!currentBot || isSavingPersonality || !savePersonalityBtn) return;
      const sliderState = getSliderState();
      const sliders = {};
      personalitySliderKeys.forEach(key => {
        sliders[key] = sliderToPercent(sliderState[key]);
      });

      const defaultText = savePersonalityBtn.dataset.defaultText || 'Save Personality';
      if (!savePersonalityBtn.dataset.defaultText) {
        savePersonalityBtn.dataset.defaultText = defaultText;
      }

      try {
        isSavingPersonality = true;
        savePersonalityBtn.disabled = true;
        savePersonalityBtn.textContent = 'Saving...';

        const traits = (currentBot.traits && typeof currentBot.traits === 'object')
          ? { ...currentBot.traits }
          : {};
        traits.persona_traits = sliders;
        traits.sliders = sliders;
        traits.sliders_raw = sliders;

        const { data: updatedBot, error } = await supabase
          .from('avatars')
          .update({
            traits,
            updated_at: new Date().toISOString()
          })
          .eq('id', currentBot.id)
          .select()
          .single();

        if (error) throw error;

        currentBot = updatedBot;
        populatePersonalitySliders(updatedBot.traits);
        savePersonalityBtn.textContent = 'Saved!';
        setTimeout(() => {
          if (!isSavingPersonality) {
            savePersonalityBtn.textContent = savePersonalityBtn.dataset.defaultText || 'Save Personality';
          }
        }, 1500);
      } catch (error) {
        console.error('Error saving personality traits:', error);
        showError('Failed to save personality changes. Please try again.');
        savePersonalityBtn.textContent = savePersonalityBtn.dataset.defaultText || 'Save Personality';
      } finally {
        isSavingPersonality = false;
        updatePersonalitySaveState();
      }
    }

    function setupSidebarControls() {
      if (!sidebar || !sidebarToggle || !resizeHandle) return;

      const EDIT_SIDEBAR_WIDTH_KEY = 'editSidebarWidth';
      const EDIT_SIDEBAR_STATE_KEY = 'editSidebarCollapsed';

      const getStoredWidth = () => {
        const stored = parseInt(localStorage.getItem(EDIT_SIDEBAR_WIDTH_KEY) || '', 10);
        return Number.isNaN(stored) ? null : stored;
      };

      const expandSidebar = () => {
        const width = getStoredWidth() || 300;
        sidebar.classList.remove('collapsed');
        sidebar.style.width = `${width}px`;
        sidebarToggle.title = 'Collapse sidebar';
        localStorage.setItem(EDIT_SIDEBAR_STATE_KEY, 'false');
      };

      const collapseSidebar = (options = {}) => {
        const { saveWidth = true, persistState = true } = options;
        if (saveWidth) {
          const currentWidth = sidebar.offsetWidth;
          if (currentWidth) {
            localStorage.setItem(EDIT_SIDEBAR_WIDTH_KEY, Math.round(currentWidth));
          }
        }
        sidebar.classList.add('collapsed');
        sidebar.style.width = `${COLLAPSED_SIDEBAR_WIDTH}px`;
        sidebarToggle.title = 'Expand sidebar';
        if (persistState) {
          localStorage.setItem(EDIT_SIDEBAR_STATE_KEY, 'true');
        }
      };

      const savedState = localStorage.getItem(EDIT_SIDEBAR_STATE_KEY);
      const isMobile = window.innerWidth <= 768;
      
      // Always start collapsed (minimized) on page load
      collapseSidebar({ saveWidth: false, persistState: false });

      sidebarToggle.addEventListener('click', () => {
        if (sidebar.classList.contains('collapsed')) {
          expandSidebar();
        } else {
          collapseSidebar();
        }
      });

      resizeHandle.addEventListener('mousedown', (event) => {
        event.preventDefault();
        if (sidebar.classList.contains('collapsed')) {
          expandSidebar();
        }

        isSidebarResizing = true;
        sidebar.classList.add('resizing');
        resizeHandle.classList.add('resizing');
        const startX = event.clientX;
        const startWidth = sidebar.getBoundingClientRect().width;

        const handleMove = (e) => {
          if (!isSidebarResizing) return;
          let newWidth = startWidth + (e.clientX - startX);
          newWidth = Math.max(200, Math.min(newWidth, 600));
          sidebar.style.width = `${newWidth}px`;
          localStorage.setItem(EDIT_SIDEBAR_WIDTH_KEY, Math.round(newWidth));
        };

        const handleUp = () => {
          isSidebarResizing = false;
          sidebar.classList.remove('resizing');
          resizeHandle.classList.remove('resizing');
          document.removeEventListener('mousemove', handleMove);
          document.removeEventListener('mouseup', handleUp);
        };

        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleUp);
      });

      window.addEventListener('resize', () => {
        if (window.innerWidth > 768 && sidebar.classList.contains('collapsed')) {
          const storedState = localStorage.getItem(EDIT_SIDEBAR_STATE_KEY);
          if (storedState === 'false') {
            expandSidebar();
            return;
          }
        }
      });
    }

    function autosizeAgentName() {
      if (!agentNameInput) return;
      agentNameInput.style.height = 'auto';
      const newHeight = Math.max(agentNameInput.scrollHeight, 46);
      agentNameInput.style.height = `${newHeight}px`;
    }

    function setupNameField() {
      if (!agentNameInput) return;
      autosizeAgentName();
      agentNameInput.addEventListener('input', () => {
        autosizeAgentName();
        scheduleNameSave();
      });
      agentNameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          agentNameInput.blur();
        }
      });
      agentNameInput.addEventListener('blur', () => {
        if (nameSaveTimer) {
          clearTimeout(nameSaveTimer);
          nameSaveTimer = null;
        }
        persistAgentName(agentNameInput.value.trim());
      });
    }

    function scheduleNameSave(delay = 600) {
      if (!agentNameInput || !currentBot) return;
      latestNameDraft = agentNameInput.value;
      if (nameSaveTimer) clearTimeout(nameSaveTimer);
      nameSaveTimer = setTimeout(() => {
        persistAgentName(latestNameDraft);
      }, delay);
    }

    async function persistAgentName(name) {
      if (!agentNameInput || !currentBot) return;
      nameSaveTimer = null;
      const trimmed = (name || '').trim();
      if (!trimmed) {
        showError('Agent name cannot be empty.');
        agentNameInput.value = currentBot.name || 'Agent';
        autosizeAgentName();
        latestNameDraft = agentNameInput.value;
        return;
      }
      if (trimmed === currentBot.name) {
        latestNameDraft = currentBot.name || '';
        return;
      }
      if (isSavingName) {
        pendingNameValue = trimmed;
        return;
      }
      isSavingName = true;
      nameSaveTimer = null;

      try {
        const { data, error } = await supabase
          .from('avatars')
          .update({
            name: trimmed,
            updated_at: new Date().toISOString()
          })
          .eq('id', currentBot.id)
          .select()
          .single();

        if (error) throw error;

        currentBot = { ...currentBot, ...data };
        agentNameInput.value = currentBot.name || '';
        autosizeAgentName();
        botImage.alt = currentBot.name || 'Agent preview';
        latestNameDraft = currentBot.name || '';
      } catch (error) {
        console.error('Error updating agent name:', error);
        showError('Failed to update agent name. Please try again.');
        agentNameInput.value = currentBot?.name || '';
        autosizeAgentName();
        latestNameDraft = agentNameInput.value;
      } finally {
        isSavingName = false;
        if (pendingNameValue && currentBot && pendingNameValue !== currentBot.name) {
          const next = pendingNameValue;
          pendingNameValue = null;
          persistAgentName(next);
        } else {
          pendingNameValue = null;
        }
      }
    }

    }    // Upload video to Supabase storage
    async function uploadVideoToSupabase(videoUrl, userId, avatarName) {
      try {
        // Fetch the video from fal.ai
        const response = await fetch(videoUrl);
        if (!response.ok) throw new Error('Failed to fetch video');
        
        const blob = await response.blob();
        const path = `${userId}/${crypto.randomUUID()}-${avatarName.replace(/[^a-z0-9-_]+/gi, '_')}.mp4`;
        
        // Upload to Supabase storage
        const { error: uploadError } = await supabase.storage
          .from('avatars')
          .upload(path, blob, { 
            upsert: true, 
            contentType: 'video/mp4',
            cacheControl: '3600'
          });
          
        if (uploadError) throw uploadError;
        
        // Get public URL
        const { data } = supabase.storage
          .from('avatars')
          .getPublicUrl(path);
          
        const url = new URL(data.publicUrl);
        url.protocol = 'https:';
        
        console.log('✅ Video uploaded to Supabase:', url.toString());
        return url.toString();
        
      } catch (error) {
        console.error('Error uploading video to Supabase:', error);
        // Return original fal.ai URL as fallback
        return videoUrl;
      }
    }

    // Regenerate bot with edits
    async function regenerateBot() {
      const prompt = editPrompt.value.trim();
      if (!prompt) {
        showError('Please describe what you\'d like to change.');
        return;
      }

      if (isRegenerating) return;
      isRegenerating = true;

      try {
  // Show loading state and keep frame spinner centered
  setLoadingState(true);
  frameSpinner.classList.remove('hidden');
  botImage.classList.remove('visible');
        hideError();

        // Check freemium limits
        if (window.FreemiumUtils) {

            const plans = await window.FreemiumUtils.getSubscriptionPlans(supabase);
            await window.FreemiumUtils.showUpgradeModal(canCreateResult.subscriptionInfo, plans);

          }
        }

        // Call regeneration API
    const payload = {
            editPrompt: prompt,

      personalityPrompt: currentBot.traits?.personality_prompt,
      originalImage: currentBot.image_url

        console.log('🔧 Regenerate payload:', payload);
        const response = await fetch('/api/regenerate-avatar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },

        });

        const result = await response.json().catch(() => ({}));
        console.log('🔧 Regenerate response:', { status: response.status, ok: response.ok, resultPreview: JSON.stringify(result).slice(0, 400) });
        
        if (!response.ok || !result.dataUrl) {
          console.error('Regeneration API error:', result);

  // Update the bot image and data

      } catch (error) {

    // Update bot image after regeneration
    async function updateBotImage(result) {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return;

        // Upload new image
        const url = await uploadAvatarImage({
          dataUrl: result.dataUrl,
          userId: user.id,
          fileName: `${currentBot.name}-edit.png`
        });

        // Save current version to history before updating
        if (window.AvatarHistory && currentBot.image_url) {
          const editPromptText = editPrompt.value.trim();
          await window.AvatarHistory.addToHistory(
            supabase,
            currentBot.id,
            url,
            'regenerate',
            editPromptText,
            currentBot.traits
          );
        }

        // Update database
        const { data: updatedBot, error } = await supabase
          .from('avatars')
          .update({ 
            image_url: url,
            updated_at: new Date().toISOString()
          })
          .eq('id', currentBot.id)
          .select()
          .single();

        if (error) {
          console.error('Error updating bot:', error);
          throw error;
        }

        // Update display
        currentBot = updatedBot;
        displayBot(updatedBot);
        
        // Reload history to show the new version

    // Utility functions
    function setLoadingState(loading) {
      if (loading) {
        // Remember whether the edit form was visible before loading
        wasEditFormVisible = editForm.classList.contains('visible');
  loadingState.classList.remove('hidden');
  frameSpinner.classList.remove('hidden');
  botImage.classList.remove('visible');
        if (agentNameInput) agentNameInput.disabled = true;
        editForm.classList.remove('visible');
        actionButtons.style.display = 'none';
      } else {
        loadingState.classList.add('hidden');
  if (wasEditFormVisible) {
          editForm.classList.add('visible');
        } else {
          editForm.classList.remove('visible');
          actionButtons.style.display = 'flex';

    function showError(message) {
      errorMessage.textContent = message;

      setTimeout(() => {

    }

    function hideError() {
      errorMessage.classList.remove('visible');
    }

    // Image upload helper
    function dataUrlToBlob(dataUrl) {
      const [meta, b64] = dataUrl.split(",");
      const mime = meta.match(/data:(.*?);base64/)[1] || "image/png";
      const bin = atob(b64), len = bin.length;
      const bytes = new Uint8Array(len);
      for(let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    }

    async function uploadAvatarImage({ dataUrl, userId, fileName = "avatar.png" }) {
      try {
        let blob;
        if (/^data:.*;base64,/.test(dataUrl)) {
          blob = dataUrlToBlob(dataUrl);
        } else if (typeof dataUrl === 'string' && dataUrl.startsWith('http')) {
          const resp = await fetch(dataUrl);
          if (!resp.ok) throw new Error('Failed to fetch image from URL');
          blob = await resp.blob();
        } else {
          throw new Error('Unsupported image format');
        }
        const path = `${userId}/${crypto.randomUUID()}-${fileName}`;
        
        const { error: upErr } = await supabase.storage.from("avatars")
          .upload(path, blob, { 
            upsert: true, 
            contentType: blob.type,
            cacheControl: '3600'
          });
        if (upErr) throw upErr;
        
        const { data } = supabase.storage.from("avatars")
          .getPublicUrl(path, {
            download: false,
            transform: {
              width: 333,
              height: 333,
              resize: 'cover'
            }
          });
          
        const url = new URL(data.publicUrl);
        url.protocol = 'https:';
        return url.toString();
      } catch (err) {
        console.error('Error in uploadAvatarImage:', err);
        throw err;
      }
    }

    // ===== History Functions =====
    
    // Load and display history
    async function loadHistory() {
      const historyGrid = document.getElementById('historyGrid');
      
      if (!currentBot) {
        historyGrid.innerHTML = '<div class="history-empty">No avatar loaded</div>';
        return;
      }
      
      if (!window.AvatarHistory) {
        historyGrid.innerHTML = '<div class="history-empty">History feature not available</div>';
        return;
      }
      
      try {
        const { success, history, error } = await window.AvatarHistory.getHistory(
          supabase,
          currentBot.id,
          20
        );

        if (success) {
          if (history && history.length > 0) {
            displayHistory(history);
          } else {
            historyGrid.innerHTML = '<div class="history-empty">No edit history yet<br><br><small>History will be created when you regenerate this avatar</small></div>';
          }
        } else {
          console.error('Failed to load history:', error);
          // Check if it's a missing function error (migration not run)
          if (error && error.message && error.message.includes('function') && error.message.includes('does not exist')) {
            historyGrid.innerHTML = '<div class="history-empty" style="color:#ff6b6b;">⚠️ Database migration required<br><br><small>Please run avatar-history-migration.sql in Supabase SQL Editor</small></div>';
          } else {
            historyGrid.innerHTML = '<div class="history-empty" style="color:#ff6b6b;">Failed to load history<br><br><small>' + (error.message || 'Unknown error') + '</small></div>';
          }
        }
      } catch (error) {
        console.error('Error loading history:', error);
        historyGrid.innerHTML = '<div class="history-empty" style="color:#ff6b6b;">Error loading history<br><br><small>' + error.message + '</small></div>';
      }
    }

    // Display history in the panel
    function displayHistory(history) {
      const historyGrid = document.getElementById('historyGrid');
      
      if (!history || history.length === 0) {
        historyGrid.innerHTML = '<div class="history-empty">No edit history yet</div>';
        return;
      }

      historyGrid.innerHTML = '';
      
      history.forEach(item => {
        const div = document.createElement('div');
        div.className = `history-item ${item.is_current ? 'current' : ''}`;
        
        const createdDate = new Date(item.created_at);
        const typeLabel = {
          'initial': 'Initial',
          'regenerate': 'Regenerated',
          'edit': 'Edited',
          'restore': 'Restored'
        }[item.created_from] || item.created_from;
        
        div.innerHTML = `
          <img src="${item.image_url}" alt="Version ${item.version_number}" loading="lazy" />
          <div class="history-item-info">
            <div class="history-item-version">Version ${item.version_number}</div>
            <div class="history-item-type">${typeLabel}</div>
            ${item.edit_prompt ? `<div class="history-item-type">"${item.edit_prompt.substring(0, 30)}${item.edit_prompt.length > 30 ? '...' : ''}"</div>` : ''}
            <div class="history-item-date">${createdDate.toLocaleDateString()} ${createdDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
          </div>
        `;

        if (!item.is_current) {
          div.addEventListener('click', async () => {
            if (confirm(`Restore version ${item.version_number}? This will replace the current image.`)) {
              await restoreHistoryVersion(item.id);
            }
          });
        }

        historyGrid.appendChild(div);
      });
    }

    // Restore a history version
    async function restoreHistoryVersion(historyId) {
      if (!currentBot || !window.AvatarHistory) return;
      
      try {
        setLoadingState(true);
        
        const { success, error } = await window.AvatarHistory.restoreVersion(
          supabase,
          currentBot.id,
          historyId
        );

        if (success) {
          // Reload the bot data
          const { data: updatedBot, error: fetchError } = await supabase
            .from('avatars')
            .select('*')
            .eq('id', currentBot.id)
            .single();

          if (!fetchError && updatedBot) {
            currentBot = updatedBot;
            displayBot(updatedBot);
            await loadHistory();
          }
        } else {
          console.error('Failed to restore version:', error);
          showError('Failed to restore version. Please try again.');
        }
      } catch (error) {
        console.error('Error restoring version:', error);
        showError('Failed to restore version. Please try again.');
      } finally {
        setLoadingState(false);
      }
    }

    // Toggle history panel
    function toggleHistoryPanel() {
      const historyPanel = document.getElementById('historyPanel');
      historyPanel.classList.toggle('visible');
      
      // Load history when opening
      if (historyPanel.classList.contains('visible')) {
        loadHistory();
      }
    }

    // Initialize the page
    initializePage();
