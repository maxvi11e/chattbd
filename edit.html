<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeaea — Edit</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>

  :root {
    --bg:#000;
    --ink:#fff;
    --muted:#d9d9d9;
    --bubble:#333;
    --stroke:#fff;
    --radius-lg:24px;
    --radius-md:14px;
  }
  * {
    box-sizing:border-box;
  }
  html,body {
    height:100%;
  }
  body {
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  }
  .screen {
    min-height:100dvh;
    width:100%;
  }
  /* ===== Dashboard ===== */
  .dashboard {
    padding:0;
    min-height:100dvh;
  }
  /* Layout */
  .chat-container {
    display:flex;
    min-height:100dvh;
  }
  .sidebar {
    width:300px;
    background:var(--bg);
    border-right:1px solid #333;
    display:flex;
    flex-direction:column;
    transition:width 0.3s ease;
    position:relative;
    min-width:200px;
    max-width:600px;
  }
  .sidebar.collapsed {
    width:44px !important;
    min-width:44px !important;
    overflow:hidden;
  }
  .sidebar.resizing {
    transition:none;
  }
  .sidebar-bottom {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px;
    border-top:0px solid #333;
  }
  .sidebar *::-webkit-scrollbar {
    width:12px;
  }
  .sidebar *::-webkit-scrollbar-track {
    background:#000 !important;
  }
  .sidebar *::-webkit-scrollbar-thumb {
    background:var(--stroke);
    border-radius:999px;
  }
  .sidebar-nav {
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .nav-logo {
    height:44px;
    width:auto;
  }
  .sidebar-actions {
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .action-btn {
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:12px 16px;
    background:transparent;
    border:none;
    border-radius:8px;
    color:var(--ink);
    cursor:pointer;
    font-size:14px;
    text-decoration:none;
  }
  .action-btn:hover {
    background:rgba(255,255,255,0.1);
  }
  .action-btn img {
    width:16px;
    height:16px;
  }
  .action-btn .action-label {
    display:inline-flex;
    align-items:center;
  }
  .conversations {
    flex:1;
    overflow-y:auto;
    padding:0 16px 16px;
  }
  .sidebar.collapsed .conversations {
    display:none;
  }
  .conversations-header {
    font-size:14px;
    font-weight:300;
    font-style:italic;
    color:#dddddd;
    margin-bottom:12px;
    padding-left:16px;
  }
  .sidebar-placeholder {
    color:var(--muted);
    font-size:13px;
    padding:0 16px;
    margin:0;
    line-height:1.5;
  }
  .user-email {
    color:var(--ink);
    font-size:14px;
  }
  .logout-btn {
    padding:6px 12px;
    border:0px solid var(--stroke);
    background:transparent;
    color:var(--ink);
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .logout-btn:hover {
    background:rgba(255,255,255,0.1);
  }
  .logout-btn img {
    width:24px;
    height:24px;
  }
  .sidebar.collapsed .logout-btn img {
    width:20px;
    height:20px;
  }
  .sidebar.collapsed .sidebar-nav {
    justify-content:center;
    padding:16px 0 0 0;
  }
  .sidebar.collapsed .nav-logo {
    height:28px;
  }
  .sidebar.collapsed .sidebar-actions {
    padding:12px 8px;
    align-items:center;
  }
  .sidebar.collapsed .action-btn {
    justify-content:center;
    padding:10px 0;
    gap:0;
  }
  .sidebar.collapsed .action-btn .action-label {
    display:none;
  }
  .sidebar.collapsed .action-btn img {
    width:20px;
    height:20px;
  }
  .sidebar.collapsed .sidebar-bottom {
    padding:12px 8px;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .sidebar.collapsed .sidebar-bottom .user-email {
    display:none;
  }
  .sidebar.collapsed .logout-btn {
    padding:8px 0;
  }
  .resize-handle {
    position:absolute;
    top:0;
    right:-3px;
    width:6px;
    height:100%;
    cursor:col-resize;
    background:transparent;
    z-index:10;
  }
  .resize-handle:hover {
    background:rgba(255,255,255,0.1);
  }
  .resize-handle.resizing {
    background:rgba(255,255,255,0.2);
  }
  .main-edit {
    flex:1;
    position:relative;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .sidebar-toggle {
    position:fixed;
    top:32px;
    left:260px;
    width:32px;
    height:32px;
    background:transparent;
    border:none;
    border-radius:8px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    z-index:1000;
    transition:left 0.3s ease;
  }
  .sidebar-toggle:hover {
    background:transparent;
  }
  .sidebar-toggle:focus {
    outline:none;
  }
  .sidebar.resizing + .main-edit .sidebar-toggle {
    transition:none;
  }
  /* Main Content */
  .main-content {
    padding:24px;
    max-width:1200px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  /* Page Title */
  .page-header {
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:40px;
    justify-content:center;
  }
  .page-icon {
    height:40px;
    width:auto;
  }
  .page-title {
    font-size:32px;
    font-weight:600;
    margin:0;
  }
  /* Bot Preview */
  .bot-preview {
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:28px;
    margin-bottom:0px;
    transition:gap 0.35s ease;
    flex-wrap:nowrap;
  }
  .bot-preview-main {
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform 0.35s ease;
  }
  .bot-preview.personality-visible .bot-preview-main {
    transform:translateX(-24px);
  }
  .bot-frame {
    width:400px;
    height:400px;
    border-radius:var(--radius-lg);
    border:1px solid #333;
    background:transparent;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .bot-image {
    width:100%;
    height:100%;
    border-radius:var(--radius-lg);
    object-fit:cover;
    display:none;
  }
  .bot-image.visible {
    display:block;
  }
  .frame-spinner {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame-spinner.hidden {
    display:none;
  }
  .agent-name-field {
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .field-heading {
    color:#a8a8a8;
    font-style:italic;
    text-align:left;
    align-self:flex-start;
    width:100%;
    max-width:400px;
    font-size:14px;
    margin:12px 0 2px 0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .agent-name-field .field-heading {
    align-self:center;
  }
  .field-heading img.icon {
    width:18px;
    height:18px;
    opacity:0.95;
  }
  #agentNameInput {
    width:100%;
    max-width:400px;
    background:transparent;
    border:1px solid var(--stroke);
    color:var(--ink);
    border-radius:24.5px;
    padding:11px 18px;
    font-size:20px;
    font-weight:600;
    line-height:1.3;
    min-height:46px;
    resize:none;
    overflow:hidden;
    text-align:center;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
    font-family:inherit;
  }
  #agentNameInput:focus {
    outline:none;
    border-color:var(--ink);
    box-shadow:0 0 0 1px var(--ink);
  }
  #agentNameInput[disabled] {
    opacity:0.6;
    cursor:not-allowed;
  }
  /* Action Buttons */
  .action-buttons {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin:24px 0 0;
    width:200px;
    align-self:center;
  }
  .action-btn {
    padding:16px 32px;
    border:none;
    border-radius:var(--radius-md);
    background:transparent;
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:all 0.2s ease;
    min-width:140px;
    text-align:center;
  }
  .action-btn:hover {
    background:rgba(255, 255, 255, 0.18);
    transform:translateY(-2px);
  }
  .confirm-btn {
    background:var(--ink);
    color:var(--bg);
  }
  .confirm-btn:hover {
    background:var(--muted);
    color:var(--bg);
  }
  .personality-panel {
    display:none;
    flex-direction:column;
    gap:12px;
    width:320px;
    max-width:360px;
    margin:0;
    padding:20px 18px;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:var(--radius-md);
    background:rgba(255,255,255,0.04);
    flex-shrink:0;
  }
  .personality-panel.visible {
    display:flex;
  }
  .personality-panel .field-heading {
    max-width:100%;
    justify-content:center;
  }
  .personality-slider-row {
    display:flex;
    align-items:center;
    gap:8px;
  }
  .personality-slider-row span {
    width:110px;
    font-size:12px;
    color:#ffffff;
  }
  .personality-slider-row span:first-child {
    text-align:right;
  }
  .personality-slider-row input[type="range"] {
    flex:1;
  }
  .personality-actions {
    display:flex;
    justify-content:flex-end;
    margin-top:8px;
  }
  .personality-subtext {
    font-size:13px;
    color:#a8a8a8;
    text-align:center;
  }
  /* Edit Form */
  .edit-form {
    display:none;
    flex-direction:column;
    gap:24px;
    width:100%;
    max-width:600px;
    padding:32px;
    border:0px solid var(--stroke);
    border-radius:var(--radius-lg);
    background:rgba(255, 255, 255, 0);
  }
  .edit-form.visible {
    display:flex;
  }
  .form-group {
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .form-label {
    font-size:16px;
    font-weight:600;
    color:var(--ink);
  }
  .form-input {
    padding:12px 16px;
    border:1px solid var(--stroke);
    border-radius:var(--radius-md);
    background:transparent;
    color:var(--ink);
    font-size:16px;
    resize:vertical;
    min-height:44px;
  }
  .form-input:focus {
    outline:none;
    border-color:var(--muted);
    box-shadow:0 0 0 2px rgba(217,217,217,0.2);
  }
  .form-input::placeholder {
    color:#a8a8a8;
  }
  .form-textarea {
    min-height:120px;
    font-family:inherit;
  }
  .form-buttons {
    display:flex;
    gap:16px;
    justify-content:center;
  }
  .form-btn {
    padding:12px 24px;
    border:1px solid var(--stroke);
    border-radius:var(--radius-md);
    background:transparent;
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .form-btn:hover {
    background:rgba(255,255,255,0.1);
  }
  .form-btn:disabled {
    opacity:0.5;
    cursor:not-allowed;
  }
  .regenerate-btn {
    background:var(--ink);
    color:var(--bg);
  }
  .regenerate-btn:hover:not(:disabled) {
    background:var(--muted);
  }
  /* Loading State */
  .loading {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:40px;
    text-align:center;
  }
  .loading.hidden {
    display:none;
  }
  .spinner {
    width:40px;
    height:40px;
    border:3px solid rgba(255,255,255,0.3);
    border-top:3px solid var(--ink);
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
  /* Error Message */
  .error-message {
    display:none;
    padding:16px;
    border:1px solid #ff6b6b;
    border-radius:var(--radius-md);
    background:rgba(255,107,107,0.1);
    color:#ff6b6b;
    text-align:center;
    margin-bottom:24px;
  }
  .error-message.visible {
    display:block;
  }
  @media (max-width: 1024px) {
    .bot-preview {
      flex-direction:column;
      align-items:center;
      gap:24px;
    }
    .bot-preview.personality-visible .bot-preview-main {
      transform:none;
    }
    .personality-panel {
      width:100%;
      max-width:420px;
      margin-top:8px;
    }
  }
  /* Responsive Design */
  @media (max-width: 768px) {
    .main-content {
      padding:16px;
    }
    .bot-frame {
      width:250px;
      height:250px;
    }
    .action-buttons {
      flex-direction:column;
      align-items:center;
    }
    .action-btn {
      width:200px;
    }
    .form-buttons {
      flex-direction:column;
    }
    .form-btn {
      width:100%;
    }
    .sidebar-toggle {
      left:200px;
      top:24px;
    }
  }
  @media (max-width: 600px) {
    .user-email {
      display:none;
    }
    .logout-btn {
      display:none !important;
    }
    .sidebar-toggle {
      left:0;
    }
  }
</style>
</head>

<body>
  <div class="chat-container">
    <div class="sidebar">
      <div class="sidebar-nav">

      <div class="screen dashboard">

      <!-- Edit Form -->

      <!-- Action Buttons -->

      </div>

  </div>

  <script>
    // Initialize Supabase
    const supabaseUrl = 'https://eyptqyzkwcpaillnwmle.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    const COLLAPSED_SIDEBAR_WIDTH = 44;

    // Auth check function
    async function checkAuthAndRedirect() {
      console.log('🔐 Checking authentication...');
      const { data: { session } } = await supabase.auth.getSession();
      
      console.log('🔐 Auth check result:', { 
        session: session ? 'Found' : 'None', 
        user: session?.user?.email
      });
      
      if (!session) {
        console.log('❌ No session found, redirecting to auth');
        window.location.href = 'auth.html';
        return false;
      }
      
      console.log('✅ User authenticated:', session.user.email);
      await loadUserProfile(session.user);
      return true;
    }

    // Load user profile
    async function loadUserProfile(user) {
      try {
        const { data: profile, error } = await supabase
          .from('profiles')
          .select('display_name')
          .eq('id', user.id)
          .single();

        if (error) {
          console.error('Error loading profile:', error);
          document.getElementById('userEmail').textContent = user.email;
        } else {
          document.getElementById('userEmail').textContent = profile?.display_name || user.email;
        }
      } catch (error) {
        console.error('Error in loadUserProfile:', error);
        document.getElementById('userEmail').textContent = user.email;
      }
    }

    // Global variables
    let currentBot = null;
    let isRegenerating = false;
  let wasEditFormVisible = false;
  let nameSaveTimer = null;
  let pendingNameValue = null;
  let latestNameDraft = '';
  let isSavingName = false;

    // DOM elements
  const botImage = document.getElementById('botImage');
  const frameSpinner = document.getElementById('frameSpinner');
    const agentNameInput = document.getElementById('agentNameInput');
    const botPreview = document.getElementById('botPreview');
    const editBtn = document.getElementById('editBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const editForm = document.getElementById('editForm');
    const actionButtons = document.getElementById('actionButtons');
    const editPrompt = document.getElementById('editPrompt');
    const cancelEdit = document.getElementById('cancelEdit');
    const regenerateBtn = document.getElementById('regenerateBtn');

  // Enter loading state like regenerate

        editForm.classList.remove('visible');

    function setupPersonalityEditor() {
      if (!personalityPanel || !personalityToggleBtn) return;
      setPersonalityPanelVisibility(false);
      personalityToggleBtn.setAttribute('aria-expanded', 'false');
      if (savePersonalityBtn && !savePersonalityBtn.dataset.defaultText) {
        savePersonalityBtn.dataset.defaultText = savePersonalityBtn.textContent;
      }
      memorizePersonality(getSliderState());
      updatePersonalitySaveState();
    }

    function togglePersonalityPanel() {
      if (!personalityPanel) return;
      const shouldShow = !personalityPanel.classList.contains('visible');
      setPersonalityPanelVisibility(shouldShow);
      if (shouldShow) {
        populatePersonalitySliders(currentBot?.traits);
      }
    }

    function setPersonalityPanelVisibility(show) {
      if (!personalityPanel || !personalityToggleBtn) return;
      if (show) {
        personalityPanel.classList.add('visible');
        personalityPanel.setAttribute('aria-hidden', 'false');
        personalityToggleBtn.setAttribute('aria-expanded', 'true');
        personalityToggleBtn.textContent = 'Hide Personality';
        if (botPreview) botPreview.classList.add('personality-visible');
      } else {
        personalityPanel.classList.remove('visible');
        personalityPanel.setAttribute('aria-hidden', 'true');
        personalityToggleBtn.setAttribute('aria-expanded', 'false');
        personalityToggleBtn.textContent = 'Edit Personality';
        if (botPreview) botPreview.classList.remove('personality-visible');
      }
    }

    function populatePersonalitySliders(traits) {
      if (!personalityPanel) return;
      const source = extractPersonalityTraits(traits);
      const sliderState = {};
      personalitySliderKeys.forEach(key => {
        const input = personalitySliderElements[key];
        if (!input) return;
        const storedValue = source ? source[key] : undefined;
        const sliderValue = percentToSlider(storedValue);
        input.value = sliderValue;
        sliderState[key] = sliderValue;
      });
      memorizePersonality(sliderState);
      updatePersonalitySaveState();
    }

    function extractPersonalityTraits(traits) {
      if (!traits || typeof traits !== 'object') return null;
      if (traits.persona_traits && typeof traits.persona_traits === 'object') return traits.persona_traits;
      if (traits.sliders_raw && typeof traits.sliders_raw === 'object') return traits.sliders_raw;
      if (traits.sliders && typeof traits.sliders === 'object') return traits.sliders;
      return null;
    }

    function getSliderState() {
      const state = {};
      personalitySliderKeys.forEach(key => {
        const input = personalitySliderElements[key];
        if (!input) {
          state[key] = 5;
          return;
        }
        const num = Number(input.value || 5);
        state[key] = clampSliderValue(num);
      });
      return state;
    }

    function memorizePersonality(values) {
      lastSavedPersonality = {};
      personalitySliderKeys.forEach(key => {
        lastSavedPersonality[key] = clampSliderValue(values?.[key]);
      });
    }

    function hasPersonalityChanges() {
      if (!lastSavedPersonality) return true;
      const current = getSliderState();
      return personalitySliderKeys.some(key => current[key] !== lastSavedPersonality[key]);
    }

    function updatePersonalitySaveState() {
      if (!savePersonalityBtn) return;
      if (!lastSavedPersonality) {
        savePersonalityBtn.disabled = true;
        return;
      }
      const dirty = hasPersonalityChanges();
      if (dirty && savePersonalityBtn.dataset.defaultText && savePersonalityBtn.textContent === 'Saved!') {
        savePersonalityBtn.textContent = savePersonalityBtn.dataset.defaultText;
      }
      savePersonalityBtn.disabled = isSavingPersonality || !dirty;
    }

    function clampSliderValue(value) {
      const num = Number(value);
      if (Number.isNaN(num)) return 5;
      return Math.max(1, Math.min(10, Math.round(num)));
    }

    function sliderToPercent(value) {
      const slider = clampSliderValue(value);
      return Math.round(((slider - 1) / 9) * 100);
    }

    function percentToSlider(value) {
      if (value === undefined || value === null || value === '') return 5;
      const num = Number(value);
      if (Number.isNaN(num)) return 5;
      if (num >= 1 && num <= 10) {
        return clampSliderValue(num);
      }
      const clamped = Math.max(0, Math.min(100, num));
      return clampSliderValue((clamped / 100) * 9 + 1);
    }

    async function savePersonalityChanges() {
      if (!currentBot || isSavingPersonality || !savePersonalityBtn) return;
      const sliderState = getSliderState();
      const sliders = {};
      personalitySliderKeys.forEach(key => {
        sliders[key] = sliderToPercent(sliderState[key]);
      });

      const defaultText = savePersonalityBtn.dataset.defaultText || 'Save Personality';
      if (!savePersonalityBtn.dataset.defaultText) {
        savePersonalityBtn.dataset.defaultText = defaultText;
      }

      try {
        isSavingPersonality = true;
        savePersonalityBtn.disabled = true;
        savePersonalityBtn.textContent = 'Saving...';

        const traits = (currentBot.traits && typeof currentBot.traits === 'object')
          ? { ...currentBot.traits }
          : {};
        traits.persona_traits = sliders;
        traits.sliders = sliders;
        traits.sliders_raw = sliders;

        const { data: updatedBot, error } = await supabase
          .from('avatars')
          .update({
            traits,
            updated_at: new Date().toISOString()
          })
          .eq('id', currentBot.id)
          .select()
          .single();

        if (error) throw error;

        currentBot = updatedBot;
        populatePersonalitySliders(updatedBot.traits);
        savePersonalityBtn.textContent = 'Saved!';
        setTimeout(() => {
          if (!isSavingPersonality) {
            savePersonalityBtn.textContent = savePersonalityBtn.dataset.defaultText || 'Save Personality';
          }
        }, 1500);
      } catch (error) {
        console.error('Error saving personality traits:', error);
        showError('Failed to save personality changes. Please try again.');
        savePersonalityBtn.textContent = savePersonalityBtn.dataset.defaultText || 'Save Personality';
      } finally {
        isSavingPersonality = false;
        updatePersonalitySaveState();
      }
    }

    function setupSidebarControls() {
      if (!sidebar || !sidebarToggle || !resizeHandle) return;

      const EDIT_SIDEBAR_WIDTH_KEY = 'editSidebarWidth';
      const EDIT_SIDEBAR_STATE_KEY = 'editSidebarCollapsed';

      const getStoredWidth = () => {
        const stored = parseInt(localStorage.getItem(EDIT_SIDEBAR_WIDTH_KEY) || '', 10);
        return Number.isNaN(stored) ? null : stored;
      };

      const expandSidebar = () => {
        const width = getStoredWidth() || 300;
        sidebar.classList.remove('collapsed');
        sidebar.style.width = `${width}px`;
        setTogglePosition(width);
        sidebarToggle.title = 'Collapse sidebar';
        localStorage.setItem(EDIT_SIDEBAR_STATE_KEY, 'false');
      };

      const collapseSidebar = (options = {}) => {
        const { saveWidth = true, persistState = true } = options;
        if (saveWidth) {
          const currentWidth = sidebar.offsetWidth;
          if (currentWidth) {
            localStorage.setItem(EDIT_SIDEBAR_WIDTH_KEY, Math.round(currentWidth));
          }
        }
        sidebar.classList.add('collapsed');
        sidebar.style.width = `${COLLAPSED_SIDEBAR_WIDTH}px`;
        setTogglePosition(COLLAPSED_SIDEBAR_WIDTH);
        sidebarToggle.title = 'Expand sidebar';
        if (persistState) {
          localStorage.setItem(EDIT_SIDEBAR_STATE_KEY, 'true');
        }
      };

      const savedState = localStorage.getItem(EDIT_SIDEBAR_STATE_KEY);
      const isMobile = window.innerWidth <= 768;
      if (savedState === 'false' && !isMobile) {
        expandSidebar();
      } else if (savedState === 'true') {
        collapseSidebar({ saveWidth: false, persistState: false });
      } else {
        collapseSidebar({ saveWidth: false, persistState: false });
      }

      sidebarToggle.addEventListener('click', () => {
        if (sidebar.classList.contains('collapsed')) {
          expandSidebar();
        } else {
          collapseSidebar();
        }
      });

      resizeHandle.addEventListener('mousedown', (event) => {
        event.preventDefault();
        if (sidebar.classList.contains('collapsed')) {
          expandSidebar();
        }

        isSidebarResizing = true;
        sidebar.classList.add('resizing');
        const startX = event.clientX;
        const startWidth = sidebar.getBoundingClientRect().width;

        const handleMove = (e) => {
          if (!isSidebarResizing) return;
          let newWidth = startWidth + (e.clientX - startX);
          newWidth = Math.max(200, Math.min(newWidth, 600));
          sidebar.style.width = `${newWidth}px`;
          localStorage.setItem(EDIT_SIDEBAR_WIDTH_KEY, Math.round(newWidth));
          setTogglePosition(newWidth);
        };

        const handleUp = () => {
          isSidebarResizing = false;
          sidebar.classList.remove('resizing');
          document.removeEventListener('mousemove', handleMove);
          document.removeEventListener('mouseup', handleUp);
        };

        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleUp);
      });

      window.addEventListener('resize', () => {
        if (window.innerWidth > 768 && sidebar.classList.contains('collapsed')) {
          const storedState = localStorage.getItem(EDIT_SIDEBAR_STATE_KEY);
          if (storedState === 'false') {
            expandSidebar();
            return;
          }
        }

        const width = sidebar.classList.contains('collapsed') ? COLLAPSED_SIDEBAR_WIDTH : sidebar.offsetWidth;
        setTogglePosition(width);
      });
    }

    function autosizeAgentName() {
      if (!agentNameInput) return;
      agentNameInput.style.height = 'auto';
      const newHeight = Math.max(agentNameInput.scrollHeight, 46);
      agentNameInput.style.height = `${newHeight}px`;
    }

    function setupNameField() {
      if (!agentNameInput) return;
      autosizeAgentName();
      agentNameInput.addEventListener('input', () => {
        autosizeAgentName();
        scheduleNameSave();
      });
      agentNameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          agentNameInput.blur();
        }
      });
      agentNameInput.addEventListener('blur', () => {
        if (nameSaveTimer) {
          clearTimeout(nameSaveTimer);
          nameSaveTimer = null;
        }
        persistAgentName(agentNameInput.value.trim());
      });
    }

    function scheduleNameSave(delay = 600) {
      if (!agentNameInput || !currentBot) return;
      latestNameDraft = agentNameInput.value;
      if (nameSaveTimer) clearTimeout(nameSaveTimer);
      nameSaveTimer = setTimeout(() => {
        persistAgentName(latestNameDraft);
      }, delay);
    }

    async function persistAgentName(name) {
      if (!agentNameInput || !currentBot) return;
      nameSaveTimer = null;
      const trimmed = (name || '').trim();
      if (!trimmed) {
        showError('Agent name cannot be empty.');
        agentNameInput.value = currentBot.name || 'Agent';
        autosizeAgentName();
        latestNameDraft = agentNameInput.value;
        return;
      }
      if (trimmed === currentBot.name) {
        latestNameDraft = currentBot.name || '';
        return;
      }
      if (isSavingName) {
        pendingNameValue = trimmed;
        return;
      }
      isSavingName = true;
      nameSaveTimer = null;

      try {
        const { data, error } = await supabase
          .from('avatars')
          .update({
            name: trimmed,
            updated_at: new Date().toISOString()
          })
          .eq('id', currentBot.id)
          .select()
          .single();

        if (error) throw error;

        currentBot = { ...currentBot, ...data };
        agentNameInput.value = currentBot.name || '';
        autosizeAgentName();
        botImage.alt = currentBot.name || 'Agent preview';
        latestNameDraft = currentBot.name || '';
      } catch (error) {
        console.error('Error updating agent name:', error);
        showError('Failed to update agent name. Please try again.');
        agentNameInput.value = currentBot?.name || '';
        autosizeAgentName();
        latestNameDraft = agentNameInput.value;
      } finally {
        isSavingName = false;
        if (pendingNameValue && currentBot && pendingNameValue !== currentBot.name) {
          const next = pendingNameValue;
          pendingNameValue = null;
          persistAgentName(next);
        } else {
          pendingNameValue = null;
        }
      }
    }

    function setTogglePosition(width) {
      if (!sidebarToggle) return;
      const collapsedWidth = COLLAPSED_SIDEBAR_WIDTH;
      const isCollapsed = sidebar.classList.contains('collapsed');
      let effectiveWidth = width;
      if (!effectiveWidth || Number.isNaN(effectiveWidth)) {
        effectiveWidth = isCollapsed ? collapsedWidth : (sidebar.offsetWidth || 300);
      }
      if (window.innerWidth <= 768) {
        sidebarToggle.style.left = `${collapsedWidth}px`;
        return;
      }
      const offset = isCollapsed ? collapsedWidth : Math.max(effectiveWidth - 40, collapsedWidth);
      sidebarToggle.style.left = `${offset}px`;
    }

    // Show edit form
    function showEditForm() {
      editForm.classList.add('visible');
      actionButtons.style.display = 'none';
      editPrompt.focus();
    }

    // Hide edit form
    function hideEditForm() {
      editForm.classList.remove('visible');
      actionButtons.style.display = 'flex';
      editPrompt.value = '';

    // Confirm bot and go to chat
    function confirmBot() {
      if (!currentBot) return;
      
      localStorage.setItem('lastSelectedAvatar', currentBot.id);
      window.location.href = `chat.html?avatar=${currentBot.id}&new=true`;
    }

    // Regenerate bot with edits
    async function regenerateBot() {
      const prompt = editPrompt.value.trim();
      if (!prompt) {
        showError('Please describe what you\'d like to change.');
        return;
      }

      if (isRegenerating) return;
      isRegenerating = true;

      try {
  // Show loading state and keep frame spinner centered
  setLoadingState(true);
  frameSpinner.classList.remove('hidden');
  botImage.classList.remove('visible');
        hideError();

        // Check freemium limits
        if (window.FreemiumUtils) {
          const canCreateResult = await window.FreemiumUtils.canUserCreateBot(supabase);
          if (!canCreateResult.canCreate) {
            const plans = await window.FreemiumUtils.getSubscriptionPlans(supabase);
            await window.FreemiumUtils.showUpgradeModal(canCreateResult.subscriptionInfo, plans);
            return;
          }
        }

        // Call regeneration API
    const payload = {
            editPrompt: prompt,
            originalPrompt: currentBot.traits?.original_prompt,
            artStyle: currentBot.traits?.art_style,
      personalityPrompt: currentBot.traits?.personality_prompt,
      originalImage: currentBot.image_url
        };
        console.log('🔧 Regenerate payload:', payload);
        const response = await fetch('/api/regenerate-avatar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));
        console.log('🔧 Regenerate response:', { status: response.status, ok: response.ok, resultPreview: JSON.stringify(result).slice(0, 400) });
        
        if (!response.ok || !result.dataUrl) {
          console.error('Regeneration API error:', result);
          const serverMsg = result?.error || 'Failed to regenerate agent. Please try again.';
          const serverDebug = result?.debug ? ` [${JSON.stringify(result.debug).slice(0, 300)}]` : '';
          showError(serverMsg + serverDebug);
          return;
        }

  // Update the bot image and data
        await updateBotImage(result);
        hideEditForm();
        
      } catch (error) {
        console.error('Error regenerating bot:', error);
        showError('Failed to regenerate agent. Please try again.');
      } finally {
        setLoadingState(false);
        isRegenerating = false;
      }
    }

    // Update bot image after regeneration
    async function updateBotImage(result) {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return;

        // Upload new image
        const url = await uploadAvatarImage({
          dataUrl: result.dataUrl,
          userId: user.id,
          fileName: `${currentBot.name}-edit.png`
        });

        // Update database
        const { data: updatedBot, error } = await supabase
          .from('avatars')
          .update({ 
            image_url: url,
            updated_at: new Date().toISOString()
          })
          .eq('id', currentBot.id)
          .select()
          .single();

        if (error) {
          console.error('Error updating bot:', error);
          throw error;
        }

        // Update display
        currentBot = updatedBot;
        displayBot(updatedBot);
        
      } catch (error) {
        console.error('Error updating bot image:', error);
        throw error;
      }
    }

    // Utility functions
    function setLoadingState(loading) {
      if (loading) {
        // Remember whether the edit form was visible before loading
        wasEditFormVisible = editForm.classList.contains('visible');
  loadingState.classList.remove('hidden');
  frameSpinner.classList.remove('hidden');
  botImage.classList.remove('visible');
        if (agentNameInput) agentNameInput.disabled = true;
        editForm.classList.remove('visible');
        actionButtons.style.display = 'none';
      } else {
        loadingState.classList.add('hidden');
  if (wasEditFormVisible) {
          editForm.classList.add('visible');
        } else {
          editForm.classList.remove('visible');
          actionButtons.style.display = 'flex';
        }
        if (agentNameInput && currentBot) agentNameInput.disabled = false;
      }
    }

    function setLoadingText(text) {
      const p = document.getElementById('loadingText');
      if (p) p.textContent = text;
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('visible');
      setTimeout(() => {
        hideError();
      }, 6000);
    }

    function hideError() {
      errorMessage.classList.remove('visible');
    }

    // Image upload helper
    function dataUrlToBlob(dataUrl) {
      const [meta, b64] = dataUrl.split(",");
      const mime = meta.match(/data:(.*?);base64/)[1] || "image/png";
      const bin = atob(b64), len = bin.length;
      const bytes = new Uint8Array(len);
      for(let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    }

    async function uploadAvatarImage({ dataUrl, userId, fileName = "avatar.png" }) {
      try {
        let blob;
        if (/^data:.*;base64,/.test(dataUrl)) {
          blob = dataUrlToBlob(dataUrl);
        } else if (typeof dataUrl === 'string' && dataUrl.startsWith('http')) {
          const resp = await fetch(dataUrl);
          if (!resp.ok) throw new Error('Failed to fetch image from URL');
          blob = await resp.blob();
        } else {
          throw new Error('Unsupported image format');
        }
        const path = `${userId}/${crypto.randomUUID()}-${fileName}`;
        
        const { error: upErr } = await supabase.storage.from("avatars")
          .upload(path, blob, { 
            upsert: true, 
            contentType: blob.type,
            cacheControl: '3600'
          });
        if (upErr) throw upErr;
        
        const { data } = supabase.storage.from("avatars")
          .getPublicUrl(path, {
            download: false,
            transform: {
              width: 333,
              height: 333,
              resize: 'cover'
            }
          });
          
        const url = new URL(data.publicUrl);
        url.protocol = 'https:';
        return url.toString();
      } catch (err) {
        console.error('Error in uploadAvatarImage:', err);
        throw err;
      }
    }

    // Initialize the page
    initializePage();
  </script>
</body>
</html>
