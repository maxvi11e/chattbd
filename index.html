<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeaea — Dashboard</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>
:root {
  --bg:#000;
  --ink:#fff;
  --muted:#d9d9d9;
  --bubble:#333;
  --stroke:#fff;
  --radius-lg:24px;
  --radius-md:14px;
}
* {
  box-sizing:border-box;
}
html,body {
  height:100%;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
}
.screen {
  min-height:100dvh;
  width:100%;
}
/* ===== Dashboard Layout with Sidebar ===== */
.dashboard {
  padding:0;
  min-height:100dvh;
}
.chat-container {
  display:flex;
  height:100dvh;
  overflow:hidden;
}
/* Sidebar */
.sidebar {
  width:300px;
  background:var(--bg);
  border-right:1px solid #333;
  display:flex;
  flex-direction:column;
  transition:width 0.3s ease;
  position:relative;
  min-width:200px;
  max-width:600px;
  height:100dvh;
  flex-shrink:0;
}
.sidebar.collapsed {
  width:44px !important;
  min-width:44px !important;
  overflow:hidden;
}
.sidebar.resizing {
  transition:none;
}
.sidebar *::-webkit-scrollbar {
  width:12px;
}
.sidebar *::-webkit-scrollbar-track {
  background:#000 !important;
}
.sidebar *::-webkit-scrollbar-thumb {
  background:var(--stroke);
  border-radius:999px;
}
.sidebar *::-webkit-scrollbar-corner {
  background:#000;
}
/* Resize Handle */
.resize-handle {
  position:absolute;
  top:0;
  right:-3px;
  width:6px;
  height:100%;
  cursor:col-resize;
  background:transparent;
  z-index:100;
}
.resize-handle:hover {
  background:rgba(255,255,255,0.1);
}
.resize-handle.resizing {
  background:rgba(255,255,255,0.2);
}
/* Sidebar Toggle Button */
.sidebar-toggle {
  position:fixed;
  top:18px;
  left:260px;
  width:32px;
  height:32px;
  background:transparent;
  border:none;
  border-radius:8px;
  color:var(--ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  z-index:1000;
  transition:left 0.1s ease, top 0.1s ease;
}
.sidebar-toggle:hover {
  background:transparent;
}
.sidebar-toggle:active {
  background:transparent;
}
.sidebar-toggle:focus {
  background:transparent;
  outline:none;
}
.sidebar.collapsed .sidebar-toggle {
  position:absolute !important;
  top:14px !important;
  left:6px !important;
  border-radius:8px;
}
/* Prevent laggy animation of toggle during live resize (match chat.html) */
.sidebar.resizing .sidebar-toggle {
  transition:none;
}
/* Top Navigation in Sidebar */
.sidebar-nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 24px 0px 24px;
}
.nav-left {
  display:flex;
  align-items:center;
  gap:16px;
}
.nav-logo {
  height:44px;
  width:auto;
}
.nav-right {
  display:flex;
  gap:12px;
  align-items:center;
}
.user-email {
  color:var(--ink);
  font-size:14px;
}
.logout-btn {
  padding:8px;
  border:none;
  background:transparent;
  color:var(--ink);
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logout-btn:hover {
  background:rgba(255,255,255,0.1);
}
.logout-btn img {
  width:24px;
  height:24px;
}
/* Sidebar Actions */
.sidebar-actions {
  padding:16px;
  flex:1;
  overflow-y:auto;
}
.action-btn {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:12px 16px;
  background:transparent;
  border:none;
  border-radius:8px;
  color:var(--ink);
  cursor:pointer;
  font-size:14px;
  margin-bottom:8px;
  text-decoration:none;
}
.action-btn:hover {
  background:rgba(255,255,255,0.1);
}
.action-btn img, .action-btn svg {
  width:16px;
  height:16px;
}
.action-btn .action-label {
  display:inline-flex;
  align-items:center;
}
/* Sidebar Bottom */
.sidebar-bottom {
  padding:16px;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.sidebar-bottom .user-email {
  color:var(--muted);
  font-size:12px;
}
.sidebar.collapsed .sidebar-nav {
  justify-content:center;
  padding:14px 0 0 0;
}
.sidebar.collapsed .nav-logo {
  display:none;
}
.sidebar.collapsed .nav-left {
  justify-content:center;
  gap:0;
}
.sidebar.collapsed .sidebar-actions {
  padding:12px 8px;
  align-items:center;
  margin-top:28px;
}
.sidebar.collapsed .action-btn {
  justify-content:center;
  padding:10px 0;
  gap:0;
}
.sidebar.collapsed .action-btn .action-label {
  display:none;
}
.sidebar.collapsed .action-btn img,
.sidebar.collapsed .action-btn svg {
  width:20px;
  height:20px;
}
.sidebar.collapsed .sidebar-bottom {
  padding:12px 4px;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.sidebar.collapsed .sidebar-bottom .user-email {
  display:none;
}
.sidebar.collapsed .logout-btn {
  padding:8px 0;
}
.sidebar.collapsed .resize-handle {
  right:-3px;
}
/* Main Chat Area wrapper for dashboard */
.main-chat {
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
  min-height:0;
  overflow:auto;
}
/* Main Content */
.main-content {
  padding:0px;
  max-width:1200px;
  margin:0 auto;
}
/* Page Title */
.page-header {
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:4px;
  margin-top:0px;
  justify-content:center;
}
.page-icon {
  height:40px;
  width:auto;
}
.page-title {
  font-size:32px;
  font-weight:600;
}
/* Avatar Grid */
.avatars-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
  gap:60px 40px;
  max-width:1000px;
  margin:0 auto;
}
/* Avatar Items */
.avatar-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  transition:transform 0.2s ease;
  position:relative;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
.avatar-item:hover {
  transform:scale(1.05);
}
.avatar-circle {
  width:190px;
  height:190px;
  border-radius:50%;
  overflow:hidden;
  margin-bottom:10px;
  background:#1a1a1a;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border:1px solid #333;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
.avatar-circle img {
  width:100%;
  height:100%;
  object-fit:cover;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  pointer-events: none;
}
/* Create New: match standard avatar size, keep glow */
.avatar-circle.create-new {
  width:190px;
  height:190px;
  margin-bottom:10px;
  /* Animated gradient glow - commented out for white static shadow */
  /* box-shadow: 0 0 0 rgba(0, 0, 0, 0); */
  /* animation: neonGlow 3.2s ease-in-out infinite; */
  /* will-change: box-shadow; */
  /* White static shadow */
  /* box-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.3) !important; */
  animation: none !important;
  border:1px solid #333;
}
/* Avatar Actions Menu */
.avatar-actions {
  position:absolute;
  top:8px;
  right:8px;
  z-index:15;
}
.avatar-menu-btn {
  background:transparent;
  border:none;
  color:var(--ink);
  cursor:pointer;
  padding:8px;
  border-radius:8px;
  font-size:18px;
  font-weight:600;
  opacity:0;
  transition:all 0.2s ease;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.avatar-item:hover .avatar-menu-btn {
  opacity:1;
}
.avatar-item.menu-visible .avatar-menu-btn {
  opacity:1;
}
/* Mobile menu visibility class */
.avatar-menu-btn:hover {
  background:transparent;
  transform:scale(1.3);
}
.dropdown {
  position:fixed;
  background:var(--bg);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:8px;
  min-width:120px;
  z-index:25;
  display:none;
  box-shadow:0 4px 6px rgba(0,0,0,0.3);
}
.dropdown.show {
  display:block;
}
.dropdown-item {
  display:block;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--ink);
  padding:8px 12px;
  cursor:pointer;
  font-size:14px;
  border-radius:4px;
}
.dropdown-item:hover {
  background:rgba(255,255,255,0.1);
}
.dropdown-item.danger {
  color:#ff5252;
}
.dropdown-item.danger:hover {
  background:rgba(255,82,82,0.1);
}
/* Neon glow animation (shared with Start button styling) */
@keyframes neonGlow {
  0%,100%{box-shadow:0 0 0 rgba(255,0,128,0);}
  10%{box-shadow:0 0 10px rgba(255,0,128,.45),0 0 20px rgba(255,0,128,.25);}
  25%{box-shadow:0 0 12px rgba(255,153,0,.55),0 0 24px rgba(255,153,0,.3);}
  40%{box-shadow:0 0 14px rgba(255,255,0,.55),0 0 26px rgba(255,255,0,.3);}
  55%{box-shadow:0 0 14px rgba(0,255,170,.55),0 0 26px rgba(0,255,170,.3);}
  70%{box-shadow:0 0 14px rgba(0,153,255,.55),0 0 26px rgba(0,153,255,.3);}
  85%{box-shadow:0 0 14px rgba(170,0,255,.55),0 0 26px rgba(170,0,255,.3);}
}
/* Create New Button */
.create-new {
  border:0 solid var(--ink);
  background:rgba(255, 255, 255, 0);
  display:flex;
  align-items:center;
  justify-content:center;
}
.create-new:hover {
  background:rgba(255,255,255,0.1);
}
.create-plus {
  font-size:100px;
  color:var(--ink);
  font-weight:400;
  display:flex;
  align-items:center;
  justify-content:center;
}
.create-plus img {
  width:110px;
  height:110px;
  display:block;
  margin:0;
  padding:0;
}
.avatar-name {
  color:var(--ink);
  font-size:16px;
  font-weight:400;
  line-height:1.4;
  text-align:center;
  margin:0;
  display:-webkit-box;
  -webkit-line-clamp:2;
  line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  text-overflow:ellipsis;
  padding:4px 8px;
  border-radius:4px;
  transition:background 0.2s ease;
  max-height:calc(1.4em * 2 + 8px);
  /* 2 lines * line-height + padding */
}
.avatar-name[contenteditable="true"] {
  display:block;
  -webkit-line-clamp:unset;
  line-clamp:unset;
  overflow:visible;
  background:rgba(255,255,255,0.05);
  outline:1px solid rgba(255,255,255,0.3);
  cursor:text;
}
/* Empty state */
.empty-state {
  display:none;
}
/* Mobile Top Navigation */
.mobile-top-nav {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: var(--bg);
  border-bottom: 0px solid #333;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  z-index: 1001;
}
.mobile-nav-btn {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s ease;
}
.mobile-nav-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}
.mobile-logo {
  display: flex;
  align-items: center;
  justify-content: center;
}
@media (max-width: 768px) {
  .mobile-top-nav {
    display: flex;
  }
  /* Hide sidebar completely on mobile */
  .sidebar {
    display: none !important;
  }
  /* Hide sidebar toggle on mobile */
  .sidebar-toggle {
    display: none !important;
  }
  .chat-container {
    padding-top: 60px;
  }
  .sidebar.collapsed .sidebar-toggle {
    left:6px !important;
  }
  /* Page Header */
  .page-header {
    margin-bottom:0px;
    padding:0 0px;
  }
  .page-title {
    font-size:28px;
  }
  .page-icon {
    height:36px;
  }
  /* Main Content */
  .main-content {
    padding:0px;
  }
  /* Avatars Grid - Two columns, 50% smaller */
  .avatars-grid {
    grid-template-columns: 1fr 1fr;
    /* Two column grid */
    gap: 50px 13px !important;
    /* Increased row spacing (+20%), decreased column spacing (-20%) */
    padding: 14px 16px 0;
    /* Added 20px top padding to increase space from mobile top nav */
    max-width: none;
  }
  .avatar-circle {
    width: 130px;
    /* Increased from 120px for better mobile visibility */
    height: 130px;
    margin-bottom: 8px;
  }
  /* Create New: match standard avatar size on tablet */
  .avatar-circle.create-new {
    width:130px;
    height:130px;
    margin-bottom:8px;
  }
  .create-plus img {
    width:60px;
    height:60px;
  }
  .create-plus {
    font-size: 50px;
    /* Proportionally smaller */
  }
  .avatar-name {
    font-size: 14px;
    margin-top: 4px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    text-overflow:ellipsis;
    line-height:1.4;
    max-height:calc(1.4em * 2 + 8px);
    /* Recalculate for smaller font size */
  }
  /* Avatar menu button adjustments for smaller size */
  .avatar-menu-btn {
    width: 24px;
    height: 24px;
    font-size: 14px;
    padding: 4px;
  }
  /* Dropdown adjustments */
  .dropdown {
    min-width: 100px;
    font-size: 12px;
  }
  .dropdown-item {
    padding: 6px 8px;
    font-size: 12px;
  }
}
@media (max-width: 480px) {
  /* Even smaller screens */
  .page-title {
    font-size:24px;
  }
  .page-header {
    padding:0 12px;
  }
  /* Keep two columns but make even more compact */
  .avatars-grid {
    gap: 35px 10px !important;
    /* Increased row spacing to match 768px breakpoint, decreased column spacing (-17%) */
    padding: 20px 12px 0;
    /* Added 20px top padding to increase space from mobile top nav */
  }
  .avatar-circle {
    width: 122px;
    /* Consistent size across mobile breakpoints */
    height: 122px;
  }
  /* Create New: match standard avatar size on small phones */
  .avatar-circle.create-new {
    width:122px;
    height:122px;
  }
  .create-plus img {
    width:55px;
    height:55px;
  }
  .create-plus {
    font-size: 40px;
  }
  .avatar-name {
    font-size: 13px;
    max-height:calc(1.4em * 2 + 8px);
    /* Recalculate for smaller font size */
  }
  .avatar-menu-btn {
    width: 20px;
    height: 20px;
    font-size: 12px;
  }
}
</style>
</head>

      // Sidebar toggle handler (copied from chat)
      function setTogglePosition(width) {
        const collapsedWidth = COLLAPSED_SIDEBAR_WIDTH;
        const effectiveWidth = Math.max(width || 0, sidebar.classList.contains('collapsed') ? collapsedWidth : 0);
        const isMobile = window.innerWidth <= 768;
        const isCollapsed = sidebar.classList.contains('collapsed');
        
        if (isMobile) {
          if (isCollapsed) {
            sidebarToggle.style.left = `${collapsedWidth}px`;
          } else {
            // Position at the right edge of expanded sidebar on mobile (222px width)
            sidebarToggle.style.left = `182px`;
          }
        } else {
          const offset = Math.max(effectiveWidth - 40, collapsedWidth);
          sidebarToggle.style.left = `${offset}px`;
        }
      }

      const SIDEBAR_WIDTH_KEY = 'sidebarWidth';
      const SIDEBAR_STATE_KEY = 'sidebarCollapsed';

      function getSavedSidebarWidth() {
        const stored = parseInt(localStorage.getItem(SIDEBAR_WIDTH_KEY) || '', 10);
        const isMobile = window.innerWidth <= 768;
        
        // On mobile, always use 222px
        if (isMobile) {
          return 222;
        }
        
        return Number.isFinite(stored) ? stored : 300;
      }

      function expandSidebar() {
        const width = getSavedSidebarWidth();
        sidebar.classList.remove('collapsed');
        sidebar.style.width = `${width}px`;
        setTogglePosition(width);
        sidebarToggle.title = 'Collapse sidebar';
        localStorage.setItem(SIDEBAR_STATE_KEY, 'false');
      }

      function collapseSidebar(options = {}) {
        const { saveWidth = true, persistState = true } = options;

        if (saveWidth) {
          const currentWidth = parseInt(window.getComputedStyle(sidebar).width, 10);
          if (!Number.isNaN(currentWidth) && currentWidth > 0) {
            localStorage.setItem(SIDEBAR_WIDTH_KEY, String(currentWidth));
          }
        }
        sidebar.classList.add('collapsed');
        sidebar.style.width = `${COLLAPSED_SIDEBAR_WIDTH}px`;
        setTogglePosition(COLLAPSED_SIDEBAR_WIDTH);
        sidebarToggle.title = 'Expand sidebar';

        if (persistState) {
          localStorage.setItem(SIDEBAR_STATE_KEY, 'true');
        }
      }

      sidebarToggle.addEventListener('click', () => {
        if (sidebar.classList.contains('collapsed')) {
          expandSidebar();
        } else {
          collapseSidebar();
        }
      });

      // Initialize sidebar state (default collapsed if no preference saved)
      const savedSidebarState = localStorage.getItem(SIDEBAR_STATE_KEY);
      if (savedSidebarState === 'false' && window.innerWidth > 768) {
        expandSidebar();
      } else if (savedSidebarState === 'true') {
        collapseSidebar({ saveWidth: false, persistState: false });
      } else {
        collapseSidebar({ saveWidth: false, persistState: false });
      }

      // Sidebar resize behavior (desktop only)
      function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
      let isResizing = false;
      let startX = 0;
      let startWidth = 0;

      function onMouseMove(e){
        if (!isResizing) return;
        const dx = e.clientX - startX;
        let newWidth = clamp(startWidth + dx, 200, 600);
        sidebar.style.width = `${newWidth}px`;
        setTogglePosition(newWidth);
      }

      function onMouseUp(){
        if (!isResizing) return;
        isResizing = false;
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        sidebar.classList.remove('resizing');
        resizeHandle.classList.remove('resizing');
        const saved = parseInt(sidebar.style.width) || 300;
        localStorage.setItem(SIDEBAR_WIDTH_KEY, String(saved));
      }

      resizeHandle.addEventListener('mousedown', (e) => {
        // Disable on mobile to avoid interference
        if (window.innerWidth <= 768 || sidebar.classList.contains('collapsed')) return;
        isResizing = true;
        startX = e.clientX;
        startWidth = parseInt(getComputedStyle(sidebar).width, 10);
        sidebar.classList.add('resizing');
        resizeHandle.classList.add('resizing');
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        e.preventDefault();
      });

  async function loadAvatars() {

      // Display avatars in grid
      function displayAvatars(avatars) {
        // Clear existing avatars but keep the create button
        const createButton = avatarsGrid.querySelector('#createBtn');

      // Setup avatar interaction for mobile and desktop
      function setupAvatarInteraction(avatarItem, avatarCircle, avatarId) {
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let hasMoved = false;
        let longPressTimer = null;
        let longPressTriggered = false;
        
        // Show avatar menu on long press
        function showAvatarMenu(clientX, clientY) {
          longPressTriggered = true;
          
          console.log('Long press triggered, menu should appear'); // Debug log
          
          // Create a synthetic event with the original touch/click coordinates
          const syntheticEvent = {
            clientX: clientX,
            clientY: clientY,
            stopPropagation: () => {}
          };
          
          // Directly call toggleAvatarMenu with coordinates
          window.toggleAvatarMenu(syntheticEvent, avatarId);
        }
        
        // Track touch start position and time
        avatarItem.addEventListener('touchstart', (e) => {
          // Don't interfere with menu button or dropdown
          if (e.target.closest('.avatar-menu-btn') || e.target.closest('.dropdown')) {
            return;
          }
          
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          console.log('Touch start captured:', touchStartX, touchStartY); // Debug log
          touchStartTime = Date.now();
          hasMoved = false;
          longPressTriggered = false;
          
          // Start long press timer (500ms)
          longPressTimer = setTimeout(() => {
            if (!hasMoved) {
              showAvatarMenu(touchStartX, touchStartY);
            }
          }, 500);
        }, { passive: true });
        
        // Mouse down for desktop long press
        avatarItem.addEventListener('mousedown', (e) => {
          // Only handle if not a touch device
          if ('ontouchstart' in window) return;
          // Don't interfere with menu button or dropdown
          if (e.target.closest('.avatar-menu-btn') || e.target.closest('.dropdown')) {
            return;
          }
          
          const mouseX = e.clientX;
          const mouseY = e.clientY;
          touchStartTime = Date.now();
          hasMoved = false;
          longPressTriggered = false;
          
          // Start long press timer (500ms)
          longPressTimer = setTimeout(() => {
            if (!hasMoved) {
              showAvatarMenu(mouseX, mouseY);
            }
          }, 500);
        });
        
        // Clear long press on mouse up (only if it hasn't triggered yet)
        avatarItem.addEventListener('mouseup', (e) => {
          console.log('Mouse up, longPressTriggered:', longPressTriggered); // Debug
          // If long press was triggered, don't clear - menu should stay open
          if (!longPressTriggered && longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }
        });
        
        // Prevent click event from closing menu if long press just triggered
        avatarItem.addEventListener('click', (e) => {
          console.log('Avatar item clicked, longPressTriggered:', longPressTriggered); // Debug
          if (longPressTriggered) {
            e.stopPropagation();
            e.preventDefault();
            return false;
          }
        }, true); // Use capture phase to prevent other handlers from running
        
        // Mouse click for desktop - keep simple, direct to chat
        avatarCircle.addEventListener('click', (e) => {
          console.log('Avatar circle clicked, longPressTriggered:', longPressTriggered); // Debug
          // Only handle if not a touch device and no long press
          if (!('ontouchstart' in window) && !longPressTriggered) {
            openChat(avatarId);
          }
          // Don't reset immediately - let the item handler check it first
          if (longPressTriggered) {
            e.stopPropagation();
            e.preventDefault();
            setTimeout(() => {
              longPressTriggered = false;
            }, 100);
          }
        });
        
        // Track if user is moving/scrolling
        avatarItem.addEventListener('touchmove', (e) => {
          const deltaX = Math.abs(e.touches[0].clientX - touchStartX);
          const deltaY = Math.abs(e.touches[0].clientY - touchStartY);
          
          // If moved more than 10px in any direction, consider it a scroll/drag
          if (deltaX > 10 || deltaY > 10) {
            hasMoved = true;
            // Clear long press timer on movement
            if (longPressTimer) {
              clearTimeout(longPressTimer);
              longPressTimer = null;
            }
          }
        }, { passive: true });
        
        // Track mouse movement for desktop
        avatarItem.addEventListener('mousemove', (e) => {
          hasMoved = true;
          // Clear long press timer on movement
          if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }
        });
        
        // Handle touch end - open chat on quick tap
        avatarCircle.addEventListener('touchend', (e) => {
          // Clear long press timer
          if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }
          
          // If long press was triggered, don't open chat
          if (longPressTriggered) {
            longPressTriggered = false;
            return;
          }
          
          const touchDuration = Date.now() - touchStartTime;
          
          // Only proceed if it was a quick tap without movement
          if (!hasMoved && touchDuration < 500) {
            e.preventDefault();
            openChat(avatarId);
          }
        });
        
        // Right-click context menu - show avatar actions
        avatarItem.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          
          // Don't show menu if right-clicking on menu button or dropdown
          if (e.target.closest('.avatar-menu-btn') || e.target.closest('.dropdown')) {
            return false;
          }
          
          const x = e.clientX;
          const y = e.clientY;
          
          console.log('Right click at:', x, y); // Debug
          
          // Close all other menus
          document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
          
          // Show this menu at cursor position
          const menu = document.getElementById(`menu-${avatarId}`);
          menu.classList.add('show');
          
          // Get menu dimensions
          const rect = menu.getBoundingClientRect();
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;
          
          let finalX = x;
          let finalY = y;
          
          // Adjust horizontal position if menu would go off right edge
          if (x + rect.width > viewportWidth) {
            finalX = Math.max(10, viewportWidth - rect.width - 10);
          }
          
          // Adjust vertical position if menu would go off bottom edge
          if (y + rect.height > viewportHeight) {
            finalY = Math.max(10, viewportHeight - rect.height - 10);
          }
          
          // Ensure menu doesn't go off left edge
          if (finalX < 10) {
            finalX = 10;
          }
          
          // Ensure menu doesn't go off top edge
          if (finalY < 10) {
            finalY = 10;
          }
          
          menu.style.left = `${finalX}px`;
          menu.style.top = `${finalY}px`;
          
          return false;
        });
        
        avatarCircle.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          
          const x = e.clientX;
          const y = e.clientY;
          
          // Close all other menus
          document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
          
          // Show this menu at cursor position
          const menu = document.getElementById(`menu-${avatarId}`);
          menu.classList.add('show');
          
          // Get menu dimensions
          const rect = menu.getBoundingClientRect();
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;
          
          let finalX = x;
          let finalY = y;
          
          // Adjust horizontal position if menu would go off right edge
          if (x + rect.width > viewportWidth) {
            finalX = Math.max(10, viewportWidth - rect.width - 10);
          }
          
          // Adjust vertical position if menu would go off bottom edge
          if (y + rect.height > viewportHeight) {
            finalY = Math.max(10, viewportHeight - rect.height - 10);
          }
          
          // Ensure menu doesn't go off left edge
          if (finalX < 10) {
            finalX = 10;
          }
          
          // Ensure menu doesn't go off top edge
          if (finalY < 10) {
            finalY = 10;
          }
          
          menu.style.left = `${finalX}px`;
          menu.style.top = `${finalY}px`;
          
          return false;
        });
        
        // Mouse click for desktop - keep simple, direct to chat
        avatarCircle.addEventListener('click', (e) => {
          // Only handle if not a touch device and no long press
          if (!('ontouchstart' in window) && !longPressTriggered) {
            openChat(avatarId);
          }
          longPressTriggered = false;
        });
      }

      // Open chat with selected avatar
      window.openChat = function(avatarId) {

        localStorage.setItem('lastSelectedAvatar', avatarId);

      // Avatar management functions
      window.toggleAvatarMenu = function(event, avatarId) {
        event.stopPropagation();
        const menu = document.getElementById(`menu-${avatarId}`);
        const isShowing = menu.classList.contains('show');
        
        // Close all menus
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
        
        if (!isShowing) {
          // Position menu at click/touch point
          // Use clientX/clientY which are already provided in our synthetic event
          const x = event.clientX;
          const y = event.clientY;
          
          console.log('Menu position:', x, y); // Debug log
          
          // Show menu first to get its dimensions
          menu.classList.add('show');
          
          // Get menu dimensions
          const rect = menu.getBoundingClientRect();
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;
          
          let finalX = x;
          let finalY = y;
          
          // Adjust horizontal position if menu would go off right edge
          if (x + rect.width > viewportWidth) {
            finalX = Math.max(10, viewportWidth - rect.width - 10);
          }
          
          // Adjust vertical position if menu would go off bottom edge
          if (y + rect.height > viewportHeight) {
            finalY = Math.max(10, viewportHeight - rect.height - 10);
          }
          
          // Ensure menu doesn't go off left edge
          if (finalX < 10) {
            finalX = 10;
          }
          
          // Ensure menu doesn't go off top edge
          if (finalY < 10) {
            finalY = 10;
          }
          
          menu.style.left = `${finalX}px`;
          menu.style.top = `${finalY}px`;
        }
      };

      window.renameAvatar = async function(avatarId, currentName) {
        // Close any open menus
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
        
        // Find the avatar name element
        const avatarItems = document.querySelectorAll('.avatar-item');
        let targetNameElement = null;
        
        for (const item of avatarItems) {
          const circle = item.querySelector(`[data-avatar-id="${avatarId}"]`);
          if (circle) {
            targetNameElement = item.querySelector('.avatar-name');
            break;
          }
        }
        
        if (!targetNameElement) return;
        
        // Make it editable
        targetNameElement.contentEditable = true;
        targetNameElement.focus();
        
        // Select all text
        const range = document.createRange();
        range.selectNodeContents(targetNameElement);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        
        // Store original name for cancel
        const originalName = targetNameElement.textContent;
        
        // Save on blur or Enter
        const saveRename = async () => {
          const newName = targetNameElement.textContent.trim();
          targetNameElement.contentEditable = false;
          
          if (!newName || newName === originalName) {
            targetNameElement.textContent = originalName;
            return;
          }
          
          try {
            const { error } = await supabase
              .from('avatars')
              .update({ 
                name: newName,
                updated_at: new Date().toISOString()
              })
              .eq('id', avatarId);
              
            if (error) throw error;
            
            targetNameElement.textContent = newName;
          } catch (error) {
            console.error('Error renaming avatar:', error);
            alert('Failed to rename avatar');
            targetNameElement.textContent = originalName;
          }
        };
        
        // Cancel on Escape
        const cancelRename = () => {
          targetNameElement.contentEditable = false;
          targetNameElement.textContent = originalName;
          targetNameElement.removeEventListener('blur', saveRename);
          targetNameElement.removeEventListener('keydown', handleKeydown);
        };
        
        const handleKeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            targetNameElement.blur();
          } else if (e.key === 'Escape') {
            e.preventDefault();
            cancelRename();
          }
        };
        
        targetNameElement.addEventListener('blur', saveRename, { once: true });
        targetNameElement.addEventListener('keydown', handleKeydown);
      };

      window.deleteAvatar = async function(avatarId, name) {
        if (!confirm(`Are you sure you want to delete "${name}"? This will also delete all conversations with this avatar. This cannot be undone.`)) return;
        
        try {
          // First, delete all conversations and messages for this avatar
          const { data: conversations, error: convoError } = await supabase
            .from('conversations')
            .select('id')
            .eq('avatar_id', avatarId);
            
          if (convoError) throw convoError;
          
          // Delete messages for each conversation
          if (conversations && conversations.length > 0) {
            const conversationIds = conversations.map(c => c.id);
            const { error: msgError } = await supabase
              .from('messages')
              .delete()
              .in('conversation_id', conversationIds);
              
            if (msgError) throw msgError;
          }
          
          // Delete conversations
          const { error: convDeleteError } = await supabase
            .from('conversations')
            .delete()
            .eq('avatar_id', avatarId);
            
          if (convDeleteError) throw convDeleteError;
          
          // Finally, delete the avatar
          const { error } = await supabase
            .from('avatars')
            .delete()
            .eq('id', avatarId);
            
          if (error) throw error;
          
          // Refresh avatars
          loadAvatars();
        } catch (error) {
          console.error('Error deleting avatar:', error);
          alert('Failed to delete avatar');
        }
      };

      // Close menus when clicking outside
      document.addEventListener('click', (event) => {
        console.log('Global click, target:', event.target); // Debug
        // Don't close if clicking on menu button, dropdown, or if long press just triggered
        if (event.target.closest('.avatar-menu-btn') || 
            event.target.closest('.dropdown')) {
          console.log('Click on menu element, not closing'); // Debug
          return;
        }
        console.log('Closing all menus'); // Debug
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
      });

      // Load avatars on page load
      loadAvatars();

    } // End of authenticated check
