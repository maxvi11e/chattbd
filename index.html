<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeaea — Dashboard</title>
  <link rel="icon" type="image/png" href="images/favicon_black.png" />
  <style>
:root {
  --bg:#000;
  --ink:#fff;
  --muted:#d9d9d9;
  --bubble:#333;
  --stroke:#fff;
  --radius-lg:24px;
  --radius-md:14px;
}
* {
  box-sizing:border-box;
}
html,body {
  height:100%;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
}
.screen {
  min-height:100dvh;
  width:100%;
}
/* ===== Dashboard Layout with Sidebar ===== */
.dashboard {
  padding:0;
  min-height:100dvh;
}
.chat-container {
  display:flex;
  height:100dvh;
  overflow:hidden;
}
/* Sidebar */
.sidebar {
  width:300px;
  background:var(--bg);
  border-right:1px solid #333;
  display:flex;
  flex-direction:column;
  transition:width 0.3s ease;
  position:relative;
  min-width:200px;
  max-width:600px;
  height:100dvh;
  flex-shrink:0;
}
.sidebar.collapsed {
  width:44px !important;
  min-width:44px !important;
  overflow:hidden;
}
.sidebar.resizing {
  transition:none;
}
.sidebar *::-webkit-scrollbar {
  width:12px;
}
.sidebar *::-webkit-scrollbar-track {
  background:#000 !important;
}
.sidebar *::-webkit-scrollbar-thumb {
  background:var(--stroke);
  border-radius:999px;
}
.sidebar *::-webkit-scrollbar-corner {
  background:#000;
}
/* Resize Handle */
.resize-handle {
  position:absolute;
  top:0;
  right:-3px;
  width:6px;
  height:100%;
  cursor:col-resize;
  background:transparent;
  z-index:100;
}
.resize-handle:hover {
  background:rgba(255,255,255,0.1);
}
.resize-handle.resizing {
  background:rgba(255,255,255,0.2);
}
/* Sidebar Toggle Button */
.sidebar-toggle {
  position:fixed;
  top:18px;
  left:260px;
  width:32px;
  height:32px;
  background:transparent;
  border:none;
  border-radius:8px;
  color:var(--ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  z-index:1000;
  transition:left 0.1s ease, top 0.1s ease;
}
.sidebar-toggle:hover {
  background:transparent;
}
.sidebar-toggle:active {
  background:transparent;
}
.sidebar-toggle:focus {
  background:transparent;
  outline:none;
}
.sidebar.collapsed .sidebar-toggle {
  position:absolute !important;
  top:14px !important;
  left:6px !important;
  border-radius:8px;
}
/* Prevent laggy animation of toggle during live resize (match chat.html) */
.sidebar.resizing .sidebar-toggle {
  transition:none;
}
/* Top Navigation in Sidebar */
.sidebar-nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 24px 0px 24px;
}
.nav-left {
  display:flex;
  align-items:center;
  gap:16px;
}
.nav-logo {
  height:44px;
  width:auto;
}
.nav-right {
  display:flex;
  gap:12px;
  align-items:center;
}
.user-email {
  color:var(--ink);
  font-size:14px;
}
.logout-btn {
  padding:8px;
  border:none;
  background:transparent;
  color:var(--ink);
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logout-btn:hover {
  background:rgba(255,255,255,0.1);
}
.logout-btn img {
  width:24px;
  height:24px;
}
/* Sidebar Actions */
.sidebar-actions {
  padding:16px;
  flex:1;
  overflow-y:auto;
}
.action-btn {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:12px 16px;
  background:transparent;
  border:none;
  border-radius:8px;
  color:var(--ink);
  cursor:pointer;
  font-size:14px;
  margin-bottom:8px;
  text-decoration:none;
}
.action-btn:hover {
  background:rgba(255,255,255,0.1);
}
.action-btn img, .action-btn svg {
  width:16px;
  height:16px;
}
.action-btn .action-label {
  display:inline-flex;
  align-items:center;
}
/* Sidebar Bottom */
.sidebar-bottom {
  padding:16px;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.sidebar-bottom .user-email {
  color:var(--muted);
  font-size:12px;
}
.sidebar.collapsed .sidebar-nav {
  justify-content:center;
  padding:14px 0 0 0;
}
.sidebar.collapsed .nav-logo {
  display:none;
}
.sidebar.collapsed .nav-left {
  justify-content:center;
  gap:0;
}
.sidebar.collapsed .sidebar-actions {
  padding:12px 8px;
  align-items:center;
  margin-top:40px;
}
.sidebar.collapsed .action-btn {
  justify-content:center;
  padding:10px 0;
  gap:0;
}
.sidebar.collapsed .action-btn .action-label {
  display:none;
}
.sidebar.collapsed .action-btn img,
.sidebar.collapsed .action-btn svg {
  width:20px;
  height:20px;
}
.sidebar.collapsed .sidebar-bottom {
  padding:12px 4px;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.sidebar.collapsed .sidebar-bottom .user-email {
  display:none;
}
.sidebar.collapsed .logout-btn {
  padding:8px 0;
}
.sidebar.collapsed .resize-handle {
  right:-3px;
}
/* Main Chat Area wrapper for dashboard */
.main-chat {
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
  min-height:0;
  overflow:auto;
}
/* Main Content */
.main-content {
  padding:0px;
  max-width:1200px;
  margin:0 auto;
}
/* Page Title */
.page-header {
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:20px;
  margin-top:10px;
  justify-content:center;
}
.page-icon {
  height:40px;
  width:auto;
}
.page-title {
  font-size:32px;
  font-weight:600;
}
/* Avatar Grid */
.avatars-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
  gap:60px 40px;
  max-width:1000px;
  margin:0 auto;
}
/* Avatar Items */
.avatar-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  transition:transform 0.2s ease;
  position:relative;
}
.avatar-item:hover {
  transform:scale(1.05);
}
.avatar-circle {
  width:190px;
  height:190px;
  border-radius:50%;
  overflow:hidden;
  margin-bottom:10px;
  background:#1a1a1a;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border:1px solid #333;
}
.avatar-circle img {
  width:100%;
  height:100%;
  object-fit:cover;
}
/* Create New: match standard avatar size, keep glow */
.avatar-circle.create-new {
  width:190px;
  height:190px;
  margin-bottom:10px;
  box-shadow: 0 0 0 rgba(0, 0, 0, 0);
  animation: neonGlow 3.2s ease-in-out infinite;
  will-change: box-shadow;
}
/* Avatar Actions Menu */
.avatar-actions {
  position:absolute;
  top:8px;
  right:8px;
  z-index:15;
}
.avatar-menu-btn {
  background:transparent;
  border:none;
  color:var(--ink);
  cursor:pointer;
  padding:8px;
  border-radius:8px;
  font-size:18px;
  font-weight:600;
  opacity:0;
  transition:all 0.2s ease;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.avatar-item:hover .avatar-menu-btn {
  opacity:1;
}
.avatar-item.menu-visible .avatar-menu-btn {
  opacity:1;
}
/* Mobile menu visibility class */
.avatar-menu-btn:hover {
  background:transparent;
  transform:scale(1.3);
}
.dropdown {
  position:absolute;
  top:100%;
  right:0;
  background:var(--bg);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:8px;
  min-width:120px;
  z-index:25;
  display:none;
  box-shadow:0 4px 6px rgba(0,0,0,0.3);
}
.dropdown.show {
  display:block;
}
.dropdown-item {
  display:block;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--ink);
  padding:8px 12px;
  cursor:pointer;
  font-size:14px;
  border-radius:4px;
}
.dropdown-item:hover {
  background:rgba(255,255,255,0.1);
}
.dropdown-item.danger {
  color:#ff5252;
}
.dropdown-item.danger:hover {
  background:rgba(255,82,82,0.1);
}
/* Neon glow animation (shared with Start button styling) */
@keyframes neonGlow {
  0%,100%{box-shadow:0 0 0 rgba(255,0,128,0);}
  10%{box-shadow:0 0 10px rgba(255,0,128,.45),0 0 20px rgba(255,0,128,.25);}
  25%{box-shadow:0 0 12px rgba(255,153,0,.55),0 0 24px rgba(255,153,0,.3);}
  40%{box-shadow:0 0 14px rgba(255,255,0,.55),0 0 26px rgba(255,255,0,.3);}
  55%{box-shadow:0 0 14px rgba(0,255,170,.55),0 0 26px rgba(0,255,170,.3);}
  70%{box-shadow:0 0 14px rgba(0,153,255,.55),0 0 26px rgba(0,153,255,.3);}
  85%{box-shadow:0 0 14px rgba(170,0,255,.55),0 0 26px rgba(170,0,255,.3);}
}
/* Create New Button */
.create-new {
  border:0 solid var(--ink);
  background:rgba(255, 255, 255, 0);
  display:flex;
  align-items:center;
  justify-content:center;
}
.create-new:hover {
  background:rgba(255,255,255,0.1);
}
.create-plus {
  font-size:100px;
  color:var(--ink);
  font-weight:400;
  display:flex;
  align-items:center;
  justify-content:center;
}
.create-plus img {
  width:110px;
  height:110px;
  display:block;
  margin:0;
  padding:0;
}
.avatar-name {
  color:var(--ink);
  font-size:16px;
  font-weight:400;
  text-align:center;
  margin:0;
}
/* Empty state */
.empty-state {
  display:none;
}
@media (max-width: 768px) {
  /* Sidebar toggle positioning for mobile */
  .sidebar-toggle {
    left:200px;
  }
  .sidebar.collapsed .sidebar-toggle {
    left:6px !important;
  }
  /* Page Header */
  .page-header {
    margin-bottom:24px;
    padding:0 16px;
  }
  .page-title {
    font-size:28px;
  }
  .page-icon {
    height:36px;
  }
  /* Main Content */
  .main-content {
    padding:0px;
  }
  /* Avatars Grid - Two columns, 50% smaller */
  .avatars-grid {
    grid-template-columns: 1fr 1fr;
    /* Two column grid */
    gap: 50px 13px !important;
    /* Increased row spacing (+20%), decreased column spacing (-20%) */
    padding: 0 16px;
    max-width: none;
  }
  .avatar-circle {
    width: 120px;
    /* Increased from 100px */
    height: 120px;
    margin-bottom: 8px;
  }
  /* Create New: match standard avatar size on tablet */
  .avatar-circle.create-new {
    width:120px;
    height:120px;
    margin-bottom:8px;
  }
  .create-plus img {
    width:60px;
    height:60px;
  }
  .create-plus {
    font-size: 50px;
    /* Proportionally smaller */
  }
  .avatar-name {
    font-size: 14px;
    margin-top: 4px;
  }
  /* Avatar menu button adjustments for smaller size */
  .avatar-menu-btn {
    width: 24px;
    height: 24px;
    font-size: 14px;
    padding: 4px;
  }
  /* Dropdown adjustments */
  .dropdown {
    min-width: 100px;
    font-size: 12px;
  }
  .dropdown-item {
    padding: 6px 8px;
    font-size: 12px;
  }
}
@media (max-width: 480px) {
  /* Even smaller screens */
  .page-title {
    font-size:24px;
  }
  .page-header {
    padding:0 12px;
  }
  /* Keep two columns but make even more compact */
  .avatars-grid {
    gap: 35px 10px !important;
    /* Increased row spacing to match 768px breakpoint, decreased column spacing (-17%) */
    padding: 0 12px;
  }
  .avatar-circle {
    width: 110px;
    /* Even smaller for very small screens */
    height: 110px;
  }
  /* Create New: match standard avatar size on small phones */
  .avatar-circle.create-new {
    width:110px;
    height:110px;
  }
  .create-plus img {
    width:55px;
    height:55px;
  }
  .create-plus {
    font-size: 40px;
  }
  .avatar-name {
    font-size: 13px;
  }
  .avatar-menu-btn {
    width: 20px;
    height: 20px;
    font-size: 12px;
  }
}
</style>
</head>

  <script type="module">
    // === Supabase Auth ===
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c";
    const supabase = createClient(supabaseUrl, supabaseAnonKey);
    const COLLAPSED_SIDEBAR_WIDTH = 44;
    
    // Make supabase available globally for freemium-utils.js
    window.supabase = supabase;

    // Check auth and redirect if not authenticated
    async function checkAuthAndRedirect() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'auth.html';
        return false;
      }
      console.log("User authenticated:", session.user.email);
      
      // Load and display username from profiles table
      await loadUserProfile(session.user);
      return true;
    }

    // Load user profile and display username
    async function loadUserProfile(user) {
      try {
        const { data: profile, error } = await supabase
          .from('profiles')
          .select('display_name')
          .eq('id', user.id)
          .single();

        if (error) {
          console.error('Error loading profile:', error);
          document.getElementById('userEmail').textContent = user.email; // Fallback to email
        } else {
          document.getElementById('userEmail').textContent = profile?.display_name || user.email;
        }
      } catch (error) {
        console.error('Error in loadUserProfile:', error);
        document.getElementById('userEmail').textContent = user.email; // Fallback to email
      }
    }

    // Load and display subscription info
    async function loadSubscriptionInfo() {
      try {
        const subscriptionInfo = await window.FreemiumUtils.getUserSubscriptionInfo(supabase);
        
        // Update subscription status if present (dashboard sidebar has no badge by default)
        const subscriptionStatus = document.getElementById('subscriptionStatus');
        if (subscriptionStatus) {
          subscriptionStatus.textContent = subscriptionInfo.plan_name;
          if (subscriptionInfo.plan_id === 'unlimited') {
            subscriptionStatus.classList.add('unlimited');
          }
        }
        
  // Usage stats UI removed
        
        return subscriptionInfo;
      } catch (error) {
        console.error('Error loading subscription info:', error);
        return null;
      }
    }

    // Initialize auth check
    const isAuthenticated = await checkAuthAndRedirect();
    if (!isAuthenticated) {
      // Don't initialize the rest of the app if not authenticated
    } else {
      // Continue with app initialization only if authenticated
      
      // Load subscription info
      const subscriptionInfo = await loadSubscriptionInfo();

  const logoutBtn = document.getElementById("logoutBtn");
  const createBtn = document.getElementById("createBtn");
  const avatarsGrid = document.getElementById("avatarsGrid");
  const chatNavAction = document.getElementById("chatNavAction");
  const sidebar = document.querySelector('.sidebar');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const resizeHandle = document.getElementById('resizeHandle');

      // Sign out handler
      logoutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.href = 'auth.html';
      });

      // Create new avatar handler with limit check
      createBtn.addEventListener("click", async () => {
        const canCreateResult = await window.FreemiumUtils.canUserCreateBot(supabase);
        if (!canCreateResult.canCreate) {
          // Show upgrade modal
          const plans = await window.FreemiumUtils.getSubscriptionPlans(supabase);
          await window.FreemiumUtils.showUpgradeModal(canCreateResult.subscriptionInfo, plans);
        } else {
          window.location.href = 'create.html';
        }
      });
      
  // Optional: add a manage subscription entry elsewhere if needed

      // Chat navigation handler (open last selected avatar)
      chatNavAction.addEventListener("click", (e) => {
        e.preventDefault();
        const lastAvatarId = localStorage.getItem('lastSelectedAvatar');
        if (lastAvatarId) {
          window.location.href = `chat.html?avatar=${lastAvatarId}`;
        } else {
          alert('Please select an avatar to chat with first!');
        }
      });

      // Sidebar toggle handler (copied from chat)
      function setTogglePosition(width) {
        const collapsedWidth = COLLAPSED_SIDEBAR_WIDTH;
        const effectiveWidth = Math.max(width || 0, sidebar.classList.contains('collapsed') ? collapsedWidth : 0);
        const isMobile = window.innerWidth <= 768;
        if (isMobile) {
          sidebarToggle.style.left = `${collapsedWidth}px`;
        } else {
          const offset = Math.max(effectiveWidth - 40, collapsedWidth);
          sidebarToggle.style.left = `${offset}px`;
        }
      }

      const SIDEBAR_WIDTH_KEY = 'sidebarWidth';
      const SIDEBAR_STATE_KEY = 'sidebarCollapsed';

      function getSavedSidebarWidth() {
        const stored = parseInt(localStorage.getItem(SIDEBAR_WIDTH_KEY) || '', 10);
        return Number.isFinite(stored) ? stored : 300;
      }

      function expandSidebar() {
        const width = getSavedSidebarWidth();
        sidebar.classList.remove('collapsed');
        sidebar.style.width = `${width}px`;
        setTogglePosition(width);
        sidebarToggle.title = 'Collapse sidebar';
        localStorage.setItem(SIDEBAR_STATE_KEY, 'false');
      }

      function collapseSidebar(options = {}) {
        const { saveWidth = true, persistState = true } = options;

        if (saveWidth) {
          const currentWidth = parseInt(window.getComputedStyle(sidebar).width, 10);
          if (!Number.isNaN(currentWidth) && currentWidth > 0) {
            localStorage.setItem(SIDEBAR_WIDTH_KEY, String(currentWidth));
          }
        }
        sidebar.classList.add('collapsed');
        sidebar.style.width = `${COLLAPSED_SIDEBAR_WIDTH}px`;
        setTogglePosition(COLLAPSED_SIDEBAR_WIDTH);
        sidebarToggle.title = 'Expand sidebar';

        if (persistState) {
          localStorage.setItem(SIDEBAR_STATE_KEY, 'true');
        }
      }

      sidebarToggle.addEventListener('click', () => {
        if (sidebar.classList.contains('collapsed')) {
          expandSidebar();
        } else {
          collapseSidebar();
        }
      });

      // Initialize sidebar state (default collapsed if no preference saved)
      const savedSidebarState = localStorage.getItem(SIDEBAR_STATE_KEY);
      if (savedSidebarState === 'false' && window.innerWidth > 768) {
        expandSidebar();
      } else if (savedSidebarState === 'true') {
        collapseSidebar({ saveWidth: false, persistState: false });
      } else {
        collapseSidebar({ saveWidth: false, persistState: false });
      }

      // Sidebar resize behavior (desktop only)
      function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
      let isResizing = false;
      let startX = 0;
      let startWidth = 0;

      function onMouseMove(e){
        if (!isResizing) return;
        const dx = e.clientX - startX;
        let newWidth = clamp(startWidth + dx, 200, 600);
        sidebar.style.width = `${newWidth}px`;
        setTogglePosition(newWidth);
      }

      function onMouseUp(){
        if (!isResizing) return;
        isResizing = false;
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        sidebar.classList.remove('resizing');
        resizeHandle.classList.remove('resizing');
        const saved = parseInt(sidebar.style.width) || 300;
        localStorage.setItem(SIDEBAR_WIDTH_KEY, String(saved));
      }

      resizeHandle.addEventListener('mousedown', (e) => {
        // Disable on mobile to avoid interference
        if (window.innerWidth <= 768 || sidebar.classList.contains('collapsed')) return;
        isResizing = true;
        startX = e.clientX;
        startWidth = parseInt(getComputedStyle(sidebar).width, 10);
        sidebar.classList.add('resizing');
        resizeHandle.classList.add('resizing');
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        e.preventDefault();
      });

      // Watch auth state changes
  supabase.auth.onAuthStateChange((_event, session) => {
        if (!session) {
          window.location.href = 'auth.html';
        }
      });


      // Load user's avatars
  async function loadAvatars() {
        try {
          const { data: { user } } = await supabase.auth.getUser();
          if (!user) return;

          const { data: avatars, error } = await supabase
            .from('avatars')
            .select('*')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false });

          if (error) {
            console.error('Error loading avatars:', error);
            return;
          }

          if (avatars && avatars.length > 0) {
            displayAvatars(avatars);
          }
        } catch (error) {
          console.error('Error in loadAvatars:', error);
        }
      }

      // Display avatars in grid
      function displayAvatars(avatars) {
        // Clear existing avatars but keep the create button
        const createButton = avatarsGrid.querySelector('#createBtn');
        avatarsGrid.innerHTML = '';
        avatarsGrid.appendChild(createButton);
        
        avatars.forEach(avatar => {
          const avatarItem = document.createElement('div');
          avatarItem.className = 'avatar-item';
          
          avatarItem.innerHTML = `
            <div class="avatar-circle" data-avatar-id="${avatar.id}">
              ${avatar.image_url 
                ? `<img src="${avatar.image_url}" alt="${avatar.nickname || avatar.name}" />`
                : `<div style="color:#666; text-align:center;">No image</div>`
              }
            </div>
            <div class="avatar-actions">
              <button class="avatar-menu-btn" onclick="toggleAvatarMenu(event, '${avatar.id}')">⋯</button>
              <div id="menu-${avatar.id}" class="dropdown">
                <button class="dropdown-item" onclick="renameAvatar('${avatar.id}', '${(avatar.nickname || avatar.name).replace(/'/g, "\\'")}')">Rename</button>
                <button class="dropdown-item" onclick="editAvatar('${avatar.id}')">Edit</button>
                <button class="dropdown-item danger" onclick="deleteAvatar('${avatar.id}', '${(avatar.nickname || avatar.name).replace(/'/g, "\\'")}')">Delete</button>
              </div>
            </div>
            <p class="avatar-name">${avatar.nickname || avatar.name || 'Unnamed Avatar'}</p>
          `;
          
          // Add touch/click handlers for better mobile UX
          const avatarCircle = avatarItem.querySelector('.avatar-circle');
          setupAvatarInteraction(avatarItem, avatarCircle, avatar.id);
          
          avatarsGrid.appendChild(avatarItem);
        });
      }

      // Setup avatar interaction for mobile and desktop
      function setupAvatarInteraction(avatarItem, avatarCircle, avatarId) {
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let hasMoved = false;
        
        // Handle taps on avatar item (but not avatar-circle) for menu
        function handleAvatarItemTouch(e) {
          // Don't handle if tapping directly on menu button, dropdown, or avatar-circle
          if (e.target.closest('.avatar-menu-btn') || 
              e.target.closest('.dropdown') || 
              e.target.closest('.avatar-circle')) {
            return;
          }
          
          const touchDuration = Date.now() - touchStartTime;
          
          // Only proceed if it was a quick tap without movement
          if (!hasMoved && touchDuration < 300) {
            e.preventDefault();
            
            // Hide all other menu buttons first
            document.querySelectorAll('.avatar-item.menu-visible').forEach(item => {
              item.classList.remove('menu-visible');
            });
            // Show this menu button
            avatarItem.classList.add('menu-visible');
          }
        }

        // Handle taps on avatar-circle for immediate chat entry
        function handleAvatarCircleTouch(e) {
          const touchDuration = Date.now() - touchStartTime;
          
          // Only proceed if it was a quick tap without movement
          if (!hasMoved && touchDuration < 300) {
            e.preventDefault();
            openChat(avatarId);
          }
        }
        
        // Track touch start position and time for the entire avatar item
        avatarItem.addEventListener('touchstart', (e) => {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
          hasMoved = false;
        });
        
        // Track if user is moving/scrolling
        avatarItem.addEventListener('touchmove', (e) => {
          const deltaX = Math.abs(e.touches[0].clientX - touchStartX);
          const deltaY = Math.abs(e.touches[0].clientY - touchStartY);
          
          // If moved more than 10px in any direction, consider it a scroll/drag
          if (deltaX > 10 || deltaY > 10) {
            hasMoved = true;
          }
        });
        
        // Handle touch end on avatar item (for menu)
        avatarItem.addEventListener('touchend', handleAvatarItemTouch);
        
        // Handle touch end on avatar circle (for immediate chat entry)
        avatarCircle.addEventListener('touchend', handleAvatarCircleTouch);
        
        // Mouse click for desktop - keep simple, direct to chat
        avatarCircle.addEventListener('click', (e) => {
          // Only handle if not a touch device
          if (!('ontouchstart' in window)) {
            openChat(avatarId);
          }
        });
        
        // Hide menu button when clicking elsewhere
        document.addEventListener('touchstart', (e) => {
          if (!e.target.closest('.avatar-item')) {
            avatarItem.classList.remove('menu-visible');
          }
        });
      }

      // Open chat with selected avatar
      window.openChat = function(avatarId) {
        // Store the selected avatar ID for future navigation
        localStorage.setItem('lastSelectedAvatar', avatarId);
        window.location.href = `chat.html?avatar=${avatarId}`;
      };

      // Edit avatar - navigate to edit page
      window.editAvatar = function(avatarId) {
        // Remember selection for chat icon and other pages
        localStorage.setItem('lastSelectedAvatar', avatarId);
        localStorage.setItem('lastGeneratedAvatar', avatarId);
        window.location.href = `edit.html?avatar=${avatarId}`;
      };

      // Avatar management functions
      window.toggleAvatarMenu = function(event, avatarId) {
        event.stopPropagation();
        const menu = document.getElementById(`menu-${avatarId}`);
        const isShowing = menu.classList.contains('show');
        
        // Close all menus
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
        
        if (!isShowing) {
          menu.classList.add('show');
        }
      };

      window.renameAvatar = async function(avatarId, currentName) {
        const newName = prompt('Enter new display name:', currentName);
        if (!newName || newName === currentName) return;
        
        try {
          const { error } = await supabase
            .from('avatars')
            .update({ nickname: newName })
            .eq('id', avatarId);
            
          if (error) throw error;
          
          // Refresh avatars
          loadAvatars();
        } catch (error) {
          console.error('Error renaming avatar:', error);
          alert('Failed to rename avatar');
        }
      };

      window.deleteAvatar = async function(avatarId, name) {
        if (!confirm(`Are you sure you want to delete "${name}"? This will also delete all conversations with this avatar. This cannot be undone.`)) return;
        
        try {
          // First, delete all conversations and messages for this avatar
          const { data: conversations, error: convoError } = await supabase
            .from('conversations')
            .select('id')
            .eq('avatar_id', avatarId);
            
          if (convoError) throw convoError;
          
          // Delete messages for each conversation
          if (conversations && conversations.length > 0) {
            const conversationIds = conversations.map(c => c.id);
            const { error: msgError } = await supabase
              .from('messages')
              .delete()
              .in('conversation_id', conversationIds);
              
            if (msgError) throw msgError;
          }
          
          // Delete conversations
          const { error: convDeleteError } = await supabase
            .from('conversations')
            .delete()
            .eq('avatar_id', avatarId);
            
          if (convDeleteError) throw convDeleteError;
          
          // Finally, delete the avatar
          const { error } = await supabase
            .from('avatars')
            .delete()
            .eq('id', avatarId);
            
          if (error) throw error;
          
          // Refresh avatars
          loadAvatars();
        } catch (error) {
          console.error('Error deleting avatar:', error);
          alert('Failed to delete avatar');
        }
      };

      // Close menus when clicking outside
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.avatar-actions')) {
          document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
        }
      });

      // Load avatars on page load
      loadAvatars();

    } // End of authenticated check

  </script>
</body>
