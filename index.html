<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Build a Bot — Dashboard</title>
  <style>
    :root{
      --bg:#000;
      --ink:#fff;
      --muted:#d9d9d9;
      --bubble:#333;
      --stroke:#fff;
      --radius-lg:24px;
      --radius-md:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial}

    .screen{min-height:100vh; width:100%;}

    /* ===== Dashboard ===== */
    .dashboard{padding:32px 24px; max-width:1200px; margin:0 auto; min-height:100vh;}
    
    .header{display:flex; justify-content:space-between; align-items:center; margin-bottom:48px;}
    .logo-section{display:flex; align-items:center; gap:16px;}
    .logo-section img{height:48px; width:auto;}
    .app-title{font-size:32px; font-weight:650; letter-spacing:-0.02em;}
    
    .user-controls{display:flex; gap:12px; align-items:center;}
    .user-email{color:var(--muted); font-size:14px;}
    .logout-btn{padding:8px 16px; border:1px solid var(--stroke); background:transparent; color:var(--ink); border-radius:8px; cursor:pointer; font-size:14px;}
    .logout-btn:hover{background:rgba(255,255,255,0.1);}

    .main-content{display:flex; flex-direction:column; gap:32px;}
    
    .create-section{text-align:center; padding:48px 24px; border:2px dashed var(--stroke); border-radius:var(--radius-lg);}
    .create-title{font-size:24px; font-weight:600; margin-bottom:16px;}
    .create-subtitle{color:var(--muted); margin-bottom:32px; font-size:16px;}
    .create-btn{padding:16px 32px; background:var(--ink); color:var(--bg); border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; font-family:inherit;}
    .create-btn:hover{background:var(--muted);}

    .avatars-section{margin-top:48px;}
    .section-title{font-size:24px; font-weight:600; margin-bottom:24px;}
    .avatars-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:24px;}
    
    .avatar-card{border:1px solid var(--stroke); border-radius:var(--radius-lg); overflow:hidden; background:rgba(255,255,255,0.02); cursor:pointer;}
    .avatar-card:hover{background:rgba(255,255,255,0.05); transform:translateY(-2px); transition:all 0.2s ease;}
    
    .avatar-image{width:100%; height:200px; background:#1c1c1c; display:flex; align-items:center; justify-content:center; overflow:hidden;}
    .avatar-image img{width:100%; height:100%; object-fit:cover;}
    .avatar-placeholder{color:var(--muted); font-size:14px;}
    
    .avatar-info{padding:16px;}
    .avatar-name{font-weight:600; margin-bottom:4px; font-size:16px;}
    .avatar-description{color:var(--muted); font-size:14px; line-height:1.4;}
    .avatar-date{color:var(--muted); font-size:12px; margin-top:8px;}

    .empty-state{text-align:center; padding:48px 24px; color:var(--muted);}
    .empty-state-icon{font-size:48px; margin-bottom:16px; opacity:0.5;}

    @media (max-width: 768px) {
      .dashboard{padding:24px 16px;}
      .header{flex-direction:column; gap:16px; align-items:stretch;}
      .user-controls{justify-content:space-between;}
      .avatars-grid{grid-template-columns:1fr;}
      .create-section{padding:32px 16px;}
    }
  </style>
</head>

<body>
  <div class="screen dashboard">
    <div class="header">
      <div class="logo-section">
        <img src="images/logo.png" alt="Build a Bot Logo">
        <h1 class="app-title">Build a Bot</h1>
      </div>
      
      <div class="user-controls">
        <span id="userEmail" class="user-email"></span>
        <button id="logoutBtn" class="logout-btn">Sign out</button>
      </div>
    </div>

    <div class="main-content">
      <div class="create-section">
        <h2 class="create-title">Create Your First Avatar</h2>
        <p class="create-subtitle">Design a unique AI persona to chat with</p>
        <button id="createBtn" class="create-btn">Create New Avatar</button>
      </div>

      <div id="avatarsSection" class="avatars-section" style="display:none;">
        <h2 class="section-title">Your Avatars</h2>
        <div id="avatarsGrid" class="avatars-grid"></div>
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-state-icon">🤖</div>
        <p>No avatars yet. Create your first one to get started!</p>
      </div>
    </div>
  </div>

  <script type="module">
    // === Supabase Auth ===
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c";
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    // Check auth and redirect if not authenticated
    async function checkAuthAndRedirect() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'auth.html';
        return false;
      }
      console.log("User authenticated:", session.user.email);
      document.getElementById('userEmail').textContent = session.user.email;
      return true;
    }

    // Initialize auth check
    const isAuthenticated = await checkAuthAndRedirect();
    if (!isAuthenticated) {
      // Don't initialize the rest of the app if not authenticated
    } else {
      // Continue with app initialization only if authenticated

      const logoutBtn = document.getElementById("logoutBtn");
      const createBtn = document.getElementById("createBtn");
      const avatarsSection = document.getElementById("avatarsSection");
      const avatarsGrid = document.getElementById("avatarsGrid");
      const emptyState = document.getElementById("emptyState");

      // Sign out handler
      logoutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.href = 'auth.html';
      });

      // Create new avatar handler
      createBtn.addEventListener("click", () => {
        window.location.href = 'create.html';
      });

      // Watch auth state changes
      supabase.auth.onAuthStateChange((_event, session) => {
        if (!session) {
          window.location.href = 'auth.html';
        }
      });


      // Load user's avatars
      async function loadAvatars() {
        try {
          const { data: { user } } = await supabase.auth.getUser();
          if (!user) return;

          const { data: avatars, error } = await supabase
            .from('avatars')
            .select('*')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false });

          if (error) {
            console.error('Error loading avatars:', error);
            return;
          }

          if (avatars && avatars.length > 0) {
            displayAvatars(avatars);
            avatarsSection.style.display = 'block';
            emptyState.style.display = 'none';
            
            // Update create section title for existing users
            document.querySelector('.create-title').textContent = 'Create Another Avatar';
            document.querySelector('.create-subtitle').textContent = 'Design another unique AI persona';
          } else {
            avatarsSection.style.display = 'none';
            emptyState.style.display = 'block';
          }
        } catch (error) {
          console.error('Error in loadAvatars:', error);
        }
      }

      // Display avatars in grid
      function displayAvatars(avatars) {
        avatarsGrid.innerHTML = '';
        
        avatars.forEach(avatar => {
          const card = document.createElement('div');
          card.className = 'avatar-card';
          card.onclick = () => openChat(avatar.id);
          
          card.innerHTML = `
            <div class="avatar-image">
              ${avatar.image_url 
                ? `<img src="${avatar.image_url}" alt="${avatar.name}" />`
                : `<div class="avatar-placeholder">No image</div>`
              }
            </div>
            <div class="avatar-info">
              <div class="avatar-name">${avatar.name || 'Unnamed Avatar'}</div>
              <div class="avatar-description">AI Avatar</div>
              <div class="avatar-date">Created ${new Date(avatar.created_at).toLocaleDateString()}</div>
            </div>
          `;
          
          avatarsGrid.appendChild(card);
        });
      }

      // Open chat with selected avatar
      function openChat(avatarId) {
        window.location.href = `chat.html?avatar=${avatarId}`;
      }

      // Load avatars on page load
      loadAvatars();

    } // End of authenticated check

  </script>
</body>
</html>
