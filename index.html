<!doctype html>
<html lan    /* Top Navigation */
    .top-nav{display:flex; justify-content:space-between; align-items:center; padding:12px 48px 0px 48px;}
    .nav-left{display:flex; align-items:center; gap:24px;}en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Build a Bot — Dashboard</title>
  <style>
    :root{
      --bg:#000;
      --ink:#fff;
      --muted:#d9d9d9;
      --bubble:#333;
      --stroke:#fff;
      --radius-lg:24px;
      --radius-md:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial}

    .screen{min-height:100vh; width:100%;}

    /* ===== Dashboard ===== */
    .dashboard{padding:0; min-height:100vh;}
    
    /* Top Navigation */
    .top-nav{display:flex; justify-content:space-between; align-items:center; padding:14px 48px 0px 48px;}
    .nav-left{display:flex; align-items:center; gap:24px;}
    .nav-logo{height:48px; width:auto; transition:transform 0.2s ease;}
    .nav-logo:hover{transform:scale(1.05);}
    .nav-right{display:flex; gap:16px; align-items:center;}
    .user-email{color:var(--ink); font-size:16px;}
    .logout-btn{padding:8px 16px; border:1px solid var(--stroke); background:transparent; color:var(--ink); border-radius:8px; cursor:pointer; font-size:14px;}
    .logout-btn:hover{background:rgba(255,255,255,0.1);}

    /* Main Content */
    .main-content{padding:0px; max-width:1200px; margin:0 auto;}
    
    /* Page Title */
    .page-header{display:flex; align-items:center; gap:16px; margin-bottom:40px; justify-content:center;}
    .page-icon{height:48px; width:auto;}
    .page-title{font-size:40px; font-weight:600; margin:0;}

    /* Avatar Grid */
    .avatars-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:20px; max-width:1000px; margin:0 auto;}
    
    /* Avatar Items */
    .avatar-item{display:flex; flex-direction:column; align-items:center; cursor:pointer; transition:transform 0.2s ease; position:relative;}
    .avatar-item:hover{transform:scale(1.05);}
    
    .avatar-circle{width:200px; height:200px; border-radius:50%; overflow:hidden; margin-bottom:16px; background:#1a1a1a; display:flex; align-items:center; justify-content:center; position:relative;}
    .avatar-circle img{width:100%; height:100%; object-fit:cover;}

    /* Avatar Actions Menu */
    .avatar-actions{position:absolute; top:8px; right:8px; z-index:15;}
    .avatar-menu-btn{background:rgba(0,0,0,0.8); border:none; color:var(--ink); cursor:pointer; padding:6px; border-radius:6px; font-size:14px; opacity:0; transition:opacity 0.2s ease; width:24px; height:24px; display:flex; align-items:center; justify-content:center;}
    .avatar-item:hover .avatar-menu-btn{opacity:1;}
    .avatar-menu-btn:hover{background:rgba(0,0,0,0.9);}
    .dropdown{position:absolute; top:100%; right:0; background:var(--bg); border:1px solid var(--stroke); border-radius:8px; padding:8px; min-width:120px; z-index:25; display:none; box-shadow:0 4px 6px rgba(0,0,0,0.3);}
    .dropdown.show{display:block;}
    .dropdown-item{display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink); padding:8px 12px; cursor:pointer; font-size:14px; border-radius:4px;}
    .dropdown-item:hover{background:rgba(255,255,255,0.1);}
    .dropdown-item.danger{color:#ff5252;}
    .dropdown-item.danger:hover{background:rgba(255,82,82,0.1);}
    
    /* Create New Button */
    .create-new{border:3px solid var(--ink); background:transparent; display:flex; align-items:center; justify-content:center;}
    .create-new:hover{background:rgba(255,255,255,0.1);}
    .create-plus{font-size:100px; color:var(--ink); font-weight:400;}
    
    .avatar-name{color:var(--ink); font-size:16px; font-weight:400; text-align:center; margin:0;}

    /* Empty state */
    .empty-state{display:none;}

    @media (max-width: 768px) {
      .dashboard{padding:24px 16px;}
      .header{flex-direction:column; gap:16px; align-items:stretch;}
      .user-controls{justify-content:space-between;}
      .avatars-grid{grid-template-columns:1fr;}
      .create-section{padding:32px 16px;}
    }
  </style>
</head>

<body>
  <div class="screen dashboard">
    <!-- Top Navigation -->
    <div class="top-nav">
      <div class="nav-left">
        <a href="create.html">
          <img src="images/logo.png" alt="Build a Bot Logo" class="nav-logo">
        </a>
      </div>
      <div class="nav-right">
        <span id="userEmail" class="user-email"></span>
        <button id="logoutBtn" class="logout-btn">Sign out</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Page Header -->
      <div class="page-header">
        <img src="images/library_icon.png" alt="Library" class="page-icon">
        <h1 class="page-title">Bot Library</h1>
      </div>

      <!-- Avatar Grid -->
      <div id="avatarsGrid" class="avatars-grid">
        <!-- Create New Button (always first) -->
        <div class="avatar-item" id="createBtn">
          <div class="avatar-circle create-new">
            <div class="create-plus">+</div>
          </div>
          <p class="avatar-name">Create new</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // === Supabase Auth ===
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://eyptqyzkwcpaillnwmle.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cHRxeXprd2NwYWlsbG53bWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MTkxNzksImV4cCI6MjA3MzE5NTE3OX0.XMSqlh-Vm9ncC2_ecUGR8EIMv3ArcvmJd7BtWMRUa2c";
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    // Check auth and redirect if not authenticated
    async function checkAuthAndRedirect() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'auth.html';
        return false;
      }
      console.log("User authenticated:", session.user.email);
      
      // Load and display username from profiles table
      await loadUserProfile(session.user);
      return true;
    }

    // Load user profile and display username
    async function loadUserProfile(user) {
      try {
        const { data: profile, error } = await supabase
          .from('profiles')
          .select('display_name')
          .eq('id', user.id)
          .single();

        if (error) {
          console.error('Error loading profile:', error);
          document.getElementById('userEmail').textContent = user.email; // Fallback to email
        } else {
          document.getElementById('userEmail').textContent = profile?.display_name || user.email;
        }
      } catch (error) {
        console.error('Error in loadUserProfile:', error);
        document.getElementById('userEmail').textContent = user.email; // Fallback to email
      }
    }

    // Initialize auth check
    const isAuthenticated = await checkAuthAndRedirect();
    if (!isAuthenticated) {
      // Don't initialize the rest of the app if not authenticated
    } else {
      // Continue with app initialization only if authenticated

      const logoutBtn = document.getElementById("logoutBtn");
      const createBtn = document.getElementById("createBtn");
      const avatarsGrid = document.getElementById("avatarsGrid");

      // Sign out handler
      logoutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.href = 'auth.html';
      });

      // Create new avatar handler
      createBtn.addEventListener("click", () => {
        window.location.href = 'create.html';
      });

      // Watch auth state changes
      supabase.auth.onAuthStateChange((_event, session) => {
        if (!session) {
          window.location.href = 'auth.html';
        }
      });


      // Load user's avatars
      async function loadAvatars() {
        try {
          const { data: { user } } = await supabase.auth.getUser();
          if (!user) return;

          const { data: avatars, error } = await supabase
            .from('avatars')
            .select('*')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false });

          if (error) {
            console.error('Error loading avatars:', error);
            return;
          }

          if (avatars && avatars.length > 0) {
            displayAvatars(avatars);
          }
        } catch (error) {
          console.error('Error in loadAvatars:', error);
        }
      }

      // Display avatars in grid
      function displayAvatars(avatars) {
        // Clear existing avatars but keep the create button
        const createButton = avatarsGrid.querySelector('#createBtn');
        avatarsGrid.innerHTML = '';
        avatarsGrid.appendChild(createButton);
        
        avatars.forEach(avatar => {
          const avatarItem = document.createElement('div');
          avatarItem.className = 'avatar-item';
          
          avatarItem.innerHTML = `
            <div class="avatar-circle" onclick="openChat('${avatar.id}')">
              ${avatar.image_url 
                ? `<img src="${avatar.image_url}" alt="${avatar.nickname || avatar.name}" />`
                : `<div style="color:#666; text-align:center;">No image</div>`
              }
            </div>
            <div class="avatar-actions">
              <button class="avatar-menu-btn" onclick="toggleAvatarMenu(event, '${avatar.id}')">⋯</button>
              <div id="menu-${avatar.id}" class="dropdown">
                <button class="dropdown-item" onclick="renameAvatar('${avatar.id}', '${(avatar.nickname || avatar.name).replace(/'/g, "\\'")}')">Rename</button>
                <button class="dropdown-item danger" onclick="deleteAvatar('${avatar.id}', '${(avatar.nickname || avatar.name).replace(/'/g, "\\'")}')">Delete</button>
              </div>
            </div>
            <p class="avatar-name">${avatar.nickname || avatar.name || 'Unnamed Avatar'}</p>
          `;
          
          avatarsGrid.appendChild(avatarItem);
        });
      }

      // Open chat with selected avatar
      function openChat(avatarId) {
        window.location.href = `chat.html?avatar=${avatarId}`;
      }

      // Avatar management functions
      window.toggleAvatarMenu = function(event, avatarId) {
        event.stopPropagation();
        const menu = document.getElementById(`menu-${avatarId}`);
        const isShowing = menu.classList.contains('show');
        
        // Close all menus
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
        
        if (!isShowing) {
          menu.classList.add('show');
        }
      };

      window.renameAvatar = async function(avatarId, currentName) {
        const newName = prompt('Enter new display name:', currentName);
        if (!newName || newName === currentName) return;
        
        try {
          const { error } = await supabase
            .from('avatars')
            .update({ nickname: newName })
            .eq('id', avatarId);
            
          if (error) throw error;
          
          // Refresh avatars
          loadAvatars();
        } catch (error) {
          console.error('Error renaming avatar:', error);
          alert('Failed to rename avatar');
        }
      };

      window.deleteAvatar = async function(avatarId, name) {
        if (!confirm(`Are you sure you want to delete "${name}"? This will also delete all conversations with this avatar. This cannot be undone.`)) return;
        
        try {
          // First, delete all conversations and messages for this avatar
          const { data: conversations, error: convoError } = await supabase
            .from('conversations')
            .select('id')
            .eq('avatar_id', avatarId);
            
          if (convoError) throw convoError;
          
          // Delete messages for each conversation
          if (conversations && conversations.length > 0) {
            const conversationIds = conversations.map(c => c.id);
            const { error: msgError } = await supabase
              .from('messages')
              .delete()
              .in('conversation_id', conversationIds);
              
            if (msgError) throw msgError;
          }
          
          // Delete conversations
          const { error: convDeleteError } = await supabase
            .from('conversations')
            .delete()
            .eq('avatar_id', avatarId);
            
          if (convDeleteError) throw convDeleteError;
          
          // Finally, delete the avatar
          const { error } = await supabase
            .from('avatars')
            .delete()
            .eq('id', avatarId);
            
          if (error) throw error;
          
          // Refresh avatars
          loadAvatars();
        } catch (error) {
          console.error('Error deleting avatar:', error);
          alert('Failed to delete avatar');
        }
      };

      // Close menus when clicking outside
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.avatar-actions')) {
          document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
        }
      });

      // Load avatars on page load
      loadAvatars();

    } // End of authenticated check

  </script>
</body>
</html>
